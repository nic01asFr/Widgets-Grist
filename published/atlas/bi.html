<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Page MAIGRE du composant carte BI : la carte et son voile, rien de l'application. `index.html?bi=1` y mène (redirection), pour qu'aucun hôte ne change d'adresse.
         Elle charge MapLibre, `lib/bi/entree.js` et ce que le runtime importe : ni l'interface d'Atlas, ni three.js, ni l'import, ni les formulaires. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'" />
    <link rel="icon" href="data:," />
    <title>Atlas — carte</title>

    <!-- Garde d'amorçage du mode composant : si la carte ne démarre pas (dépendance bloquée, réseau lent), le voile le DIT au lieu de rester sur « Chargement… »,
         et l'hôte en est averti (événement `error`, aux seules origines déclarées par `hote=`). Sans ce garde, un CDN bloqué laissait un écran vide sans cause.
         Place EN TETE de la page (même garde que index_v7.html, sans le test de ?bi=1 : cette page est toujours le composant) : il doit ecouter avant les scripts du head (MapLibre, SunCalc), dont l'echec survient avant que le voile existe.
         Gardé par tests/amorcage-garde.test.js ; `window.__biPret` est posé par lib/bi/montage.js. -->
    <script src="./lib/bi/amorcage.js?v=1.45.0"></script>

    <script src="./vendor/maplibre-gl/maplibre-gl.js"></script>
    <link href="./vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />

    <link rel="stylesheet" href="./lib/page-bi.css?v=1.45.0" />
</head>
<body class="mode-bi">
    <!-- La classe du voile est posée AVANT le premier affichage. Même règle que `voileDemande` (lib/bi/voile.js), gardée par tests/bi-premier-affichage.test.js. -->
    <script src="./lib/bi/voile-initial.js?v=1.45.0"></script>
    <div id="bi-voile" role="status" aria-live="polite">Chargement de la carte…</div>
    <div id="map"></div>
    <script type="module" src="./lib/bi/demarrer.js?v=1.45.0"></script>
</body>
</html>
