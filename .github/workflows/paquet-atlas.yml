# Atlas — le paquet WEB figé
#
# À chaque étiquette `atlas-web-v<version>` : fabrique DEUX archives du paquet web d'Atlas depuis `published/atlas/` au commit étiqueté, et les dépose en release avec
# leurs empreintes : le paquet complet (la page maigre, l'application et leurs dépendances, sans CDN) et le paquet « carte seule » (`atlas-web-bi-<version>.zip` : le
# composant carte BI et l'élément `<atlas-bi>`, avec `CSP.txt` et `PRECACHE.json`). C'est ce qu'un client en production télécharge pour ne pas suivre la dernière
# version de l'adresse publique. L'étiquette est un geste qu'on pose soi-même : rien ne part tant qu'elle n'est pas poussée.
#
# Ne se confond pas avec `apk-atlas.yml` (étiquettes `atlas-v*` : l'application Android).

name: Paquet web Atlas

on:
  workflow_dispatch: {}
  push:
    tags:
      - "atlas-web-v*"

permissions:
  contents: write

jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # L'étiquette et la version du paquet doivent dire la même chose : sinon la release annoncerait une version et en livrerait une autre.
      - name: Vérifier que l'étiquette dit la version publiée
        run: |
          version=$(node -p "require('./published/atlas/package.json').version")
          etiquette="${GITHUB_REF_NAME#atlas-web-v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$version" != "$etiquette" ]; then
            echo "L'étiquette ($GITHUB_REF_NAME) ne correspond pas à la version publiée ($version)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fabriquer les paquets
        run: |
          node scripts/paquet-atlas.js --sortie dist --profil tous
          cd dist
          zip -r -q "atlas-web-${VERSION}.zip" "atlas-web-${VERSION}"
          zip -r -q "atlas-web-bi-${VERSION}.zip" "atlas-web-bi-${VERSION}"
          sha256sum "atlas-web-${VERSION}.zip" "atlas-web-bi-${VERSION}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Les paquets se relisent (archives complètes, client, licence, politique de sécurité de contenu)
        run: |
          cd dist
          unzip -q -t "atlas-web-${VERSION}.zip"
          unzip -q -t "atlas-web-bi-${VERSION}.zip"
          for d in "atlas-web-${VERSION}" "atlas-web-bi-${VERSION}"; do
            test -f "$d/PAQUET.json"
            test -f "$d/bi.html"
            test -f "$d/lib/bi/client-hote.js"
            test -f "$d/LICENSE"
            test ! -d "$d/demos"
          done
          test -f "atlas-web-bi-${VERSION}/CSP.txt"
          test -f "atlas-web-bi-${VERSION}/PRECACHE.json"
          test ! -f "atlas-web-bi-${VERSION}/app.js"
          test ! -d "atlas-web-bi-${VERSION}/models"

      - name: Déposer la release (sur étiquette)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/atlas-web-${VERSION}.zip" "dist/atlas-web-bi-${VERSION}.zip" dist/SHA256SUMS \
            --title "Atlas — paquet web ${VERSION}" --notes-file dist/NOTES.md

      - name: Garder les archives (hors étiquette)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-web
          path: |
            dist/atlas-web-${{ env.VERSION }}.zip
            dist/atlas-web-bi-${{ env.VERSION }}.zip
            dist/SHA256SUMS
            dist/NOTES.md
          if-no-files-found: error
