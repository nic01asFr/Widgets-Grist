            ft.forEach(t => {
                const s = gristToDate(t.dateDebut) || gristToDate(t.dateEcheance);
                const e = gristToDate(t.dateEcheance) || s;
                if (!s) return;
                const taskStart = startOfDay(s), taskEnd = endOfDay(e);
                for (let w = 0; w < weeks; w++) {
                    const wStart = addDays(firstDate, w * 7);
                    if (taskEnd >= wStart && taskStart <= endOfDay(addDays(wStart, 6)))
                        tasksByWeek[w].push({ task: t, start: taskStart, end: taskEnd });
                }
            });

            // Passe 1 : calculer les lanes max nécessaires par semaine (sans cutoff)
            const maxLanesPerWeek = tasksByWeek.map((tasks, w) => {
                const wStart = addDays(firstDate, w * 7);
                tasks.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
                const lns = [];
                tasks.forEach(({ start, end }) => {
                    const bs = Math.max(start.getTime(), wStart.getTime());
                    const be = Math.min(end.getTime(), addDays(wStart, 7).getTime() - 1);
                    const sd = Math.floor((bs - wStart.getTime()) / 86400000);
                    const ed = Math.floor((be - wStart.getTime()) / 86400000);
                    let lane = lns.findIndex(l => l <= sd);
                    if (lane === -1) { lane = lns.length; lns.push(0); }
                    lns[lane] = ed + 1;
                });
                return lns.length;
            });

            // Calculer les hauteurs proportionnelles par semaine
            const availableHeight = monthBody.clientHeight || weeks * 80;
            const HEADER_H = 32, MIN_LANE_H = 20, MAX_BAR_H = 72, MIN_ROW_H = HEADER_H + MIN_LANE_H;
            const weights = maxLanesPerWeek.map(n => Math.max(1, n));
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            const rawHeights = weights.map(wt => Math.max(MIN_ROW_H, (wt / totalWeight) * availableHeight));
            const totalRaw = rawHeights.reduce((a, b) => a + b, 0);
            const heights = totalRaw > availableHeight
                ? rawHeights.map(h => Math.max(MIN_ROW_H, h * availableHeight / totalRaw))
                : rawHeights;

            // Lanes visibles : combien peuvent tenir avec hauteur minimale
            const visibleLanesPerRow = heights.map(h => Math.max(1, Math.floor((h - HEADER_H) / MIN_LANE_H)));

            // Appliquer les hauteurs aux lignes DOM
            weekRows.forEach((row, w) => {
                row.style.flex = 'none';
                row.style.height = Math.round(heights[w]) + 'px';
            });

            // Passe 2 : Rendu des barres avec chevrons (B) et cutoff dynamique (C)
            weekRows.forEach((row, w) => {
                const lanesContainer = document.createElement('div');
                lanesContainer.className = 'week-lanes-container';
                const weekStart = addDays(firstDate, w * 7);
                const weekEnd = addDays(weekStart, 7); // exclusif
                const maxVisible = visibleLanesPerRow[w];
                // laneH distribué sur les lanes réellement utilisées (pas le max théorique)
                const usedLanes = Math.max(1, Math.min(maxLanesPerWeek[w], maxVisible));
                const laneH = Math.floor((heights[w] - HEADER_H) / usedLanes);
                const barH = Math.min(MAX_BAR_H, Math.max(14, laneH - 4));
                const level = barH < 20 ? 'compact' : barH < 34 ? 'medium' : barH < 52 ? 'tall' : 'full';

                const lanes = [];
                let hiddenCount = 0;

                tasksByWeek[w].forEach(({ task, start, end }) => {
                    const barStart = Math.max(start.getTime(), weekStart.getTime());
                    const barEnd = Math.min(end.getTime(), weekEnd.getTime() - 1);
                    const startDay = Math.floor((barStart - weekStart.getTime()) / 86400000);
                    const endDay = Math.floor((barEnd - weekStart.getTime()) / 86400000);

                    let lane = lanes.findIndex(l => l <= startDay);
                    if (lane === -1) { lane = lanes.length; lanes.push(0); }
                    lanes[lane] = endDay + 1;

                    if (lane < maxVisible) {
                        const p = getPriority(task);
                        const top = HEADER_H + lane * laneH;
                        const continuedFromPrev = start < weekStart;
                        const continuesNext = end >= weekEnd;
                        const isMilestone = task.type === 'jalon';
                        const isClosed = !TF.isLive(statusCfg, task.statut);

                        const bar = document.createElement('div');
                        bar.className = ['event-bar', `p${p}`, `size-${level}`,
                            isMilestone ? 'milestone' : '',
                            isClosed ? 'done' : '',
                            task.id === selectedTaskId ? 'selected' : '',
                            continuedFromPrev ? 'continued-left' : '',
                            continuesNext ? 'continues-right' : ''
                        ].filter(Boolean).join(' ');
                        const projectColor = task.projet ? getProjectColor(task.projet) : null;
                        bar.style.cssText = `left:${startDay / 7 * 100}%; width:${(endDay - startDay + 1) / 7 * 100}%; top:${top}px; height:${barH}px;${projectColor ? ` border-left-color:${projectColor};` : ''}`;
                        if (!isMilestone) bar.style.background = getTaskBarGradient(task);

                        buildBarContent(bar, task, level, continuedFromPrev, continuesNext, isMilestone);

                        bar.addEventListener('click', (e) => { e.stopPropagation(); openTaskPanel(task.id); });
                        lanesContainer.appendChild(bar);
                    } else {
                        hiddenCount++;
                    }
                });

                // C: +N overflow → naviguer vers vue semaine
                if (hiddenCount > 0) {
                    const more = document.createElement('div');
                    more.className = 'more-events';
                    more.textContent = `+${hiddenCount}`;
                    const capturedWeekStart = new Date(weekStart.getTime());
                    more.addEventListener('click', (e) => {
                        e.stopPropagation();
                        currentDate = capturedWeekStart;
                        setView('week');
                    });
                    const lastDay = row.querySelector('.month-day:last-child');
                    if (lastDay) lastDay.appendChild(more);
                }

                row.appendChild(lanesContainer);
            });
        }
        
        // Construit le contenu d'une barre adaptative selon son niveau de détail
        function buildBarContent(bar, task, level, continuedFromPrev, continuesNext, isMilestone) {
            const title = task.titre || 'Sans titre';

            if (isMilestone || level === 'compact') {
                // Layout horizontal : [◄] titre [►]
                if (continuedFromPrev) { const a = document.createElement('span'); a.className = 'bar-chevron bar-chevron-left'; a.textContent = '◄'; bar.appendChild(a); }
                const t = document.createElement('span'); t.className = 'eb-title'; t.textContent = title; bar.appendChild(t);
                if (continuesNext) { const a = document.createElement('span'); a.className = 'bar-chevron bar-chevron-right'; a.textContent = '►'; bar.appendChild(a); }
                return;
            }

            // Layout vertical pour medium / tall / full
            bar.style.padding = '3px 7px';

            // Ligne 1 : [◄] titre  [badge statut]  [►]
            const rowTop = document.createElement('div');
            rowTop.className = 'eb-row-top';
            if (continuedFromPrev) { const a = document.createElement('span'); a.className = 'bar-chevron bar-chevron-left'; a.textContent = '◄'; rowTop.appendChild(a); }
            const t = document.createElement('span'); t.className = 'eb-title'; t.textContent = title; rowTop.appendChild(t);
            const si = getStatusInfo(task.statut);
            const badge = document.createElement('span'); badge.className = 'eb-status'; badge.textContent = si.label; badge.style.background = si.bg; rowTop.appendChild(badge);
            if (continuesNext) { const a = document.createElement('span'); a.className = 'bar-chevron bar-chevron-right'; a.textContent = '►'; rowTop.appendChild(a); }
            bar.appendChild(rowTop);

            // Ligne 2 (full seulement) : plage de dates
            if (level === 'full') {
                const ds = gristToDate(task.dateDebut) || gristToDate(task.dateEcheance);
                const de = gristToDate(task.dateEcheance) || ds;
                if (ds) {
                    const rowDate = document.createElement('div');
                    rowDate.className = 'eb-row-date';
                    const dateStr = formatDate(ds, 'short') + (de && de.getTime() !== ds.getTime() ? ' → ' + formatDate(de, 'short') : '');
                    rowDate.textContent = dateStr;
                    bar.appendChild(rowDate);
                }
            }

            // Ligne avatars (tall + full)
            if (level === 'tall' || level === 'full') {
                const ids = getAssignees(task);
                if (ids.length > 0) {
                    const rowBottom = document.createElement('div');
                    rowBottom.className = 'eb-row-bottom';
                    const MAX_AV = 5;
                    ids.slice(0, MAX_AV).forEach(id => {
                        const name = getTeamMemberName(id);
                        const color = getTeamMemberColor(id);
                        const av = document.createElement('span');
                        av.className = 'eb-avatar';
                        av.textContent = name ? name.charAt(0).toUpperCase() : '?';
                        av.style.background = color + '55';
                        av.style.borderColor = color + '99';
                        av.title = name;
                        rowBottom.appendChild(av);
                    });
                    if (ids.length > MAX_AV) {
                        const ov = document.createElement('span');
                        ov.className = 'eb-avatar';
                        ov.textContent = '+' + (ids.length - MAX_AV);
                        ov.style.background = 'rgba(255,255,255,0.2)';
                        rowBottom.appendChild(ov);
                    }
                    bar.appendChild(rowBottom);
                }
            }
        }

        function renderWeekEventBars(containerId, ft, weekStart, numDays) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const periodEnd = addDays(weekStart, numDays);
            const tasksInPeriod = [];

            ft.forEach(t => {
                const s = gristToDate(t.dateDebut) || gristToDate(t.dateEcheance);
                const e = gristToDate(t.dateEcheance) || s;
                if (!s) return;
                const taskStart = startOfDay(s), taskEnd = endOfDay(e);
                if (taskEnd >= weekStart && taskStart < periodEnd)
                    tasksInPeriod.push({ task: t, start: taskStart, end: taskEnd });
            });

            tasksInPeriod.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));

            const lanes = [];
            const maxLanes = 12;
            const rich = numDays <= 7;      // 7 ou 5 jours : colonnes assez larges pour une carte complete
            const step = rich ? 66 : 22;    // hauteur d'une voie
            let hidden = 0;

            tasksInPeriod.forEach(({ task, start, end }) => {
                const barStart = Math.max(start.getTime(), weekStart.getTime());
                const barEnd = Math.min(end.getTime(), periodEnd.getTime() - 1);
                const startDay = Math.floor((barStart - weekStart.getTime()) / 86400000);
                const endDay = Math.floor((barEnd - weekStart.getTime()) / 86400000);

                let lane = lanes.findIndex(l => l <= startDay);
                if (lane === -1) { lane = lanes.length; lanes.push(0); }
                lanes[lane] = endDay + 1;

                if (lane < maxLanes) {
                    const p = getPriority(task);
                    const isMilestone = task.type === 'jalon';
                    const isClosed = !TF.isLive(statusCfg, task.statut);
                    // B: Détecter continuation hors période
                    const continuedFromPrev = start < weekStart;
                    const continuesNext = end >= periodEnd;

                    const bar = document.createElement('div');
                    bar.className = ['week-event-bar', `p${p}`,
                        isMilestone ? 'milestone' : '',
                        isClosed ? 'done' : '',
                        rich && !isMilestone ? 'rich' : '',
                        task.id === selectedTaskId ? 'selected' : '',
                        continuedFromPrev ? 'continued-left' : '',
                        continuesNext ? 'continues-right' : ''
                    ].filter(Boolean).join(' ');
                    const projectColor = task.projet ? getProjectColor(task.projet) : null;
                    bar.style.cssText = `left:${startDay / numDays * 100}%; width:${(endDay - startDay + 1) / numDays * 100}%; top:${lane * step}px;${projectColor ? ` border-left-color:${projectColor};` : ''}`;
                    if (!isMilestone) bar.style.background = getTaskBarGradient(task);

                    // Memes cartes que le mois : titre + statut, dates, avatars (vue 7 ou 5 jours) ; barre fine en vue 2 semaines
                    buildBarContent(bar, task, rich && !isMilestone ? 'full' : 'compact', continuedFromPrev, continuesNext, isMilestone);

                    bar.addEventListener('click', (e) => { e.stopPropagation(); openTaskPanel(task.id); });
                    container.appendChild(bar);
                } else {
                    hidden++;
                }
            });

            // La zone « journee » grandit avec les voies utilisees ; au-dela, « +N » ouvre la liste de la periode
            const used = Math.min(lanes.length, maxLanes);
            if (container.parentElement) container.parentElement.style.minHeight = Math.max(80, used * step + (hidden ? 30 : 10)) + 'px';
            if (hidden > 0) {
                const more = document.createElement('div');
                more.className = 'more-events';
                more.textContent = '+' + hidden + (hidden > 1 ? ' autres' : ' autre');
                more.title = 'Voir toutes les tâches de la période';
                more.addEventListener('click', (e) => {
                    e.stopPropagation();
                    panelState = { open: true, mode: 'period', periodType: 'week', periodDate: weekStart, periodTasks: tasksInPeriod.map(x => x.task), taskId: null, taskIndex: -1, isNew: false, editData: null };
                    renderPanelPeriod();
                    openPanel();
                });
                container.appendChild(more);
            }
        }

        function renderYear() {

            for (let m = 0; m < 12; m++) {

                miniMonth.appendChild(title);

                for (let d = 1; d <= 7; d++) {
                    const hdr = document.createElement('div');
                    hdr.className = 'mini-day-header';
                    hdr.textContent = DAYS[d % 7].charAt(0);
                    gridEl.appendChild(hdr);
                }

                let date = new Date(firstDate);
                for (let w = 0; w < 6; w++) {
                    const weekStart = addDays(firstDate, w * 7);
                    const weekEnd = endOfDay(addDays(weekStart, 6));

                        dayEl.textContent = date.getDate();

                    }

                    barsEl.className = 'mini-month-bars';

                    const weekTasks = [];
                    ft.forEach(t => {
                        const s = gristToDate(t.dateDebut) || gristToDate(t.dateEcheance);
                        const e = gristToDate(t.dateEcheance) || s;
                        if (!s) return;
                        const ts = startOfDay(s), te = endOfDay(e);
                        if (te >= weekStart && ts <= weekEnd) weekTasks.push({ task: t, start: ts, end: te });
                    });

                    weekTasks.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
                    const lanes = [];
                    const MAX_LANES = 2;
                    weekTasks.forEach(({ task, start, end }) => {
                        const barStart = Math.max(start.getTime(), weekStart.getTime());
                        const barEnd = Math.min(end.getTime(), weekEnd.getTime());
                        const startDay = Math.floor((barStart - weekStart.getTime()) / 86400000);
                        const endDay = Math.floor((barEnd - weekStart.getTime()) / 86400000);
                        let lane = lanes.findIndex(l => l <= startDay);
                        if (lane === -1) { lane = lanes.length; lanes.push(0); }
                        lanes[lane] = endDay + 1;

                            const cL = start < weekStart, cR = end > weekEnd;
                            bar.style.cssText = `left:${startDay / 7 * 100}%; width:${(endDay - startDay + 1) / 7 * 100}%; top:${1 + lane * 5}px; background:${color}; height:4px; border-radius:${cL?'0':'2px'} ${cR?'0':'2px'} ${cR?'0':'2px'} ${cL?'0':'2px'};`;
                            bar.title = task.titre || 'Sans titre';
                            bar.addEventListener('click', (e) => { e.stopPropagation(); openTaskPanel(task.id); });
                            barsEl.appendChild(bar);
                        }
                    });

                    const usedLanes = Math.min(lanes.length, MAX_LANES);
                    if (usedLanes > 0) barsEl.style.height = (usedLanes * 5 + 2) + 'px';
                    gridEl.appendChild(barsEl);
                }

                miniMonth.appendChild(gridEl);
                grid.appendChild(miniMonth);
            }

        // Vue Trimestre / Semestre : mois expansés sur toute la hauteur (Option 1)
        function renderCompact(nbMonths) {
            const grid = document.getElementById('compactGrid');
            grid.innerHTML = '';
            const ft = getFilteredTasks();
            const startMonth = currentDate.getMonth();
            const startYear = currentDate.getFullYear();

            for (let i = 0; i < nbMonths; i++) {

                // Zone grille (flex colonne, prend toute la hauteur restante)

                    // Mini-barres événements pour cette semaine

                    const weekTasks = [];
                    ft.forEach(t => {
                        const s = gristToDate(t.dateDebut) || gristToDate(t.dateEcheance);
                        const e = gristToDate(t.dateEcheance) || s;
                        if (!s) return;
                        const ts = startOfDay(s), te = endOfDay(e);
                        if (te >= weekStart && ts <= weekEnd) weekTasks.push({ task: t, start: ts, end: te });
                    });

                    weekTasks.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
                    const lanes = [];
                    const MAX_MINI_LANES = 4;
                    weekTasks.forEach(({ task, start, end }) => {
                        const barStart = Math.max(start.getTime(), weekStart.getTime());
                        const barEnd = Math.min(end.getTime(), weekEnd.getTime());
                        const startDay = Math.floor((barStart - weekStart.getTime()) / 86400000);
                        const endDay = Math.floor((barEnd - weekStart.getTime()) / 86400000);
                        let lane = lanes.findIndex(l => l <= startDay);
                        if (lane === -1) { lane = lanes.length; lanes.push(0); }
                        lanes[lane] = endDay + 1;
                        if (lane < MAX_MINI_LANES) {
                            const bar = document.createElement('div');
                            bar.className = 'mini-event-bar';
                            const color = PRIORITY_COLORS[getPriority(task)] || '#64748b';
                            const continuedLeft = start < weekStart;
                            const continuesRight = end > weekEnd;
                            bar.style.cssText = `left:${startDay / 7 * 100}%; width:${(endDay - startDay + 1) / 7 * 100}%; top:${2 + lane * 7}px; background:${color}; height:5px; border-radius:${continuedLeft ? '0' : '2px'} ${continuesRight ? '0' : '2px'} ${continuesRight ? '0' : '2px'} ${continuedLeft ? '0' : '2px'};`;
                            bar.title = task.titre || 'Sans titre';
                            bar.addEventListener('click', (e) => { e.stopPropagation(); openTaskPanel(task.id); });
                            barsEl.appendChild(bar);
                        }
                    });
                    const usedLanes = Math.min(lanes.length, MAX_MINI_LANES);
                    if (usedLanes > 0) barsEl.style.height = (usedLanes * 7 + 4) + 'px';
                    weekWrapper.appendChild(barsEl);
                    gridEl.appendChild(weekWrapper);
                }

                miniMonth.appendChild(gridEl);
                grid.appendChild(miniMonth);
            }
        }

            document.getElementById('gridContainer').classList.add('panel-open');
            document.getElementById('panelOverlay').classList.add('visible');
        }

        function closePanel() {
            panelState.open = false;
            document.getElementById('panel').classList.remove('open');
            document.getElementById('gridContainer').classList.remove('panel-open');
            document.getElementById('panelOverlay').classList.remove('visible');
            panelState = { open: false, mode: null, periodType: null, periodDate: null, periodTasks: [], taskId: null, taskIndex: -1, isNew: false, editData: null };
            render();
        }
        function confirmClosePanel() {
            if (panelState.isNew && panelState.editData?.titre?.trim()) {
                TF.confirm({ title: 'Fermer sans créer la tâche ?', message: 'Ce qui a été saisi sera perdu.', confirmLabel: 'Fermer sans créer', danger: true }).then(ok => { if (ok) closePanel(); });
            } else { closePanel(); }
        }
        
        function openDayPanel(date) {
            selectedDate = date;
            const ft = getFilteredTasks().filter(t => {
                const s = gristToDate(t.dateDebut), e = gristToDate(t.dateEcheance) || s;
                return s && startOfDay(s) <= date && endOfDay(e || s) >= date;
            });
            panelState = { open: true, mode: 'period', periodType: 'day', periodDate: date, periodTasks: ft, taskId: null, taskIndex: -1, isNew: false, editData: null };
            renderPanelPeriod();
            openPanel();
            render();
        }
        
        function openWeekPanel(date) {
            const weekStart = getWeekStart(date);
            const weekEnd = addDays(weekStart, 6);
            const ft = getFilteredTasks().filter(t => {
                const s = gristToDate(t.dateDebut), e = gristToDate(t.dateEcheance) || s;
                return s && startOfDay(s) <= weekEnd && endOfDay(e || s) >= weekStart;
            });
            panelState = { open: true, mode: 'period', periodType: 'week', periodDate: weekStart, periodTasks: ft, taskId: null, taskIndex: -1, isNew: false, editData: null };
            renderPanelPeriod();
            openPanel();
        }
        
        function openTaskPanel(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            selectedTaskId = taskId;
            const idx = panelState.periodTasks.findIndex(t => t.id === taskId);
            panelState.mode = 'task';
            panelState.taskId = taskId;
            panelState.taskIndex = idx >= 0 ? idx : 0;
            panelState.isNew = false;
            panelState.editData = cloneTaskData(task);
            renderPanelTask();
            openPanel();
            if (gristReady) grist.setSelectedRows([taskId]);
            render();
        }
        
        function openCreatePanel(date = null) {
            const today = new Date();
            const targetDate = date || selectedDate || today;
            panelState = {
                open: true, mode: 'task', periodType: panelState.periodType, periodDate: panelState.periodDate,
                periodTasks: panelState.periodTasks, taskId: null, taskIndex: -1, isNew: true,

        // WBS-03: création sous-tâche
        function openCreateTaskWithParent(parentId) {

            const parent = parentId ? tasks.find(t => t.id === parentId) : null;
            panelState = {
                open: true, mode: 'task', periodType: null, periodDate: null, periodTasks: [], taskId: null, taskIndex: -1, isNew: true,

                }

        function detachFromParent() { updateField('parentTask', null); }
        async function adjustParentDatesToChildren() {
            const t = tasks.find(x => x.id === panelState.taskId);
            if (!t || !hasChildren(t)) return;
            const kids = getAllDescendants(t.id);
            let minS = null, maxE = null;
            for (const k of kids) {
                if (k.dateDebut != null && (minS == null || k.dateDebut < minS)) minS = k.dateDebut;
                if (k.dateEcheance != null && (maxE == null || k.dateEcheance > maxE)) maxE = k.dateEcheance;
            }
            if (minS == null || maxE == null) { showToast('Aucun descendant avec dates', 'info'); return; }
            t.dateDebut = minS; t.dateEcheance = maxE;
            if (panelState.editData) { panelState.editData.dateDebut = minS; panelState.editData.dateEcheance = maxE; }
            if (gristReady) {
                try { await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', t.id, { dateDebut: minS, dateEcheance: maxE }]]); showSaveIndicator(); }
                catch (e) { showToast('Erreur ajustement', 'error'); }
            }
            renderPanelTask(); render();
        }
        function setParent(newParentId) {
            if (panelState.taskId && !canSetParent(panelState.taskId, newParentId)) {
                showToast('Cycle détecté — choix impossible', 'error');
                return;
            }
            updateField('parentTask', newParentId);
        }

        function cloneTaskData(task) {
            return {
                titre: task.titre || '',
                description: task.description || '',

                priorite: String(task.priorite || '3'),
                statut: TF.statusOf(statusCfg, task),
                progression: task.progression || 0,
                dateDebut: task.dateDebut,
                dateEcheance: task.dateEcheance,
                projet: task.projet || null,
                assignees: getAssignees(task),
                dependDe: getDependsOn(task),
                tags: getTags(task),
                estimationH: task.estimationH || null,
                tempsPasse: task.tempsPasse || null,
                subtasks: getSubtasks(task),
                couleur: task.couleur || null,
                parentTask: task.parentTask || null,
                charges: TF.parseCharges(task.charges), dateCloture: task.dateCloture || null
            };
        }
        
        // FIX: Synchroniser editData vers le task local dans tasks[]
        function syncLocalTask() {
            if (panelState.isNew || !panelState.taskId) return;
            const task = tasks.find(t => t.id === panelState.taskId);
            const data = panelState.editData;

            task.priorite = data.priorite;
            task.statut = data.statut;

            task.dateEcheance = data.dateEcheance;

        function backToPeriod(force) {
            if (!force && panelState.isNew && panelState.editData?.titre?.trim()) {
                TF.confirm({ title: 'Abandonner la création ?', message: 'Ce qui a été saisi sera perdu.', confirmLabel: 'Abandonner', danger: true }).then(ok => { if (ok) backToPeriod(true); });
                return;
            }
            if (panelState.periodType) {
                panelState.mode = 'period';
                panelState.taskId = null;
                panelState.isNew = false;
                panelState.editData = null;
                renderPanelPeriod();
            } else {
                closePanel();
            }
        }
        
        function navigatePanelTask(dir) {
            if (panelState.isNew || panelState.periodTasks.length < 2) return;
            let newIdx = panelState.taskIndex + dir;
            if (newIdx < 0) newIdx = panelState.periodTasks.length - 1;
            if (newIdx >= panelState.periodTasks.length) newIdx = 0;
            const t = panelState.periodTasks[newIdx];
            if (t) openTaskPanel(t.id);
        }

                    ${(!panelState.isNew || data.parentTask) ? `

                                ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">

                    <div class="prop-row">
                        <span class="prop-label">${assignLabel}</span>
                        <div class="prop-value">
                            ${data.assignees.length ? `<div class="asg-list">${data.assignees.map(id => { const nm = getTeamMemberName(id) || '?'; const initials = nm.split(' ').filter(Boolean).map(w => w[0]).slice(0,2).join('').toUpperCase(); const mem = team.find(x => x.id === id); return `<div class="asg"><span class="asg-ava" style="background:${getTeamMemberColor(id)}">${escapeHtml(initials)}</span><span class="an">${escapeHtml(nm)}</span>${mem && mem.role ? `<span class="ar">${escapeHtml(mem.role)}</span>` : ''}<button class="asg-x" title="Retirer" onclick="removeAssignee(${id})">×</button></div>`; }).join('')}</div>` : ''}
                            <div class="multi-select" id="assigneesSelect"><button class="addbtn" onclick="toggleMultiSelect('assigneesSelect')"><span style="font-size: var(--fs-lg);line-height:1">+</span> ${data.type === 'reunion' ? 'Ajouter un participant' : 'Assigner un membre'}</button><div class="multi-select-dropdown">${assigneesOptions || '<div class="multi-select-empty">Aucun membre</div>'}</div></div>
                        </div>
                    </div>
                    ${data.type === 'tache' ? `
                    <div class="prop-row">
                        <span class="prop-label">Temps &amp; charge</span>
                        <div class="prop-value">
                            <div class="tc-grid">
                                <div class="tc-box"><div class="tcl">Estimé</div><div class="tcv"><input type="number" min="0" step="0.5" value="${estim || ''}" placeholder="0" onchange="updateField('estimationH', parseFloat(this.value) || null)"><small>h</small></div></div>
                                <div class="tc-box"><div class="tcl">Passé${CRA_ACTIVE ? ' <span style="font-weight:400;opacity:.6">(Feuille de temps)</span>' : ''}</div><div class="tcv"><input type="number" min="0" step="0.5" value="${passe || ''}" placeholder="0" ${CRA_ACTIVE ? 'readonly title="Saisi via la Feuille de temps"' : ''} onchange="updateField('tempsPasse', parseFloat(this.value) || null)"><small>h</small></div></div>
                            </div>
                            ${estim > 0 ? `<div class="tc-bar"><i class="${timeOver ? 'over' : ''}" style="width:${timePercent}%"></i></div><div class="tc-foot"><span>${Math.round((passe/estim)*100)}% consommé</span><span>reste ${Math.max(estim-passe,0)} h</span></div>` : ''}
                            ${(data.assignees.length && TASK_COLS.has('charges')) ? `<div style="margin-top:13px"><div class="prop-label" style="margin-bottom:6px">Charge par personne</div>${data.assignees.map(id => `<div class="charge-row"><span class="an">${escapeHtml(getTeamMemberName(id))}</span><input type="number" min="0" step="0.5" value="${chargeOf(id)}" onchange="updateCharge(${id}, this.value)"><span style="font-size: var(--fs-sm);color:var(--text-muted)">h</span></div>`).join('')}<div style="margin-top:6px;font-size: var(--fs-sm);color:var(--text-muted)">Total : <strong>${chargeTotalH}</strong> h</div></div>` : ''}${chargeConsolHtml}
                        </div>
                    </div>` : ''}
                    ${data.type === 'tache' ? `
                    <div class="prop-row pr-prog">
                        <span class="prop-label">Progression</span>
                        <div class="prop-value">
                            <div class="progress-inline-wrap">
                                <div class="progress-bar-mini"><div class="progress-bar-mini-fill" id="progressBarFill" style="width:${data.progression}%"></div></div>
                                <span class="progress-pct-label" id="progressValue">${data.progression}%</span>
                            </div>
                            <input type="range" class="progress-slider" min="0" max="100" value="${data.progression}" oninput="document.getElementById('progressValue').textContent=this.value+'%';document.getElementById('progressBarFill').style.width=this.value+'%'" onchange="updateField('progression', parseInt(this.value))">
                            <div class="progress-presets">
                                <div class="progress-preset ${data.progression === 0 ? 'active' : ''}" onclick="setProgressPreset(0)">0%</div>
                                <div class="progress-preset ${data.progression === 25 ? 'active' : ''}" onclick="setProgressPreset(25)">25%</div>
                                <div class="progress-preset ${data.progression === 50 ? 'active' : ''}" onclick="setProgressPreset(50)">50%</div>
                                <div class="progress-preset ${data.progression === 75 ? 'active' : ''}" onclick="setProgressPreset(75)">75%</div>
                                <div class="progress-preset ${data.progression === 100 ? 'active' : ''}" onclick="setProgressPreset(100)">100%</div>
                            </div>
                        </div>
                    </div>` : ''}
                </div>

                <!-- Description / Ordre du jour / Critères -->
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">${descLabel}</span></div>
                    <div class="form-group"><textarea class="form-textarea" placeholder="${descLabel}..." oninput="updateField('description', this.value, true)">${escapeHtml(data.description)}</textarea></div>
                </div>

                <!-- WBS-03: Sous-tâches (hiérarchie) -->
                ${!panelState.isNew ? (function() {
                    const kids = getChildren(panelState.taskId);
                    const _par = data.parentTask ? tasks.find(x => x.id === data.parentTask) : null;
                    const parentLink = _par ? '<div class="prereq-item" onclick="openTaskPanel(' + _par.id + ')" title="Ouvrir la tâche parent"><span style="flex-shrink:0;font-weight:700;color:var(--primary)">↑</span><span class="prereq-item-title">Parent : ' + escapeHtml(_par.titre) + '</span></div>' : '';
                    const kidsList = kids.map(k => {
                        const kp = getPriority(k);
                        const kprog = hasChildren(k) ? aggregateProgress(k) : (k.progression || 0);
                        return `<div class="prereq-item" onclick="openTaskPanel(${k.id})">
                            <span style="width:3px;height:16px;border-radius:2px;flex-shrink:0;background:${PRIORITY_COLORS[kp]};display:inline-block"></span>

                            <span class="prereq-badge ${TF.statusOf(statusCfg, k)}">${kprog}%</span>

                    }).join('');
                    return `<div class="panel-section">
                        <div class="panel-section-header"><span class="panel-section-title">Sous-tâches (hiérarchie)</span>${kids.length ? `<span class="panel-section-badge">${kids.length}</span>` : TF.ui.info("Aucune sous-tâche. Décomposez cette tâche en étapes planifiables.")}</div>
                        ${parentLink}
                        ${kids.length ? `<div class="prereq-list">${kidsList}</div>` : ''}
                        <button class="panel-btn" style="width:auto;padding:6px 12px;font-size: var(--fs-sm);margin-top:6px;margin-right:6px" onclick="openCreateTaskWithParent(${panelState.taskId})">+ Sous-tâche</button>${kids.length ? `<button class="btn" style="padding:6px 12px;font-size: var(--fs-sm);margin-top:6px" onclick="adjustParentDatesToChildren()" title="Aligner les dates du parent sur min/max des descendants">↔ Ajuster dates</button>` : ''}

                })() : ''}

                <!-- Prérequis (jalon) ou Checklist (tâche/réunion) -->
                ${data.type === 'jalon' ? `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">Prérequis</span>${data.dependDe.length ? `<span class="panel-section-badge">${doneCount}/${data.dependDe.length}</span>` : TF.ui.info("Aucune dépendance — liez des tâches amont via le panneau d'une tâche.")}</div>
                    <div class="prereq-list">${prereqHtml}</div>
                </div>
                ` : `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">${data.type === 'reunion' ? 'Points à traiter' : 'Checklist'}</span>${subtasksTotal > 0 ? `<span class="panel-section-badge">${subtasksDone}/${subtasksTotal}</span>` : ''}</div>
                    <div class="subtask-list">${(data.subtasks || []).map(st => `<div class="subtask-item ${st.done ? 'done' : ''}"><input type="checkbox" class="subtask-checkbox" ${st.done ? 'checked' : ''} onchange="toggleSubtask(${st.id})"><input class="subtask-text" value="${escapeHtml(st.text)}" onchange="editSubtask(${st.id}, this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="subtask-remove" onclick="removeSubtask(${st.id})">×</button></div>`).join('')}</div>
                    <div class="subtask-add"><input type="text" id="newSubtaskInput" placeholder="Ajouter..." onkeydown="handleSubtaskKeydown(event)"><button onclick="addSubtask()">+</button></div>
                </div>
                `}

                <!-- Détails : temps + tags + dépendances (hors jalon) -->
                ${data.type !== 'jalon' ? `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">Détails</span></div>
                    <div class="form-group"><div class="tags-input" onclick="document.getElementById('tagInput').focus()">${tagsChips}<input type="text" id="tagInput" placeholder="${data.tags.length ? '' : 'Ajouter un tag...'}" onkeydown="handleTagKeydown(event)"></div></div>
                    ${data.type !== 'reunion' ? `
                    <div class="form-group"><div class="multi-select" id="depsSelect"><div class="multi-select-trigger" onclick="toggleMultiSelect('depsSelect')"><div class="multi-select-values">${depsChips || '<span class="multi-select-placeholder">Dépendances...</span>'}</div><span class="multi-select-arrow">▾</span></div><div class="multi-select-dropdown">${depsOptions || '<div class="multi-select-empty">Aucune</div>'}</div></div>${blockedHtml}</div>
                    ` : ''}
                </div>
                ` : ''}

                ${!panelState.isNew ? `<div class="panel-footer-left"><button class="panel-btn danger" onclick="showDeleteConfirm()" style="width:auto;padding:10px 14px">Suppr.</button></div><div class="delete-confirm" id="deleteConfirm">${TF.deleteConfirmHtml(getChildren(panelState.taskId).length)}</div>` : ''}
            `;

            // Footer
            if (panelState.isNew) {
                const canCreate = data.titre && data.titre.trim().length > 0;
                footer.innerHTML = `<div style="display:flex;gap:8px;width:100%"><button class="panel-btn" style="flex:0 0 auto;width:auto;padding:10px 16px;background:transparent;color:var(--text-muted);border:1px solid var(--border)" onclick="closePanel()">Annuler</button><button class="panel-btn success" onclick="createTask()" ${!canCreate ? 'disabled' : ''} style="flex:1;width:auto">Créer la tâche</button></div>`;
            } else {
                footer.innerHTML = '';
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // FIELD UPDATES & HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function updateCharge(memberId, value) {
            const data = panelState.editData; if (!data) return;
            if (!Array.isArray(data.charges)) data.charges = [];
            const h = Math.max(0, Number(value) || 0);
            const existing = data.charges.find(c => c.teamId === memberId);
            if (existing) existing.heures = h; else data.charges.push({ teamId: memberId, heures: h });
            syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask();
        }
        // Les taches parentes suivent leurs sous-taches (TF.parentSpanUpdates) : apres un changement de dates dans la fiche,
        // retourne les actions Grist qui ajustent les ascendantes, et les applique aux taches en memoire.
        function parentSpanActions() {
            const prev = panelState.datesBefore;
            panelState.datesBefore = null;
            if (!prev || prev.id !== panelState.taskId) return [];
            return TF.parentSpanUpdates(tasks, panelState.taskId, prev).map(u => {
                const t = tasks.find(x => x.id === u.id);
                if (t) { t.dateDebut = u.dateDebut; t.dateEcheance = u.dateEcheance; }
                return ['UpdateRecord', 'Tasks', u.id, { dateDebut: u.dateDebut, dateEcheance: u.dateEcheance }];
            });
        }
        function updateField(field, value, noSave = false) {
            const data = panelState.editData;
            if (!data) return;
            if (field === 'dateDebut' || field === 'dateEcheance') {   // dates d'avant, pour que la tache parente suive (parentSpanActions)
                if (!panelState.datesBefore) { const lt = tasks.find(x => x.id === panelState.taskId); if (lt) panelState.datesBefore = { id: lt.id, dateDebut: lt.dateDebut, dateEcheance: lt.dateEcheance }; }
            }
            
            // BUG-01 FIX: Convert date strings to Grist timestamps using robust parsing
            let datesFix = null;
            if (field === 'dateDebut' || field === 'dateEcheance') {
                value = value ? dateToGrist(parseInputDate(value)) : null;
                datesFix = TF.datesPatch(data, field, value);
            }
            // dateCloture auto : posee au statut terminal, effacee si reouverture
            if (field === 'statut' || field === 'progression') Object.assign(data, TF.completionPatch(statusCfg, data, { [field]: value }));

            data[field] = value;
            if (datesFix) { Object.assign(data, datesFix.patch); showToast(datesFix.message, 'info'); }
            
            // Jalon: sync dates
            if (field === 'type' && value === 'jalon' && data.dateDebut) {
                data.dateEcheance = data.dateDebut;
            }
            
            // FIX: Synchroniser le task local pour affichage immédiat
            syncLocalTask();
            
            // Visual fields requiring re-render
            const visualFields = ['type', 'priorite', 'statut', 'projet', 'progression', 'dateDebut', 'dateEcheance', 'couleur', 'parentTask'];
            if (visualFields.includes(field)) {
                renderPanelTask();
                if (!panelState.isNew) render();
            }
            
            // Enable/disable create button
            if (field === 'titre' && panelState.isNew) {
                const btn = document.querySelector('.panel-footer .panel-btn.success');
                if (btn) btn.disabled = !value || !value.trim();
            }
            
            // Auto-save for existing tasks
            if (!panelState.isNew && !noSave && gristReady) {
                saveTaskToGrist();
            }
        }

        function setProgressPreset(value) {
            const data = panelState.editData;
            if (!data) return;
            if (Object.keys(TF.completionPatch(statusCfg, data, { progression: value })).length) { updateField('progression', value); return; }
            data.progression = value;
            syncLocalTask();

            const slider = document.querySelector('.progress-slider');
            const valueSpan = document.getElementById('progressValue');
            const barFill = document.getElementById('progressBarFill');
            if (slider) slider.value = value;
            if (valueSpan) valueSpan.textContent = value + '%';
            if (barFill) barFill.style.width = value + '%';
            document.querySelectorAll('.progress-preset').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === value);
            });
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function setTodayDate() {
            const data = panelState.editData;
            if (!data) return;
            const today = dateToGrist(new Date());
            data.dateDebut = today;
            if (data.type === 'jalon') data.dateEcheance = today;
            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }

        // Subtasks/Checklist
        function getSubtasks(task) {
            if (!task?.subtasks) return [];
            try { return JSON.parse(task.subtasks); } catch (e) { return []; }
        }
        function subtasksToJson(subtasks) {
            return JSON.stringify(subtasks || []);
        }
        function addSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;
            const data = panelState.editData;
            if (!data.subtasks) data.subtasks = [];
            data.subtasks.push({ id: Date.now(), text: text, done: false });
            input.value = '';
            updateSubtaskProgress();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }
        function toggleSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (st) {
                st.done = !st.done;
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();
            }
        }
        function removeSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const idx = data.subtasks.findIndex(s => s.id === id);
            if (idx !== -1) {
                data.subtasks.splice(idx, 1);
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();
            }
        }
        // Édite le texte d'un item de checklist (pas de renderPanelTask -> garde le focus dans l'input)
        function editSubtask(id, value) {
            const data = panelState.editData;
            if (!data || !data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (!st) return;
            const t = (value || '').trim();
            if (!t || t === st.text) return;
            st.text = t;
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }
        function updateSubtaskProgress() {
            const data = panelState.editData;
            if (!data.subtasks || data.subtasks.length === 0) return;
            const done = data.subtasks.filter(s => s.done).length;
            const total = data.subtasks.length;
            data.progression = Math.round((done / total) * 100);
            syncLocalTask();
        }
        function handleSubtaskKeydown(e) {
            if (e.key === 'Enter') { e.preventDefault(); addSubtask(); }
        }

        function toggleMultiSelect(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.multi-select').forEach(s => { if (s.id !== id) s.classList.remove('open'); });
            el.classList.toggle('open');
            TF.ui.placeDropdown(el);
        }

        function toggleAssignee(id) {
            const data = panelState.editData;
            const idx = data.assignees.indexOf(id);
            if (idx === -1) data.assignees.push(id);
            else data.assignees.splice(idx, 1);
            syncLocalTask();  // FIX
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }
        
        function removeAssignee(id) {
            const data = panelState.editData;
            const idx = data.assignees.indexOf(id);
            if (idx !== -1) {
                data.assignees.splice(idx, 1);
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();
            }
        }
        
        function toggleDependency(id) {
            const data = panelState.editData;
            const idx = data.dependDe.indexOf(id);
            if (idx === -1) data.dependDe.push(id);
            else data.dependDe.splice(idx, 1);
            syncLocalTask();  // FIX
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
        }
        
        function removeDependency(id) {
            const data = panelState.editData;
            const idx = data.dependDe.indexOf(id);
            if (idx !== -1) {
                data.dependDe.splice(idx, 1);
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
            }
        }
        
        function handleTagKeydown(e) {
            const data = panelState.editData;
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const tag = e.target.value.trim().replace(/^#/, '');
                if (tag && !data.tags.includes(tag)) {
                    data.tags.push(tag);
                    e.target.value = '';
                    syncLocalTask();  // FIX
                    if (!panelState.isNew && gristReady) saveTaskToGrist();
                    renderPanelTask();
                }
            } else if (e.key === 'Backspace' && !e.target.value && data.tags.length) {
                data.tags.pop();
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
            }
        }
        
        function removeTag(tag) {
            const data = panelState.editData;
            const idx = data.tags.indexOf(tag);
            if (idx !== -1) {
                data.tags.splice(idx, 1);
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
            }
        }
        
        function showDeleteConfirm() { document.getElementById('deleteConfirm').classList.add('visible'); }
        function hideDeleteConfirm() { document.getElementById('deleteConfirm').classList.remove('visible'); }

        // ═══════════════════════════════════════════════════════════════════════
        // CRUD OPERATIONS
        // ═══════════════════════════════════════════════════════════════════════
        async function saveTaskToGrist() {
            const data = panelState.editData;
            if (!data || panelState.isNew || !gristReady) return;
            if (data.dateDebut && data.dateEcheance && data.dateDebut > data.dateEcheance) {
                showToast('La date de début ne peut pas dépasser la date de fin', 'error');
                return;
            }

            const record = {
                titre: data.titre,
                description: data.description,
                type: data.type,
                priorite: data.priorite,
                statut: data.statut,
                progression: data.progression,
                dateDebut: data.dateDebut,
                dateEcheance: data.dateEcheance,
                projet: data.projet,
                assignees: toGristRefList(data.assignees),
                dependDe: toGristRefList(data.dependDe),
                tags: toGristChoiceList(data.tags),
                estimationH: data.estimationH,
                tempsPasse: data.tempsPasse,
                subtasks: subtasksToJson(data.subtasks),
                couleur: data.couleur || null,
                parentTask: data.parentTask || null,
                charges: TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId))), dateCloture: data.dateCloture || null
            };

            try {
                const parents = parentSpanActions();
                await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', panelState.taskId, pruneTaskRecord(record)]].concat(parents));
                showSaveIndicator();
                if (parents.length) { showToast('Tâche parente ajustée à ses sous-tâches', 'info'); render(); }
            } catch (e) {
                if (!(e && e.tfReadOnly)) showToast('Erreur de sauvegarde', 'error');
            }
        }
        
        async function createTask() {
            const data = panelState.editData;
            if (!data || !data.titre || !data.titre.trim()) {
                showToast('Le titre est requis', 'error');
                return;
            }
            if (data.dateDebut && data.dateEcheance && data.dateDebut > data.dateEcheance) {
                showToast('La date de début ne peut pas dépasser la date de fin', 'error');
                return;
            }

            const record = {
                titre: data.titre,
                description: data.description || '',
                type: data.type || 'tache',
                priorite: data.priorite || '3',
                statut: TF.statusOf(statusCfg, data),
                progression: data.progression || 0,
                dateDebut: data.dateDebut,
                dateEcheance: data.dateEcheance,
                projet: data.projet,
                assignees: toGristRefList(data.assignees),
                dependDe: toGristRefList(data.dependDe),
                tags: toGristChoiceList(data.tags),
                estimationH: data.estimationH,
                tempsPasse: data.tempsPasse,
                subtasks: subtasksToJson(data.subtasks),
                couleur: data.couleur || null,
                parentTask: data.parentTask || null,
                charges: TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId))), dateCloture: data.dateCloture || null
            };

            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([['AddRecord', 'Tasks', null, pruneTaskRecord(record)]]);
                    showToast('Tâche créée', 'success');
                    await loadAllData();
                    backToPeriod(true);
                } catch (e) {
                    showToast('Erreur de création', 'error');
                }
            } else {
                record.id = Date.now();
                tasks.push(record);
                showToast('Tâche créée', 'success');
                render();
                backToPeriod(true);
            }
        }
        
        async function confirmDelete(mode) {
            if (panelState.isNew || !panelState.taskId) return;
            const plan = TF.deletePlan(tasks, panelState.taskId, mode);
            const n = plan.removed.length;
            const msg = n > 1 ? n + ' tâches supprimées' : (plan.detached.length ? 'Supprimée (sous-tâches conservées)' : 'Supprimée');
            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions(plan.actions);
                    showToast(msg, 'success');
                    await loadAllData();
                    backToPeriod(true);
                } catch (e) {
                    showToast('Erreur de suppression', 'error');
                }
            } else {
                tasks = tasks.filter(t => !plan.removed.includes(t.id));
                tasks.forEach(t => { if (plan.detached.includes(t.id)) t.parentTask = null; });
                if (typeof rebuildChildrenCache === 'function') rebuildChildrenCache();
                showToast(msg, 'success');
                render();
                backToPeriod(true);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════
        async function initGrist() {
            // ?demo : donnees d'exemple tout de suite, sans attendre Grist (absent hors document).
            if (TF.isExplicitDemo()) { useDemoMode(); return; }
            // Phase 1 : tenter grist.ready — si Grist absent, basculer en démo
            try {
                await grist.ready({ requiredAccess: 'full' });
            } catch (e) {
                console.log('Grist unavailable, using demo:', e);
                useDemoMode();
                return;
            }
            // Contexte commun (filtres, couleur, niveau) et position memorisee, lus avant le premier rendu.
            await TF.ctx.init(grist, 'calendar'); applyCtx(); restorePos();
            if (TF.consumeRelinkNotice()) showToast('Widget relié à la table Tasks (Ctrl+Z dans Grist pour annuler)', 'success');
            // #7 respect des droits : bandeau lecture seule + garde transverse sur toutes les ecritures.
            TF.readOnlyBanner();
            TF.guardWrites(grist, {
                onReadOnly: () => showToast('Lecture seule : modification non autorisee', 'error'),
                onDenied: () => { showToast('Modification refusee par vos droits', 'error'); loadAllData(); }
            });
            // Phase 2 : ici on est dans Grist. Toute erreur est logguée mais ne bascule PAS en démo.
            // En lecture seule, on ne tente pas de creer le schema (ecritures bloquees).
            if (!TF.isReadOnly()) { try { await ensureSchema(); } catch (e) { console.error('ensureSchema error (continuing):', e); showToast('Schéma: ' + (e?.message || e), 'error'); } }
            try { CRA_ACTIVE = (await grist.docApi.listTables()).includes('TimeEntries'); } catch (e) {}
            try { await loadAllData(); } catch (e) { console.error('loadAllData error (continuing):', e); showToast('Chargement: ' + (e?.message || e), 'error'); }
            try {
                grist.onRecords(async () => await loadAllData());
                TF.watchTasks(grist, () => loadAllData());
                grist.onRecord((rec) => {
                    if (rec?.id && rec.id !== selectedTaskId) { selectedTaskId = rec.id; render(); }
                });
            } catch (e) { console.error('Grist listeners error:', e); }
        }

        // Event listeners
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.filter-dropdown')) {
                document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open'));
            }
            // Fermer les pickers couleur (Projects / Team)
            if (!e.target.closest('.color-picker-pop, .project-color-dot, .member-color-picker, .member-color-dot')) {
                document.querySelectorAll('.color-picker-pop, .member-color-picker').forEach(p => p.classList.remove('open'));
            }
            if (!e.target.closest('.multi-select')) {
                document.querySelectorAll('.multi-select').forEach(s => s.classList.remove('open'));
            }
            // GEN-01: Désélection si clic en dehors d'un événement, du panel ou des contrôles
            if (!e.target.closest('.event-bar, .panel, .toolbar, .filter-dropdown, .view-controls, .day-cell, .week-panel')) {
                if (selectedTaskId !== null && !panelState.open) {
                    selectedTaskId = null;

                }
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (panelState.open) confirmClosePanel();
            }
            if (panelState.open && panelState.mode === 'task' && !e.target.matches('input, textarea, select')) {
                if (e.key === 'ArrowLeft') navigatePanelTask(-1);
                if (e.key === 'ArrowRight') navigatePanelTask(1);
            }
        });

        panelOverlay.addEventListener('mousedown', (e) => { overlayPointerStart = { x: e.clientX, y: e.clientY }; });

            function pic(txt){ var t=(txt||'').toLowerCase();
                if(t.indexOf('statut')>=0)return P.statut;

                if(t.indexOf('date')>=0)return P.date;
                if(t.indexOf('projet')>=0)return P.projet;
                if(t.indexOf('couleur')>=0)return P.couleur;
                if(t.indexOf('parent')>=0)return P.parent;
                if(t.indexOf('assign')>=0||t.indexOf('particip')>=0||t.indexOf('quipe')>=0)return P.assigne;
                if(t.indexOf('charge')>=0)return P.charge;
                if(t.indexOf('progress')>=0)return P.progression;
                return ''; }

                        sel.addEventListener('click', function(ev){
                            if(!sel.classList.contains('tfo')){ ev.stopPropagation(); ev.preventDefault();
                                document.querySelectorAll('.tfc.tfo').forEach(function(o){ o.classList.remove('tfo'); });
                                sel.classList.add('tfo'); }
                        }, true);
                    });
                });
            }
            function deco(){ var c=document.getElementById('panelContent'); if(!c)return;

            var c=document.getElementById('panelContent');
            if(c){ try{ new MutationObserver(deco).observe(c,{childList:true}); }catch(e){} deco(); }
            document.addEventListener('click', function(ev){ document.querySelectorAll('.tfc.tfo').forEach(function(o){ if(!o.contains(ev.target)) o.classList.remove('tfo'); }); });

        renderCalSkeleton();  // 06 · squelette pendant le chargement

        setTimeout(function(){ try { if ((typeof tasks==='undefined' || !tasks || !tasks.length) && TF.shouldAutoDemo() && typeof useDemoMode==='function') useDemoMode(); } catch(e){ console.log(e); } }, 2800);
        try { if (new URLSearchParams(location.search).has('nav')) document.body.classList.add('suite-nav'); } catch (e) {}
