    /* Seme les options (choix + couleurs) sur une colonne Choice si elle n'en a
     * pas encore. Defensif. A appeler depuis ensureSchema apres creation.
     */
    async function seedStatusChoices(grist, table, column, statuses) {
        try {
            const tid = await tableRowId(grist, table);
            if (tid == null) return;
            const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
            const col = cols.find(c => c.parentId === tid && c.colId === column);
            if (!col) return;
            let opt = {};
            try { opt = JSON.parse(col.widgetOptions || '{}') || {}; } catch (e) { opt = {}; }
            if (Array.isArray(opt.choices) && opt.choices.length) return; // deja configure : on respecte
            const list = statuses && statuses.length ? statuses : DEFAULT_STATUSES;
            const choiceOptions = {};
            for (const s of list) choiceOptions[s.value] = { fillColor: s.fillColor, textColor: s.textColor };
            const widgetOptions = JSON.stringify({ choices: list.map(s => s.value), choiceOptions: choiceOptions });
            await grist.docApi.applyUserActions([['ModifyColumn', table, column, { widgetOptions: widgetOptions }]]);
        } catch (e) { console.warn('TF.seedStatusChoices:', e && e.message); }
    }

    /* ----- #2 : colonnes d'affichage des Ref (noms au lieu des IDs) ---------
     * Pose le visibleCol + la display formula sur des colonnes Ref pour que les
     * VUES NATIVES Grist affichent un libelle plutot que l'ID de ligne.
     * specs : [{ table:'Tasks', column:'projet', visibleColId:'nom' }, ...]
     * DEFENSIF : si Grist refuse une action, on log et on continue ; au pire
     * l'affichage reste en IDs (comportement actuel), jamais de casse.
     * --------------------------------------------------------------------- */
    async function setRefDisplayColumns(grist, specs) {
        if (!Array.isArray(specs) || !specs.length) return;
        try {
            const tables = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
            const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
            const tidOf = (tableId) => { const r = tables.find(t => t.tableId === tableId); return r ? r.id : null; };
            const colOf = (tableRow, colId) => cols.find(c => c.parentId === tableRow && c.colId === colId);

            const actions = [];
            for (const s of specs) {
                const srcTid = tidOf(s.table);
                if (srcTid == null) continue;
                const refCol = colOf(srcTid, s.column);
                if (!refCol) continue;
                // Table cible deduite du type "Ref:Target" / "RefList:Target".
                const m = /^(?:Ref|RefList):(.+)$/.exec(refCol.type || '');
                if (!m) continue;
                const targetTid = tidOf(m[1]);
                if (targetTid == null) continue;
                const visCol = colOf(targetTid, s.visibleColId);
                if (!visCol) continue;
                // Eviter de re-poser si deja correct.
                if (refCol.visibleCol === visCol.id) continue;
                actions.push(['SetDisplayFormula', s.table, null, refCol.id, '$' + s.column + '.' + s.visibleColId]);
                actions.push(['UpdateRecord', '_grist_Tables_column', refCol.id, { visibleCol: visCol.id }]);
            }
            if (actions.length) await grist.docApi.applyUserActions(actions);
        } catch (e) { console.warn('TF.setRefDisplayColumns:', e && e.message); }
    }

    /* ----- #3 : plan de charge (heures par personne) ------------------------
     * Stockage : colonne Text `charges` sur Tasks, JSON [{teamId, heures}].
     * Parse defensif identique au pattern subtasks.
     * --------------------------------------------------------------------- */
    function parseCharges(v) {
        try {
            const a = JSON.parse(v || '[]');
            if (!Array.isArray(a)) return [];
            return a.filter(x => x && x.teamId != null)
                    .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                    .filter(x => !isNaN(x.teamId));
        } catch (e) { return []; }
    }
    function chargesToJson(arr) {
        return JSON.stringify((arr || [])
            .filter(x => x && x.teamId != null)
            .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
            .filter(x => !isNaN(x.teamId)));
    }
    // Heures totales d'une tache (somme des charges par personne).
    function chargeTotal(charges) { return parseCharges(typeof charges === 'string' ? charges : JSON.stringify(charges || [])).reduce((s, c) => s + c.heures, 0); }
    // Agrege la charge par membre sur une liste de taches (chaque tache expose .charges).
    function chargeByMember(tasks) {
        const by = {};
        for (const t of (tasks || [])) {
            for (const c of parseCharges(t && t.charges)) {
                by[c.teamId] = (by[c.teamId] || 0) + c.heures;
            }
        }
        return by;
    }

    // Cle de periode : semaine ISO 'YYYY-Www' ou mois 'YYYY-MM'.
    function periodKey(date, granularity) {
        if (granularity === 'month') {
            return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
        }
        const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
        const day = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - day);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
    }

    // #3 plan de charge temporel : etale les charges PROPRES de chaque tache sur sa
    // duree (jours calendaires), agrege par personne et par periode.
    // dateDebut/dateEcheance = timestamps Unix SECONDES (Grist). Tache sans dates ou
    // sans charge = ignoree. Retourne { teamId: { periodKey: heures } }.
    function chargeByMemberPeriod(tasks, granularity) {
        const g = granularity === 'month' ? 'month' : 'week';
        const out = {};
        for (const t of (tasks || [])) {
            const charges = parseCharges(t && t.charges);
            if (!charges.length) continue;
            const s = t.dateDebut, e = t.dateEcheance;
            if (s == null || e == null) continue;
            const day0 = dayNum(s);
            const day1 = dayNum(e);
            const nDays = Math.max(day1 - day0 + 1, 1);
            for (const c of charges) {
                const perDay = (Number(c.heures) || 0) / nDays;
                if (!perDay) continue;
                if (!out[c.teamId]) out[c.teamId] = {};
                for (let dd = day0; dd <= day1; dd++) {
                    const key = periodKey(new Date(dd * 86400000), g);
                    out[c.teamId][key] = (out[c.teamId][key] || 0) + perDay;
                }
            }
        }
        return out;
    }

    // Decale une date de n periodes (semaine = 7 jours, mois = 1 mois).
    function shiftPeriods(date, granularity, n) {
        const d = new Date(date.getTime());
        if (granularity === 'month') d.setUTCMonth(d.getUTCMonth() + n);
        else d.setUTCDate(d.getUTCDate() + n * 7);
        return d;
    }

    // Liste contigue de cles de periode (semaine ISO ou mois) a partir d'une date,
    // alignee sur le debut de periode (lundi / 1er du mois). Inclut les periodes vides.
    function periodRange(startDate, granularity, count) {
        const g = granularity === 'month' ? 'month' : 'week';
        let d = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate()));
        if (g === 'week') { const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() - day + 1); }
        else { d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); }
        const out = [];
        for (let i = 0; i < count; i++) {
            out.push(periodKey(d, g));
            if (g === 'week') d.setUTCDate(d.getUTCDate() + 7);
            else d.setUTCMonth(d.getUTCMonth() + 1);
        }
        return out;
    }

    // chargeMatrix : generalise chargeByMemberPeriod. Etale les charges (via getCharges,
    // defaut parseCharges) sur la duree, agrege par cle keyFn(t, charge) et periode.
    function chargeMatrix(tasks, keyFn, granularity, getCharges, workdays) {
        const g = granularity === 'month' ? 'month' : 'week';
        const out = {};
        for (const t of (tasks || [])) {
            const charges = getCharges ? getCharges(t) : parseCharges(t && t.charges);
            if (!charges.length || t.dateDebut == null || t.dateEcheance == null) continue;
            const d0 = dayNum(t.dateDebut), d1 = dayNum(t.dateEcheance);
            const days = [];
            for (let dd = d0; dd <= d1; dd++) { if (workdays) { const wd = new Date(dd * 86400000).getUTCDay(); if (wd < 1 || wd > 5) continue; } days.push(dd); }
            if (!days.length) days.push(d0);
            for (const c of charges) {
                const key = keyFn(t, c); if (key == null) continue;
                const perDay = c.heures / days.length; if (!perDay) continue;
                if (!out[key]) out[key] = {};
                for (const dd of days) { const pk = periodKey(new Date(dd * 86400000), g); out[key][pk] = (out[key][pk] || 0) + perDay; }
            }
        }
        return out;
    }

    /* ----- #7 : respect des droits (ACL) ------------------------------------
     * Deux niveaux : (a) acces document lecture seule -> Grist passe
     * `readonly=true` dans l'URL de l'iframe ; (b) ACL au niveau ligne ->
     * l'acces widget peut etre `full` mais une ecriture sur une ligne donnee
     * est refusee par le serveur. safeApply absorbe ce refus proprement.
     * --------------------------------------------------------------------- */
    function _qp(name) { try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; } }
    // Vrai si Grist a ouvert le widget en lecture seule (acces doc restreint).
    function isReadOnly() { return _qp('readonly') === 'true'; }
    // Niveau d'acces accorde au widget : 'full' | 'read table' | 'none' (defaut 'full').
    function accessLevel() { return _qp('access') || 'full'; }
    // Detecte un message d'erreur Grist correspondant a un refus de droits.
    function isAccessError(e) {
        const msg = (e && (e.message || e.toString())) || '';
        return /access denied|not allowed|permission|forbidden|read[- ]?only|cannot (modify|add|remove)|acl/i.test(msg);
    }
    // Applique des actions en absorbant un refus de droits.
    // Retourne { ok:true } ou { ok:false, denied:bool, message }. Ne fait PAS d'UI
    // (chaque widget affiche son propre toast et recharge pour annuler l'optimiste).
    async function safeApply(grist, actions) {
        if (isReadOnly()) return { ok: false, denied: true, message: 'Document en lecture seule' };
        try { const r = await grist.docApi.applyUserActions(actions); return { ok: true, ret: r }; }
        catch (e) { return { ok: false, denied: isAccessError(e), message: (e && (e.message || e.toString())) || 'Erreur' }; }
    }
    // Garde transverse : enrobe grist.docApi.applyUserActions une seule fois pour
    // respecter les droits sur TOUS les sites d'ecriture sans les modifier un a un.
    // - lecture seule -> bloque + opts.onReadOnly()
    // - refus ACL au niveau ligne -> opts.onDenied(err) (le widget toast + recharge)
    // Les erreurs continuent d'etre levees (les try/catch existants les absorbent).
    function guardWrites(grist, opts) {
        opts = opts || {};
        if (!grist || !grist.docApi || grist.docApi._tfGuarded) return;
        const raw = grist.docApi.applyUserActions.bind(grist.docApi);
        grist.docApi._tfGuarded = true;
        grist.docApi.applyUserActions = async function (actions) {
            if (isReadOnly()) { try { opts.onReadOnly && opts.onReadOnly(); } catch (e) {} const err = new Error('Document en lecture seule'); err.tfReadOnly = true; throw err; }
            try { return await raw(actions); }
            catch (e) { if (isAccessError(e)) { try { opts.onDenied && opts.onDenied(e); } catch (e2) {} } throw e; }
        };
    }
    // Bandeau "lecture seule" auto-contenu (aucun markup widget requis).
    // Pousse le contenu vers le bas (padding-top sur body) pour NE PAS recouvrir l'en-tete du widget.
    function readOnlyBanner() {
        if (!isReadOnly() || (typeof document === 'undefined') || document.getElementById('tf-ro-banner')) return;
        const b = document.createElement('div');
        b.id = 'tf-ro-banner';
        b.textContent = 'Lecture seule — vos droits ne permettent pas la modification';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b45309;color:#fff;font:600 12px/1.4 system-ui,-apple-system,sans-serif;text-align:center;padding:6px 10px;letter-spacing:.2px;box-sizing:border-box';
        document.body.appendChild(b);
        const h = b.offsetHeight || 28;
        const prev = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
        document.body.style.paddingTop = (prev + h) + 'px';
    }

    return {
        DEFAULT_STATUSES: DEFAULT_STATUSES,
        columnarToRows: columnarToRows,
        loadStatusConfig: loadStatusConfig,
        buildStatusConfig: buildStatusConfig,
        getStatus: getStatus,
        isTerminal: isTerminal,
        isDone: isDone,
        isDead: isDead,
        isLive: isLive,
        statusOf: statusOf,
        shouldAutoDemo: shouldAutoDemo,
        confirm: uiConfirm,
        deletePlan: deletePlan,
        deleteConfirmHtml: deleteConfirmHtml,
        completionPatch: completionPatch,
        reopenValue: reopenValue,
        statusKnown: statusKnown,
        gristToDate: gristToDate,
        dateToGrist: dateToGrist,
        dayNum: dayNum,
        todayGrist: todayGrist,
        isoDate: isoDate,
        parseISODate: parseISODate,
        colorModeLabel: colorModeLabel,
        panelHeaderHtml: panelHeaderHtml,
        initUi: initUi,
        searchMatch: searchMatch,
        setPeriodLabel: setPeriodLabel,
        monthYearShort: monthYearShort,
        monthShort: monthShort,
        ui: ui,
        seedStatusChoices: seedStatusChoices,
        setRefDisplayColumns: setRefDisplayColumns,
        parseCharges: parseCharges,
        chargesToJson: chargesToJson,
        chargeTotal: chargeTotal,
        chargeByMember: chargeByMember,
        periodKey: periodKey,
        chargeByMemberPeriod: chargeByMemberPeriod,
        shiftPeriods: shiftPeriods,
        periodRange: periodRange,
        chargeMatrix: chargeMatrix,
        isReadOnly: isReadOnly,
        accessLevel: accessLevel,
        isAccessError: isAccessError,
        safeApply: safeApply,
        guardWrites: guardWrites,
        readOnlyBanner: readOnlyBanner
    };
})();

// WBS (hiérarchie sous-tâches) — API commune
let childrenByParent = new Map();
function rebuildChildrenCache() {
    childrenByParent = new Map();
    const cycleIds = new Set();
    for (const t of tasks) {
        const seen = new Set([t.id]);
        let cur = t.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
        let guard = 0;
        while (cur && guard++ < 128) {
            if (seen.has(cur.id)) { cycleIds.add(t.id); break; }
            seen.add(cur.id);
            cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
        }
    }
    if (cycleIds.size) console.warn('WBS: cycles detected on task ids:', [...cycleIds]);
    for (const t of tasks) {
        const pid = t.parentTask;
        if (pid && !isNaN(pid) && !cycleIds.has(t.id)) {
            if (!childrenByParent.has(pid)) childrenByParent.set(pid, []);
            childrenByParent.get(pid).push(t);
        }
    }
}

const isSameDay    = (a,b) => a && b && a.getDate()===b.getDate() && a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear();
const addDays      = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const startOfWeek  = d => { const t=new Date(d); const dow=t.getDay(); return addDays(t,-(dow===0?6:dow-1)); };
const getPriority  = t => parseInt(t?.priorite)||3;
const getStatus    = t => TF.statusOf(statusCfg, t);

const getAssigneesArray = t => {
    if (!t?.assignees) return [];
    const a = t.assignees;
    if (Array.isArray(a)) return a[0]==='L' ? a.slice(1) : a;   // RefList ['L',..] ou tableau simple
    if (typeof a === 'number') return [a];                       // Ref simple (un seul assigné)
    if (typeof a === 'string') return a.split(/[,;]/).map(s=>s.trim()).filter(Boolean); // texte (noms ou ids)
    return [];
};

function getWeekNumber(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
    const y = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date-y)/86400000)+1)/7);
}

function getPeriodStart(periode) {
    const d = new Date(); d.setHours(0,0,0,0);
    if (periode === 'week')    return startOfWeek(d);
    if (periode === 'month')   { d.setDate(1); return d; }
    if (periode === 'quarter') { d.setMonth(Math.floor(d.getMonth()/3)*3,1); return d; }
    return new Date(0);
}

function getFilteredTasks(compFilter, ignoreLeaves) {
    let ft = tasks;
    // WBS-04: feuilles seulement par défaut — évite double-compte parent+enfants.
    // ignoreLeaves: la charge (#3) somme les charges PROPRES de toutes les tâches (parents inclus, coordination), une seule fois.
    if (leavesOnly && !ignoreLeaves) ft = ft.filter(t => !hasChildren(t));
    if (filters.periode !== 'all') {
        const pStart = getPeriodStart(filters.periode);
        ft = ft.filter(t => { const d=gristToDate(t.dateEcheance); return d && d >= pStart; });
    }
    if (searchQuery) ft = ft.filter(t => TF.searchMatch(t, searchQuery, { projects, team }));
    if (filters.projets.length)  ft = ft.filter(t => filters.projets.includes(String(t.projet)));
    if (filters.assignes.length) ft = ft.filter(t => getAssigneesArray(t).some(a => filters.assignes.includes(String(a))));
    if (filters.statuts.length)  ft = ft.filter(t => filters.statuts.includes(getStatus(t)));
    if (compFilter && compFilter.field && compFilter.value) {
        const {field, value} = compFilter;
        ft = ft.filter(t => {
            if (field==='statut')   return getStatus(t)===value;
            if (field==='priorite') return String(getPriority(t))===String(value);
            if (field==='projet')   return String(t.projet)===String(value);
            if (field==='type')     return (t.type||'tache')===value;
            return true;
        });
    }
    return ft;
}

    if (!body) return;

    // ── Composants actifs — accordéon inline ──
    const accordionItems = dashConfig.layout.map(c => {
        const isOpen = c.id === selectedCompId;
        const cfgFields = CONFIG_FIELDS[c.type] || [];
        const cf = c.config.compFilter || { field:'', value:'' };
        const valueOpts = getFilterValueOptions(cf.field);

        const configBody = isOpen ? `<div class="accordion-body">
            <div class="cfg-row">
                <div class="cfg-label">Titre</div>
                <input class="cfg-input" type="text" value="${escapeHtml(c.title)}" oninput="updateCompTitle('${c.id}',this.value)" />
            </div>
            ${cfgFields.map(f => `
            <div class="cfg-row">
                <div class="cfg-label">${f.label}</div>
                <select class="cfg-input" onchange="updateCompConfig('${c.id}','${f.key}',this.value,event)">
                    ${f.options.map(([v,l]) => `<option value="${v}" ${String(c.config[f.key])===String(v)?'selected':''}>${l}</option>`).join('')}
                </select>
            </div>`).join('')}
            <div class="cfg-row">
                <div class="cfg-label">Filtre composant</div>
                <select class="cfg-input" onchange="updateCompFilterField('${c.id}',this.value,event)">
                    ${FILTER_FIELDS.map(([v,l]) => `<option value="${v}" ${cf.field===v?'selected':''}>${l}</option>`).join('')}
                </select>
                ${cf.field ? `<select class="cfg-input" style="margin-top:4px" onchange="updateCompFilterValue('${c.id}',this.value,event)">
                    ${valueOpts.map(([v,l]) => `<option value="${v}" ${String(cf.value)===String(v)?'selected':''}>${l}</option>`).join('')}
                </select>` : ''}
            </div>
        </div>` : '';

        return `<div class="accordion-item ${isOpen ? 'open' : ''}">
            <div class="accordion-header" onclick="selectComponent('${c.id}',event)">
                <span class="accordion-chevron">▶</span>
                <span class="accordion-label">${escapeHtml(c.title)}</span>
                <div class="edit-controls" onclick="event.stopPropagation()">
                    <div class="span-btns">${[1,2,3,4].map(n=>`<button class="span-btn ${c.colSpan===n?'active':''}" onclick="setSpan('${c.id}',${n},event)">${n}</button>`).join('')}</div>
                    <button class="btn-icon danger" onclick="removeComponent('${c.id}',event)" title="Supprimer">×</button>
                </div>

    // ── Catalogue ──
    const CATALOG_LABELS = {
        kpi:'KPI', donut:'Donut', bars:'Barres', list:'Liste',

    };
    const catalogItems = Object.keys(CATALOG).map(type => `
        <div class="catalog-item" onclick="addComponent('${type}')">

        </div>`).join('');

    body.innerHTML = `
        <div class="edit-section">

}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER GRID
// ═══════════════════════════════════════════════════════════════════════════════
function renderGrid() {
    const grid = document.getElementById('dashboardGrid');
    grid.innerHTML = '';
    grid.className = 'dashboard-grid' + (isEditMode ? ' edit-mode' : '');
    if (tasksMissing) {
        grid.innerHTML = '<div class="tf-notice"><div class="tf-notice-title">Aucune table de tâches dans ce document</div>' +
            '<div class="tf-notice-sub">Ouvrez d\'abord le Kanban ou le Gantt sur ce document : ils créent les tables TaskFlow. Le Dashboard s\'alimentera ensuite tout seul.</div></div>';
        return;
    }
    dashConfig.layout.forEach(comp => grid.appendChild(createComp(comp)));
}

function createComp(comp) {
    const div = document.createElement('div');
    div.className = 'component' + (isEditMode && selectedCompId===comp.id ? ' selected' : '');
    div.dataset.span = comp.colSpan;
    div.dataset.id = comp.id;

    const cf = comp.config.compFilter;
    const hasCF = cf && cf.field && cf.value;
    const cfLabel = hasCF ? ` <span class="comp-filter-badge">${cf.field}=${cf.value}</span>` : '';

    const editControls = isEditMode ? `
        <div class="edit-controls" onclick="event.stopPropagation()">
            <div class="span-btns">${[1,2,3,4].map(n=>`<button class="span-btn ${comp.colSpan===n?'active':''}" onclick="setSpan('${comp.id}',${n},event)">${n}</button>`).join('')}</div>
            <button class="btn-icon ${selectedCompId===comp.id?'active':''}" onclick="selectComponent('${comp.id}',event)" title="Configurer">⚙</button>
            <button class="btn-icon danger" onclick="removeComponent('${comp.id}',event)" title="Supprimer">×</button>
        </div>` : '';

    const ft = getFilteredTasks(hasCF ? cf : null, comp.type === 'charge' || comp.type === 'plancharge');

    div.innerHTML = `
        <div class="comp-header">
            <div class="comp-title-wrap">
                <span class="comp-title">${escapeHtml(comp.title)}</span>${cfLabel}
            </div>
            ${editControls}
        </div>
        <div class="comp-body">${renderCompBody(comp, ft)}</div>`;

    if (isEditMode) div.addEventListener('click', () => selectComponent(comp.id));
    return div;
}

function renderCompBody(comp, ft) {
    switch (comp.type) {
        case 'kpi':      return renderKPI(comp, ft);
        case 'donut':    return renderDonut(comp, ft);
        case 'bars':     return renderBars(comp, ft);
        case 'list':     return renderList(comp, ft);
        case 'workload': return renderWorkload(comp, ft);
        case 'charge':   return renderCharge(comp, ft);
        case 'plancharge': return renderPlanCharge(comp, ft);
        case 'upcoming': return renderUpcoming(comp, ft);
        case 'projects': return renderProjects(comp, ft);
        case 'velocity': return renderVelocity(comp, ft);
        default: return '<div class="empty-state"><div class="empty-text">Type inconnu</div></div>';
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDERERS
// ═══════════════════════════════════════════════════════════════════════════════
function renderKPI(comp, ft) {
    const metric = comp.config.metric || 'total';
    const today = new Date(); today.setHours(0,0,0,0);
    const weekStart = startOfWeek(today);
    let value = 0, label = '';
    switch (metric) {
        case 'total':     value = ft.length;                                                                            label = 'tâches au total'; break;
        case 'inprogress':value = ft.filter(t=>TF.isLive(statusCfg, getStatus(t))).length;                                           label = 'tâches actives'; break;
        case 'done':      value = ft.filter(t=>TF.isDone(statusCfg, getStatus(t))).length;                                           label = 'tâches terminées'; break;
        case 'done_week': value = ft.filter(t=>TF.isDone(statusCfg, getStatus(t)) && gristToDate(t.dateEcheance)>=weekStart).length; label = 'terminées cette semaine'; break;
        case 'late':      value = ft.filter(t=>{ const d=gristToDate(t.dateEcheance); return d&&d<today&&TF.isLive(statusCfg, getStatus(t)); }).length; label = 'en retard'; break;
        case 'rate':      { const done=ft.filter(t=>TF.isDone(statusCfg, getStatus(t))).length; value=ft.length?Math.round(done/ft.length*100):0; label='% complété'; break; }
    }
    const cls = { total:'kpi-total', inprogress:'kpi-inprogress', done:'kpi-done', done_week:'kpi-done_week', late:'kpi-late', rate:'kpi-rate' }[metric]||'';
    const lateClass = metric==='late'&&value>0 ? 'kpi-late-border' : '';
    if (lateClass) setTimeout(()=>{ const el=document.querySelector(`[data-id="${comp.id}"]`); if(el) el.classList.add(lateClass); },0);
    return `<div class="${cls}"><div class="kpi-value">${metric==='rate'?value+'%':value}</div><div class="kpi-label">${label}</div></div>`;
}

function groupByField(ft, field) {
    const counts = {};
    ft.forEach(t => {
        if (field==='assignee') { getAssigneesArray(t).forEach(a=>{ counts[String(a)]=(counts[String(a)]||0)+1; }); return; }
        let key;
        if (field==='statut')   key = getStatus(t);
        else if (field==='priorite') key = String(getPriority(t));
        else if (field==='projet')   key = String(t.projet||'');
        else if (field==='type')     key = t.type||'tache';
        if (key!==undefined) counts[key]=(counts[key]||0)+1;
    });
    if (field==='statut')   return statusCfg.list.map(s=>({ key:s.value, label:s.label, count:counts[s.value]||0, color:s.fillColor }));
    if (field==='priorite') return [1,2,3,4].map(k=>({ key:String(k), label:PRIORITY_LABELS[k], count:counts[String(k)]||0, color:PRIORITY_COLORS[k] }));
    if (field==='projet')   return projects.filter(p=>counts[String(p.id)]).map(p=>({ key:String(p.id), label:p.nom, count:counts[String(p.id)]||0, color:p.couleur||'#6366f1' }));
    if (field==='type')     return [['tache','Tâche','#3b82f6'],['jalon','Jalon','#f59e0b'],['reunion','Réunion','#10b981']].map(([k,l,c])=>({ key:k, label:l, count:counts[k]||0, color:c }));
    if (field==='assignee') return team.filter(m=>counts[String(m.id)]).map(m=>({ key:String(m.id), label:(m.nom||'?').split(' ')[0], count:counts[String(m.id)]||0, color:m.couleur||'#4f46e5' }));
    return [];
}

function renderDonut(comp, ft) {
    const groups = groupByField(ft, comp.config.groupBy||'statut').filter(g=>g.count>0);
    if (!groups.length) return '<div class="empty-state"><div class="empty-text">Aucune donnée</div></div>';
    const total = ft.length||1;
    const R=56, C=2*Math.PI*R;
    let offset=0, paths='', legend='';
    groups.forEach(g => {
        const len=(g.count/total)*C;
        paths+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${g.color}" stroke-width="18" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}"/>`;
        offset+=len;
        legend+=`<div class="legend-item"><span class="legend-dot" style="background:${g.color}"></span><span>${escapeHtml(g.label)}</span><span class="legend-value">${g.count}</span></div>`;
    });
    return `<div class="donut-wrap">
        <div class="donut-chart" style="width:140px;height:140px">
            <svg width="140" height="140">${paths}</svg>
            <div class="donut-center"><div class="donut-center-value">${ft.length}</div><div class="donut-center-label">tâches</div></div>
        </div>
        <div class="donut-legend">${legend}</div>
    </div>`;
}

function renderBars(comp, ft) {
    const groups = groupByField(ft, comp.config.groupBy||'statut');
    const max = Math.max(...groups.map(g=>g.count), 1);
    return `<div class="bar-chart">${groups.map(g => `
        <div class="bar-row">
            <div class="bar-label">${escapeHtml(g.label)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(g.count/max*100)}%;background:${g.color}"><span>${g.count}</span></div></div>
        </div>`).join('')}</div>`;
}

function renderWorkload(comp, ft) {
    if (!team.length) return '<div class="empty-state"><div class="empty-icon">◑</div><div class="empty-text">Aucun membre Team</div></div>';
    // resout une valeur d'assigne (id numerique OU nom) vers un id de membre Team — robustesse des formats
    const resolveMember = v => { const m = team.find(x => String(x.id)===String(v) || (x.nom && x.nom.toLowerCase()===String(v).trim().toLowerCase())); return m ? m.id : null; };
    const byAssignee = {};
    ft.forEach(t => {
        getAssigneesArray(t).forEach(a => {
            const id = resolveMember(a); if (id == null) return;
            if (!byAssignee[id]) byAssignee[id]={ total:0, active:0 };
            byAssignee[id].total++;
            if (TF.isLive(statusCfg, getStatus(t))) byAssignee[id].active++;
        });
    });
    const maxActive = Math.max(...team.map(m=>(byAssignee[m.id]||{}).active||0), 1);
    const members = team.filter(m=>m.actif!==false);
    if (!members.length) return '<div class="empty-state"><div class="empty-text">Aucun membre actif</div></div>';
    return `<div class="workload-list">${members.map(m => {
        const d=byAssignee[m.id]||{total:0,active:0};
        const pct=Math.round(d.active/maxActive*100);
        const lvl=d.active>5?'high':d.active>3?'medium':'';
        const ini=(m.nom||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
        return `<div class="workload-item">
            <div class="workload-avatar" style="background:${m.couleur||'#4f46e5'}">${ini}</div>
            <div class="workload-info"><div class="workload-name">${escapeHtml(m.nom)}</div><div class="workload-tasks">${d.active} active${d.active>1?'s':''} / ${d.total} total</div></div>
            <div class="workload-bar"><div class="workload-bar-fill ${lvl}" style="width:${pct}%"></div></div>
        </div>`;
    }).join('')}</div>`;
}

// #3 : charge par personne (somme des heures allouees via Tasks.charges)
function renderCharge(comp, ft) {
    if (!team.length) return '<div class="empty-state"><div class="empty-icon">◔</div><div class="empty-text">Aucun membre Team</div></div>';
    const byMember = TF.chargeByMember(ft); // { teamId: heures }
    const members = team.filter(m=>m.actif!==false);
    if (!members.length) return '<div class="empty-state"><div class="empty-text">Aucun membre actif</div></div>';
    const maxH = Math.max(...members.map(m=>byMember[m.id]||0), 1);
    const totalH = members.reduce((s,m)=>s+(byMember[m.id]||0),0);
    return `<div class="workload-list">${members.map(m => {
        const h = byMember[m.id]||0;
        const pct = Math.round(h/maxH*100);
        const lvl = h>40?'high':h>20?'medium':'';
        const ini=(m.nom||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
        return `<div class="workload-item">
            <div class="workload-avatar" style="background:${m.couleur||'#4f46e5'}">${ini}</div>
            <div class="workload-info"><div class="workload-name">${escapeHtml(m.nom)}</div><div class="workload-tasks">${h} h allouée${h>1?'s':''}</div></div>
            <div class="workload-bar"><div class="workload-bar-fill ${lvl}" style="width:${pct}%"></div></div>
        </div>`;
    }).join('')}<div style="margin-top:8px;font-size:0.78rem;color:var(--text-muted);text-align:right">Total : <strong>${totalH}</strong> h</div></div>`;
}

// #3 plan de charge temporel — grille personne × période (semaine/mois) avec taux vs capacité
// État éphémère (non persisté) du décalage de fenêtre temporelle, par composant.
let planChargeOffset = {};
function planChargeShift(id, delta) { planChargeOffset[id] = (planChargeOffset[id] || 0) + delta; renderGrid(); }
function planChargeReset(id) { planChargeOffset[id] = 0; renderGrid(); }

function renderPlanCharge(comp, ft) {
    if (!team.length) return '<div class="empty-state"><div class="empty-icon">▦</div><div class="empty-text">Aucun membre Team</div></div>';
    const members = team.filter(m => m.actif !== false);
    if (!members.length) return '<div class="empty-state"><div class="empty-text">Aucun membre actif</div></div>';
    const granularity = comp.config.granularity === 'month' ? 'month' : 'week';
    const horizon = parseInt(comp.config.horizon) || 8;
    const includeDone = comp.config.includeDone === 'oui';
    const defaultCap = parseFloat(comp.config.capacite) || 35;
    let planTasks = ft;
    if (!includeDone) planTasks = planTasks.filter(t => TF.isLive(statusCfg, getStatus(t)));
    const byMP = TF.chargeByMemberPeriod(planTasks, granularity);
    const undated = planTasks.filter(t => TF.parseCharges(t.charges).length && (t.dateDebut == null || t.dateEcheance == null)).length;
    if (!Object.keys(byMP).length && !undated) return '<div class="empty-state"><div class="empty-icon">▦</div><div class="empty-text">Aucune charge datée à planifier</div><div style="font-size:0.72rem;color:var(--text-muted);margin-top:4px">Renseignez la charge par personne + des dates sur les tâches.</div></div>';
    const offset = planChargeOffset[comp.id] || 0;
    const periods = TF.periodRange(TF.shiftPeriods(new Date(), granularity, offset), granularity, horizon);
    const nowKey = TF.periodKey(new Date(), granularity);
    const capWeek = (m) => (Number(m.capaciteHebdo) > 0 ? Number(m.capaciteHebdo) : defaultCap);
    const capPer = (m) => granularity === 'month' ? capWeek(m) * 52 / 12 : capWeek(m);
    const plabel = (p) => granularity === 'month' ? (p.slice(5) + '/' + p.slice(2, 4)) : ('S' + p.slice(6));
    const cellColor = (h, cap) => { const r = cap > 0 ? h / cap : 0; return r > 1 ? '#e5484d' : r > 0.85 ? '#f59e0b' : r > 0 ? '#3b82f6' : 'transparent'; };
    const navBtn = 'background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:1px 9px;cursor:pointer;font-size:0.8rem';
    let html = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button onclick="planChargeShift(\'' + comp.id + '\',-1)" style="' + navBtn + '">◀</button><span style="font-size:0.74rem;color:var(--text-muted)">' + plabel(periods[0]) + ' → ' + plabel(periods[periods.length - 1]) + '</span><button onclick="planChargeShift(\'' + comp.id + '\',1)" style="' + navBtn + '">▶</button>' + (offset !== 0 ? '<button onclick="planChargeReset(\'' + comp.id + '\')" style="' + navBtn + ';font-size:0.72rem">Aujourd\'hui</button>' : '') + '</div>';
    html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.74rem"><thead><tr><th style="text-align:left;padding:4px 8px;color:var(--text-muted);font-weight:600">Membre</th>';
    for (const p of periods) html += '<th style="padding:4px 6px;text-align:center;font-weight:600;color:' + (p === nowKey ? 'var(--primary,#6366f1)' : 'var(--text-muted)') + '">' + plabel(p) + (p === nowKey ? ' •' : '') + '</th>';
    html += '</tr></thead><tbody>';
    for (const m of members) {
        const cap = capPer(m);
        html += '<tr><td style="padding:4px 8px;white-space:nowrap;border-top:1px solid var(--border)">' + escapeHtml(m.nom) + ' <span style="color:var(--text-muted);font-size:0.7rem">(' + Math.round(cap) + 'h)</span></td>';
        for (const p of periods) {
            const h = Math.round(((byMP[m.id] || {})[p] || 0) * 10) / 10;
            const col = cellColor(h, cap);
            const pct = cap > 0 ? Math.round(h / cap * 100) : 0;
            html += '<td style="padding:3px 4px;text-align:center;border-top:1px solid var(--border)">' + (h > 0 ? '<div style="background:' + col + ';color:#fff;border-radius:4px;padding:2px 4px;font-weight:600;min-width:26px;display:inline-block" title="' + pct + '% de la capacité">' + h + '</div>' : '<span style="color:var(--text-muted)">·</span>') + '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table></div>';
    html += '<div style="margin-top:8px;display:flex;gap:14px;font-size:0.72rem;color:var(--text-muted);flex-wrap:wrap"><span><span style="display:inline-block;width:10px;height:10px;background:#3b82f6;border-radius:2px;vertical-align:middle"></span> charge OK</span><span><span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> &gt; 85% capacité</span><span><span style="display:inline-block;width:10px;height:10px;background:#e5484d;border-radius:2px;vertical-align:middle"></span> surcharge</span><span>· = aucune charge</span></div>';
    if (undated) html += '<div style="margin-top:6px;font-size:0.72rem;color:#f59e0b">&#9888; ' + undated + ' tâche' + (undated > 1 ? 's' : '') + ' chargée' + (undated > 1 ? 's' : '') + ' sans dates — non planifiée' + (undated > 1 ? 's' : '') + '.</div>';
    return html;
}

function renderUpcoming(comp, ft) {
    const horizon = parseInt(comp.config.horizon)||14;
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = ft.filter(t => {
        const d=gristToDate(t.dateEcheance);
        if (!d || !TF.isLive(statusCfg, getStatus(t))) return false;
        return Math.ceil((d-today)/86400000) <= horizon;
    }).map(t => ({ t, d:gristToDate(t.dateEcheance), days:Math.ceil((gristToDate(t.dateEcheance)-today)/86400000) }))
      .sort((a,b)=>a.d-b.d).slice(0,8);
    if (!upcoming.length) return '<div class="empty-state"><div class="empty-icon">◷</div><div class="empty-text">Aucune échéance proche</div></div>';
    return `<div class="upcoming-list">${upcoming.map(({t,d,days}) => {
        const p=getPriority(t);
        const proj=projects.find(x=>x.id===t.projet);
        const dc=days<0?'late':days===0?'today':'';
        return `<div class="upcoming-item" onclick="selectTask(${t.id})">
            <div class="upcoming-prio p${p}"></div>
            <div class="upcoming-date ${dc}"><div class="upcoming-date-day">${d.getDate()}</div><div class="upcoming-date-month">${MONTHS_SHORT[d.getMonth()]}</div></div>
            <div class="upcoming-info">
                <div class="upcoming-title">${escapeHtml(t.titre)}</div>
                <div class="upcoming-meta">
                    ${proj?`<span style="color:${proj.couleur||'#6366f1'}">● ${escapeHtml(proj.nom)}</span>`:''}
                    <span class="${days<0?'text-danger':''}">${days<0?Math.abs(days)+'j retard':days===0?"Aujourd'hui":'Dans '+days+'j'}</span>
                </div>
            </div>
            <button class="upcoming-done-btn" onclick="markDone(${t.id},event)" title="Marquer comme terminée">✓</button>
        </div>`;
    }).join('')}</div>`;
}

function renderProjects(comp, ft) {
    const active = projects.filter(p=>p.actif!==false);
    if (!active.length) return '<div class="empty-state"><div class="empty-icon">◧</div><div class="empty-text">Aucun projet actif</div></div>';
    const stats = {};
    ft.forEach(t => {
        if (!t.projet) return;
        if (!stats[t.projet]) stats[t.projet]={ total:0, done:0, prog:0 };
        stats[t.projet].total++;
        if (TF.isDone(statusCfg, getStatus(t))) stats[t.projet].done++;
        stats[t.projet].prog += (t.progression||0);
    });
    return `<div class="projects-list">${active.filter(p=>stats[p.id]).map(p => {
        const s=stats[p.id]||{total:0,done:0};
        const pct=s.total>0?Math.round(s.done/s.total*100):0;
        return `<div class="project-item">
            <div class="project-color" style="background:${p.couleur||'#6366f1'}"></div>
            <div class="project-info"><div class="project-name">${escapeHtml(p.nom)}</div><div class="project-stats">${s.done}/${s.total} terminées</div></div>
            <div class="project-progress">
                <div class="project-progress-bar"><div class="project-progress-fill" style="width:${pct}%"></div></div>
                <div class="project-progress-text">${pct}%</div>
            </div>
        </div>`;
    }).join('')}</div>`;
}

function renderList(comp, ft) {
    const preset = comp.config.preset||'all';
    const limit  = parseInt(comp.config.limit)||10;
    const today  = new Date(); today.setHours(0,0,0,0);
    let list = ft;
    if (preset==='overdue')   list = ft.filter(t=>{const d=gristToDate(t.dateEcheance);return d&&d<today&&TF.isLive(statusCfg, getStatus(t));});
    else if (preset==='today')     list = ft.filter(t=>{const d=gristToDate(t.dateEcheance);return d&&isSameDay(d,today);});
    else if (preset==='upcoming')  list = ft.filter(t=>{const d=gristToDate(t.dateEcheance);const diff=d&&Math.ceil((d-today)/86400000);return diff!==null&&diff>=0&&diff<=14&&TF.isLive(statusCfg, getStatus(t));});
    // « En cours » = actives hors premier statut (a faire), quels que soient les statuts configures
    else if (preset==='inprogress')list = ft.filter(t=>{ const st=getStatus(t); return TF.isLive(statusCfg, st) && st!==statusCfg.firstValue; });
    if (!list.length) return '<div class="empty-state"><div class="empty-text">Aucune tâche</div></div>';
    return `<div class="list-items">${list.slice(0,limit).map(t=>{
        const p=getPriority(t), s=getStatus(t);
        const d=gristToDate(t.dateEcheance);
        const proj=projects.find(x=>x.id===t.projet);
        const isLate=d&&d<today&&TF.isLive(statusCfg, s);
        return `<div class="list-item" onclick="selectTask(${t.id})">
            <div class="list-prio p${p}"></div>
            <div class="list-info">
                <div class="list-title">${escapeHtml(t.titre||'')}</div>
                <div class="list-meta">
                    ${proj?`<span style="color:${proj.couleur||'#6366f1'}">● ${escapeHtml(proj.nom)}</span>`:''}
                    ${d?`<span class="${isLate?'text-danger':''}">${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</span>`:''}
                    <span class="status-badge" style="background:${TF.getStatus(statusCfg, s).fillColor};color:${TF.getStatus(statusCfg, s).textColor}">${TF.getStatus(statusCfg, s).label}</span>
                </div>
            </div>
        </div>`;
    }).join('')}</div>`;
}

function renderVelocity(comp, ft) {
    const weeks = parseInt(comp.config.weeks)||6;
    const today = new Date(); today.setHours(0,0,0,0);
    const buckets = [];
    for (let w=weeks-1; w>=0; w--) {
        const start = startOfWeek(addDays(today, -w*7));
        const end   = addDays(start, 7);
        const count = ft.filter(t => {
            if (!TF.isDone(statusCfg, getStatus(t))) return false;
            const d=gristToDate(t.dateEcheance);
            return d && d>=start && d<end;
        }).length;
        buckets.push({ label:'S'+getWeekNumber(start), count });
    }
    const maxC = Math.max(...buckets.map(b=>b.count), 1);
    const bw=34, gap=8, ch=100, sw=buckets.length*(bw+gap);
    let bars='';
    buckets.forEach((b,i)=>{
        const h=Math.max(4,Math.round(b.count/maxC*ch));
        const x=i*(bw+gap);
        bars+=`<rect x="${x}" y="${ch-h}" width="${bw}" height="${h}" rx="3" fill="var(--primary)" opacity="${.45+.55*(b.count/maxC)}"/>
        <text x="${x+bw/2}" y="${ch+13}" text-anchor="middle" font-size="9" fill="#64748b">${b.label}</text>
        ${b.count?`<text x="${x+bw/2}" y="${ch-h-4}" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="600">${b.count}</text>`:''}`;
    });
    return `<div class="velocity-wrap"><svg width="${Math.max(sw,200)}" height="${ch+18}" style="overflow:visible">${bars}</svg></div>`;
}

let _saving = false;

function saveConfig() {
    if (!gristReady) return;

    _saving = true;

function loadConfig(opts) {
    if (opts?.dash?.layout?.length) {
        dashConfig = opts.dash;
        dashConfig.layout.forEach(c => {
            if (!c.config) c.config = {};
            if (c.type === 'kpi' && c.config.metric === 'inprogress' && c.title === 'En cours') c.title = 'Actives';
        });
    }

}

async function exportPNG() {

const convert = data => {
    if (!data || Array.isArray(data)) return data||[];
    const cols=Object.keys(data); if (!cols.length) return [];
    const n=data[cols[0]]?.length||0, r=[];
    for (let i=0;i<n;i++){const rec={};cols.forEach(c=>rec[c]=data[c][i]);r.push(rec);}
    return r;
};

async function loadAllData() {
    if (!gristReady) return;
    try {
        // Une table absente ne doit pas bloquer les autres ni laisser le squelette : on la signale.
        const grab = async (name) => { try { return await grist.docApi.fetchTable(name); } catch (e) { return null; } };
        const [td,pd,md]=await Promise.all([grab('Tasks'), grab('Projects'), grab('Team')]);
        tasksMissing = !td;
        taskCols = new Set(Object.keys(td || {}));
        tasks=convert(td); projects=convert(pd); team=convert(md);
        rebuildChildrenCache();
        try { statusCfg = await TF.loadStatusConfig(grist, 'Tasks', 'statut', tasks.map(t => t && t.statut)); } catch (e) {}
        render();
    } catch(e) { console.log('Error loading data:', e); }
}

function selectTask(id) {

async function markDone(taskId, event) {
    event.stopPropagation();
    if (!gristReady) return;
    try {
        const t = tasks.find(x => x.id === taskId);
        const rec = Object.assign({ statut: statusCfg.doneValue, progression: 100 }, TF.completionPatch(statusCfg, t || {}, { statut: statusCfg.doneValue }));
        if (taskCols.size) { for (const k in rec) if (!taskCols.has(k)) delete rec[k]; }   // dateCloture n'existe que si le Plan a ete ouvert
        await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, rec]]);
        await loadAllData();
    } catch(e) { console.error(e); }
}

async function init() {
    try {
        await grist.ready({ requiredAccess: 'full' });

        TF.readOnlyBanner();
        TF.guardWrites(grist, { onReadOnly: () => {}, onDenied: () => { loadAllData(); } });
        const opts = await grist.widgetApi.getOptions();
        loadConfig(opts);
        await loadAllData();
        grist.onOptions(opts => { if (_saving) return; loadConfig(opts); render(); });
        grist.onRecords(async () => await loadAllData());
    } catch(e) {
        console.log('Demo mode');
        useDemoMode();
    }
}
