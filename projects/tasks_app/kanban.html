                if (!isFinite(n) || !n) return null;
                if (n % 86400 === 0) { const u = new Date(n * 1000); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
                const l = new Date(n * 1000);
                return new Date(l.getFullYear(), l.getMonth(), l.getDate());
            }
            function dateToGrist(d) {
                if (!d || isNaN(d.getTime())) return null;
                return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
            }
            // Numero de jour (depuis 1970) du jour calendaire d'une valeur Grist, quelle que soit sa convention.
            function dayNum(ts) {
                const d = gristToDate(ts);
                return d ? Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) : null;
            }
            function todayGrist() { return dateToGrist(new Date()); }
            // 'AAAA-MM-JJ' <-> Date locale (valeur des <input type="date">), sans decalage de fuseau.
            function isoDate(d) {
                if (!d || isNaN(d.getTime())) return '';
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            function parseISODate(s) {
                const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
                return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
            }

            // Convertit un tableau Grist colonnaire en tableau d'objets lignes.
            function columnarToRows(data) {
                if (!data || Array.isArray(data)) return data || [];
                const cols = Object.keys(data);
                if (!cols.length) return [];
                const n = (data[cols[0]] && data[cols[0]].length) || 0;
                const rows = [];
                for (let i = 0; i < n; i++) {
                    const rec = {};
                    for (const k of cols) rec[k] = data[k][i];
                    rows.push(rec);
                }
                return rows;
            }

            // Resout le rowId d'une table depuis son tableId via _grist_Tables.
            async function tableRowId(grist, tableId) {
                const meta = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                const row = meta.find(r => r.tableId === tableId);
                return row ? row.id : null;
            }

            // Construit une config de statuts normalisee depuis une liste brute.
            function buildStatusConfig(list, source) {
                const clean = (list || []).filter(s => s && s.value != null).map(s => {
                    const v = String(s.value);
                    const d = DEFAULTS_BY_VALUE[v];
                    const hasExplicitLabel = s.label != null && s.label !== '' && String(s.label) !== v;
                    return {
                        value: v,
                        label: hasExplicitLabel ? String(s.label) : (d ? d.label : v),
                        fillColor: s.fillColor || (d ? d.fillColor : '#94a3b8'),
                        textColor: s.textColor || (d ? d.textColor : '#ffffff')
                    };
                });
                const final = clean.length ? clean : DEFAULT_STATUSES.slice();
                const byValue = {};
                for (const s of final) byValue[s.value] = s;
                // done = dernier statut dont le libelle/valeur evoque une cloture positive ;
                // repli = dernier statut NON annule (ancienne convention "dernier = fait",
                // corrigee quand le dernier est "Annule"), a defaut le dernier de la liste.
                const isDeadHint = s => DEAD_HINT.test(s.label) || DEAD_HINT.test(s.value);
                let doneValue = null;
                for (const s of final) { if (!isDeadHint(s) && (DONE_HINT.test(s.label) || DONE_HINT.test(s.value))) doneValue = s.value; }
                if (doneValue == null) {
                    for (const s of final) { if (!isDeadHint(s)) doneValue = s.value; }
                }
                if (doneValue == null) doneValue = final[final.length - 1].value;
                const deadValues = final.filter(s => isDeadHint(s) && s.value !== doneValue).map(s => s.value);
                return {
                    list: final,
                    byValue,
                    values: final.map(s => s.value),
                    terminalValue: final[final.length - 1].value, // retro-compat ("dernier"), NE PAS utiliser pour la completion
                    doneValue: doneValue,      // statut = "fait" (cloture positive)
                    deadValues: deadValues,    // statuts = "annule" (exclus des actives / en retard)
                    firstValue: final[0].value,
                    source: clean.length ? source : 'default'
                };
            }

            /* Lit les statuts (libelles + couleurs + ordre) depuis la colonne Choice
             * indiquee, via les metadonnees Grist. Repli en cascade :
             *   1. options de la colonne Choice (cas ideal)
             *   2. valeurs distinctes presentes dans les donnees (colonne Text)
             *   3. DEFAULT_STATUSES
             * Ne jette jamais : retourne toujours une config exploitable.
             */
            async function loadStatusConfig(grist, table, column, distinctFallback) {
                try {
                    const tid = await tableRowId(grist, table);
                    if (tid != null) {
                        const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                        const col = cols.find(c => c.parentId === tid && c.colId === column);
                        if (col && col.widgetOptions) {
                            let opt = {};
                            try { opt = JSON.parse(col.widgetOptions) || {}; } catch (e) { opt = {}; }
                            const choices = Array.isArray(opt.choices) ? opt.choices : [];
                            const co = opt.choiceOptions || {};
                            if (choices.length) {
                                return buildStatusConfig(choices.map(ch => ({
                                    value: ch,
                                    label: ch,
                                    fillColor: co[ch] && co[ch].fillColor,
                                    textColor: co[ch] && co[ch].textColor
                                })), 'choice');
                            }
                        }
                    }
                } catch (e) { /* repli silencieux */ }

                if (Array.isArray(distinctFallback) && distinctFallback.length) {
                    const seen = [];
                    for (const v of distinctFallback) { if (v != null && v !== '' && seen.indexOf(v) === -1) seen.push(v); }
                    if (seen.length) return buildStatusConfig(seen.map(v => ({ value: v, label: v })), 'data');
                }
                return buildStatusConfig(DEFAULT_STATUSES.slice(), 'default');
            }

            function getStatus(cfg, value) {
                if (cfg && cfg.byValue && cfg.byValue[value]) return cfg.byValue[value];
                return { value: value, label: value || '', fillColor: '#94a3b8', textColor: '#ffffff' };
            }
            function isTerminal(cfg, value) { return !!cfg && value === cfg.terminalValue; }
            // Completion "positive" (remplace l'usage de isTerminal pour "fait").
            function isDone(cfg, value) { return !!cfg && value === (cfg.doneValue != null ? cfg.doneValue : cfg.terminalValue); }
            // Cloture "negative" (annule/abandonne/rejete).
            function isDead(cfg, value) { return !!cfg && Array.isArray(cfg.deadValues) && cfg.deadValues.indexOf(value) !== -1; }
            // Ni fait ni annule = actif.
            // Statut d'une tache tel que les widgets le traitent : sa valeur si elle figure dans la configuration,
            // sinon le PREMIER statut configure. Une tache au statut vide (ou supprime de la colonne Choice) reste
            // ainsi visible, rangee dans la premiere colonne, au lieu de disparaitre du Kanban.
            function statusKnown(cfg, value) { return !!cfg && !!cfg.list && cfg.list.some(function (s) { return s.value === value; }); }
            function statusOf(cfg, t) {
                const v = t ? t.statut : null;
                if (statusKnown(cfg, v)) return v;
                return cfg && cfg.firstValue != null ? cfg.firstValue : 'todo';
            }
            // Statut de reouverture quand une tache terminee repasse sous 100 % : le premier statut actif, ou le
            // suivant si de l'avancement existe deja (« En cours » plutot que « A faire »).
            function reopenValue(cfg, progression) {
                const live = cfg.list.filter(function (s) { return isLive(cfg, s.value); });
                if (!live.length) return cfg.firstValue;
                return (Number(progression) > 0 && live.length > 1) ? live[1].value : live[0].value;
            }
            // Cloture coherente : statut terminé <-> 100 % <-> dateCloture. Renvoie les champs DERIVES a ecrire en
            // plus de ce qui change (changes = { statut } ou { progression }) ; ne modifie pas la tache.
            //   - passer au statut terminé : 100 % et date de cloture (si elle n'etait pas deja posee) ;
            //   - atteindre 100 % : statut terminé et date de cloture ;
            //   - repasser sous 100 % ou quitter le statut terminé : date de cloture effacee (et statut rouvert).
            function completionPatch(cfg, task, changes) {
                const out = {};
                if (!cfg || !task || !changes) return out;
                const was = isDone(cfg, task.statut);
                if ('statut' in changes) {
                    const now = isDone(cfg, changes.statut);
                    if (now) { if (Number(task.progression) !== 100) out.progression = 100; if (!was) out.dateCloture = todayGrist(); }
                    else if (was) out.dateCloture = null;
                } else if ('progression' in changes) {
                    const p = Number(changes.progression);
                    if (p >= 100 && !was) { out.statut = cfg.doneValue; out.dateCloture = todayGrist(); }
                    else if (p < 100 && was) { out.statut = reopenValue(cfg, p); out.dateCloture = null; }
                }
                return out;
            }
            function isLive(cfg, value) { return !isDone(cfg, value) && !isDead(cfg, value); }

            // Libelle francais d'un mode de couleur (colorMode : priority / project / assignee / status).
            const COLOR_MODE_LABELS = { priority: 'priorité', project: 'projet', assignee: 'assigné', status: 'statut' };
            function colorModeLabel(mode) { return COLOR_MODE_LABELS[mode] || String(mode || ''); }

            /* ----- Interface commune : menus et lanceur ------------------------------
             * Menus deroulants generiques : un conteneur [data-menu] avec un bouton
             * [data-menu-toggle] et un panneau .tf-menu-panel. Un clic sur le bouton ouvre /
             * ferme, un clic ailleurs ou Echap ferme. Le panneau s'aligne a droite s'il
             * deborderait du widget. Dans le lanceur (?shell=1) le titre du widget est masque :
             * l'onglet l'affiche deja. A appeler une fois, en fin de script du widget. */
            function initUi() {
                if (typeof document === 'undefined' || initUi.done) return;
                initUi.done = true;
                try { if (/[?&]shell/.test(location.search)) document.documentElement.classList.add('in-shell'); } catch (e) {}
                // Bandeau (recherche / filtres / affichage) : un clic sur le bouton l'ouvre ou le referme, Echap le referme.
                // Il reste ouvert pendant la manipulation du widget : les filtres s'appliquent en direct.
                document.addEventListener('click', (e) => {
                    const toggle = e.target.closest ? e.target.closest('[data-tray-toggle]') : null;
                    if (toggle) trayToggle(toggle.getAttribute('data-tray-toggle'));
                    const host = document.getElementById('tfHeader');
                    if (host) syncSearchState(host);
                });
                document.addEventListener('input', () => { const host = document.getElementById('tfHeader'); if (host) syncSearchState(host); });
                document.addEventListener('keydown', (e) => {
                    if (e.key !== 'Escape') return;
                    const tray = document.getElementById('tfTray');
                    if (tray && tray.classList.contains('open')) trayToggle('', false);
                });
                // Info-bulles « i » : alignees a droite si elles debordent du widget.
                const placeTip = (e) => {
                    const tip = e.target.closest ? e.target.closest('.tf-info') : null;
                    if (!tip) return;
                    tip.classList.remove('tip-left');
                    if (tip.getBoundingClientRect().left + 232 > window.innerWidth - 8) tip.classList.add('tip-left');
                };
                document.addEventListener('mouseover', placeTip);
                document.addEventListener('focusin', placeTip);
                // Controles segmentes defilants : l'element actif est toujours ramene dans le champ.
                const revealActive = () => document.querySelectorAll('.tf-seg .btn.active').forEach(b => { if (b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
                document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('.tf-seg .btn')) setTimeout(revealActive, 60); });
                setTimeout(revealActive, 300);
                // Clavier : cartes, lignes et barres sont atteignables par Tab et s'ouvrent avec Entree ou Espace.
                // Les widgets les creent chacun a leur facon (HTML ou DOM) : on les repere une fois rendus.
                const ACTIVABLES = '.task-card, .task-row, .gantt-bar, .gantt-milestone, .event-bar, .week-event-bar';
                const rendreActivables = () => {
                    document.querySelectorAll(ACTIVABLES).forEach(el => {
                        if (el.hasAttribute('tabindex')) return;
                        el.setAttribute('tabindex', '0');
                        el.setAttribute('role', 'button');
                        const titre = el.querySelector('.card-title, .task-name, .gantt-bar-label, .milestone-label');
                        const nom = ((titre && titre.textContent) || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 90);
                        if (nom) el.setAttribute('aria-label', nom);
                    });
                };
                let planifie = false;
                const planifier = () => { if (planifie) return; planifie = true; requestAnimationFrame(() => { planifie = false; rendreActivables(); }); };
                if (typeof MutationObserver !== 'undefined' && document.body) new MutationObserver(planifier).observe(document.body, { childList: true, subtree: true });
                planifier();
                document.addEventListener('keydown', (e) => {
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    const el = e.target;
                    if (!el || el.getAttribute('role') !== 'button' || !el.matches || !el.matches(ACTIVABLES)) return;
                    e.preventDefault();
                    el.click();
                });
            }

            /* ----- Composants de la barre du haut (tous les widgets) ----------------------
             * Un meme composant a le meme balisage, la meme place et le meme comportement dans
             * kanban, gantt, calendar et dashboard : chaque widget les COMPOSE (voir ui.header)
             * au lieu de recopier du HTML. Les ids et les gestionnaires restent ceux du widget
             * (ils sont passes en parametres). Disposition : titre | vue / navigation |
             * outils (recherche, filtres, affichage) | actions. Le style est dans

                    syncSearchState(host);
                } finally {
                    fitHeader.busy = false;
                    // nos propres deplacements ne doivent pas declencher une nouvelle mesure
                    if (fitHeader.observer) fitHeader.observer.takeRecords();
                }
            }
            function setupHeader(host) {
                const tray = host.querySelector('.tf-tray');
                if (!tray) return;
                host.querySelectorAll('.hz-view .tf-panel, .hz-tools .tf-panel, .hz-actions .tf-panel').forEach(p => tray.appendChild(p));
                let attente = false;
                const refit = () => { if (attente) return; attente = true; requestAnimationFrame(() => { attente = false; fitHeader(host); }); };
                window.addEventListener('resize', refit);
                if (typeof ResizeObserver !== 'undefined') {
                    let largeur = -1;
                    new ResizeObserver(() => { const w = host.clientWidth; if (w !== largeur) { largeur = w; refit(); } }).observe(host);
                }
                // Le texte de la periode change la largeur du contenu : on remesure (hors bandeau, qui n'y change rien).
                if (typeof MutationObserver !== 'undefined') {
                    fitHeader.observer = new MutationObserver((muts) => {
                        if (fitHeader.busy) return;
                        if (muts.some(m => { const n = m.target.nodeType === 1 ? m.target : m.target.parentElement; return n && !n.closest('.tf-tray'); })) refit();
                    });
                    fitHeader.observer.observe(host, { childList: true, characterData: true, subtree: true });
                }
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
                fitHeader(host);
                setTimeout(() => fitHeader(host), 300);
            }
            function mountHeader(o, el) {
                const host = el || (typeof document !== 'undefined' ? document.getElementById('tfHeader') : null);
                if (host) { host.innerHTML = uiHeader(o); setupHeader(host); }
                initUi();
            }
            const ui = {
                icon: uiIcon, info: uiInfo, title: uiTitle, segmented: uiSegmented, periodNav: uiPeriodNav, search: uiSearch, filters: uiFilters,
                select: uiSelect, colorField: uiColorField, levelField: uiLevelField, sortField: uiSortField,
                displayMenu: uiDisplayMenu, moreMenu: uiMoreMenu, button: uiButton, header: uiHeader, mount: mountHeader,
                tray: trayToggle, refit: fitHeader
            };

            /* ----- En-tete de la fiche de tache ---------------------------------------
             * Le titre editable (#taskTitle) EST l'en-tete ; la navigation "n/m" entre les
             * taches est integree a cote (fleches + compteur), puis la fermeture. Le
             * handler oninput de #taskTitle est celui de chaque widget (updateField).
             * o = { title, placeholder, index, total, isNew, back, dotColor, dotTitle } */
            function panelHeaderHtml(o) {
                o = o || {};
                const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                const chevron = (pts) => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="' + pts + '"/></svg>';
                const hasNav = !o.isNew && Number(o.total) > 1;
                const nav = hasNav
                    ? '<div class="panel-nav" role="group" aria-label="Navigation entre les tâches">' +
                        '<button type="button" class="panel-nav-btn" onclick="navigatePanelTask(-1)" title="Tâche précédente" aria-label="Tâche précédente">' + chevron('15 18 9 12 15 6') + '</button>' +
                        '<span class="panel-count" aria-live="polite">' + (Number(o.index) + 1) + '/' + Number(o.total) + '</span>' +
                        '<button type="button" class="panel-nav-btn" onclick="navigatePanelTask(1)" title="Tâche suivante" aria-label="Tâche suivante">' + chevron('9 18 15 12 9 6') + '</button>' +
                      '</div>'
                    : '';
                const back = o.back
                    ? '<button type="button" class="panel-nav-btn panel-back" onclick="backToPeriod()" title="Retour" aria-label="Retour">' + chevron('15 18 9 12 15 6') + '</button>'
                    : '';
                const dot = o.dotColor ? '<span class="panel-dot" style="background:' + esc(o.dotColor) + '" title="' + esc(o.dotTitle || '') + '"></span>' : '';
                return back + dot +
                    '<input type="text" class="panel-title-edit" id="taskTitle" placeholder="' + esc(o.placeholder) + '" value="' + esc(o.title) + '" oninput="updateField(\'titre\', this.value, true)" aria-label="Titre">' +
                    nav +
                    '<button type="button" class="panel-close" onclick="confirmClosePanel()" title="Fermer" aria-label="Fermer">×</button>';
            }

            /* Seme les options (choix + couleurs) sur une colonne Choice si elle n'en a
             * pas encore. Defensif. A appeler depuis ensureSchema apres creation.
             */
            async function seedStatusChoices(grist, table, column, statuses) {
                try {
                    const tid = await tableRowId(grist, table);
                    if (tid == null) return;
                    const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const col = cols.find(c => c.parentId === tid && c.colId === column);
                    if (!col) return;
                    let opt = {};
                    try { opt = JSON.parse(col.widgetOptions || '{}') || {}; } catch (e) { opt = {}; }
                    if (Array.isArray(opt.choices) && opt.choices.length) return; // deja configure : on respecte
                    const list = statuses && statuses.length ? statuses : DEFAULT_STATUSES;
                    const choiceOptions = {};
                    for (const s of list) choiceOptions[s.value] = { fillColor: s.fillColor, textColor: s.textColor };
                    const widgetOptions = JSON.stringify({ choices: list.map(s => s.value), choiceOptions: choiceOptions });
                    await grist.docApi.applyUserActions([['ModifyColumn', table, column, { widgetOptions: widgetOptions }]]);
                } catch (e) { console.warn('TF.seedStatusChoices:', e && e.message); }
            }

            /* ----- #2 : colonnes d'affichage des Ref (noms au lieu des IDs) ---------
             * Pose le visibleCol + la display formula sur des colonnes Ref pour que les
             * VUES NATIVES Grist affichent un libelle plutot que l'ID de ligne.
             * specs : [{ table:'Tasks', column:'projet', visibleColId:'nom' }, ...]
             * DEFENSIF : si Grist refuse une action, on log et on continue ; au pire
             * l'affichage reste en IDs (comportement actuel), jamais de casse.
             * --------------------------------------------------------------------- */
            async function setRefDisplayColumns(grist, specs) {
                if (!Array.isArray(specs) || !specs.length) return;
                try {
                    const tables = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                    const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const tidOf = (tableId) => { const r = tables.find(t => t.tableId === tableId); return r ? r.id : null; };
                    const colOf = (tableRow, colId) => cols.find(c => c.parentId === tableRow && c.colId === colId);

                    const actions = [];
                    for (const s of specs) {
                        const srcTid = tidOf(s.table);
                        if (srcTid == null) continue;
                        const refCol = colOf(srcTid, s.column);
                        if (!refCol) continue;
                        // Table cible deduite du type "Ref:Target" / "RefList:Target".
                        const m = /^(?:Ref|RefList):(.+)$/.exec(refCol.type || '');
                        if (!m) continue;
                        const targetTid = tidOf(m[1]);
                        if (targetTid == null) continue;
                        const visCol = colOf(targetTid, s.visibleColId);
                        if (!visCol) continue;
                        // Eviter de re-poser si deja correct.
                        if (refCol.visibleCol === visCol.id) continue;
                        actions.push(['SetDisplayFormula', s.table, null, refCol.id, '$' + s.column + '.' + s.visibleColId]);
                        actions.push(['UpdateRecord', '_grist_Tables_column', refCol.id, { visibleCol: visCol.id }]);
                    }
                    if (actions.length) await grist.docApi.applyUserActions(actions);
                } catch (e) { console.warn('TF.setRefDisplayColumns:', e && e.message); }
            }

            /* ----- #3 : plan de charge (heures par personne) ------------------------
             * Stockage : colonne Text `charges` sur Tasks, JSON [{teamId, heures}].
             * Parse defensif identique au pattern subtasks.
             * --------------------------------------------------------------------- */
            function parseCharges(v) {
                try {
                    const a = JSON.parse(v || '[]');
                    if (!Array.isArray(a)) return [];
                    return a.filter(x => x && x.teamId != null)
                            .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                            .filter(x => !isNaN(x.teamId));
                } catch (e) { return []; }
            }
            function chargesToJson(arr) {
                return JSON.stringify((arr || [])
                    .filter(x => x && x.teamId != null)
                    .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                    .filter(x => !isNaN(x.teamId)));
            }
            // Heures totales d'une tache (somme des charges par personne).
            function chargeTotal(charges) { return parseCharges(typeof charges === 'string' ? charges : JSON.stringify(charges || [])).reduce((s, c) => s + c.heures, 0); }
            // Agrege la charge par membre sur une liste de taches (chaque tache expose .charges).
            function chargeByMember(tasks) {
                const by = {};
                for (const t of (tasks || [])) {
                    for (const c of parseCharges(t && t.charges)) {
                        by[c.teamId] = (by[c.teamId] || 0) + c.heures;
                    }
                }
                return by;
            }

            // Cle de periode : semaine ISO 'YYYY-Www' ou mois 'YYYY-MM'.
            function periodKey(date, granularity) {
                if (granularity === 'month') {
                    return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
                }
                const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
                const day = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - day);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
            }

            // #3 plan de charge temporel : etale les charges PROPRES de chaque tache sur sa
            // duree (jours calendaires), agrege par personne et par periode.
            // dateDebut/dateEcheance = timestamps Unix SECONDES (Grist). Tache sans dates ou
            // sans charge = ignoree. Retourne { teamId: { periodKey: heures } }.
            function chargeByMemberPeriod(tasks, granularity) {
                const g = granularity === 'month' ? 'month' : 'week';
                const out = {};
                for (const t of (tasks || [])) {
                    const charges = parseCharges(t && t.charges);
                    if (!charges.length) continue;
                    const s = t.dateDebut, e = t.dateEcheance;
                    if (s == null || e == null) continue;
                    const day0 = dayNum(s);
                    const day1 = dayNum(e);
                    const nDays = Math.max(day1 - day0 + 1, 1);
                    for (const c of charges) {
                        const perDay = (Number(c.heures) || 0) / nDays;
                        if (!perDay) continue;
                        if (!out[c.teamId]) out[c.teamId] = {};
                        for (let dd = day0; dd <= day1; dd++) {
                            const key = periodKey(new Date(dd * 86400000), g);
                            out[c.teamId][key] = (out[c.teamId][key] || 0) + perDay;
                        }
                    }
                }
                return out;
            }

            // Decale une date de n periodes (semaine = 7 jours, mois = 1 mois).
            function shiftPeriods(date, granularity, n) {
                const d = new Date(date.getTime());
                if (granularity === 'month') d.setUTCMonth(d.getUTCMonth() + n);
                else d.setUTCDate(d.getUTCDate() + n * 7);
                return d;
            }

            // Liste contigue de cles de periode (semaine ISO ou mois) a partir d'une date,
            // alignee sur le debut de periode (lundi / 1er du mois). Inclut les periodes vides.
            function periodRange(startDate, granularity, count) {
                const g = granularity === 'month' ? 'month' : 'week';
                let d = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate()));
                if (g === 'week') { const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() - day + 1); }
                else { d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); }
                const out = [];
                for (let i = 0; i < count; i++) {
                    out.push(periodKey(d, g));
                    if (g === 'week') d.setUTCDate(d.getUTCDate() + 7);
                    else d.setUTCMonth(d.getUTCMonth() + 1);
                }
                return out;
            }

            // chargeMatrix : generalise chargeByMemberPeriod. Etale les charges (via getCharges,
            // defaut parseCharges) sur la duree, agrege par cle keyFn(t, charge) et periode.
            function chargeMatrix(tasks, keyFn, granularity, getCharges, workdays) {
                const g = granularity === 'month' ? 'month' : 'week';
                const out = {};
                for (const t of (tasks || [])) {
                    const charges = getCharges ? getCharges(t) : parseCharges(t && t.charges);
                    if (!charges.length || t.dateDebut == null || t.dateEcheance == null) continue;
                    const d0 = dayNum(t.dateDebut), d1 = dayNum(t.dateEcheance);
                    const days = [];
                    for (let dd = d0; dd <= d1; dd++) { if (workdays) { const wd = new Date(dd * 86400000).getUTCDay(); if (wd < 1 || wd > 5) continue; } days.push(dd); }
                    if (!days.length) days.push(d0);
                    for (const c of charges) {
                        const key = keyFn(t, c); if (key == null) continue;
                        const perDay = c.heures / days.length; if (!perDay) continue;
                        if (!out[key]) out[key] = {};
                        for (const dd of days) { const pk = periodKey(new Date(dd * 86400000), g); out[key][pk] = (out[key][pk] || 0) + perDay; }
                    }
                }
                return out;
            }

            /* ----- #7 : respect des droits (ACL) ------------------------------------
             * Deux niveaux : (a) acces document lecture seule -> Grist passe
             * `readonly=true` dans l'URL de l'iframe ; (b) ACL au niveau ligne ->
             * l'acces widget peut etre `full` mais une ecriture sur une ligne donnee
             * est refusee par le serveur. safeApply absorbe ce refus proprement.
             * --------------------------------------------------------------------- */
            function _qp(name) { try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; } }
            // Vrai si Grist a ouvert le widget en lecture seule (acces doc restreint).
            function isReadOnly() { return _qp('readonly') === 'true'; }
            // Niveau d'acces accorde au widget : 'full' | 'read table' | 'none' (defaut 'full').
            function accessLevel() { return _qp('access') || 'full'; }
            // Detecte un message d'erreur Grist correspondant a un refus de droits.
            function isAccessError(e) {
                const msg = (e && (e.message || e.toString())) || '';
                return /access denied|not allowed|permission|forbidden|read[- ]?only|cannot (modify|add|remove)|acl/i.test(msg);
            }
            // Applique des actions en absorbant un refus de droits.
            // Retourne { ok:true } ou { ok:false, denied:bool, message }. Ne fait PAS d'UI
            // (chaque widget affiche son propre toast et recharge pour annuler l'optimiste).
            async function safeApply(grist, actions) {
                if (isReadOnly()) return { ok: false, denied: true, message: 'Document en lecture seule' };
                try { const r = await grist.docApi.applyUserActions(actions); return { ok: true, ret: r }; }
                catch (e) { return { ok: false, denied: isAccessError(e), message: (e && (e.message || e.toString())) || 'Erreur' }; }
            }
            // Garde transverse : enrobe grist.docApi.applyUserActions une seule fois pour
            // respecter les droits sur TOUS les sites d'ecriture sans les modifier un a un.
            // - lecture seule -> bloque + opts.onReadOnly()
            // - refus ACL au niveau ligne -> opts.onDenied(err) (le widget toast + recharge)
            // Les erreurs continuent d'etre levees (les try/catch existants les absorbent).
            function guardWrites(grist, opts) {
                opts = opts || {};
                if (!grist || !grist.docApi || grist.docApi._tfGuarded) return;
                const raw = grist.docApi.applyUserActions.bind(grist.docApi);
                grist.docApi._tfGuarded = true;
                grist.docApi.applyUserActions = async function (actions) {
                    if (isReadOnly()) { try { opts.onReadOnly && opts.onReadOnly(); } catch (e) {} const err = new Error('Document en lecture seule'); err.tfReadOnly = true; throw err; }
                    try { return await raw(actions); }
                    catch (e) { if (isAccessError(e)) { try { opts.onDenied && opts.onDenied(e); } catch (e2) {} } throw e; }
                };
            }
            // Bandeau "lecture seule" auto-contenu (aucun markup widget requis).
            // Pousse le contenu vers le bas (padding-top sur body) pour NE PAS recouvrir l'en-tete du widget.
            function readOnlyBanner() {
                if (!isReadOnly() || (typeof document === 'undefined') || document.getElementById('tf-ro-banner')) return;
                const b = document.createElement('div');
                b.id = 'tf-ro-banner';
                b.textContent = 'Lecture seule — vos droits ne permettent pas la modification';
                b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b45309;color:#fff;font:600 12px/1.4 system-ui,-apple-system,sans-serif;text-align:center;padding:6px 10px;letter-spacing:.2px;box-sizing:border-box';
                document.body.appendChild(b);
                const h = b.offsetHeight || 28;
                const prev = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
                document.body.style.paddingTop = (prev + h) + 'px';
            }

            return {
                DEFAULT_STATUSES: DEFAULT_STATUSES,
                columnarToRows: columnarToRows,
                loadStatusConfig: loadStatusConfig,
                buildStatusConfig: buildStatusConfig,
                getStatus: getStatus,
                isTerminal: isTerminal,
                isDone: isDone,
                isDead: isDead,
                isLive: isLive,
                statusOf: statusOf,
                shouldAutoDemo: shouldAutoDemo,
                confirm: uiConfirm,
                deletePlan: deletePlan,
                deleteConfirmHtml: deleteConfirmHtml,
                completionPatch: completionPatch,
                reopenValue: reopenValue,
                statusKnown: statusKnown,
                gristToDate: gristToDate,
                dateToGrist: dateToGrist,
                dayNum: dayNum,
                todayGrist: todayGrist,
                isoDate: isoDate,
                parseISODate: parseISODate,
                colorModeLabel: colorModeLabel,
                panelHeaderHtml: panelHeaderHtml,
                initUi: initUi,
                searchMatch: searchMatch,
                setPeriodLabel: setPeriodLabel,
                monthYearShort: monthYearShort,
                monthShort: monthShort,
                ui: ui,
                seedStatusChoices: seedStatusChoices,
                setRefDisplayColumns: setRefDisplayColumns,
                parseCharges: parseCharges,
                chargesToJson: chargesToJson,
                chargeTotal: chargeTotal,
                chargeByMember: chargeByMember,
                periodKey: periodKey,
                chargeByMemberPeriod: chargeByMemberPeriod,
                shiftPeriods: shiftPeriods,
                periodRange: periodRange,
                chargeMatrix: chargeMatrix,
                isReadOnly: isReadOnly,
                accessLevel: accessLevel,
                isAccessError: isAccessError,
                safeApply: safeApply,
                guardWrites: guardWrites,
                readOnlyBanner: readOnlyBanner
            };
        })();

        // ═══════════════════════════════════════════════════════════════════════
        // WBS (hiérarchie sous-tâches) — API commune
        // ═══════════════════════════════════════════════════════════════════════
        let childrenByParent = new Map();
        function rebuildChildrenCache() {
            childrenByParent = new Map();
            const cycleIds = new Set();
            for (const t of tasks) {
                const seen = new Set([t.id]);
                let cur = t.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
                let guard = 0;
                while (cur && guard++ < 128) {
                    if (seen.has(cur.id)) { cycleIds.add(t.id); break; }
                    seen.add(cur.id);
                    cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
                }
            }
            if (cycleIds.size) console.warn('WBS: cycles detected on task ids:', [...cycleIds]);
            for (const t of tasks) {
                const pid = t.parentTask;
                if (pid && !isNaN(pid) && !cycleIds.has(t.id)) {
                    if (!childrenByParent.has(pid)) childrenByParent.set(pid, []);
                    childrenByParent.get(pid).push(t);
                }
            }
        }
        const isRoot = (t) => !t?.parentTask;
        const getParent = (t) => t?.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
        const getChildren = (id) => childrenByParent.get(id) || [];
        const hasChildren = (t) => t && getChildren(t.id).length > 0;
        function getDepth(t) { let d = 0, cur = t, guard = 0; while (cur?.parentTask && guard++ < 32) { cur = tasks.find(x => x.id === cur.parentTask); d++; } return d; }
        function walkTree(roots, cb) {
            const stack = roots.map(r => ({ task: r, depth: 0 }));
            while (stack.length) {
                const { task, depth: d } = stack.shift();
                cb(task, d);
                const kids = getChildren(task.id);
                if (kids.length) for (let i = kids.length - 1; i >= 0; i--) stack.unshift({ task: kids[i], depth: d + 1 });
            }
        }
        function getAllDescendants(id, acc = [], visited = new Set()) {
            if (visited.has(id)) return acc;
            visited.add(id);
            for (const k of getChildren(id)) { acc.push(k); getAllDescendants(k.id, acc, visited); }
            return acc;
        }
        function canSetParent(taskId, newParent) {
            if (!newParent) return true;
            if (newParent === taskId) return false;
            let cur = tasks.find(x => x.id === newParent), guard = 0;
            while (cur && guard++ < 64) {
                if (cur.id === taskId) return false;
                cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
            }
            return true;
        }
        function aggregateProgress(t, visited = new Set()) {
            if (visited.has(t.id)) return t.progression || 0;
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return t.progression || 0;
            const allWeighted = kids.every(k => k.estimationH && k.estimationH > 0);
            if (allWeighted) {
                const totalW = kids.reduce((s, k) => s + k.estimationH, 0);
                return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited) * k.estimationH, 0) / totalW);
            }
            return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited), 0) / kids.length);
        }
        function aggregateDates(t, visited = new Set()) {
            if (visited.has(t.id)) return { start: t.dateDebut, end: t.dateEcheance };
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return { start: t.dateDebut, end: t.dateEcheance };
            let minS = t.dateDebut, maxE = t.dateEcheance;
            for (const k of kids) {
                const sub = aggregateDates(k, visited);
                if (sub.start != null && (minS == null || sub.start < minS)) minS = sub.start;
                if (sub.end != null && (maxE == null || sub.end > maxE)) maxE = sub.end;
            }
            return { start: minS, end: maxE };
        }

        function wouldCreateCycle(taskId, depId, visited = new Set()) { if (taskId === depId) return true; if (visited.has(depId)) return false; visited.add(depId); const depTask = tasks.find(t => t.id === depId); if (!depTask) return false; return getDependsOn(depTask).some(d => wouldCreateCycle(taskId, d, visited)); }
        function getAvailableDependencies(taskId) { return tasks.filter(t => t.id !== taskId && !wouldCreateCycle(taskId, t.id)); }
        function getBlockedTasks(taskId) { return tasks.filter(t => getDependsOn(t).includes(taskId)); }

        async function ensureSchema() { let created = 0; const tablesCreated = []; for (const [tableName, columns] of Object.entries(TASKFLOW_SCHEMA)) { let existingCols = [], tableExists = false; try { const data = await grist.docApi.fetchTable(tableName); existingCols = Object.keys(data).filter(c => c !== 'id' && c !== 'manualSort'); tableExists = true; } catch (e) { try { await grist.docApi.applyUserActions([['AddTable', tableName, columns.map(c => ({ id: c.id, type: c.type }))]]); tablesCreated.push(tableName); created++; continue; } catch (e2) { continue; } } if (tableExists) { const missing = columns.filter(c => !existingCols.includes(c.id)); for (const col of missing) { try { await grist.docApi.applyUserActions([['AddColumn', tableName, col.id, { type: col.type }]]); } catch (e) {} } } } if (tablesCreated.includes('Tasks')) await seedData();

                return [1,2,3,4].map(p => ({ key: String(p), label: PRIORITY_LABELS[p], icon: '', tasks: ft.filter(t => getPriority(t) === p) }));
            } else if (groupBy === 'projet') {
                const cols = projects.filter(p => p.actif !== false).map(p => ({ key: String(p.id), label: p.nom, icon: `<span style="color:${p.couleur}">●</span>`, tasks: ft.filter(t => t.projet === p.id) }));
                cols.push({ key: 'none', label: 'Sans projet', icon: '', tasks: ft.filter(t => !t.projet) });
                return cols;
            }
            return [];

            const projectName = getProjectName(t.projet);
            const projectColor = getProjectColor(t.projet);
            const typeIcon = TYPE_ICONS[t.type] || '';
            const subs = getSubtasks(t);
            const subsDone = subs.filter(s => s.done).length;
            const nChildren = getChildren(t.id).length;
            const isChild = !!t.parentTask;

            const barColor = getTaskColor(t);
            const prog = t.progression || 0;
            let dueHtml = '';
            if (t.dateEcheance && t.type !== 'jalon') {
                const _e = gristToDate(t.dateEcheance);
                if (_e) {
                    const _t0 = new Date(); _t0.setHours(0,0,0,0);
                    const _d = new Date(_e); _d.setHours(0,0,0,0);
                    const _days = Math.round((_d - _t0) / 86400000);
                    const _done = !TF.isLive(statusCfg, t.statut);
                    const _st = _done ? '' : _days < 0 ? 'over' : _days <= 2 ? 'soon' : '';

                    dueHtml = `<span class="tf-due ${_st}">${_d.getDate()} ${_MO[_d.getMonth()]}</span>`;

            return `<div class="task-card p${p} ${!TF.isLive(statusCfg, t.statut) ? 'done' : ''} ${t.id === selectedTaskId ? 'selected' : ''}" data-id="${t.id}" style="border-left-color:${barColor}" onclick="openTaskPanel(${t.id})">

                ${assignees.length ? `<div class="card-assignees">${assignees.slice(0, 3).map(id => `<div class="card-avatar" style="background:${getTeamMemberColor(id)}">${getInitials(getTeamMemberName(id))}</div>`).join('')}${assignees.length > 3 ? `<div class="card-avatar more">+${assignees.length - 3}</div>` : ''}</div>` : ''}

        }

        async function handleDrop(evt) {
            const taskId = parseInt(evt.item.dataset.id);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // Lire la colonne de destination depuis evt.to (le conteneur d'arrivée).
            // Utiliser col.key capturée en closure donnerait la source, pas la destination.
            const colKey = (evt.to && evt.to.id) ? evt.to.id.replace(/^col-/, '') : null;
            if (colKey === null) return;

            let updates = {};
            if (groupBy === 'statut') { updates.statut = colKey; const _wasT = TF.isDone(statusCfg, task.statut), _nowT = TF.isDone(statusCfg, colKey); if (_nowT) { updates.progression = 100; if (!_wasT) updates.dateCloture = TF.todayGrist(); } else if (_wasT) updates.dateCloture = null; }
            else if (groupBy === 'priorite') updates.priorite = parseInt(colKey, 10);
            else if (groupBy === 'projet') updates.projet = colKey === 'none' ? null : parseInt(colKey, 10);
            
            Object.assign(task, updates);
            
            if (gristReady) {
                try { await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, pruneTaskRecord(updates)]]); showSaveIndicator(); }
                catch (e) { showToast('Erreur déplacement', 'error'); await loadAllData(); }
            }
            render();  // garde les états vides cohérents après un déplacement
        }

        function openPanel() { 
            panelState.open = true; 
            document.getElementById('panel').classList.add('open'); 
            document.getElementById('kanbanContainer').classList.add('panel-open'); 
            document.getElementById('panelOverlay').classList.add('visible');
        }
        function closePanel() { 
            panelState.open = false; 
            document.getElementById('panel').classList.remove('open'); 
            document.getElementById('kanbanContainer').classList.remove('panel-open'); 
            document.getElementById('panelOverlay').classList.remove('visible');
            panelState = { open: false, isNew: false, taskId: null, taskIndex: -1, columnTasks: [], columnKey: null, editData: null }; 
            selectedTaskId = null; 
            render(); 
        }
        // BUG-04 FIX: Confirmation avant fermeture si nouvelle tâche non sauvegardée
        function confirmClosePanel() {
            if (panelState.isNew && panelState.editData?.titre?.trim()) {
                TF.confirm({ title: 'Fermer sans créer la tâche ?', message: 'Ce qui a été saisi sera perdu.', confirmLabel: 'Fermer sans créer', danger: true }).then(ok => { if (ok) closePanel(); });
            } else {
                closePanel();
            }
        }

        function openTaskPanel(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            selectedTaskId = taskId;
            
            // Find column tasks for navigation
            const ft = getFilteredTasks();
            const columns = buildColumns(ft);
            let colKey = null, colTasks = [];
            for (const col of columns) {
                const idx = col.tasks.findIndex(t => t.id === taskId);
                if (idx !== -1) { colKey = col.key; colTasks = col.tasks; break; }
            }
            
            panelState.taskId = taskId;
            panelState.taskIndex = colTasks.findIndex(t => t.id === taskId);
            panelState.columnTasks = colTasks;
            panelState.columnKey = colKey;
            panelState.isNew = false;
            panelState.editData = cloneTaskData(task);
            renderPanelTask();
            openPanel();
            if (gristReady) grist.setSelectedRows([taskId]);
            render();
        }

                    ${data.type === 'tache' ? `

                            ${estim > 0 ? `<div class="tc-bar"><i class="${timeOver ? 'over' : ''}" style="width:${timePercent}%"></i></div><div class="tc-foot"><span>${Math.round((passe/estim)*100)}% consommé</span><span>reste ${Math.max(estim-passe,0)} h</span></div>` : ''}
                            ${(data.assignees.length && TASK_COLS.has('charges')) ? `<div style="margin-top:13px"><div class="prop-label" style="margin-bottom:6px">Charge par personne</div>${data.assignees.map(id => `<div class="charge-row"><span class="an">${escapeHtml(getTeamMemberName(id))}</span><input type="number" min="0" step="0.5" value="${chargeOf(id)}" onchange="updateCharge(${id}, this.value)"><span style="font-size: var(--fs-sm);color:var(--text-muted)">h</span></div>`).join('')}<div style="margin-top:6px;font-size: var(--fs-sm);color:var(--text-muted)">Total : <strong>${chargeTotalH}</strong> h</div></div>` : ''}${chargeConsolHtml}

                    ${data.type === 'tache' ? `
                    <div class="prop-row pr-prog">
                        <span class="prop-label">Progression</span>

                            <div class="progress-inline-wrap">

                                <div class="progress-preset ${data.progression === 25 ? 'active' : ''}" onclick="setProgressPreset(25)">25%</div>
                                <div class="progress-preset ${data.progression === 50 ? 'active' : ''}" onclick="setProgressPreset(50)">50%</div>
                                <div class="progress-preset ${data.progression === 75 ? 'active' : ''}" onclick="setProgressPreset(75)">75%</div>
                                <div class="progress-preset ${data.progression === 100 ? 'active' : ''}" onclick="setProgressPreset(100)">100%</div>
                            </div>
                        </div>
                    </div>` : ''}
                </div>

                <!-- Description / Ordre du jour / Critères -->
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">${descLabel}</span></div>
                    <div class="form-group"><textarea class="form-textarea" placeholder="${descLabel}..." oninput="updateField('description', this.value, true)">${escapeHtml(data.description)}</textarea></div>
                </div>

                <!-- WBS-03: Sous-tâches (hiérarchie) — vraies tâches avec parentTask -->
                ${!panelState.isNew ? (function() {
                    const kids = getChildren(panelState.taskId);
                    const _par = data.parentTask ? tasks.find(x => x.id === data.parentTask) : null;
                    const parentLink = _par ? '<div class="prereq-item" onclick="openTaskPanel(' + _par.id + ')" title="Ouvrir la tâche parent"><span style="flex-shrink:0;font-weight:700;color:var(--primary)">↑</span><span class="prereq-item-title">Parent : ' + escapeHtml(_par.titre) + '</span></div>' : '';
                    const kidsList = kids.map(k => {
                        const kp = getPriority(k);
                        const kprog = hasChildren(k) ? aggregateProgress(k) : (k.progression || 0);
                        return `<div class="prereq-item" onclick="openTaskPanel(${k.id})">
                            <span class="card-project" style="width:3px;height:16px;border-radius:2px;flex-shrink:0;background:${PRIORITY_COLORS[kp]}"></span>

                        <button class="panel-btn" style="width:auto;padding:6px 12px;font-size: var(--fs-sm);margin-top:6px" onclick="openCreateTaskWithParent(${panelState.taskId})">+ Sous-tâche</button>
                    </div>`;
                })() : ''}

                <!-- Prérequis (jalon) ou Checklist (tâche/réunion) -->
                ${data.type === 'jalon' ? `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">Prérequis</span>${data.dependDe.length ? `<span class="panel-section-badge">${doneCount}/${data.dependDe.length}</span>` : TF.ui.info("Aucune dépendance — liez des tâches amont via le panneau d'une tâche.")}</div>
                    <div class="prereq-list">${prereqHtml}</div>
                </div>
                ` : `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">${data.type === 'reunion' ? 'Points à traiter' : 'Checklist'}</span>${subtasksTotal > 0 ? `<span class="panel-section-badge">${subtasksDone}/${subtasksTotal}</span>` : ''}</div>
                    <div class="subtask-list">${(data.subtasks || []).map(st => `<div class="subtask-item ${st.done ? 'done' : ''}"><input type="checkbox" class="subtask-checkbox" ${st.done ? 'checked' : ''} onchange="toggleSubtask(${st.id})"><input class="subtask-text" value="${escapeHtml(st.text)}" onchange="editSubtask(${st.id}, this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="subtask-remove" onclick="removeSubtask(${st.id})">×</button></div>`).join('')}</div>
                    <div class="subtask-add"><input type="text" id="newSubtaskInput" placeholder="Ajouter..." onkeydown="handleSubtaskKeydown(event)"><button onclick="addSubtask()">+</button></div>
                </div>
                `}

                <!-- Détails : temps + tags + dépendances (hors jalon) -->
                ${data.type !== 'jalon' ? `
                <div class="panel-section">
                    <div class="panel-section-header"><span class="panel-section-title">Détails</span></div>
                    <div class="form-group"><div class="tags-input" onclick="document.getElementById('tagInput').focus()">${tagsChips}<input type="text" id="tagInput" placeholder="${data.tags.length ? '' : 'Ajouter un tag...'}" onkeydown="handleTagKeydown(event)"></div></div>
                    ${data.type !== 'reunion' ? `
                    <div class="form-group"><div class="multi-select" id="depsSelect"><div class="multi-select-trigger" onclick="toggleMultiSelect('depsSelect')"><div class="multi-select-values">${depsChips || '<span class="multi-select-placeholder">Dépendances...</span>'}</div><span class="multi-select-arrow">▾</span></div><div class="multi-select-dropdown">${depsOptions || '<div class="multi-select-empty">Aucune</div>'}</div></div>${blockedHtml}</div>
                    ` : ''}
                </div>
                ` : ''}
            `;

            footer.innerHTML = panelState.isNew
                ? `<div style="display:flex;gap:8px;width:100%"><button class="panel-btn" style="flex:0 0 auto;width:auto;padding:10px 16px;background:transparent;color:var(--text-muted);border:1px solid var(--border)" onclick="closePanel()">Annuler</button><button class="panel-btn success" onclick="createTask()" ${!data.titre?.trim() ? 'disabled' : ''} style="flex:1;width:auto">Créer la tâche</button></div>`
                : `<div class="panel-footer-left"><button class="panel-btn danger" onclick="showDeleteConfirm()" style="width:auto;padding:10px 14px">Suppr.</button></div><div class="panel-footer-right"><div class="delete-confirm" id="deleteConfirm" style="display:none;position:fixed;bottom:60px;right:16px;width:min(320px,calc(100vw - 32px));z-index:100;box-shadow:var(--shadow-lg)">${TF.deleteConfirmHtml(getChildren(panelState.taskId).length)}</div></div>`;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // FIELD HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function updateField(field, value, noSave = false) {
            const data = panelState.editData;
            if (!data) return;
            // BUG-01 FIX: Utiliser parseInputDate pour éviter problèmes de timezone
            if (field === 'dateDebut' || field === 'dateEcheance') value = value ? dateToGrist(parseInputDate(value)) : null;
            // dateCloture auto : posee quand on passe au statut terminal, effacee si on rouvre
            if (field === 'statut' || field === 'progression') Object.assign(data, TF.completionPatch(statusCfg, data, { [field]: value }));
            data[field] = value;
            if (field === 'type' && value === 'jalon' && data.dateDebut) data.dateEcheance = data.dateDebut;
            
            // Synchroniser le task local pour affichage immédiat
            syncLocalTask();
            
            const visualFields = ['type', 'priorite', 'statut', 'projet', 'progression', 'couleur', 'parentTask'];
            if (visualFields.includes(field)) { renderPanelTask(); if (!panelState.isNew) render(); }
            if (field === 'titre' && panelState.isNew) { const btn = document.querySelector('.panel-footer .panel-btn.success'); if (btn) btn.disabled = !value || !value.trim(); }
            if (!panelState.isNew && !noSave && gristReady) saveTaskToGrist();
        }

        function setProgressPreset(value) {
            const data = panelState.editData;
            if (!data) return;
            if (Object.keys(TF.completionPatch(statusCfg, data, { progression: value })).length) { updateField('progression', value); return; }
            data.progression = value;
            syncLocalTask();  // FIX: Synchroniser le task local

            const slider = document.querySelector('.progress-slider');
            const valueSpan = document.getElementById('progressValue');
            const barFill = document.getElementById('progressBarFill');
            if (slider) slider.value = value;
            if (valueSpan) valueSpan.textContent = value + '%';
            if (barFill) barFill.style.width = value + '%';
            document.querySelectorAll('.progress-preset').forEach(btn => btn.classList.toggle('active', parseInt(btn.textContent) === value));
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function setTodayDate() {
            const data = panelState.editData;
            if (!data) return;
            const today = dateToGrist(new Date());
            data.dateDebut = today;
            if (data.type === 'jalon') data.dateEcheance = today;
            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }

        // KAN-03: Clic direct sur barre de progression
        async function setCardProgress(e, taskId) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.round((clickX / rect.width) * 100);
            const roundedPercent = Math.round(percent / 5) * 5;  // Arrondir à 5%
            const clampedPercent = Math.max(0, Math.min(100, roundedPercent));
            
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const patch = TF.completionPatch(statusCfg, task, { progression: clampedPercent });
            Object.assign(task, patch);
            task.progression = clampedPercent;
            
            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, pruneTaskRecord(Object.assign({ progression: clampedPercent }, patch))]]);
                    showToast(`${clampedPercent}%`, 'success');
                } catch (err) {
                    showToast('Erreur', 'error');
                }
            }
            render();
        }

        function toggleMultiSelect(id) { const el = document.getElementById(id); document.querySelectorAll('.multi-select').forEach(s => { if (s.id !== id) s.classList.remove('open'); }); el.classList.toggle('open'); }
        function toggleAssignee(id) { const data = panelState.editData; const idx = data.assignees.indexOf(id); if (idx === -1) data.assignees.push(id); else data.assignees.splice(idx, 1); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); render(); }
        function removeAssignee(id) { const data = panelState.editData; const idx = data.assignees.indexOf(id); if (idx !== -1) { data.assignees.splice(idx, 1); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); render(); } }
        function updateCharge(memberId, value) {
            const data = panelState.editData; if (!data) return;
            if (!Array.isArray(data.charges)) data.charges = [];
            const h = Math.max(0, Number(value) || 0);
            const existing = data.charges.find(c => c.teamId === memberId);
            if (existing) existing.heures = h; else data.charges.push({ teamId: memberId, heures: h });
            syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask();
        }
        function toggleDependency(id) { const data = panelState.editData; const idx = data.dependDe.indexOf(id); if (idx === -1) data.dependDe.push(id); else data.dependDe.splice(idx, 1); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); }
        function removeDependency(id) { const data = panelState.editData; const idx = data.dependDe.indexOf(id); if (idx !== -1) { data.dependDe.splice(idx, 1); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); } }
        function handleTagKeydown(e) { const data = panelState.editData; if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); const tag = e.target.value.trim().replace(/^#/, ''); if (tag && !data.tags.includes(tag)) { data.tags.push(tag); e.target.value = ''; syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); } } else if (e.key === 'Backspace' && !e.target.value && data.tags.length) { data.tags.pop(); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); } }
        function removeTag(tag) { const data = panelState.editData; const idx = data.tags.indexOf(tag); if (idx !== -1) { data.tags.splice(idx, 1); syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanelTask(); } }
        function showDeleteConfirm() { const el = document.getElementById('deleteConfirm'); if (el) el.style.display = 'block'; }
        function hideDeleteConfirm() { const el = document.getElementById('deleteConfirm'); if (el) el.style.display = 'none'; }

        // A15: Mise à jour couleur membre dans la table Team
        async function setMemberColor(memberId, color) {
            const m = team.find(x => x.id === memberId);
            if (!m) return;
            m.couleur = color;  // Mise à jour locale immédiate
            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([['UpdateRecord', 'Team', memberId, { couleur: color }]]);
                    showSaveIndicator();
                } catch (e) { showToast('Erreur mise à jour couleur', 'error'); }
            }
            renderPanelTask();
            render();
        }

        // FUT-01: Gestion des subtasks/checklist
        function getSubtasks(task) {
            if (!task?.subtasks) return [];
            try { return JSON.parse(task.subtasks); } catch (e) { return []; }
        }
        function subtasksToJson(subtasks) {
            return JSON.stringify(subtasks || []);
        }
        function addSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;
            const data = panelState.editData;
            if (!data.subtasks) data.subtasks = [];
            data.subtasks.push({ id: Date.now(), text: text, done: false });
            input.value = '';
            updateSubtaskProgress();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();  // FIX: Actualiser l'affichage des cartes
        }
        function toggleSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (st) { 
                st.done = !st.done; 
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask(); 
                render();
            }
        }
        function removeSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const idx = data.subtasks.findIndex(s => s.id === id);
            if (idx !== -1) {
                data.subtasks.splice(idx, 1);
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();  // FIX: Actualiser l'affichage des cartes
            }
        }
        // Édite le texte d'un item de checklist (pas de renderPanelTask -> garde le focus dans l'input)
        function editSubtask(id, value) {
            const data = panelState.editData;
            if (!data || !data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (!st) return;
            const t = (value || '').trim();
            if (!t || t === st.text) return;
            st.text = t;
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }
        function updateSubtaskProgress() {
            const data = panelState.editData;
            if (!data.subtasks || data.subtasks.length === 0) return;
            const done = data.subtasks.filter(s => s.done).length;
            const total = data.subtasks.length;
            data.progression = Math.round((done / total) * 100);
            syncLocalTask();  // FIX: Synchroniser immédiatement pour affichage correct
        }
        function handleSubtaskKeydown(e) {
            if (e.key === 'Enter') { e.preventDefault(); addSubtask(); }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // CRUD
        // ═══════════════════════════════════════════════════════════════════════
        async function saveTaskToGrist() {
            const data = panelState.editData;
            if (!data || panelState.isNew || !gristReady) return;
            if (data.dateDebut && data.dateEcheance && data.dateDebut > data.dateEcheance) { showToast('La date de début ne peut pas dépasser la date de fin', 'error'); return; }
            syncLocalTask();  // FIX: Synchroniser localement avant envoi API
            const record = { titre: data.titre, description: data.description, type: data.type, priorite: data.priorite, statut: data.statut, progression: data.progression, dateDebut: data.dateDebut, dateEcheance: data.dateEcheance, projet: data.projet, assignees: toGristRefList(data.assignees), dependDe: toGristRefList(data.dependDe), tags: toGristChoiceList(data.tags), estimationH: data.estimationH, tempsPasse: data.tempsPasse, subtasks: subtasksToJson(data.subtasks), couleur: data.couleur || null, parentTask: data.parentTask || null, charges: TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId))), dateCloture: data.dateCloture || null };
            try { await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', panelState.taskId, pruneTaskRecord(record)]]); showSaveIndicator(); } catch (e) { showToast('Erreur sauvegarde', 'error'); }
        }

        async function createTask() {
            const data = panelState.editData;
            if (!data || !data.titre?.trim()) { showToast('Titre requis', 'error'); return; }
            if (data.dateDebut && data.dateEcheance && data.dateDebut > data.dateEcheance) { showToast('La date de début ne peut pas dépasser la date de fin', 'error'); return; }
            const record = { titre: data.titre, description: data.description || '', type: data.type || 'tache', priorite: data.priorite || '3', statut: TF.statusOf(statusCfg, data), progression: data.progression || 0, dateDebut: data.dateDebut, dateEcheance: data.dateEcheance, projet: data.projet, assignees: toGristRefList(data.assignees), dependDe: toGristRefList(data.dependDe), tags: toGristChoiceList(data.tags), estimationH: data.estimationH, tempsPasse: data.tempsPasse, subtasks: subtasksToJson(data.subtasks), couleur: data.couleur || null, parentTask: data.parentTask || null, charges: TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId))), dateCloture: data.dateCloture || null };
            if (gristReady) {
                try { await grist.docApi.applyUserActions([['AddRecord', 'Tasks', null, pruneTaskRecord(record)]]); showToast('Créée', 'success'); await loadAllData(); closePanel(); } catch (e) { showToast('Erreur création', 'error'); }

        async function confirmDelete(mode) {
            if (panelState.isNew || !panelState.taskId) return;
            const plan = TF.deletePlan(tasks, panelState.taskId, mode);
            const n = plan.removed.length;
            const msg = n > 1 ? n + ' tâches supprimées' : (plan.detached.length ? 'Supprimée (sous-tâches conservées)' : 'Supprimée');
            if (gristReady) {
                try { await grist.docApi.applyUserActions(plan.actions); showToast(msg, 'success'); await loadAllData(); closePanel(); } catch (e) { showToast('Erreur suppression', 'error'); }
            } else {
                tasks = tasks.filter(t => !plan.removed.includes(t.id));
                tasks.forEach(t => { if (plan.detached.includes(t.id)) t.parentTask = null; });
                if (typeof rebuildChildrenCache === 'function') rebuildChildrenCache();
                showToast(msg, 'success'); render(); closePanel();
            }
        }

        async function initGrist() {
            // Phase 1 : tenter grist.ready — si Grist absent, basculer en démo
            try {
                await grist.ready({ requiredAccess: 'full' });
            } catch (e) {
                console.log('Grist unavailable, using demo:', e);
                useDemoMode();
                return;
            }
            // #7 respect des droits : bandeau lecture seule + garde transverse sur toutes les ecritures.
            TF.readOnlyBanner();
            TF.guardWrites(grist, {
                onReadOnly: () => showToast('Lecture seule : modification non autorisee', 'error'),
                onDenied: () => { showToast('Modification refusee par vos droits', 'error'); loadAllData(); }
            });
            // Phase 2 : ici on est dans Grist. Toute erreur est logguée mais ne bascule PAS en démo.
            // En lecture seule, on ne tente pas de creer le schema (ecritures bloquees).
            if (!TF.isReadOnly()) { try { await ensureSchema(); } catch (e) { console.error('ensureSchema error (continuing):', e); showToast('Schéma: ' + (e?.message || e), 'error'); } }
            try { CRA_ACTIVE = (await grist.docApi.listTables()).includes('TimeEntries'); } catch (e) {}
            try { await loadAllData(); } catch (e) { console.error('loadAllData error (continuing):', e); showToast('Chargement: ' + (e?.message || e), 'error'); }
            try {
                grist.onRecords(async () => await loadAllData());
                grist.onRecord((rec) => { if (rec?.id && rec.id !== selectedTaskId) { selectedTaskId = rec.id; render(); } });
                { const s = document.getElementById('colorSelect'); if (s) s.value = colorMode; }
                { const s = document.getElementById('levelSelect'); if (s) s.value = workLevel; }
            } catch (e) { console.error('Grist listeners error:', e); }
        }
