                // --- Selecteur de vues (menu Affichage) : rendu a chaque changement de contexte ou de liste de vues.
                function viewsHtml() {
                    const mod = modified();
                    const opts = '<option value="">Aucune vue</option>' + views.map(v =>
                        '<option value="' + escAttr(v.name) + '"' + (v.name === state.view ? ' selected' : '') + '>' + escAttr(v.name) + (v.name === state.view && mod ? ' (modifiée)' : '') + '</option>').join('');
                    return '<select id="tfViewSelect" onchange="TF.ctx.pickView(this.value)" aria-label="Vue enregistrée">' + opts + '</select>' +
                        '<span class="tf-views-save"><input type="text" id="tfViewName" maxlength="40" placeholder="Nom de la vue" aria-label="Nom de la vue" value="' + escAttr(state.view || '') + '" ' +
                        'onkeydown="if(event.key===\'Enter\'){TF.ctx.saveViewFromUi();event.preventDefault();}">' +
                        '<button type="button" class="btn" onclick="TF.ctx.saveViewFromUi()" title="Enregistrer les filtres, le tri, la couleur et le niveau actuels sous ce nom">Enregistrer</button>' +
                        (state.view ? '<button type="button" class="btn" onclick="TF.ctx.removeViewFromUi()" title="Supprimer cette vue">Supprimer</button>' : '') + '</span>';
                }
                // Une vue supprimee ailleurs ne doit plus rester « active ».
                function dropGhostView() {
                    if (state.view && !views.some(v => v.name === state.view)) { state = ctxClean(Object.assign(copy(state), { view: null })); wr(keyCtx(), JSON.stringify(state)); }
                }
                function renderViews() {
                    if (typeof document === 'undefined') return;
                    const a = document.activeElement;
                    if (a && a.id === 'tfViewName') return;   // ne pas effacer un nom en cours de saisie
                    document.querySelectorAll('.tf-views').forEach(el => { el.innerHTML = viewsHtml(); });
                }
                function commit(next, source) {
                    if (same(next, state)) return false;
                    state = next;
                    wr(keyCtx(), JSON.stringify(state));
                    renderViews();
                    // Le widget qui agit se met a jour lui-meme ; les autres, et lui-meme apres le choix d'une vue, sont prevenus.
                    if (source === 'external' || source === 'view') listeners.forEach(fn => { try { fn(copy(state), source); } catch (e) { /* un ecouteur ne bloque pas les autres */ } });
                    return true;
                }
                function refresh() {
                    if (ns === null) return;
                    const raw = parse(rd(keyCtx()));
                    const nv = loadViews();
                    const viewsChanged = !same(nv, views);
                    views = nv;
                    if (raw) {
                        const next = ctxClean(raw);
                        if (!same(next, state)) { state = next; dropGhostView(); renderViews(); listeners.forEach(fn => { try { fn(copy(state), 'external'); } catch (e) {} }); return; }
                    }
                    if (viewsChanged) { dropGhostView(); renderViews(); }
                }
                const api = {
                    // Associe le contexte a un document. widget = nom du widget, pour reprendre ses anciens reglages.
                    bind: function (docId, widget) {
                        ns = String(docId || 'doc');
                        const raw = parse(rd(keyCtx()));
                        state = raw ? ctxClean(raw) : legacy(widget);
                        if (!raw) wr(keyCtx(), JSON.stringify(state));
                        views = loadViews();
                        dropGhostView();
                        if (typeof window !== 'undefined' && !api._wired) {
                            api._wired = true;
                            window.addEventListener('storage', e => { if (e.key === keyCtx() || e.key === keyViews()) refresh(); });
                            window.addEventListener('focus', refresh);
                            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
                        }
                        renderViews();
                        return copy(state);
                    },
                    init: async function (grist, widget) {
                        let id = null;
                        try {
                            if (grist && grist.docApi && grist.docApi.getDocName) id = await Promise.race([grist.docApi.getDocName(), new Promise(r => setTimeout(() => r(null), 2000))]);
                        } catch (e) { /* identifiant indisponible : contexte commun a tous les documents du navigateur */ }
                        return api.bind(id, widget);
                    },
                    get: function () { return copy(state); },
                    // patch = { filters: { project: [..] }, color, sort, level, subs, view } ; seules les cles presentes changent.
                    set: function (patch) {
                        const next = copy(state);
                        patch = patch || {};
                        if (patch.filters) Object.keys(next.filters).forEach(k => { if (patch.filters[k] !== undefined) next.filters[k] = patch.filters[k]; });
                        ['color', 'sort', 'level', 'subs', 'view'].forEach(k => { if (k in patch) next[k] = patch[k]; });
                        return commit(ctxClean(next), 'local');
                    },
                    // fn(contexte, source) quand le contexte change SANS que ce widget en soit l'auteur : source = 'external' ou 'view'.
                    onChange: function (fn) { listeners.push(fn); },
                    // Ecarte les filtres devenus sans objet (projet supprime, membre retire, statut renomme) : ils masqueraient
                    // tout sans qu'on puisse les retirer. valid = { project: [ids], assignee: [ids], status: [valeurs] } ;
                    // une liste vide n'est pas appliquee (donnees pas encore lues). Retourne le nombre de filtres retires.
                    prune: function (valid) {
                        const next = copy(state);
                        let removed = 0;
                        ['project', 'assignee', 'status'].forEach(k => {
                            const ok = valid && valid[k];
                            if (!ok || !ok.length) return;
                            const keep = new Set(ok.map(k === 'status' ? String : Number));
                            const kept = next.filters[k].filter(v => keep.has(v));
                            removed += next.filters[k].length - kept.length;
                            next.filters[k] = kept;
                        });
                        if (removed) commit(next, 'prune');
                        return removed;
                    },
                    views: {
                        list: function () { return views.map(v => v.name); },
                        current: function () { return state.view; },
                        modified: modified,
                        save: function (name) {
                            name = String(name == null ? '' : name).trim().slice(0, 40);
                            if (!name) return false;
                            const data = copy(ctxData(state));
                            const i = views.findIndex(v => v.name === name);
                            if (i >= 0) views[i].data = data; else views.push({ name: name, data: data });
                            wr(keyViews(), JSON.stringify(views));
                            if (!commit(ctxClean(Object.assign(copy(state), { view: name })), 'local')) renderViews();
                            return true;
                        },
                        apply: function (name) {
                            const v = views.find(x => x.name === name);
                            if (!v) return false;
                            commit(ctxClean(Object.assign(copy(v.data), { view: name })), 'view');
                            return true;
                        },
                        clear: function () { return commit(ctxClean(Object.assign(copy(state), { view: null })), 'local'); },
                        remove: function (name) {
                            const n = views.length;
                            views = views.filter(v => v.name !== name);
                            if (views.length === n) return false;
                            wr(keyViews(), JSON.stringify(views));
                            if (state.view === name) commit(ctxClean(Object.assign(copy(state), { view: null })), 'local'); else renderViews();
                            return true;
                        }
                    },
                    // Appels des controles du menu Affichage.
                    pickView: function (name) { if (name) api.views.apply(name); else api.views.clear(); },
                    saveViewFromUi: function () {
                        const input = typeof document !== 'undefined' ? document.getElementById('tfViewName') : null;
                        const name = input ? input.value : '';
                        if (!api.views.save(name) && input) input.focus();
                        else if (input) input.blur();
                    },
                    removeViewFromUi: function () { if (state.view) api.views.remove(state.view); },
                    // Position affichee (Gantt, Calendrier) : { iso, fit, ... } memorisee 12 h au plus.
                    pos: {
                        get: function (widget) {
                            if (ns === null) return null;
                            const p = parse(rd(keyPos(widget)));
                            return p && typeof p.t === 'number' && now() - p.t < CTX_POS_MAX_AGE ? p : null;
                        },
                        set: function (widget, value) { if (ns !== null) wr(keyPos(widget), JSON.stringify(Object.assign({}, value, { t: now() }))); }
                    },
                    renderViews: renderViews,
                    // Relit le stockage (appele sur l'evenement « storage », au retour de focus ; expose pour les tests).
                    refresh: refresh
                };
                return api;
            }
            let ctxStorage = null;
            try { ctxStorage = typeof localStorage !== 'undefined' ? localStorage : null; } catch (e) { ctxStorage = null; }
            const ctx = createCtx({ storage: ctxStorage });

            // Un widget cree la table Tasks dans un document neuf alors qu'il est lie a la table par defaut de Grist
            // (« Table1 ») : onRecords ne se declenche alors jamais pour Tasks. On rattache la section a Tasks, une seule
            // fois, seulement si c'est sans ambiguite (une seule section personnalisee sur la table liee) et si la table
            // liee est vide ou porte le nom par defaut. Grist recree alors l'iframe ; un avis s'affiche au redemarrage.
            // Annulable (Ctrl+Z) dans Grist. Appeler juste apres la creation de Tasks, en fin de schema.
            async function relinkToTasks(grist) {
                try {
                    if (isReadOnly() || !grist || !grist.selectedTable) return false;
                    const liee = await grist.selectedTable.getTableId();
                    if (!liee || liee === 'Tasks') return false;
                    const tables = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                    const from = tables.find(t => t.tableId === liee), to = tables.find(t => t.tableId === 'Tasks');
                    if (!from || !to) return false;
                    const sections = columnarToRows(await grist.docApi.fetchTable('_grist_Views_section')).filter(s => s.parentKey === 'custom' && s.tableRef === from.id);
                    if (sections.length !== 1) return false;
                    const data = await grist.docApi.fetchTable(liee);
                    const vide = !data || !data.id || data.id.length === 0;
                    if (!vide && !/^Table\d+$/.test(liee)) return false;
                    try { localStorage.setItem('taskflow_relinked', '1'); } catch (e) {}
                    await grist.docApi.applyUserActions([['UpdateRecord', '_grist_Views_section', sections[0].id, { tableRef: to.id }]]);
                    return true;
                } catch (e) { return false; }
            }
            // Vrai une seule fois, au demarrage qui suit un rattachement a Tasks (pour l'annoncer).
            function consumeRelinkNotice() {
                try { if (localStorage.getItem('taskflow_relinked')) { localStorage.removeItem('taskflow_relinked'); return true; } } catch (e) {}
                return false;
            }
            // Garde transverse : enrobe grist.docApi.applyUserActions une seule fois pour
            // respecter les droits sur TOUS les sites d'ecriture sans les modifier un a un.
            // - lecture seule -> bloque + opts.onReadOnly()
            // - refus ACL au niveau ligne -> opts.onDenied(err) (le widget toast + recharge)
            // Les erreurs continuent d'etre levees (les try/catch existants les absorbent).
            // Rafraichissement de secours. grist.onRecords ne se declenche que pour la table LIEE a la section : un widget lie a
            // une autre table (cas courant : la table proposee par defaut a l'ajout du widget) ne voyait pas les saisies faites
            // dans Tasks. Si la table liee n'est pas Tasks, on la relit toutes les 15 s (page visible) et au retour sur la page,
            // et on recharge seulement si elle a change, sans interrompre une saisie en cours. opts = { table, every, busy }.
            const watchState = { baseline: null, on: false };
            function watchTasks(grist, reload, opts) {
                opts = opts || {};
                if (!grist || !grist.docApi || typeof document === 'undefined' || watchState.on) return;
                watchState.on = true;
                const table = opts.table || 'Tasks';
                const occupe = () => {
                    const a = document.activeElement;
                    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
                    if (document.querySelector('.panel.open, .tf-modal-overlay')) return true;
                    return !!(opts.busy && opts.busy());
                };
                let enCours = false;
                const verifier = async () => {
                    if (enCours || document.visibilityState === 'hidden') return;
                    enCours = true;
                    try {
                        const signature = JSON.stringify(await grist.docApi.fetchTable(table));
                        if (watchState.baseline === null) watchState.baseline = signature;
                        else if (signature !== watchState.baseline && !occupe()) { watchState.baseline = signature; await reload(); }
                    } catch (e) { /* lecture impossible : on reessaiera */ }
                    finally { enCours = false; }
                };
                (async () => {
                    let liee = null;
                    try { liee = await grist.selectedTable.getTableId(); } catch (e) { /* aucune table liee */ }
                    if (liee === table) return;   // onRecords suffit
                    setInterval(verifier, opts.every || 15000);
                    document.addEventListener('visibilitychange', verifier);
                    window.addEventListener('focus', verifier);
                    verifier();
                })();
            }
            function guardWrites(grist, opts) {
                opts = opts || {};
                if (!grist || !grist.docApi || grist.docApi._tfGuarded) return;
                const raw = grist.docApi.applyUserActions.bind(grist.docApi);
                grist.docApi._tfGuarded = true;

        // ═══════════════════════════════════════════════════════════════════════
        // WBS (hiérarchie sous-tâches) — API commune
        // ═══════════════════════════════════════════════════════════════════════
        let childrenByParent = new Map();  // reconstruit à chaque loadAllData
        function rebuildChildrenCache() {
            childrenByParent = new Map();
            // WBS-FIX: ignorer les parentTask qui formeraient un cycle (self-ref ou chaîne circulaire)
            const cycleIds = new Set();
            for (const t of tasks) {
                const seen = new Set([t.id]);
                let cur = t.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
                let guard = 0;
                while (cur && guard++ < 128) {
                    if (seen.has(cur.id)) { cycleIds.add(t.id); break; }
                    seen.add(cur.id);
                    cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
                }
            }
            if (cycleIds.size) console.warn('WBS: cycles detected on task ids:', [...cycleIds]);
            for (const t of tasks) {
                const pid = t.parentTask;
                if (pid && !isNaN(pid) && !cycleIds.has(t.id)) {
                    if (!childrenByParent.has(pid)) childrenByParent.set(pid, []);
                    childrenByParent.get(pid).push(t);
                }
            }
        }
        const isRoot = (t) => !t?.parentTask;
        const getParent = (t) => t?.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
        const getChildren = (id) => childrenByParent.get(id) || [];
        const hasChildren = (t) => t && getChildren(t.id).length > 0;
        function getDepth(t) { let d = 0, cur = t, guard = 0; while (cur?.parentTask && guard++ < 32) { cur = tasks.find(x => x.id === cur.parentTask); d++; } return d; }
        // Itératif DFS pour éviter stack overflow
        function walkTree(roots, cb, depth = 0) {
            const stack = roots.map(r => ({ task: r, depth: 0 }));
            while (stack.length) {
                const { task, depth: d } = stack.shift();
                cb(task, d);
                const kids = getChildren(task.id);
                if (kids.length) {
                    for (let i = kids.length - 1; i >= 0; i--) stack.unshift({ task: kids[i], depth: d + 1 });
                }
            }
        }
        function getAllDescendants(id, acc = [], visited = new Set()) {
            if (visited.has(id)) return acc;  // WBS-FIX: anti-cycle
            visited.add(id);
            const kids = getChildren(id);
            for (const k of kids) { acc.push(k); getAllDescendants(k.id, acc, visited); }
            return acc;
        }
        // Anti-cycle : true si newParent peut être affecté à taskId sans créer de boucle
        function canSetParent(taskId, newParent) {
            if (!newParent) return true;
            if (newParent === taskId) return false;
            let cur = tasks.find(x => x.id === newParent);
            let guard = 0;
            while (cur && guard++ < 64) {
                if (cur.id === taskId) return false;
                cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
            }
            return true;
        }
        // Agrégations — calculées à la demande, JAMAIS persistées côté Grist
        function aggregateProgress(t, visited = new Set()) {
            if (visited.has(t.id)) return t.progression || 0;
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return t.progression || 0;
            const allWeighted = kids.every(k => k.estimationH && k.estimationH > 0);
            if (allWeighted) {
                const totalW = kids.reduce((s, k) => s + k.estimationH, 0);
                return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited) * k.estimationH, 0) / totalW);
            }
            return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited), 0) / kids.length);
        }
        function aggregateDates(t, visited = new Set()) {
            if (visited.has(t.id)) return { start: t.dateDebut, end: t.dateEcheance };
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return { start: t.dateDebut, end: t.dateEcheance };
            let minS = t.dateDebut, maxE = t.dateEcheance;
            for (const k of kids) {
                const sub = aggregateDates(k, visited);
                if (sub.start != null && (minS == null || sub.start < minS)) minS = sub.start;
                if (sub.end != null && (maxE == null || sub.end > maxE)) maxE = sub.end;

        // WBS-02: toggle expand/collapse d'une branche

        // Tri au sein d'une fratrie selon sortMode

        }
        // Construit la liste aplatie des tâches visibles (DFS) avec respect filtres + expand/collapse
        // Renvoie [{task, depth, dimmed}]
        function buildVisibleTasks() {
            const filtered = getFilteredTasks();
            // #9 : niveau != 'all' -> vue APLATIE du niveau (pas d'arbre), coherent avec le Kanban.
            if (workLevel === 'actions') return filtered.filter(t => !hasChildren(t)).map(t => ({ task: t, depth: 0, dimmed: false }));
            if (workLevel === 'parents') return filtered.filter(t => hasChildren(t)).map(t => ({ task: t, depth: 0, dimmed: false }));
            const directMatches = new Set(filtered.map(t => t.id));
            // branches = tâches dont elles-mêmes OU un ancêtre OU un descendant match
            const branchTasks = new Set();
            for (const t of filtered) {
                let cur = t, guard = 0;
                while (cur && guard++ < 64) {
                    branchTasks.add(cur.id);
                    cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
                }
                for (const d of getAllDescendants(t.id)) branchTasks.add(d.id);
            }
            // Racines (tâches sans parent existant)
            const rootsAll = tasks.filter(t => !t.parentTask || !tasks.find(x => x.id === t.parentTask));
            const roots = sortFratrie(rootsAll.filter(t => branchTasks.has(t.id)));
            const visible = [];
            const walk = (node, depth) => {
                const dimmed = !directMatches.has(node.id);
                visible.push({ task: node, depth, dimmed });
                if (hasChildren(node) && expandedTasks.has(node.id)) {
                    const kids = sortFratrie(getChildren(node.id).filter(k => branchTasks.has(k.id)));
                    for (const k of kids) walk(k, depth + 1);

            };
            for (const r of roots) walk(r, 0);
            return visible;

        // Dependency cycle detection
        function wouldCreateCycle(taskId, depId, visited = new Set()) {
            if (taskId === depId) return true;
            if (visited.has(depId)) return false;
            visited.add(depId);
            const depTask = tasks.find(t => t.id === depId);
            if (!depTask) return false;
            return getDependsOnArray(depTask).some(d => wouldCreateCycle(taskId, d, visited));
        }
        function getAvailableDependencies(taskId) { return tasks.filter(t => t.id !== taskId && !wouldCreateCycle(taskId, t.id)); }
        function getBlockedTasks(taskId) { return tasks.filter(t => getDependsOnArray(t).includes(taskId)); }
        
        // GANTT-06: Propagation des dates aux tâches dépendantes
        function propagateDependencyDates(changedTaskId, visited = new Set()) {
            if (visited.has(changedTaskId)) return []; // Protection contre les cycles
            visited.add(changedTaskId);
            
            const changedTask = tasks.find(t => t.id === changedTaskId);
            if (!changedTask) return [];
            
            const changedEnd = gristToDate(changedTask.dateEcheance);
            if (!changedEnd) return [];
            
            const updates = [];
            const blockedTasks = getBlockedTasks(changedTaskId);
            
            blockedTasks.forEach(depTask => {
                const depStart = gristToDate(depTask.dateDebut);
                const depEnd = gristToDate(depTask.dateEcheance);
                
                if (!depStart || !depEnd) return;
                // Une tache deja terminee ou annulee garde ses dates : on ne rejoue pas l'histoire.
                if (TF.isDone(statusCfg, depTask.statut) || TF.isDead(statusCfg, depTask.statut)) return;

                // Si la tâche dépendante commence avant la fin de la tâche modifiée, la décaler
                const requiredStart = addDays(changedEnd, 1); // Commence le jour suivant
                
                if (depStart < requiredStart) {
                    const duration = getDaysDiff(depStart, depEnd);
                    const newStart = requiredStart;
                    const newEnd = addDays(newStart, duration);
                    
                    // Mettre à jour en mémoire
                    depTask.dateDebut = dateToGrist(newStart);
                    depTask.dateEcheance = dateToGrist(newEnd);
                    
                    updates.push({
                        id: depTask.id,
                        dateDebut: depTask.dateDebut,
                        dateEcheance: depTask.dateEcheance
                    });
                    
                    // Propager récursivement
                    const cascadeUpdates = propagateDependencyDates(depTask.id, visited);
                    updates.push(...cascadeUpdates);
                }
            });
            
            return updates;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // DATE CALCULATIONS
        // ═══════════════════════════════════════════════════════════════════════
        function getStartOfWeek(d) { const r = new Date(d); const day = r.getDay(); r.setDate(r.getDate() - day + (day === 0 ? -6 : 1)); r.setHours(0, 0, 0, 0); return r; }
        function getStartOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
        function getStartOfQuarter(d) { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); }
        function getStartOfSemester(d) { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 6) * 6, 1); }
        function getStartOfYear(d) { return new Date(d.getFullYear(), 0, 1); }
        function getWeekNumber(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const year = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil((((t - year) / 86400000) + 1) / 7); }
        function getViewStartDate() {
            // Un cadrage « Ajuster » est une fenêtre libre : la recaler sur le début de période
            // annulerait le calage qui vient d'être calculé.
            if (fitWindow) return fitWindow.start;
            switch (currentView) {
                case 'week': return getStartOfWeek(viewStartDate);
                case 'month': return getStartOfMonth(viewStartDate);
                case 'quarter': return getStartOfQuarter(viewStartDate);
                case 'semester': return getStartOfSemester(viewStartDate);
                case 'year': return getStartOfYear(viewStartDate);
                case 'multi': return getStartOfQuarter(viewStartDate);
                default: return getStartOfMonth(viewStartDate);
            }
        }
        function getTotalDays() {
            if (fitWindow) return fitWindow.days;
            const cfg = VIEW_CONFIG[currentView];
            if (cfg.unit === 'day') return cfg.days;
            if (cfg.unit === 'week') return cfg.weeks * 7;
            if (cfg.unit === 'month') return cfg.months * 30; // Approximation pour vue année
            if (cfg.unit === 'quarter') return cfg.quarters * 91; // Approximation pour vue pluriannuelle
            return cfg.days;
        }
        function getPixelsPerDay() {
            const cfg = VIEW_CONFIG[currentView];
            if (cfg.unit === 'day') return cfg.cellWidth;
            if (cfg.unit === 'week') return cfg.cellWidth / 7;
            if (cfg.unit === 'month') return cfg.cellWidth / 30; // Approximation pour vue année
            if (cfg.unit === 'quarter') return cfg.cellWidth / 91;
            return cfg.cellWidth;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // VIEW & NAVIGATION
        // ═══════════════════════════════════════════════════════════════════════
        function setView(view) {
            currentView = view;
            fitWindow = null;   // choix explicite d'une vue : on quitte le cadrage « Ajuster »
            alignOnRender = true;
            localStorage.setItem('taskflow_gantt_view', view);
            document.querySelectorAll('.view-controls .btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            document.documentElement.style.setProperty('--cell-width', VIEW_CONFIG[view].cellWidth + 'px');
            savePos();
            render();
        }
        // Position affichee : memorisee quelques heures (contexte commun), pour la retrouver apres un rechargement du widget.
        function savePos() {
            TF.ctx.pos.set('gantt', { start: viewStartDate.getTime(), fit: fitWindow ? { start: fitWindow.start.getTime(), days: fitWindow.days } : null, view: currentView });
        }
        function restorePos() {
            const p = TF.ctx.pos.get('gantt');
            if (!p || !isFinite(p.start)) return;
            if (p.view && VIEW_CONFIG[p.view]) {
                currentView = p.view;
                document.querySelectorAll('.view-controls .btn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
                document.documentElement.style.setProperty('--cell-width', VIEW_CONFIG[currentView].cellWidth + 'px');
            }
            viewStartDate = new Date(p.start);
            alignOnRender = true;
            fitWindow = p.fit && isFinite(p.fit.start) && p.fit.days > 0 ? { start: new Date(p.fit.start), days: p.fit.days } : null;
        }
        function navigate(dir) {
            // Naviguer depuis un cadrage libre : on repart de sa borne gauche, en vue fixe.
            if (fitWindow) { viewStartDate = new Date(fitWindow.start.getTime()); fitWindow = null; }
            alignOnRender = true;
            const cfg = VIEW_CONFIG[currentView];
            if (typeof cfg.navStep === 'number') viewStartDate = addDays(viewStartDate, dir * cfg.navStep);
            else if (cfg.navStep === 'month') viewStartDate = new Date(viewStartDate.getFullYear(), viewStartDate.getMonth() + dir, 1);
            else if (cfg.navStep === 'quarter') viewStartDate = new Date(viewStartDate.getFullYear(), viewStartDate.getMonth() + dir * 3, 1);
            else if (cfg.navStep === 'semester') viewStartDate = new Date(viewStartDate.getFullYear(), viewStartDate.getMonth() + dir * 6, 1);
            else if (cfg.navStep === 'year') viewStartDate = new Date(viewStartDate.getFullYear() + dir, 0, 1);
            savePos();
            render();
        }
        function goToToday() { fitWindow = null; viewStartDate = new Date(); alignOnRender = true; savePos(); render(); }

        function fitToTasks() {
            const ft = getFilteredTasks();
            if (ft.length === 0) { goToToday(); return; }

            // Find min/max dates from tasks
            let minDate = null, maxDate = null;
            ft.forEach(t => {
                const start = gristToDate(t.dateDebut);
                const end = gristToDate(t.dateEcheance);
                if (start && (!minDate || start < minDate)) minDate = start;
                if (end && (!maxDate || end > maxDate)) maxDate = end;
            });

            if (!minDate || !maxDate) { goToToday(); return; }

            // Add some padding (7 days before, 7 days after)
            minDate = addDays(minDate, -7);
            maxDate = addDays(maxDate, 7);

            // Calculate span in days
            const spanDays = getDaysDiff(minDate, maxDate);

            // Choix de la graduation : la plus fine qui reste lisible sur toute l'amplitude.
            if (spanDays <= 14) {
                currentView = 'week';
            } else if (spanDays <= 60) {
                currentView = 'month';
            } else if (spanDays <= 120) {
                currentView = 'quarter';
            } else if (spanDays <= 200) {
                currentView = 'semester';
            } else if (spanDays <= 400) {
                currentView = 'year';
            } else {
                currentView = 'multi';   // au-dela d'un an, seule la graduation trimestrielle tient
            }

            // Cadrage libre : la fenêtre EST la plage des tâches. Sans cela, getViewStartDate()
            // la recalerait sur le début de période et « Ajuster » n'ajusterait rien.
            viewStartDate = minDate;
            fitWindow = { start: minDate, days: Math.max(spanDays, 1) };
            alignOnRender = true;
            localStorage.setItem('taskflow_gantt_view', currentView);
            document.querySelectorAll('.view-controls .btn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
            document.documentElement.style.setProperty('--cell-width', VIEW_CONFIG[currentView].cellWidth + 'px');
            savePos();
            render();
        }
        function updatePeriodLabel() {
            const start = getViewStartDate();
            let text = '', court = null;
            // Sous cadrage libre, le libellé annonce la plage réelle, pas une période calendaire.
            if (fitWindow) {
                const fin = addDays(fitWindow.start, fitWindow.days);
                TF.setPeriodLabel(
                    formatDateShort(fitWindow.start) + ' ' + start.getFullYear() + ' - ' + formatDateShort(fin) + ' ' + fin.getFullYear(),
                    formatDateShort(fitWindow.start) + ' - ' + formatDateShort(fin));
                return;
            }
            switch (currentView) {
                case 'week': text = 'S' + getWeekNumber(start) + ' · ' + formatDateShort(start) + ' - ' + formatDateShort(addDays(start, 6)); court = 'S' + getWeekNumber(start) + ' · ' + TF.monthYearShort(start); break;
                case 'month': text = MONTHS[start.getMonth()] + ' ' + start.getFullYear(); court = TF.monthYearShort(start); break;
                case 'quarter': text = 'T' + (Math.floor(start.getMonth() / 3) + 1) + ' ' + start.getFullYear(); court = 'T' + (Math.floor(start.getMonth() / 3) + 1) + ' ' + String(start.getFullYear()).slice(-2); break;
                case 'semester': text = 'S' + (Math.floor(start.getMonth() / 6) + 1) + ' ' + start.getFullYear(); court = 'S' + (Math.floor(start.getMonth() / 6) + 1) + ' ' + String(start.getFullYear()).slice(-2); break;
                case 'year': text = start.getFullYear().toString(); break;
                case 'multi': text = start.getFullYear() + ' - ' + addDays(start, getTotalDays()).getFullYear(); court = String(start.getFullYear()).slice(-2) + ' - ' + String(addDays(start, getTotalDays()).getFullYear()).slice(-2); break;
            }
            TF.setPeriodLabel(text, court);
        }

                function taskMatchesFilters(t) {

        // Calcule la plage effective = période vue étendue uniquement pour les tâches qui la chevauchent
        function computeEffectiveRange() {
            const ft = getFilteredTasks();
            const cfg = VIEW_CONFIG[currentView];
            const vStart = getViewStartDate();
            const vDays = getTotalDays();

            const vEnd = addDays(vStart, vDays);
            // La frise se prolonge de part et d'autre de la periode annoncee (jours et semaines) : on fait defiler pour voir
            // la suite (ou ce qui precede) au lieu de buter sur le bord. La periode, elle, garde toute la largeur (voir plus bas).
            const OUTER = fitWindow ? 0 : (cfg.unit === 'day' ? 14 : cfg.unit === 'week' ? 28 : 0);
            let eStart = addDays(vStart, -OUTER);
            let eEnd = addDays(vEnd, OUTER);

            // Padding en jours selon la résolution de la vue
            const PADDING = cfg.unit === 'day' ? 3 : cfg.unit === 'week' ? 7 : cfg.unit === 'quarter' ? 30 : 14;

            // La frise couvre TOUTES les taches datees (a l'echelle de la vue) : on les atteint en faisant defiler, la periode
            // annoncee n'etant que la position d'ouverture. Garde-fou : au-dela de ±1000 jours (vue jour) ou ±3000 jours
            // (autres vues) autour de la periode, une date aberrante n'etire pas la frise ; la navigation y mene.
            const CAP = cfg.unit === 'day' ? 1000 : 3000;
            const lo = addDays(vStart, -CAP), hi = addDays(vEnd, CAP);
            ft.forEach(t => {
                let ts = gristToDate(t.dateDebut) || gristToDate(t.dateEcheance);
                let te = gristToDate(t.dateEcheance) || ts;
                if (!ts || !te) return;
                if (te < lo || ts > hi) return;
                if (ts < lo) ts = lo;
                if (te > hi) te = hi;
                if (ts < eStart) eStart = addDays(ts, -PADDING);
                if (addDays(te, 1) > eEnd) eEnd = addDays(te, 1 + PADDING);   // le dernier jour de la tache est inclus
            });

            // Aligner le début sur la frontière de la grille
            if (cfg.unit === 'week') eStart = getStartOfWeek(eStart);
            else if (cfg.unit === 'month') eStart = getStartOfMonth(eStart);
            else if (cfg.unit === 'quarter') eStart = getStartOfQuarter(eStart);
            else eStart = new Date(eStart.getFullYear(), eStart.getMonth(), eStart.getDate());

            effectiveStart = eStart;
            effectiveDays = Math.max(getDaysDiff(eStart, eEnd), vDays);
            // Colonnes de largeur egale mais de duree inegale (mois, trimestres) : la plage se termine sur la
            // frontiere de la derniere colonne, de sorte que le nombre de colonnes comptees pour l'echelle soit
            // exactement celui des colonnes dessinees (sinon les barres derivaient de plusieurs jours).
            if (cfg.unit === 'month' || cfg.unit === 'quarter') {
                const derniere = addDays(eStart, effectiveDays - 1);
                const pas = cfg.unit === 'month' ? 1 : 3;
                const debutCol = Math.floor(derniere.getMonth() / pas) * pas;
                effectiveDays = getDaysDiff(eStart, new Date(derniere.getFullYear(), debutCol + pas, 1));
            } else if (cfg.unit === 'week') {
                effectiveDays = Math.ceil(effectiveDays / 7) * 7;   // colonnes de 7 jours : plage en semaines entieres
            }

            // Nombre de cellules effectives selon l'unité de la vue
            const eCfg = VIEW_CONFIG[currentView];
            let numCells;
            if (eCfg.unit === 'quarter') {
                const eEnd2 = addDays(eStart, effectiveDays);
                const mois = (eEnd2.getFullYear() - eStart.getFullYear()) * 12 + (eEnd2.getMonth() - eStart.getMonth());
                numCells = Math.max(1, Math.ceil(mois / 3));
            } else if (eCfg.unit === 'month') {
                const eEnd2 = addDays(eStart, effectiveDays);
                numCells = Math.max(1, (eEnd2.getFullYear() - eStart.getFullYear()) * 12 + (eEnd2.getMonth() - eStart.getMonth()));
            } else if (eCfg.unit === 'week') {
                numCells = Math.ceil(effectiveDays / 7);
            } else {
                numCells = effectiveDays;
            }

            // Largeur de cellule : remplit la largeur disponible, min = cfg.cellWidth.
            // Sous cadrage « Ajuster », le plancher descend jusqu'a la limite de lisibilite :
            // sinon la vue ne peut jamais se comprimer et le calage deborde de l'ecran.
            const timelineEl = document.getElementById('timelineScroll');
            const availableWidth = (timelineEl && timelineEl.clientWidth > 10) ? timelineEl.clientWidth : 600;
            const plancher = fitWindow ? (MIN_CELL_WIDTH[eCfg.unit] || eCfg.cellWidth) : eCfg.cellWidth;
            // La largeur se cale sur la PERIODE annoncee (pas sur la frise prolongee) : la semaine remplit l'ecran, le reste se
            // decouvre en faisant defiler. Sous cadrage « Ajuster », c'est la plage entiere qui doit tenir.
            const cellulesPeriode = fitWindow ? numCells : (eCfg.unit === 'day' ? vDays : eCfg.unit === 'week' ? Math.ceil(vDays / 7) : numCells);
            effectiveCellWidth = Math.max(plancher, Math.floor(availableWidth / Math.max(1, cellulesPeriode)));

            // Mettre à jour --cell-width pour les vues jour (Sem/Mois)
            document.documentElement.style.setProperty('--cell-width', effectiveCellWidth + 'px');

            // pxPerDay depuis le ratio réel (précis même en vue année)
            effectivePxPerDay = effectiveDays > 0 ? (numCells * effectiveCellWidth) / effectiveDays : eCfg.cellWidth;
        }

        // Abscisse d'une date (debut de journee) depuis le debut de la plage effective. Mois et trimestres ont une
        // duree variable pour une largeur de colonne fixe : position = colonne + fraction de la colonne.
        function dateToX(d) {
            const cfg = VIEW_CONFIG[currentView], s = effectiveStart;
            if (cfg.unit === 'month') {
                const idx = (d.getFullYear() - s.getFullYear()) * 12 + (d.getMonth() - s.getMonth());
                const duree = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
                return (idx + (d.getDate() - 1) / duree) * effectiveCellWidth;
            }
            if (cfg.unit === 'quarter') {
                const q = Math.floor(d.getMonth() / 3);
                const idx = (d.getFullYear() - s.getFullYear()) * 4 + (q - Math.floor(s.getMonth() / 3));
                const debut = new Date(d.getFullYear(), q * 3, 1), fin = new Date(d.getFullYear(), q * 3 + 3, 1);
                return (idx + getDaysDiff(debut, d) / getDaysDiff(debut, fin)) * effectiveCellWidth;
            }
            return getDaysDiff(s, d) * effectivePxPerDay;
        }

        function renderTimelineHeader() {
            const start = effectiveStart;
            const totalDays = effectiveDays;
            const cfg = VIEW_CONFIG[currentView];
            let monthsHtml = '', daysHtml = '';

            if (cfg.unit === 'quarter') {
                // Vue Pluriannuelle : une cellule par trimestre, l'année portée par le bandeau du haut.
                const effEnd = addDays(start, totalDays);
                let cur = new Date(start.getFullYear(), Math.floor(start.getMonth() / 3) * 3, 1);
                let anneeCourante = -1, largeurAnnee = 0;
                const pousserAnnee = () => {
                    if (anneeCourante !== -1) monthsHtml += '<div class="month-cell" style="width:' + largeurAnnee + 'px">' + anneeCourante + '</div>';
                };
                const maintenant = new Date();
                while (cur < effEnd) {
                    const y = cur.getFullYear();
                    const t = Math.floor(cur.getMonth() / 3) + 1;
                    if (y !== anneeCourante) { pousserAnnee(); anneeCourante = y; largeurAnnee = 0; }
                    largeurAnnee += effectiveCellWidth;
                    const finTrim = new Date(y, cur.getMonth() + 3, 1);
                    const estTrimCourant = maintenant >= cur && maintenant < finTrim;
                    daysHtml += '<div class="day-cell ' + (estTrimCourant ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px">T' + t + '</div>';
                    cur = finTrim;
                }
                pousserAnnee();

            } else if (cfg.unit === 'month') {
                // Vue Année : itérer sur les mois réels de la plage effective
                const effEnd = addDays(start, totalDays);
                let cur = new Date(start.getFullYear(), start.getMonth(), 1);
                let idx = 0;
                while (cur < effEnd) {
                    const m = cur.getMonth();
                    const y = cur.getFullYear();
                    const isCurrentMonth = (new Date().getMonth() === m && new Date().getFullYear() === y);
                    monthsHtml += '<div class="month-cell" style="width:' + effectiveCellWidth + 'px">' + (m === 0 || idx === 0 ? y : '') + '</div>';
                    daysHtml += '<div class="day-cell ' + (isCurrentMonth ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px">' + MONTHS_SHORT[m] + '</div>';
                    cur = new Date(y, m + 1, 1);
                    idx++;
                }

            } else if (cfg.unit === 'week') {
                // Vues Trimestre/Semestre : regrouper les cellules-semaine par mois
                // → largeur header mois = nb_cellules × effectiveCellWidth (alignement parfait)
                const weekGroups = [];
                let curGroup = null;
                for (let i = 0; i < totalDays; i += 7) {
                    const d = addDays(start, i);
                    const monthKey = d.getFullYear() * 100 + d.getMonth();
                    if (!curGroup || curGroup.key !== monthKey) {
                        curGroup = { key: monthKey, month: d.getMonth(), year: d.getFullYear(), cells: 0 };
                        weekGroups.push(curGroup);
                    }
                    curGroup.cells++;
                }
                weekGroups.forEach((g, gi) => {
                    const w = g.cells * effectiveCellWidth;
                    const label = (g.month === 0 || gi === 0) ? g.year + ' · ' + MONTHS_SHORT[g.month] : MONTHS_SHORT[g.month];
                    monthsHtml += '<div class="month-cell" style="width:' + w + 'px">' + label + '</div>';
                });
                // Une cellule-jour par bloc de 7 jours, centrée sur le lundi ISO
                for (let i = 0; i < totalDays; i += 7) {
                    let labelDate = null;
                    for (let j = 0; j < 7; j++) {
                        const d = addDays(start, i + j);
                        if (d.getDay() === 1) { labelDate = d; break; }
                    }
                    if (!labelDate) labelDate = addDays(start, i);
                    const isCurrentWeek = new Date() >= addDays(start, i) && new Date() < addDays(start, i + 7);
                    daysHtml += '<div class="day-cell ' + (isCurrentWeek ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px">S' + getWeekNumber(labelDate) + '</div>';
                }

            } else {
                // Vues Semaine/Mois : une cellule par jour — largeur explicite alignée sur les cellules-mois
                let currentMonth = -1, monthStartIdx = 0;
                for (let i = 0; i < totalDays; i++) {
                    const d = addDays(start, i);
                    const m = d.getMonth();
                    if (m !== currentMonth) {
                        if (currentMonth !== -1) {
                            monthsHtml += '<div class="month-cell" style="width:' + ((i - monthStartIdx) * effectiveCellWidth) + 'px">' + MONTHS_SHORT[currentMonth] + '</div>';
                        }
                        currentMonth = m;
                        monthStartIdx = i;
                    }
                    const isWe = isWeekend(d);
                    const isT = isSameDay(d, new Date());
                    const isMonthStart = d.getDate() === 1;
                    daysHtml += '<div class="day-cell ' + (isWe ? 'weekend ' : '') + (isT ? 'today ' : '') + (isMonthStart ? 'month-start' : '') + '" style="width:' + effectiveCellWidth + 'px">' + d.getDate() + '</div>';
                }
                monthsHtml += '<div class="month-cell" style="width:' + ((totalDays - monthStartIdx) * effectiveCellWidth) + 'px">' + MONTHS_SHORT[currentMonth] + '</div>';
            }

            document.getElementById('monthsHeader').innerHTML = monthsHtml;
            document.getElementById('daysHeader').innerHTML = daysHtml;
        }

        // WBS-02: liste aplatie visible, partagée entre renderTaskList et renderTimeline
        let currentVisible = [];
        function renderTaskList() {
            currentVisible = buildVisibleTasks();
            panelState.taskList = currentVisible.map(v => v.task);
            document.getElementById('taskCount').textContent = currentVisible.length;

            let html = '';
            currentVisible.forEach(({ task: t, depth, dimmed }) => {
                const p = getTaskPriority(t);
                const isParent = hasChildren(t);
                // Dates affichées : agrégées si parent sans dates propres, sinon dates du parent
                let start = gristToDate(t.dateDebut), end = gristToDate(t.dateEcheance);
                if (isParent && !start && !end) { const agg = aggregateDates(t); start = gristToDate(agg.start); end = gristToDate(agg.end); }
                const jalon = isJalon(t);
                const progress = isParent ? aggregateProgress(t) : (t.progression || 0);
                const selected = t.id === selectedTaskId;
                const assignees = getAssigneesArray(t);
                const avatarsHtml = assignees.length ? '<div class="task-avatars">' + assignees.slice(0, 2).map(id => '<div class="task-avatar" style="background:' + getTeamMemberColor(id) + '">' + getInitials(getTeamMemberName(id)) + '</div>').join('') + (assignees.length > 2 ? '<div class="task-avatar more">+' + (assignees.length - 2) + '</div>' : '') + '</div>' : '';
                const subs = getSubtasks(t);
                const subsDone = subs.filter(s => s.done).length;
                const subBadge = subs.length ? '<span class="task-subtask-badge' + (subsDone === subs.length ? ' complete' : '') + '" title="Sous-tâches">◎ ' + subsDone + '/' + subs.length + '</span>' : '';
                const nChildren = getChildren(t.id).length;
                const childBadge = nChildren ? '<span class="task-subtask-badge" title="Sous-tâches structurelles">↳ ' + nChildren + '</span>' : '';

                const chevron = isParent
                    ? '<span class="tree-chevron' + (expandedTasks.has(t.id) ? ' expanded' : '') + '" onclick="event.stopPropagation();toggleExpand(' + t.id + ')" title="' + (expandedTasks.has(t.id) ? 'Replier' : 'Déplier') + '">▶</span>'
                    : '<span class="tree-chevron-placeholder"></span>';
                const indent = depth * 18;
                const classes = ['task-row', selected ? 'selected' : '', dimmed ? 'dimmed' : '', isParent ? 'parent' : ''].filter(Boolean).join(' ');

                html += '<div class="' + classes + '" data-id="' + t.id + '" onclick="openTaskPanel(' + t.id + ')" style="padding-left:' + (12 + indent) + 'px">' +
                    '<span class="drag-handle">☰</span>' +
                    chevron +
                    '<div class="task-priority-bar p' + p + '"></div>' +
                    '<div class="task-info">' +
                        '<div class="task-name">' + (jalon ? '◆ ' : '') + (escapeHtml(t.titre) || 'Sans titre') + '</div>' +
                        '<div class="task-meta">' +
                            '<span class="task-dates">' + (start && end ? formatDateShort(start) + ' → ' + formatDateShort(end) : start ? 'Dès le ' + formatDateShort(start) : end ? 'Jusqu\'au ' + formatDateShort(end) : 'Sans dates') + '</span>' +
                            (!jalon ? '<span class="task-progress-badge">' + progress + '%</span>' : '') +
                            subBadge +
                            childBadge +
                            avatarsHtml +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
            document.getElementById('taskList').innerHTML = html;

            // Sortable en mode manuel : autorisé uniquement au sein d'une fratrie (limite via check dans onEnd)
            if (sortMode === 'manual') {
                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = new Sortable(document.getElementById('taskList'), {
                    animation: 150, handle: '.drag-handle', ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen',
                    onEnd: (evt) => {
                        const id = parseInt(evt.item.dataset.id);
                        const movedTask = tasks.find(t => t.id === id);
                        if (!movedTask) return;
                        // Vérifier que le voisin visuel est dans la même fratrie, sinon annuler
                        const newSiblingId = parseInt(evt.item.nextElementSibling?.dataset.id || evt.item.previousElementSibling?.dataset.id);
                        const sibling = tasks.find(t => t.id === newSiblingId);
                        if (sibling && (sibling.parentTask || null) !== (movedTask.parentTask || null)) {
                            showToast('Le drag manuel est limité à la même fratrie', 'info');
                            render();
                            return;
                        }
                        const newIndex = evt.newIndex, oldIndex = evt.oldIndex;
                        if (newIndex !== oldIndex) {
                            const [moved] = tasks.splice(tasks.findIndex(t => t.id === id), 1);
                            tasks.splice(newIndex, 0, moved);
                            render();
                        }
                    }
                });
            }
        }

        function renderTimeline() {
            // WBS-02: utiliser currentVisible (ordre DFS) au lieu d'une liste plate filtrée
            const ft = currentVisible.map(v => v.task);
            const dimmedSet = new Set(currentVisible.filter(v => v.dimmed).map(v => v.task.id));
            const start = effectiveStart;
            const totalDays = effectiveDays;
            const cfg = VIEW_CONFIG[currentView];

            // Largeur totale depuis effectiveCellWidth (calculé dans computeEffectiveRange)
            let numCells, totalWidth;
            if (cfg.unit === 'quarter') {
                const effEnd = addDays(start, totalDays);
                const mois = (effEnd.getFullYear() - start.getFullYear()) * 12 + (effEnd.getMonth() - start.getMonth());
                numCells = Math.max(1, Math.ceil(mois / 3));
                totalWidth = numCells * effectiveCellWidth;
            } else if (cfg.unit === 'month') {
                const effEnd = addDays(start, totalDays);
                numCells = Math.max(1, (effEnd.getFullYear() - start.getFullYear()) * 12 + (effEnd.getMonth() - start.getMonth()));
                totalWidth = numCells * effectiveCellWidth;
            } else if (cfg.unit === 'week') {
                numCells = Math.ceil(totalDays / 7);
                totalWidth = numCells * effectiveCellWidth;
            } else {
                numCells = totalDays;
                totalWidth = totalDays * effectiveCellWidth;
            }
            // pxPerDay = effectivePxPerDay (déjà calculé depuis effectiveCellWidth)
            const pxPerDay = effectivePxPerDay;

            // Colonnes (jours, semaines, mois ou trimestres) dessinees UNE fois pour toute la hauteur ; les lignes ne portent
            // plus que leur trait horizontal. Evite lignes x jours elements quand la frise couvre toutes les taches.
            let colsHtml = '';
            if (cfg.unit === 'quarter') {
                // Une cellule de fond par trimestre : le fond doit suivre la graduation
                // de l'en-tete, sinon la grille se compte en jours et deborde.
                const effEnd = addDays(start, totalDays);
                let cur = new Date(start.getFullYear(), Math.floor(start.getMonth() / 3) * 3, 1);
                const maintenant = new Date();
                while (cur < effEnd) {
                    const finTrim = new Date(cur.getFullYear(), cur.getMonth() + 3, 1);
                    const estTrimCourant = maintenant >= cur && maintenant < finTrim;
                    colsHtml += '<div class="grid-cell ' + (estTrimCourant ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px"></div>';
                    cur = finTrim;
                }
            } else if (cfg.unit === 'month') {
                const effEnd = addDays(start, totalDays);
                let cur = new Date(start.getFullYear(), start.getMonth(), 1);
                while (cur < effEnd) {
                    const m = cur.getMonth();
                    const y = cur.getFullYear();
                    const isCurrentMonth = (new Date().getMonth() === m && new Date().getFullYear() === y);
                    colsHtml += '<div class="grid-cell ' + (isCurrentMonth ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px"></div>';
                    cur = new Date(y, m + 1, 1);
                }
            } else if (cfg.unit === 'week') {
                for (let i = 0; i < totalDays; i += 7) {
                    const d = addDays(start, i);
                    const isT = new Date() >= d && new Date() < addDays(d, 7);
                    colsHtml += '<div class="grid-cell ' + (isT ? 'today' : '') + '" style="width:' + effectiveCellWidth + 'px"></div>';
                }
            } else {
                for (let i = 0; i < totalDays; i++) {
                    const d = addDays(start, i);
                    const isWe = isWeekend(d);
                    const isT = isSameDay(d, new Date());
                    const isMonthStart = d.getDate() === 1;
                    colsHtml += '<div class="grid-cell ' + (isWe ? 'weekend ' : '') + (isT ? 'today ' : '') + (isMonthStart ? 'month-start' : '') + '" style="width:' + effectiveCellWidth + 'px"></div>';
                }
            }
            let gridHtml = '<div class="grid-cols">' + colsHtml + '</div>';
            ft.forEach(() => { gridHtml += '<div class="grid-row"></div>'; });

            const grid = document.getElementById('timelineGrid');
            grid.innerHTML = gridHtml;
            grid.style.width = totalWidth + 'px';
            grid.style.height = (ft.length * 44) + 'px';

            // Ligne aujourd'hui
            const today = new Date();
            const todayOffset = getDaysDiff(start, today);
            if (todayOffset >= 0 && todayOffset <= totalDays) {
                const todayLine = document.createElement('div');
                todayLine.className = 'today-line';
                todayLine.style.left = Math.round(dateToX(new Date(today.getFullYear(), today.getMonth(), today.getDate()))) + 'px';
                grid.appendChild(todayLine);
            }

            // Barres et jalons — ordre Y = currentVisible (DFS avec expand/collapse)
            ft.forEach((t, idx) => {
                const isParent = hasChildren(t);
                // Dates effectives : agrégées si parent sans dates propres, sinon dates du parent
                let tStart = gristToDate(t.dateDebut), tEnd = gristToDate(t.dateEcheance);
                if (isParent && (!tStart || !tEnd)) { const agg = aggregateDates(t); if (!tStart) tStart = gristToDate(agg.start); if (!tEnd) tEnd = gristToDate(agg.end); }
                if (!tStart && !tEnd) return;                // sans aucune date : pas de barre (la liste l'indique)
                if (!tStart) tStart = tEnd; else if (!tEnd) tEnd = tStart;   // une seule borne : barre d'un jour

                const p = getTaskPriority(t);
                const jalon = isJalon(t);
                const top = idx * 44 + 10;
                const left = Math.round(dateToX(tStart));
                const width = Math.max(Math.round(dateToX(addDays(tEnd, 1)) - left), 1);
                const selected = t.id === selectedTaskId;
                const dimmed = dimmedSet.has(t.id);

                if (left + width <= 0 || left >= totalWidth) return;   // entierement hors de la plage affichee : pas de barre (elle flottait au-dela de la frise)

                if (jalon) {
                    const m = document.createElement('div');
                    m.className = 'gantt-milestone p' + p + (selected ? ' selected' : '') + (dimmed ? ' dimmed' : '');
                    m.dataset.id = t.id;
                    m.style.left = Math.max(0, left + Math.round(pxPerDay / 2) - 7) + 'px';
                    m.style.top = top + 'px';
                    const jColor = getTaskColor(t);
                    m.innerHTML = '<div class="milestone-diamond" style="background:' + jColor + '"></div><span class="milestone-label">' + escapeHtml(t.titre) + '</span>';
                    m.onclick = () => openTaskPanel(t.id);
                    setupTooltip(m, t);
                    grid.appendChild(m);
                } else {
                    const bar = document.createElement('div');
                    const barLeft = Math.max(0, left);
                    const barWidth = Math.max(Math.min(left + width, totalWidth) - barLeft, 12);   // coupee aux bords de la frise
                    const isNarrow = barWidth < 60;
                    const progVal = isParent ? aggregateProgress(t) : (t.progression || 0);
                    bar.className = 'gantt-bar p' + p + (selected ? ' selected' : '') + (isNarrow ? ' narrow-bar' : '') + (isParent ? ' parent' : '') + (dimmed ? ' dimmed' : '');
                    bar.dataset.id = t.id;
                    bar.style.left = barLeft + 'px';
                    bar.style.top = top + 'px';
                    bar.style.width = barWidth + 'px';
                    bar.style.background = getTaskBarGradient(t);
                    bar.style.borderColor = getTaskColor(t);
                    bar.innerHTML = '<div class="gantt-bar-progress" style="width:' + progVal + '%"></div>' +
                        (isParent ? '' : '<div class="resize-handle left" onmousedown="startDrag(event, this.parentElement, \'resize-left\')"></div>') +
                        '<span class="gantt-bar-label" style="position:relative;z-index:1;">' + escapeHtml(t.titre) + '</span>' +
                        (isParent ? '' : '<div class="resize-handle right" onmousedown="startDrag(event, this.parentElement, \'resize-right\')"></div>') +
                        '<span class="gantt-bar-external-label">' + escapeHtml(t.titre) + '</span>';
                    bar.onclick = (e) => { if (!e.target.classList.contains('resize-handle')) openTaskPanel(t.id); };
                    bar.onmousedown = (e) => { if (!e.target.classList.contains('resize-handle')) startDrag(e, bar, 'move'); };
                    setupTooltip(bar, t);
                    grid.appendChild(bar);
                }
            });

            renderDependencies(ft, start, pxPerDay);
        }

        function renderDependencies(ft, start, pxPerDay) {
            const existing = document.querySelector('.dependencies-layer');
            if (existing) existing.remove();

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('dependencies-layer');
            svg.style.width = '100%';
            svg.style.height = '100%';

            const taskIndexMap = {};
            ft.forEach((t, i) => taskIndexMap[t.id] = i);

            ft.forEach(t => {
                const deps = getDependsOnArray(t);
                deps.forEach(depId => {
                    const depTask = tasks.find(x => x.id === depId);
                    if (!depTask || taskIndexMap[depId] === undefined) return;

                    const depEnd = gristToDate(depTask.dateEcheance);
                    const tStart = gristToDate(t.dateDebut);
                    if (!depEnd || !tStart) return;

                    const depIdx = taskIndexMap[depId];
                    const tIdx = taskIndexMap[t.id];

                    const x1 = dateToX(addDays(depEnd, 1));
                    const y1 = depIdx * 44 + 22;
                    const x2 = dateToX(tStart);
                    const y2 = tIdx * 44 + 22;

                    const highlight = selectedTaskId === t.id || selectedTaskId === depId;
                    const midX = (x1 + x2) / 2;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + midX + ',' + y1 + ' ' + midX + ',' + y2 + ' ' + x2 + ',' + y2);
                    path.classList.add('dependency-line');
                    if (highlight) path.classList.add('highlight');
                    svg.appendChild(path);

        function setupTooltip(el, task) {

            el.addEventListener('mouseenter', () => {

                TOOLTIP_FIELDS.forEach(field => {

                    if (value) html += '<div class="tooltip-row"><span>' + field.label + '</span><span>' + escapeHtml(String(value)) + '</span></div>';
                });
                tooltip.innerHTML = html;
                tooltip.classList.add('visible');
            });
            el.addEventListener('mousemove', (e) => { tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY + 15) + 'px'; });

        function syncScroll() {
            const taskList = document.getElementById('taskList');
            const timeline = document.getElementById('timelineScroll');
            const monthsHeader = document.getElementById('monthsHeader');
            const daysHeader = document.getElementById('daysHeader');

            if (alignOnRender && tasks.length) {
                alignOnRender = false;
                timeline.scrollLeft = Math.max(0, Math.round(dateToX(getViewStartDate())));
            }
            // Appliquer immédiatement la position de scroll courante (après chaque render)
            const initX = timeline.scrollLeft;
            monthsHeader.style.transform = 'translateX(-' + initX + 'px)';
            daysHeader.style.transform = 'translateX(-' + initX + 'px)';
            taskList.scrollTop = timeline.scrollTop;

            // Sync vertical scroll between task list and timeline
            taskList.onscroll = () => timeline.scrollTop = taskList.scrollTop;

            // Sync both vertical and horizontal scroll
            timeline.onscroll = () => {
                taskList.scrollTop = timeline.scrollTop;
                // Sync horizontal scroll with headers using transform
                const scrollX = timeline.scrollLeft;
                monthsHeader.style.transform = 'translateX(-' + scrollX + 'px)';
                daysHeader.style.transform = 'translateX(-' + scrollX + 'px)';
            };
        }

        function detachFromParent() { updateField('parentTask', null); }
        // WBS-05: ajuste les dates du parent aux bornes (min/max) de ses descendants
        async function adjustParentDatesToChildren() {
            const t = tasks.find(x => x.id === panelState.taskId);
            if (!t || !hasChildren(t)) return;
            const kids = getAllDescendants(t.id);
            let minS = null, maxE = null;
            for (const k of kids) {
                if (k.dateDebut != null && (minS == null || k.dateDebut < minS)) minS = k.dateDebut;
                if (k.dateEcheance != null && (maxE == null || k.dateEcheance > maxE)) maxE = k.dateEcheance;
            }
            if (minS == null || maxE == null) { showToast('Aucun descendant avec dates', 'info'); return; }
            t.dateDebut = minS; t.dateEcheance = maxE;
            if (panelState.editData) { panelState.editData.dateDebut = minS; panelState.editData.dateEcheance = maxE; }
            if (gristReady) {
                try { await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', t.id, { dateDebut: minS, dateEcheance: maxE }]]); showSaveIndicator(); }
                catch (e) { showToast('Erreur ajustement', 'error'); }
            }
            renderPanel(); render();
        }

        function updateCharge(memberId, value) {
            const data = panelState.editData; if (!data) return;
            if (!Array.isArray(data.charges)) data.charges = [];
            const h = Math.max(0, Number(value) || 0);
            const existing = data.charges.find(c => c.teamId === memberId);
            if (existing) existing.heures = h; else data.charges.push({ teamId: memberId, heures: h });
            syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanel();
        }
        function updateField(field, value, noSave) {
            const data = panelState.editData;
            if (!data) return;

            let datesFix = null;
            if (field === 'dateDebut' || field === 'dateEcheance') {
                value = value ? dateToGrist(TF.parseISODate(value)) : null;
                panelState.datesTouched = true;   // la sauvegarde decalera les taches dependantes
                datesFix = TF.datesPatch(data, field, value);
            }
            // dateCloture auto : posee au statut terminal, effacee si reouverture
            if (field === 'statut' || field === 'progression') Object.assign(data, TF.completionPatch(statusCfg, data, { [field]: value }));

            data[field] = value;
            if (datesFix) { Object.assign(data, datesFix.patch); showToast(datesFix.message, 'info'); }

            if (field === 'type' && value === 'jalon' && data.dateDebut) {
                data.dateEcheance = data.dateDebut;
            }

            // FIX: Synchroniser le task local pour affichage immédiat
            syncLocalTask();

            const visualFields = ['type', 'priorite', 'statut', 'projet', 'progression', 'dateDebut', 'dateEcheance', 'couleur', 'parentTask'];
            if (visualFields.includes(field)) {
                renderPanel();
                if (!panelState.isNew) render();
            }

            if (field === 'titre' && panelState.isNew) {
                const btn = document.querySelector('.panel-footer .panel-btn.success');
                if (btn) btn.disabled = !value || !value.trim();
            }

            if (!panelState.isNew && !noSave && gristReady) saveTaskToGrist();
        }

        function setProgressPreset(value) {
            const data = panelState.editData;
            if (!data) return;
            if (Object.keys(TF.completionPatch(statusCfg, data, { progression: value })).length) { updateField('progression', value); return; }
            data.progression = value;
            syncLocalTask();

            const slider = document.querySelector('.progress-slider');
            const valueSpan = document.getElementById('progressValue');
            const barFill = document.getElementById('progressBarFill');
            if (slider) slider.value = value;
            if (valueSpan) valueSpan.textContent = value + '%';
            if (barFill) barFill.style.width = value + '%';
            document.querySelectorAll('.progress-preset').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === value);
            });
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function setTodayDate() {
            const data = panelState.editData;
            if (!data) return;
            const today = new Date();
            today.setHours(12, 0, 0, 0);
            data.dateDebut = dateToGrist(today);
            if (data.type === 'jalon') data.dateEcheance = data.dateDebut;
            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
            render();
        }

        // Subtasks/Checklist
        function getSubtasks(task) {
            if (!task?.subtasks) return [];
            try { return JSON.parse(task.subtasks); } catch (e) { return []; }
        }
        function subtasksToJson(subtasks) {
            return JSON.stringify(subtasks || []);
        }
        function addSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;
            const data = panelState.editData;
            if (!data.subtasks) data.subtasks = [];
            data.subtasks.push({ id: Date.now(), text: text, done: false });
            input.value = '';
            updateSubtaskProgress();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
            render();
        }
        function toggleSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (st) {
                st.done = !st.done;
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }
        function removeSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const idx = data.subtasks.findIndex(s => s.id === id);
            if (idx !== -1) {
                data.subtasks.splice(idx, 1);
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }
        // Édite le texte d'un item de checklist (pas de renderPanel -> garde le focus dans l'input)
        function editSubtask(id, value) {
            const data = panelState.editData;
            if (!data || !data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (!st) return;
            const t = (value || '').trim();
            if (!t || t === st.text) return;
            st.text = t;
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }
        function updateSubtaskProgress() {
            const data = panelState.editData;
            if (!data.subtasks || data.subtasks.length === 0) return;
            const done = data.subtasks.filter(s => s.done).length;
            const total = data.subtasks.length;
            data.progression = Math.round((done / total) * 100);
            syncLocalTask();
        }

            if (e.key === 'Enter') { e.preventDefault(); addSubtask(); }

        function handleTagKeydown(e) {
