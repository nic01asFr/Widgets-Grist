/** Le réglage en cours dans l'écran : jamais écrit dans le formulaire, seulement dans les règles du document. */
function etatAcces() {
  S.acces = S.acces || { mode: 'ajout-seul', gestionnaires: '', defautRefus: false, existant: null, lu: false, message: '' };
  return S.acces;
}

function gestionnairesDe(texte) {
  return String(texte || '').split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
}

function renderAccesBloc() {
  const A = window.FormAcces;
  const def = S.currentDef;
  if (!A || !def) return '';
  const a = etatAcces();
  const plan = A.planRegles(def, { mode: a.mode, gestionnaires: gestionnairesDe(a.gestionnaires), defautRefus: a.defautRefus, public: a.public });
  const pose = a.existant ? A.modePose(def, a.existant) : null;
  // Les règles posées suivent-elles ce que le formulaire demande aujourd'hui ? Un maximum par choix ajouté après la pose
  // demande de lire de nouvelles colonnes : on le dit, et on met la liste à jour en place.
  const maj = (pose && A.actionsMiseAJour && plan.ok) ? A.actionsMiseAJour(plan.regles, a.existant) : null;
  const modes = Object.keys(A.MODES).map(k => `
    <div class="fr-radio-group"><input type="radio" id="acc-m-${k}" name="acces-mode" value="${k}" ${a.mode === k ? 'checked' : ''} onchange="App.onAcces('mode', '${k}')">
      <label class="fr-label" for="acc-m-${k}">${esc(A.MODES[k].libelle)}<span class="fr-hint-text">${esc(A.MODES[k].explication)}</span></label></div>`).join('');
  const regles = plan.regles.map(r => `<tr><td>${esc(r.tableId === '*' ? 'tout le reste' : r.tableId)}</td><td>${esc(r.colIds === '*' ? 'toutes' : r.colIds)}</td>
    <td><code>${esc(r.aclFormula || 'sinon')}</code></td><td><code>${esc(r.permissionsText)}</code></td></tr>`).join('');
  const peutPoser = plan.ok && plan.regles.length && !pose;
  return `
    <details class="fr-mt-3w" ${a.ouvert ? 'open' : ''} ontoggle="App.onAcces('ouvert', this.open)">
      <summary class="fr-label">Choisir ce que les participants lisent${pose ? ' — règles posées' : ''}</summary>
      <p class="fr-text--sm fr-mt-1w">Une page de formulaire est une page de votre document : <strong>celles et ceux qui la remplissent en sont éditeurs</strong> et voient tout ce que les
        règles d’accès ne leur cachent pas. Pour exposer le formulaire sans exposer les réponses, dites ici ce qu’ils peuvent lire. Une règle ne peut que retirer des droits :
        les participants doivent déjà être éditeurs (ou arriver par un lien public en édition). Pour des personnes qui n’ont pas de compte, préférez la page hors de Grist, plus bas.</p>
      ${pose ? (maj && maj.etat === 'en-place'
        ? `<div class="fr-alert fr-alert--warning"><p>Les colonnes lisibles par les participants ne sont plus celles que ce formulaire demande aujourd’hui
            (${maj.changements.map(c => `posé : <code>${esc(c.avant)}</code>, demandé : <code>${esc(c.apres)}</code>`).join(' ; ')}).
            Sans mise à jour, le formulaire ne peut pas compter les places ; avec elle, rien n’est retiré, le document n’est jamais sans protection.</p></div>`
        : `<div class="fr-alert fr-alert--info"><p>Des règles de ce formulaire sont posées dans le document (réglage : <strong>${esc(A.MODES[pose] ? A.MODES[pose].libelle : pose)}</strong>).
            ${maj && maj.etat === 'a-jour' ? 'Elles sont à jour.' : (maj && maj.etat === 'impossible' ? esc(maj.raison) + ' Retirez-les pour les changer.' : 'Retirez-les pour changer de réglage.')}</p></div>`) : ''}
      <fieldset class="fr-fieldset fr-mt-1w"><legend class="fr-label">Ce que lisent les participants</legend>${modes}</fieldset>
      <div class="fr-input-group"><label class="fr-label" for="acc-gest">Qui garde tous les droits, en plus des propriétaires du document (un courriel par ligne)
        ${hintIcon('Les propriétaires gardent toujours tous les droits. Ajoutez ici les personnes qui gèrent les réponses sans être propriétaires : sans cela, elles seraient traitées comme des participants.')}</label>
        <textarea class="fr-input" id="acc-gest" rows="2" oninput="App.onAcces('gestionnaires', this.value)">${esc(a.gestionnaires)}</textarea></div>
      <div class="fr-checkbox-group"><input type="checkbox" id="acc-public" ${a.public ? 'checked' : ''} onchange="App.onAcces('public', this.checked)">
        <label class="fr-label" for="acc-public">Le document est partagé avec le public, sans compte
          <span class="fr-hint-text">Une personne sans compte peut répondre (rôle Éditeur du public). Les règles d’accès sont alors la seule protection : « tout le reste caché » est imposé, et personne n’est identifié.</span></label></div>
      <div class="fr-checkbox-group"><input type="checkbox" id="acc-defaut" ${(a.defautRefus || a.public) ? 'checked' : ''} ${a.public ? 'disabled' : ''} onchange="App.onAcces('defautRefus', this.checked)">
        <label class="fr-label" for="acc-defaut">Cacher aussi le reste du document aux participants
          <span class="fr-hint-text">Sinon ils voient encore les autres tables et pages. À cocher si le document n’est partagé qu’avec eux ; à éviter si des collègues non propriétaires y travaillent.</span></label></div>
      ${plan.erreurs.length ? `<div class="fr-alert fr-alert--error fr-mt-1w"><p>${plan.erreurs.map(esc).join('<br>')}</p></div>` : ''}
      <h3 class="fr-h6 fr-mt-2w">Ce que cela change</h3>
      <ul class="fr-text--sm">${plan.resume.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      ${plan.avertissements.length ? `<div class="fr-alert fr-alert--warning"><p>${plan.avertissements.map(esc).join('<br>')}</p></div>` : ''}
      ${plan.regles.length ? `<details class="fr-mt-1w"><summary class="fr-text--sm">Voir les règles (pour les poser à la main dans « Règles d’accès » de Grist)</summary>
        <div class="fr-table fr-mt-1w"><table><thead><tr><th>Table</th><th>Colonnes</th><th>Condition</th><th>Droits</th></tr></thead><tbody>${regles}</tbody></table></div>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-mt-1w" onclick="App.accesCopier()">Copier les règles</button></details>` : ''}
      <div class="fr-mt-2w">
        <button type="button" class="fr-btn" ${peutPoser ? '' : 'disabled'} onclick="App.accesAppliquer()">Poser ces règles dans le document</button>
        ${maj && maj.etat === 'en-place' ? `<button type="button" class="fr-btn fr-ml-1w" onclick="App.accesMettreAJour()">Mettre à jour les règles</button>` : ''}
        ${pose ? `<button type="button" class="fr-btn fr-btn--secondary fr-ml-1w" onclick="App.accesRetirer()">Retirer les règles de ce formulaire</button>` : ''}
        <button type="button" class="fr-btn fr-btn--tertiary fr-ml-1w" onclick="App.accesLire()">${a.lu ? 'Relire les règles du document' : 'Lire les règles du document'}</button>
      </div>
      ${a.message ? `<p class="fr-text--sm fr-mt-1w" role="status">${esc(a.message)}</p>` : ''}
      <p class="fr-text--sm fr-mt-1w">Posées sur le document, ces règles s’appliquent à tout le monde, y compris à vous si vous n’êtes pas propriétaire : vérifiez-les avec un compte de participant.</p>
    </details>`;
}

function onAcces(cle, valeur) {
  const a = etatAcces();
  if (cle === 'ouvert') { a.ouvert = !!valeur; return; }
  a[cle] = valeur;
  if (cle === 'gestionnaires') return;   // la saisie ne redessine pas : le focus resterait perdu
  renderPublishStep();
}

/** Les règles qui existent déjà dans le document, lues sans rien modifier. */
async function accesLire() {
  const a = etatAcces();
  if (S.isDemo) { a.existant = { ressources: [], regles: [] }; a.lu = true; a.message = 'Mode démo : aucune règle à lire.'; renderPublishStep(); return; }
  try {
    const lignes = (donnees) => (window.FormLimites ? FormLimites.lignesDe(donnees) : []);
    const [res, regles] = await Promise.all([GristBridge.loadTable('_grist_ACLResources'), GristBridge.loadTable('_grist_ACLRules')]);
    const ressources = lignes(res).map(r => ({ id: r.id, tableId: r.tableId || '', colIds: r.colIds || '' }));
    const parRes = {}; ressources.forEach(r => { parRes[r.id] = r; });
    a.existant = {
      ressources: ressources,
      regles: lignes(regles).map(r => ({ id: r.id, resource: r.resource, rulePos: typeof r.rulePos === 'number' ? r.rulePos : null, memo: r.memo || '',
        aclFormula: r.aclFormula || '', permissionsText: r.permissionsText || '', tableId: (parRes[r.resource] || {}).tableId || '' }))
    };
    a.lu = true;
    a.message = 'Règles du document lues : ' + a.existant.regles.length + ' règle(s).';
  } catch (e) {
    a.existant = null; a.lu = false;
    a.message = 'Les règles du document n’ont pas pu être lues (' + ((e && e.message) || 'refusé') + '). Posez-les à la main avec « Voir les règles ».';
  }
  renderPublishStep();
}

async function accesAppliquer() {
  const A = window.FormAcces;
  const def = S.currentDef;
  const a = etatAcces();
  if (!A || !def) return;
  const plan = A.planRegles(def, { mode: a.mode, gestionnaires: gestionnairesDe(a.gestionnaires), defautRefus: a.defautRefus, public: a.public });
  if (!plan.ok || !plan.regles.length) return;
  if (!a.lu) { a.message = 'Lisez d’abord les règles du document : on ne pose rien sans savoir ce qui existe.'; renderPublishStep(); return; }
  const pose = A.actionsPose(plan.regles, a.existant);
  if (!pose.ok) { a.message = pose.erreurs.join(' '); renderPublishStep(); return; }
  const texte = 'Poser ces règles d’accès dans le document ?\n\n- ' + plan.resume.join('\n- ') +
    (plan.avertissements.length ? '\n\nÀ noter :\n- ' + plan.avertissements.join('\n- ') : '') +
    '\n\nElles s’appliquent aussitôt à tout le monde. Les propriétaires du document gardent tous les droits.';
  if (!confirm(texte)) return;
  if (S.isDemo) { a.message = 'Mode démo : ' + pose.actions.length + ' action(s) seraient appliquées ; rien n’est écrit.'; renderPublishStep(); return; }
  try {
    await GristBridge.applyUserActions(pose.actions);
    a.message = 'Règles posées (' + pose.actions.filter(x => x[1] === '_grist_ACLRules').length + ').' + (pose.infos && pose.infos.length ? ' ' + pose.infos.join(' ') : '');
    toast('Règles d’accès posées', 'success');
    await accesLire();
  } catch (e) {
    a.message = 'Échec : ' + ((e && e.message) || 'refusé') + '. Rien n’a été modifié ; posez les règles à la main avec « Voir les règles ».';
    toast(a.message, 'error');
    renderPublishStep();
  }
}

/** Changer en place les colonnes lisibles quand le formulaire a changé depuis la pose : rien n'est retiré. */
async function accesMettreAJour() {
  const A = window.FormAcces;
  const def = S.currentDef;
  const a = etatAcces();
  if (!A || !def || !a.existant) return;
  const plan = A.planRegles(def, { mode: a.mode, gestionnaires: gestionnairesDe(a.gestionnaires), defautRefus: a.defautRefus, public: a.public });
  if (!plan.ok) return;
  const maj = A.actionsMiseAJour(plan.regles, a.existant);
  if (maj.etat !== 'en-place') { a.message = maj.etat === 'a-jour' ? 'Les règles sont déjà à jour.' : (maj.raison || 'Rien à mettre à jour.'); renderPublishStep(); return; }
  const texte = 'Mettre à jour les règles d’accès de ce formulaire ?\n\nColonnes lisibles par les participants :\n- ' +
    maj.changements.map(c => 'posé : ' + c.avant + '\n  demandé : ' + c.apres).join('\n- ') +
    '\n\nSeule cette liste change : aucune règle n’est retirée, le document reste protégé pendant la mise à jour.';
  if (!confirm(texte)) return;
  if (S.isDemo) { a.message = 'Mode démo : ' + maj.actions.length + ' action(s) seraient appliquées ; rien n’est écrit.'; renderPublishStep(); return; }
  try {
    await GristBridge.applyUserActions(maj.actions);
    a.message = 'Règles mises à jour : ' + maj.changements.length + ' liste(s) de colonnes lisibles.';
    toast('Règles d’accès mises à jour', 'success');
    await accesLire();
  } catch (e) {
    a.message = 'Échec : ' + ((e && e.message) || 'refusé') + '. Rien n’a été modifié.';
    toast(a.message, 'error');
    renderPublishStep();
  }
}

async function accesRetirer() {
  const A = window.FormAcces;
  const def = S.currentDef;
  const a = etatAcces();
  if (!A || !def || !a.existant) return;
  const actions = A.actionsRetrait(def, a.existant);
  if (!actions.length) { a.message = 'Aucune règle de ce formulaire à retirer.'; renderPublishStep(); return; }
  if (!confirm('Retirer les règles d’accès posées pour ce formulaire ?\n\nLes participants retrouveront les droits que leur donne leur rôle dans le document (ils pourront de nouveau lire les réponses). Les autres règles du document ne sont pas touchées.')) return;
  if (S.isDemo) { a.message = 'Mode démo : ' + actions.length + ' action(s) seraient appliquées ; rien n’est écrit.'; renderPublishStep(); return; }
  try {
    await GristBridge.applyUserActions(actions);
    a.message = 'Règles retirées.';
    toast('Règles d’accès retirées', 'success');
    await accesLire();
  } catch (e) {
    a.message = 'Échec : ' + ((e && e.message) || 'refusé');
    toast(a.message, 'error');
    renderPublishStep();
  }
}

/** Les règles en texte, pour les poser à la main dans « Règles d’accès » de Grist. */
async function accesCopier() {
  const A = window.FormAcces;
  const a = etatAcces();
  const plan = A.planRegles(S.currentDef, { mode: a.mode, gestionnaires: gestionnairesDe(a.gestionnaires), defautRefus: a.defautRefus, public: a.public });
  const texte = plan.regles.map(r => [r.tableId === '*' ? 'Tout le reste' : r.tableId, 'colonnes : ' + (r.colIds === '*' ? 'toutes' : r.colIds),
    'si : ' + (r.aclFormula || '(sinon)'), 'droits : ' + r.permissionsText].join(' | ')).join('\n');
  try { await navigator.clipboard.writeText(texte); a.message = 'Règles copiées.'; }
  catch (e) { a.message = 'Copie impossible : sélectionnez le tableau des règles.'; }
  renderPublishStep();
}

// ═══════════════════════════════════════════════════════════
// Envoi depuis une page hors de Grist (voir docs/ENVOI-EXTERNE.md)
// ═══════════════════════════════════════════════════════════

/** Les colonnes déjà là pour la table des réponses et sa table de traitement. */
function existantExterne(def) {
  const tables = {};
  [def.tableId, def.tableId + '_Traitements'].forEach(function (id) {
    if (S.tables.some(t => t.tableId === id)) {
      tables[id] = (S.columnsByTable[id] || []).map(c => ({ id: c.colId, type: c.type }));
    }
  });
  return { tables: tables };
}

function renderExterneBloc() {
  const E = window.FormExterne;
  const def = S.currentDef;
  if (!E || !def) return '';
  const x = S.externe = S.externe || {};
  let plan = null;
  try { plan = E.planExterne(def, existantExterne(def)); } catch (e) { plan = null; }
  const guichet = E.lireAdresseFormulaire(x.adresse);
  const avertissements = plan ? plan.avertissements : [];
  const erreurs = plan && !plan.ok ? plan.errors : [];
  return `
    <details class="fr-mt-3w" ${x.ouvert ? 'open' : ''} ontoggle="App.externeOuvrir(this.open)">
      <summary class="fr-label">Préparer la page hors de Grist</summary>
      <div class="fr-alert fr-alert--warning fr-mt-1w"><p><strong>À savoir avant de l’ouvrir.</strong>
        Toute personne qui a la page peut envoyer, sans limite : Grist accepte la ligne, puis une colonne la juge (« Conforme »).
        Rien n’est refusé. Les pièces jointes, dessins et signatures ne peuvent pas partir depuis une page hors de Grist.
        Ce qui est collecté ainsi l’est sur une page publique : le dire est de votre responsabilité.</p></div>
      ${erreurs.length ? `<div class="fr-alert fr-alert--warning fr-mt-1w"><p><strong>À régler d’abord :</strong> ${erreurs.map(esc).join(' ')}</p></div>` : ''}
      ${avertissements.length ? `<div class="fr-alert fr-alert--info fr-mt-1w"><p>${avertissements.map(esc).join('<br>')}</p></div>` : ''}

      <h3 class="fr-h6 fr-mt-2w">1. Préparer la table</h3>
      <p class="fr-text--sm">Crée la table des réponses avec ses colonnes de tri (reçu, motifs, conformité), une table de traitement privée
        (statut, réponse, notes internes) et une page de formulaire natif. Le statut et les notes ne sont jamais dans la table que la page peut écrire.</p>
      <button class="fr-btn fr-btn--secondary" ${erreurs.length ? 'disabled' : ''} onclick="App.externePreparer()">Préparer la table et le formulaire natif</button>
      ${x.message ? `<p class="fr-text--sm fr-mt-1w" role="status">${esc(x.message)}</p>` : ''}

      <h3 class="fr-h6 fr-mt-2w">2. Publier le formulaire natif</h3>
      <p class="fr-text--sm">Dans Grist, ouvrez la page de formulaire créée sur ${def.tableId ? 'la table « ' + esc(def.tableId) + ' »' : 'la table des réponses'}, cliquez sur <strong>Publier</strong>,
        puis sur <strong>Partager</strong> et copiez le lien. La clé n’apparaît qu’à cet endroit, et Grist ne la donne à aucun programme.</p>

      <h3 class="fr-h6 fr-mt-2w">3. Coller le lien</h3>
      <div class="fr-input-group"><label class="fr-label" for="ext-adresse">Lien du formulaire publié</label>
        <input class="fr-input" id="ext-adresse" value="${esc(x.adresse || '')}" placeholder="https://…/forms/…/…"
          oninput="App.externeAdresse(this.value)"></div>
      <p class="fr-text--sm" id="ext-adresse-etat" role="status">${x.adresse ? (guichet ? 'Lien reconnu.' : 'Ce lien n’est pas celui d’un formulaire publié.') : ''}</p>

      <h3 class="fr-h6 fr-mt-2w">4. Générer la page</h3>
      <p class="fr-text--sm">Une page autonome, à déposer où vous voulez (un site, un dépôt). La clé y est écrite : elle ne permet qu’<em>ajouter</em> des lignes dans la table des réponses.
        Pour désigner un objet depuis un QR code, ajoutez le paramètre déclaré à l’adresse de la page (<code>?objet=123</code>).</p>
      <button class="fr-btn" id="ext-generer" data-erreurs="${erreurs.length ? '1' : '0'}" ${guichet && !erreurs.length ? '' : 'disabled'} onclick="App.externeGenerer()">Générer la page</button>
      ${x.page ? `<button class="fr-btn fr-btn--secondary fr-ml-1w" onclick="App.externeTelecharger()">Télécharger ${esc(x.nom)} (${Math.round(x.page.length / 1024)} Ko)</button>` : ''}
    </details>`;
}

function externeOuvrir(ouvert) {
  (S.externe = S.externe || {}).ouvert = !!ouvert;
}

function externeAdresse(valeur) {
  const x = S.externe = S.externe || {};
  x.adresse = String(valeur || '').trim();
  x.page = null;
  const etat = document.getElementById('ext-adresse-etat');
  const E = window.FormExterne;
  if (etat && E) etat.textContent = x.adresse ? (E.lireAdresseFormulaire(x.adresse) ? 'Lien reconnu.' : 'Ce lien n’est pas celui d’un formulaire publié.') : '';
  // Le bouton suit le lien sans attendre que l'écran soit redessiné.
  const gen = document.getElementById('ext-generer');
  if (gen && E) gen.disabled = !E.lireAdresseFormulaire(x.adresse) || gen.getAttribute('data-erreurs') === '1';
}

async function externePreparer() {
  const E = window.FormExterne;
  const def = S.currentDef;
  const x = S.externe = S.externe || {};
  if (!E || !def) return;
  try {
    const plan = E.planExterne(def, existantExterne(def));
    if (!plan.ok) { toast(plan.errors.join(' ; '), 'error'); return; }
    if (plan.avertissements.length &&
        !confirm('À noter :\n- ' + plan.avertissements.join('\n- ') + '\n\nContinuer ?')) return;
    if (S.isDemo) {
      x.message = 'Mode démo : ' + plan.actions.length + ' action(s) seraient appliquées ; rien n’est écrit.';
      toast(x.message, 'success');
      renderPublishStep();
      return;
    }
    await GristBridge.applyUserActions(plan.actions);
    await refreshTablesAfterSchemaChange();
    await applyVisibleColMeta(def);
    const table = S.tables.find(t => t.tableId === def.tableId);
    let formulaire = '';
    if (table && !x.formulaireCree) {
      await GristBridge.applyUserActions(E.actionsFormulaireNatif(table.id));
      x.formulaireCree = true;
      formulaire = ' Une page de formulaire natif a été créée.';
    }
    x.message = 'Table prête (' + plan.actions.length + ' action(s)).' + formulaire + ' Passez à l’étape 2.';
    toast('Table préparée', 'success');
    renderPublishStep();
  } catch (e) {
    x.message = 'Échec : ' + (e && e.message);
    toast(x.message, 'error');
    renderPublishStep();
  }
}

async function externeGenerer() {
  const E = window.FormExterne;
  const def = S.currentDef;
  const x = S.externe = S.externe || {};
  if (!E || !def) return;
  try {
    const [typesJs, sessionContextJs, carteJs, referentielJs, formatsJs, enrichirJs, saisiesJs, prefillJs, conditionsJs, limitesJs, themeJs, themeDefJs, engineJs, cssText] = await Promise.all([
      fetchScriptSource('shared/types.js'),
      fetchScriptSource('shared/session-context.js'),
      fetchScriptSource('shared/carte-geometrie.js'),
      fetchScriptSource('shared/referentiel.js'),
      fetchScriptSource('shared/formats.js'),
      fetchScriptSource('shared/enrichir.js'),
      fetchScriptSource('shared/saisies.js'),
      fetchScriptSource('shared/prefill.js'),
      fetchScriptSource('shared/conditions.js'),
      fetchScriptSource('shared/limites.js'),
      fetchScriptSource('shared/theme.js'),
      fetchScriptSource('shared/themedef.js'),
      fetchScriptSource('runtime/engine.js'),
      fetchScriptSource('shared/dsfr-like.css')
    ]);
    // Hors de Grist, il n'y a pas de document à lire : le thème du document, s'il y en a un et que le formulaire le suit, est figé
    // dans la page avec le formulaire (une copie du ThemeDef, jamais une adresse).
    let defExt = def;
    const T = window.FormThemeDef;
    if (T && ['document', 'grist'].indexOf(T.apparenceDe(def).mode) !== -1 && S.themeDocument && S.themeDocument.themedef) {
      defExt = Object.assign({}, def, { apparence: { mode: 'formulaire', themedef: S.themeDocument.themedef } });
    }
    x.page = E.buildExternalDocument(defExt,
      { typesJs, sessionContextJs, carteJs, referentielJs, formatsJs, enrichirJs, saisiesJs, prefillJs, conditionsJs, limitesJs, themeJs, themeDefJs, engineJs, cssText },
      { adresse: x.adresse });
    x.nom = (def.id || 'formulaire') + '.html';
    toast('Page générée', 'success');
    renderPublishStep();
  } catch (e) {
    toast('Échec de la génération : ' + (e && e.message), 'error');
  }
}

function externeTelecharger() {
  const x = S.externe || {};
  if (!x.page) return;
  const url = URL.createObjectURL(new Blob([x.page], { type: 'text/html;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = x.nom || 'formulaire.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function renderPublishLogEntries() {
  const box = document.getElementById('publish-log-entries');
  if (!box) return;
  box.innerHTML = S.publishLog.map(l => `<p class="fr-text--sm">${esc(l)}</p>`).join('');
}

function logPublish(msg) {
  S.publishLog.push(new Date().toLocaleTimeString('fr-FR') + ' — ' + msg);
  renderPublishLogEntries();
}

function fetchScriptSource(relPath) {
  return fetch(relPath).then(r => {
    if (!r.ok) throw new Error('Impossible de charger ' + relPath + ' (HTTP ' + r.status + ')');
    return r.text();
  });
}

function extractSectionRef(result) {
  if (result == null) return null;

  function fromVal(rv) {
    if (rv == null) return null;
    if (typeof rv === 'number' && !Number.isNaN(rv)) return rv;
    if (typeof rv === 'string' && /^\d+$/.test(rv)) return Number(rv);
    if (typeof rv === 'object') {
      if (typeof rv.sectionRef === 'number') return rv.sectionRef;
      if (typeof rv.viewSectionRef === 'number') return rv.viewSectionRef;
      if (typeof rv.id === 'number') return rv.id;
      if (Array.isArray(rv.viewSections) && rv.viewSections.length) {
        const vs = rv.viewSections[0];
        const nested = fromVal(vs);
        if (nested != null) return nested;
      }
    }
    return null;
  }

  let found = fromVal(result);
  if (found != null) return found;

  if (result.retValues != null) {
    const list = Array.isArray(result.retValues) ? result.retValues : [result.retValues];
    for (let i = 0; i < list.length; i++) {
      found = fromVal(list[i]);
      if (found != null) return found;
      if (Array.isArray(list[i])) {
        for (let j = 0; j < list[i].length; j++) {
          found = fromVal(list[i][j]);
          if (found != null) return found;
        }
      }
    }
  }

  function deepFind(obj, depth) {
    if (!obj || typeof obj !== 'object' || depth > 8) return null;
    if (typeof obj.sectionRef === 'number') return obj.sectionRef;
    if (typeof obj.viewSectionRef === 'number') return obj.viewSectionRef;
    if (Array.isArray(obj)) {
      for (let i = 0; i < obj.length; i++) {
        const n = deepFind(obj[i], depth + 1);
        if (n != null) return n;
      }
      return null;
    }
    const keys = Object.keys(obj);
    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      const v = obj[key];
      if (typeof v === 'number' && /sectionRef/i.test(key)) return v;
      const nested = deepFind(v, depth + 1);
      if (nested != null) return nested;
    }
    return null;
  }

  return deepFind(result, 0);
}

/**
 * La section de la page déjà publiée, si elle existe encore.
 *
 * Une page se supprime dans Grist sans rien dire au formulaire : on vérifie
 * avant de la réutiliser, et on en recrée une si elle a disparu.
 */
async function sectionPublieeValide(sectionRef) {
  const ref = Number(sectionRef);
  if (!Number.isFinite(ref) || ref <= 0) return null;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === ref);
    return s && s.parentKey === 'custom' ? ref : null;
  } catch (e) {
    return null;
  }
}

/**
 * La page porte le titre du formulaire.
 *
 * `CreateViewSection` ignore le nom qu'on lui passe — les pages s'appelaient
 * toutes « New page », et deux formulaires publiés devenaient indiscernables.
 */
async function nommerPagePubliee(sectionRef, nom) {
  if (!nom) return;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === sectionRef);
    if (!s || !s.parentId) return;
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views', s.parentId, { name: nom }],
      ['UpdateRecord', '_grist_Views_section', sectionRef, { title: nom }]
    ]);
  } catch (e) {
    logPublish('La page n’a pas pu être renommée : ' + (e && e.message));
  }
}

async function publishForm() {
  const def = S.currentDef;
  if (!def) return;
  try {
    logPublish('Enregistrement du formulaire avant publication…');
    await saveForm();
    renderPublishStep();

    if (S.isDemo) {
      logPublish('Mode démo : publication simulée (aucune écriture Grist).');
      toast('Publication simulée (mode démo)', 'success');
      return;
    }

    logPublish('Construction du bundle runtime (bridge + types + attachments + session-context + carte + dessin + referentiel + formats + enrichir + saisies + conditions + limites + thème du document + engine + CSS)…');
    const [bridgeJs, typesJs, attachmentsJs, sessionContextJs, carteJs, dessinJs, referentielJs, formatsJs, enrichirJs, saisiesJs, conditionsJs, limitesJs, themeJs, themeDefJs, engineJs, cssText] =
      await Promise.all([
      fetchScriptSource('shared/grist-bridge.js'),
      fetchScriptSource('shared/types.js'),
      fetchScriptSource('shared/attachments.js'),
      fetchScriptSource('shared/session-context.js'),
      fetchScriptSource('shared/carte-geometrie.js'),
      fetchScriptSource('shared/dessin.js'),
      fetchScriptSource('shared/referentiel.js'),
      fetchScriptSource('shared/formats.js'),
      fetchScriptSource('shared/enrichir.js'),
      fetchScriptSource('shared/saisies.js'),
      fetchScriptSource('shared/conditions.js'),
      fetchScriptSource('shared/limites.js'),
      fetchScriptSource('shared/theme.js'),
      fetchScriptSource('shared/themedef.js'),
      fetchScriptSource('runtime/engine.js'),
      fetch('shared/dsfr-like.css').then(function (r) {
        if (!r.ok) throw new Error('Impossible de charger dsfr-like.css (' + r.status + ')');
        return r.text();
      })
    ]);
    const fullHtml = Publish.buildRuntimeDocument(def,
      { bridgeJs, typesJs, attachmentsJs, sessionContextJs, carteJs, dessinJs, referentielJs, formatsJs, enrichirJs, saisiesJs, conditionsJs, limitesJs, themeJs, themeDefJs, engineJs, cssText,
        // Le hook d'essai de bout en bout n'est embarque que pour un essai demande (?e2e=1), jamais en production.
        e2e: /([?&])e2e=1(?:&|$)/.test(location.search || '') });
    const { html, js } = Publish.splitHtmlJs(fullHtml);
    const optionsStr = Publish.buildCustomViewOptions({ html, js });

    const tableRow = S.tables.find(t => t.tableId === def.tableId);
    if (!tableRow) throw new Error('Table cible introuvable : ' + def.tableId);

    // Remettre en ligne REMPLACE le formulaire figé sur la page déjà publiée,
    // comme l'écran le promet. Créer une page de plus laissait l'ancienne en
    // service avec l'ancienne version, sans que rien ne le dise.
    const pageNom = def.title || def.id;
    const rowPub = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    let sectionRef = await sectionPublieeValide(rowPub && rowPub.PublishedSectionRef);
    if (sectionRef) {
      logPublish('Page déjà publiée (section ' + sectionRef + ') : remplacement du formulaire figé…');
    } else {
      logPublish('Création de la page « ' + pageNom + ' »…');
      const createRes = await GristBridge.applyUserActions(Publish.planCreateCustomPage(tableRow.id, pageNom));
      sectionRef = extractSectionRef(createRes);
      if (!sectionRef) throw new Error('Impossible de déterminer la section créée (réponse CreateViewSection inattendue)');
    }

    logPublish('Application du snapshot figé (_html/_js) sur la section ' + sectionRef + '…');
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views_section', sectionRef, { options: optionsStr }]
    ]);
    await nommerPagePubliee(sectionRef, pageNom);

    const row = S.forms.find(r => r.id === S.currentRowId);
    const nextVersion = (row ? row.Version : 0) + 1;
    await GristBridge.updateRow('Formulaires', S.currentRowId, {
      Version: nextVersion,
      Statut: 'publie',
      PublishedSectionRef: sectionRef,
      UpdatedAt: GristBridge.util.fromDate(new Date())
    });
    await loadFormulaires();

    logPublish('Publication terminée (version ' + nextVersion + ').');
    toast('Formulaire publié', 'success');
    renderPublishStep();
  } catch (e) {
    logPublish('Erreur : ' + (e && e.message));
    toast('Échec de la publication : ' + (e && e.message), 'error');
    renderPublishStep();
  }
}

/**
 * Le harnais d'essai se charge a la demande, et seulement a la demande.
 *
 * Il ouvre une porte — des actions declenchees par un message du parent — qui
 * n'a rien a faire dans un formulaire en service. Elle ne s'ouvre que sur
 * `?e2e=1`, et le fichier ne pese plus sur les autres chargements.
 */
(function chargerHarnaisDEssai() {
  var demande = false;
  try { demande = /([?&])e2e=1(?:&|$)/.test(location.search || ''); } catch (e) { return; }
  if (!demande) return;
  var s = document.createElement('script');
  s.src = 'tests/e2e-hook.js';
  s.async = false;
  document.body.appendChild(s);
}());
