<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Builder — essence formulaires Grist</title>
<link rel="stylesheet" href="shared/dsfr-like.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  /* Une seule barre : étapes à gauche, état de la connexion à droite. */
  .app-bar {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.4rem 0.9rem;
    background: #fff;
    border-bottom: 1px solid var(--grey-925, #e5e5e5);
    position: sticky; top: 0; z-index: 10;
  }
  #steps { display: flex; gap: 0.25rem; flex: 1 1 auto; flex-wrap: wrap; min-width: 0; }
  /* Les étapes sont un sélecteur segmenté, pas quatre gros boutons. */
  #steps .fr-btn {
    border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.85rem; font-weight: 500;
    background: transparent; color: var(--grey-200, #3a3a3a); border: 1px solid transparent;
    box-shadow: none; min-height: 0;
  }
  #steps .fr-btn:hover { background: var(--grey-975, #f3f3fb); }
  #steps .fr-btn.is-active {
    background: var(--blue-france, #000091);
    color: #fff;
    border-color: var(--blue-france, #000091);
  }
  .app-bar__etat {
    font-size: 0.75rem; color: var(--grey-400, #666); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 0.35rem;
  }
  .app-bar__etat::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--grey-700, #999);
  }
  .app-bar__etat.est-connecte::before { background: #18753c; }
  .app-bar__etat.est-demo::before { background: #b34000; }
  /* Le menu : un seul point d'entrée pour voir, exporter, régler. */
  .app-menu { position: relative; }
  .app-menu > summary {
    list-style: none; cursor: pointer; border-radius: 6px;
    padding: 0.15rem 0.5rem; font-size: 1.1rem; line-height: 1.4;
    color: var(--grey-200, #3a3a3a); border: 1px solid transparent;
  }
  .app-menu > summary::-webkit-details-marker { display: none; }
  .app-menu > summary:hover { background: var(--grey-975, #f3f3fb); }
  .app-menu[open] > summary { background: var(--grey-975, #f3f3fb); border-color: var(--grey-925, #e5e5e5); }
  .app-menu__panneau {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
    width: min(26rem, calc(100vw - 1.5rem));
    max-height: min(70vh, 32rem); overflow: auto;
    background: #fff; border: 1px solid var(--grey-925, #e5e5e5); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(22, 22, 22, 0.12);
    padding: 0.75rem 0.9rem;
  }
  .app-menu__titre {
    font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--grey-400, #666); margin: 0.7rem 0 0.35rem;
  }
  .app-menu__titre:first-child { margin-top: 0; }
  .app-menu__lignes { display: flex; flex-direction: column; gap: 0.3rem; }
  .app-menu__action {
    font: inherit; font-size: 0.86rem; text-align: left; cursor: pointer;
    padding: 0.4rem 0.55rem; border-radius: 5px;
    background: transparent; border: 1px solid transparent; color: var(--grey-100, #1e1e1e);
  }
  .app-menu__action:hover { background: var(--grey-975, #f3f3fb); border-color: var(--grey-925, #e5e5e5); }
  .app-menu__action[disabled] { opacity: 0.45; cursor: default; }
  .app-menu__note { font-size: 0.78rem; color: var(--grey-400, #666); margin: 0.2rem 0 0; }
  .app-menu pre {
    max-height: 16rem; overflow: auto; font-size: 0.72rem; line-height: 1.5;
    background: var(--grey-975, #f6f6f6); padding: 0.6rem; border-radius: 5px; margin: 0.3rem 0 0;
  }
  @media (max-width: 36rem) {
    .app-bar { flex-wrap: wrap; }
    .app-bar__etat { order: -1; }
  }
  /* Pleine largeur : le widget occupe le panneau que Grist lui donne. Les
     écrans qui ne sont pas l'atelier gardent une colonne de lecture. */
  .app-main { padding: 0.7rem; }
  .builder-step { max-width: 64rem; margin-inline: auto; }

  /* Mes formulaires : des cartes qui remplissent la largeur, pas cinq colonnes
     etroites. On reconnait son questionnaire a son nom et a ce qu'il demande. */
  .form-cartes {
    display: grid; gap: 0.8rem;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
  }
  .form-carte {
    font: inherit; text-align: left; cursor: pointer; color: inherit;
    display: flex; flex-direction: column; gap: 0.3rem;
    padding: 0.9rem 1rem; border: 1px solid var(--grey-925, #e5e5e5);
    border-radius: 10px; background: var(--fond-carte, #fff);
  }
  .form-carte:hover { border-color: var(--blue-france, #000091); }
  .form-carte__tete { display: flex; align-items: center; gap: 0.5rem; }
  .form-carte__version { font-size: 0.74rem; color: var(--encre-douce, #666); }
  .form-carte__nom { font-size: 1.05rem; font-weight: 600; }
  .form-carte__detail { font-size: 0.84rem; color: var(--encre-douce, #666); }
  .form-carte__table { font-size: 0.8rem; color: var(--encre-douce, #666); }
  .form-carte__note { font-size: 0.78rem; color: var(--orange, #b34000); }

  /* Une modale pour ce qui se regarde sans quitter ce qu'on fait. */
  .modale {
    border: none; border-radius: 12px; padding: 0; max-width: min(58rem, 92vw);
    width: 100%; max-height: 86vh; background: var(--fond-carte, #fff); color: inherit;
  }
  .modale::backdrop { background: rgba(0, 0, 18, 0.35); }
  .modale__tete {
    display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.1rem;
    border-bottom: 1px solid var(--grey-925, #e5e5e5); position: sticky; top: 0;
    background: var(--fond-carte, #fff);
  }
  .modale__titre { margin: 0; font-size: 1.05rem; flex: 1 1 auto; }
  .modale__fermer {
    font: inherit; font-size: 1rem; cursor: pointer; width: 2.2rem; height: 2.2rem;
    border: 1px solid var(--grey-925, #e5e5e5); border-radius: 6px; background: transparent; color: inherit;
  }
  .modale__corps { padding: 1rem 1.1rem 1.4rem; overflow: auto; max-height: calc(86vh - 4rem); }

  /* Le plan : toutes les etapes, toutes les questions, en colonnes. */
  .plan__grille {
    display: grid; gap: 1rem; margin-top: 0.6rem;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
  }
  .plan__etape { display: flex; flex-direction: column; gap: 2px; }
  .plan__etape-titre {
    margin: 0 0 0.3rem; font-size: 0.86rem; display: flex; align-items: center; gap: 0.4rem;
    padding-bottom: 0.25rem; border-bottom: 1px solid var(--grey-925, #e5e5e5);
  }
  .plan__compte { font-size: 0.74rem; color: var(--encre-douce, #666); margin-left: auto; }
  .plan__question {
    font: inherit; text-align: left; cursor: pointer; color: inherit; width: 100%;
    display: flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.4rem;
    border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 0.82rem;
  }
  .plan__question:hover { background: var(--grey-975, #f6f6f6); border-color: var(--grey-925, #e5e5e5); }
  .plan__rang { font-size: 0.72rem; color: var(--encre-douce, #666); flex: 0 0 1.1rem; font-variant-numeric: tabular-nums; }
  .plan__intitule { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan__nature { font-size: 0.72rem; color: var(--encre-douce, #666); flex: 0 0 auto; }
  .plan__souci {
    flex: 0 0 auto; width: 1.1rem; height: 1.1rem; border-radius: 999px;
    background: var(--orange, #b34000); color: #fff; font-size: 0.7rem;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* L'apercu : une scene, et dedans l'ecran qu'on veut voir. */
  .apercu-barre { display: flex; align-items: center; gap: 0.6rem; }
  .apercu-largeur { display: inline-flex; border: 1px solid var(--grey-925, #e5e5e5); border-radius: 999px; overflow: hidden; }
  .apercu-largeur__bouton {
    font: inherit; font-size: 0.82rem; cursor: pointer; padding: 0.35rem 0.9rem;
    border: none; background: transparent; color: var(--encre-douce, #666);
  }
  .apercu-largeur__bouton.est-actif { background: var(--blue-france, #000091); color: #fff; }
  .apercu-scene { background: var(--grey-975, #f6f6f6); border-radius: 12px; padding: 1rem; }
  .apercu-scene--telephone .preview-frame {
    max-width: 24rem; margin-inline: auto; background: var(--fond-carte, #fff);
    border: 1px solid var(--grey-925, #e5e5e5); border-radius: 14px; padding: 0.9rem;
  }
  .apercu-scene--ordinateur .preview-frame {
    max-width: 48rem; margin-inline: auto; background: var(--fond-carte, #fff);
    border: 1px solid var(--grey-925, #e5e5e5); border-radius: 10px; padding: 1.4rem 1.8rem;
  }
  #builder.builder-step { max-width: none; padding: 0; border: none; background: none; }

  /* Le panneau d'une question : des blocs, et ce qu'ils permettent en une phrase. */
  .panneau__fil {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.8rem; color: var(--encre-douce, #666);
    border-bottom: 1px solid var(--grey-950, #eee); padding-bottom: 0.5rem; margin-bottom: 0.9rem;
  }
  .panneau__fil-espace { flex: 1 1 auto; }
  .panneau__nav {
    font: inherit; font-size: 1rem; line-height: 1; cursor: pointer;
    border: 1px solid var(--grey-925, #e5e5e5); background: transparent; color: inherit;
    border-radius: 5px; padding: 0.15rem 0.5rem;
  }
  .panneau__nav[disabled] { opacity: 0.35; cursor: default; }
  .bloc { border-top: 1px solid var(--grey-950, #eee); padding-top: 0.9rem; margin-top: 0.9rem; }
  .bloc:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .bloc__titre {
    font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--encre-douce, #666); margin: 0 0 0.6rem; display: flex; align-items: center; gap: 0.4rem;
  }
  .bloc__intitule {
    font-size: 0.8125rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--encre-douce);
    margin: 1.25rem 0 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--bord);
  }
  .bloc__intitule span { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .encart-edit { border: 1px solid var(--bord); border-radius: 4px; padding: 0.75rem; margin-bottom: 0.5rem; }
  .bloc__duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.75rem; }
  .structure__marque { font-size: 0.7rem; color: var(--blue-france, #000091); flex: 0 0 auto; }
  .rail__etape.est-actif .structure__marque, .champ-bloc.est-ouvert .structure__marque { color: inherit; }

  /* ── L'atelier : structure | question | aperçu ─────────────────────────
     Mesuré avant : 34 357 px de haut, 45 écrans, 709 contrôles d'un coup.
     Les trois zones défilent chacune pour elle-même ; sur écran étroit, elles
     s'empilent et la structure passe devant. */
  .atelier {
    display: grid;
    grid-template-columns: 14rem minmax(0, 1fr) 24rem;
    gap: 1px;
    background: var(--grey-925, #e5e5e5);
    border: 1px solid var(--grey-925, #e5e5e5);
    border-radius: 8px;
    overflow: hidden;
    /* Hauteur fixe : ce sont les zones qui défilent, pas la page. Sans quoi
       la colonne centrale rallonge l'écran et on perd le bénéfice. */
    height: calc(100vh - 8.5rem);
  }
  .atelier > * { background: var(--fond-carte, #fff); min-width: 0; overflow: auto; }
  .atelier__structure { padding: 0.6rem; display: flex; flex-direction: column; gap: 1px; }
  .atelier__question { padding: 1rem 1.1rem; }
  .atelier__titre { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
                    color: var(--encre-douce, #666); margin: 0 0 0.75rem; font-weight: 600; }
  .atelier__apercu { display: flex; flex-direction: column; }
  .atelier__apercu-tete {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--grey-950, #eee);
    font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--encre-douce, #666);
  }
  .atelier__apercu-cadre { padding: 0.8rem; font-size: 0.92rem; }
  .atelier__apercu-cadre .fr-form { max-width: none; }
  .atelier__apercu-cadre .fr-form__actions { position: static; background: none; }

  /* Où partent les réponses : au pied du parcours, visible sans ouvrir de menu. */
  .rail__pied { margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--grey-950, #eee); font-size: 0.82rem; }
  .rail__pied .fr-input, .rail__pied .fr-select { font-size: 0.82rem; padding: 0.3rem 0.4rem; }

  /* Les options d'une question liée : celles de la colonne, montrées telles quelles. */
  .options-liees { margin-bottom: 1rem; }
  .options-liees__liste {
    list-style: none; margin: 0.3rem 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.3rem;
  }
  .options-liees__liste li {
    font-size: 0.82rem; padding: 0.15rem 0.55rem; border-radius: 999px;
    background: var(--grey-975, #f6f6f6); border: 1px solid var(--grey-925, #e5e5e5);
  }

  /* ── Rail · canevas · inspecteur ────────────────────────────────────────
     Trois colonnes stables : le parcours, le formulaire tel qu'il sera vu, et
     ce qu'on règle. Ouvrir un réglage ne déplace plus ce qu'on regarde. */
  .atelier3 {
    display: grid; grid-template-columns: 13.5rem minmax(0, 1fr) 27rem;
    gap: 1px; background: var(--grey-925, #e5e5e5);
    border: 1px solid var(--grey-925, #e5e5e5); border-radius: 8px; overflow: hidden;
    height: calc(100vh - 7.5rem);
  }
  .atelier3 > * { background: var(--fond-carte, #fff); min-width: 0; overflow: auto; }

  .rail { padding: 0 0.5rem 0.5rem; display: flex; flex-direction: column; gap: 1px; }
  .rail .colonne__role { margin: 0 -0.5rem 0.4rem; }
  .rail__etapes { display: flex; flex-direction: column; gap: 1px; }
  .rail__etape, .rail__bout, .rail__ajout {
    font: inherit; text-align: left; width: 100%; cursor: pointer; color: inherit;
    display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.5rem;
    border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 0.86rem;
  }
  .rail__bout { font-weight: 600; color: var(--encre-douce, #666); }
  .rail__ajout { color: var(--encre-douce, #666); font-size: 0.8rem; }
  .rail__etape:hover, .rail__bout:hover, .rail__ajout:hover { background: var(--grey-975, #f6f6f6); }
  .rail__etape.est-actif, .rail__bout.est-actif {
    background: var(--blue-france, #000091); color: #fff; border-color: var(--blue-france, #000091);
  }
  .rail__rang {
    font-size: 0.74rem; font-variant-numeric: tabular-nums; flex: 0 0 auto;
    background: var(--grey-950, #eee); border-radius: 999px; padding: 0 0.35rem; color: var(--grey-425, #3a3a3a);
  }
  .rail__etape.est-actif .rail__rang { background: rgba(255,255,255,0.25); color: #fff; }
  .rail__nom { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail__compte, .rail__chemin { font-size: 0.72rem; opacity: 0.7; flex: 0 0 auto; }

  .inspecteur { display: flex; flex-direction: column; }
  .inspecteur .colonne__role { padding-bottom: 0.35rem; border-bottom: none; }
  .inspecteur__onglets { display: flex; gap: 2px; padding: 0.4rem 0.5rem 0; border-bottom: 1px solid var(--grey-950, #eee); }
  .inspecteur__onglet {
    font: inherit; font-size: 0.82rem; cursor: pointer; padding: 0.3rem 0.7rem;
    border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0;
    background: transparent; color: var(--encre-douce, #666);
  }
  .inspecteur__onglet.est-actif { background: var(--grey-975, #f6f6f6); color: var(--blue-france, #000091); font-weight: 600; }
  .inspecteur__corps { flex: 1 1 auto; overflow: auto; padding: 0.8rem 0.9rem; }

  .controle { display: flex; flex-direction: column; gap: 2px; }
  .controle--ok { color: var(--success, #18753c); }
  .controle__tete { font-size: 0.86rem; font-weight: 600; color: var(--warning, #b34000); margin: 0 0 0.4rem; }
  .controle__ligne {
    font: inherit; text-align: left; cursor: pointer; border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: inherit; padding: 0.4rem 0.5rem; display: flex; flex-direction: column; gap: 2px;
  }
  .controle__ligne:hover { background: var(--grey-975, #f6f6f6); border-color: var(--grey-925, #e5e5e5); }
  .controle__ou { font-size: 0.74rem; color: var(--encre-douce, #666); }
  .controle__quoi { font-size: 0.84rem; }

  /* Le canevas occupe sa colonne : la page garde sa largeur de lecture, centrée. */
  .canevas { padding: 0; background: var(--grey-975, #f6f6f6); }
  .canevas__page {
    max-width: 42rem; margin: 0 1rem 1rem;
    background: var(--fond-carte, #fff); border: 1px solid var(--grey-925, #e5e5e5);
    border-radius: 10px; padding: 1.2rem 1.4rem;
  }

  /* ── À quoi sert chaque colonne, dit en un mot ───────────────────────────
     « Étape 1 » s'affichait trois fois, du même poids, sans qu'on sache
     laquelle agissait. Chaque colonne annonce désormais son rôle, et seule
     celle des réglages nomme le sujet sur lequel on agit. */
  .colonne__role {
    position: sticky; top: 0; z-index: 2; margin: 0;
    padding: 0.45rem 0.9rem; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--encre-douce, #666);
    background: var(--grey-975, #f6f6f6); border-bottom: 1px solid var(--grey-925, #e5e5e5);
  }
  .colonne__sujet {
    font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--grey-425, #3a3a3a);
  }
  /* Un libellé long ne doit pas repousser les onglets : il se coupe. */
  .colonne__role { display: flex; gap: 0.4rem; align-items: baseline; white-space: nowrap; }
  .colonne__sujet { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rail { background: var(--grey-990, #fafafa); }
  .canevas__titre-public { font-size: 1.3rem; margin: 0; }
  .section-card__retirer { margin-top: 0.6rem; color: var(--rouge, #ce0500); font-size: 0.84rem; }

  @media (max-width: 78rem) {
    .atelier3 { grid-template-columns: 12rem minmax(0, 1fr); }
    .inspecteur { grid-column: 1 / -1; max-height: 26rem; }
  }
  @media (max-width: 48rem) {
    .atelier3 { grid-template-columns: 1fr; height: auto; }
    .rail { max-height: 11rem; }
  }

  /* ── Les étapes en barre, le canevas en dessous ─────────────────────────
     Une étape est ce que le public verra sur un écran : la barre dit le
     parcours, le canevas montre l'écran choisi. */
  .barre-etapes {
    display: flex; align-items: center; gap: 0.35rem;
    padding: 0.5rem 0.2rem; position: sticky; top: 2.75rem; z-index: 6;
    background: var(--fond-page, #f6f6f6);
  }
  .barre-etapes__defile {
    display: flex; gap: 0.35rem; overflow-x: auto; flex: 1 1 auto;
    scrollbar-width: thin; padding-bottom: 2px;
  }
  .pastille {
    font: inherit; font-size: 0.82rem; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.3rem 0.6rem; border-radius: 999px;
    border: 1px solid var(--grey-925, #e5e5e5); background: var(--fond-carte, #fff); color: inherit;
    max-width: 14rem;
  }
  .pastille:hover { border-color: var(--blue-france, #000091); }
  .pastille.est-actif { background: var(--blue-france, #000091); border-color: var(--blue-france, #000091); color: #fff; }
  .pastille__rang {
    font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.74rem;
    background: var(--grey-950, #eee); border-radius: 999px; padding: 0 0.35rem; color: var(--grey-425, #3a3a3a);
  }
  .pastille.est-actif .pastille__rang { background: rgba(255,255,255,0.25); color: #fff; }
  .pastille__nom { overflow: hidden; text-overflow: ellipsis; }
  .pastille__compte, .pastille__chemin { font-size: 0.72rem; opacity: 0.75; }
  .pastille--bout, .pastille--ajout { flex: 0 0 auto; }
  .pastille--ajout { font-size: 1rem; line-height: 1; padding: 0.25rem 0.6rem; }

  .canevas { padding: 0.2rem 0 1rem; }
  .canevas__page {
    /* La page garde une colonne de lecture : c'est ainsi que le public la verra.
       La largeur en trop sert aux réglages, posés à côté du champ ouvert. */
    max-width: 52rem; margin-inline: auto;
    background: var(--fond-carte, #fff); border: 1px solid var(--grey-925, #e5e5e5);
    border-radius: 10px; padding: 1.2rem 1.4rem;
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  .canevas__entete { border-bottom: 1px solid var(--grey-950, #eee); padding-bottom: 0.6rem; }
  .canevas__role { font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--encre-douce, #666); }
  .canevas__public { padding: 0.5rem 0; }
  .canevas__public .fr-form__header { margin-bottom: 0; }
  .canevas__titre {
    font: inherit; font-size: 1.25rem; font-weight: 600; cursor: pointer;
    background: none; border: none; color: inherit; padding: 0;
  }
  .canevas__titre.est-actif { color: var(--blue-france, #000091); }
  .canevas__consigne { font-size: 0.92rem; color: var(--encre-douce, #666); margin: 0.2rem 0 0; }
  .canevas__matrice { font-size: 0.78rem; color: var(--blue-france, #000091); margin: 0.4rem 0 -0.2rem; }

  /* Un champ : vu comme le public le verra, configurable sur place. */
  .champ-bloc {
    border: 1px solid transparent; border-radius: 8px; padding: 0.5rem 0.6rem;
    position: relative; background: var(--fond-carte, #fff);
  }
  .champ-bloc:hover { border-color: var(--grey-925, #e5e5e5); }
  .champ-bloc.est-ouvert { border-color: var(--blue-france, #000091); background: var(--grey-975, #f6f6f6); }
  .champ-bloc__barre {
    display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem;
    color: var(--encre-douce, #666); margin-bottom: 0.3rem;
  }
  .champ-bloc__rang {
    font-variant-numeric: tabular-nums; background: var(--grey-950, #eee);
    border-radius: 999px; padding: 0 0.35rem;
  }
  .champ-bloc__espace { flex: 1 1 auto; }
  .champ-bloc__action {
    font: inherit; cursor: pointer; border: 1px solid transparent; background: transparent;
    border-radius: 5px; padding: 0.1rem 0.4rem; color: var(--encre-douce, #666);
  }
  .champ-bloc__action:hover { border-color: var(--grey-900, #ddd); background: var(--grey-975, #f6f6f6); }
  /* Le rendu est une image de ce que verra le public : on ne saisit pas dedans. */
  .champ-bloc__rendu { pointer-events: none; user-select: none; }
  .champ-bloc__rendu .fr-form__actions { display: none; }
  .champ-bloc__reglages {
    margin-top: 0.6rem; border-top: 1px solid var(--grey-900, #ddd); padding-top: 0.7rem;
  }
  /* Assez large : les réglages se posent à côté du champ, qui reste à sa place.
     La page s'élargit juste le temps qu'une question soit ouverte. */
  @media (min-width: 76rem) {
    .canevas__page:has(.champ-bloc.est-ouvert) { max-width: 82rem; }
    .champ-bloc.est-ouvert {
      display: grid; grid-template-columns: minmax(0, 30rem) minmax(0, 1fr);
      gap: 0 1.2rem; align-items: start;
    }
    .champ-bloc.est-ouvert .champ-bloc__barre { grid-column: 1 / -1; }
    .champ-bloc.est-ouvert .champ-bloc__reglages {
      margin-top: 0; border-top: none; border-left: 1px solid var(--grey-900, #ddd);
      padding-top: 0; padding-left: 1.2rem; max-height: 60vh; overflow: auto;
    }
  }
  .champ-bloc--ajout {
    border: 1px dashed var(--grey-900, #ddd); color: var(--encre-douce, #666);
    text-align: center; cursor: pointer; font: inherit; font-size: 0.9rem; padding: 0.8rem;
  }
  .champ-bloc--ajout:hover { border-color: var(--blue-france, #000091); color: var(--blue-france, #000091); }

  /* Écrire une question, puis la suivante : le geste dominant. */
  .ajout {
    border: 1px dashed var(--grey-900, #ddd); border-radius: 8px; padding: 0.7rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .ajout__texte {
    font: inherit; font-size: 1rem; width: 100%; padding: 0.55rem 0.7rem;
    border: 1px solid var(--grey-925, #e5e5e5); border-bottom-width: 2px; border-radius: 5px 5px 0 0;
    background: var(--fond-carte, #fff); color: inherit;
  }
  .ajout__titre { margin: 0; font-size: 0.92rem; font-weight: 600; }
  .ajout__ligne { display: flex; gap: 0.5rem; align-items: stretch; }
  .ajout__ligne .ajout__texte { flex: 1 1 auto; }
  .ajout__valider { flex: 0 0 auto; }
  .ajout__aide { margin: 0; font-size: 0.78rem; color: var(--encre-douce, #666); }
  .ajout__types { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .ajout__type {
    font: inherit; font-size: 0.78rem; cursor: pointer; padding: 0.2rem 0.6rem; border-radius: 999px;
    border: 1px solid var(--grey-925, #e5e5e5); background: transparent; color: var(--encre-douce, #666);
  }
  .ajout__type:hover { border-color: var(--blue-france, #000091); color: var(--blue-france, #000091); }
  .ajout__type.est-actif { background: var(--blue-france, #000091); border-color: var(--blue-france, #000091); color: #fff; }

  /* Déplacer : au clavier et au doigt, pas seulement à la souris. */
  .champ-bloc__action[disabled] { opacity: 0.3; cursor: default; }
  .champ-bloc__deplacer {
    font: inherit; font-size: 0.72rem; padding: 0.1rem 0.3rem; border-radius: 5px;
    border: 1px solid transparent; background: transparent; color: var(--encre-douce, #666); max-width: 8rem;
  }
  .champ-bloc__deplacer:hover { border-color: var(--grey-900, #ddd); }

  /* Ce qui empêcherait le formulaire de marcher. */
  .verif {
    max-width: 52rem; margin: 0.6rem auto 0; background: var(--fond-carte, #fff);
    border: 1px solid var(--warning, #b34000); border-radius: 8px; padding: 0.7rem 0.8rem;
    display: flex; flex-direction: column; gap: 2px;
  }
  .verif--ok { border-color: var(--success, #18753c); }
  .verif__tete { font-size: 0.84rem; font-weight: 600; color: var(--warning, #b34000); margin: 0 0 0.3rem; }
  .verif__ligne {
    font: inherit; text-align: left; cursor: pointer; border: 1px solid transparent; border-radius: 5px;
    background: transparent; color: inherit; padding: 0.3rem 0.4rem; display: flex; gap: 0.6rem; flex-wrap: wrap;
  }
  .verif__ligne:hover { background: var(--grey-975, #f6f6f6); border-color: var(--grey-925, #e5e5e5); }
  .verif__ou { font-size: 0.78rem; color: var(--encre-douce, #666); flex: 0 0 14rem; }
  .verif__quoi { font-size: 0.84rem; flex: 1 1 16rem; }
  .barre-enregistrement__compte { font-size: 0.78rem; color: var(--encre-douce, #666); margin-right: auto; }

  /* Le plan de l'étape : ses questions en cartes, visibles d'un coup. */
  .atelier__plan { padding: 0.8rem 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .plan__tete { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .plan__titre {
    font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 0.25rem 0.5rem; color: inherit;
  }
  .plan__titre:hover { background: var(--grey-975, #f6f6f6); }
  .plan__titre.est-actif { background: var(--blue-france, #000091); color: #fff; }
  .plan__chemin { font-size: 0.78rem; color: var(--blue-france, #000091); }
  .plan__compte { font-size: 0.78rem; color: var(--encre-douce, #666); margin-left: auto; }
  .plan__vide { padding: 2rem 1rem; text-align: center; color: var(--encre-douce, #666); }
  .plan__grille {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 0.6rem; align-content: start;
  }
  .carte {
    font: inherit; text-align: left; cursor: pointer; color: inherit;
    display: flex; flex-direction: column; gap: 0.3rem;
    padding: 0.6rem 0.7rem; border: 1px solid var(--grey-925, #e5e5e5); border-radius: 8px;
    background: var(--fond-carte, #fff); min-width: 0;
  }
  .carte:hover { border-color: var(--blue-france, #000091); }
  .carte.est-actif { border-color: var(--blue-france, #000091); box-shadow: inset 0 0 0 1px var(--blue-france, #000091); }
  .carte__tete { display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--encre-douce, #666); }
  .carte__rang {
    background: var(--grey-950, #eee); border-radius: 999px; padding: 0 0.4rem; font-variant-numeric: tabular-nums;
  }
  .carte__nature { text-transform: lowercase; }
  .carte__question { font-size: 0.92rem; font-weight: 500; line-height: 1.3; }
  .carte__consigne { font-size: 0.78rem; color: var(--encre-douce, #666); }
  .carte__apercu { margin-top: 0.2rem; }
  .carte--ajout {
    align-items: center; justify-content: center; border-style: dashed; color: var(--encre-douce, #666);
    min-height: 5rem; font-size: 0.86rem;
  }
  .mini { display: flex; flex-wrap: wrap; gap: 3px; }
  .mini i {
    font-style: normal; font-size: 0.7rem; color: var(--encre-douce, #666);
    border: 1px solid var(--grey-925, #e5e5e5); border-radius: 4px; padding: 1px 5px; background: var(--grey-975, #f6f6f6);
  }
  .mini__champ { flex: 1 1 auto; }
  .mini__vide { font-size: 0.72rem; color: var(--warning, #b34000); }

  /* Le détail : réglages ou rendu, en onglets — pas deux panneaux concurrents. */
  .atelier__detail { display: flex; flex-direction: column; }
  .atelier__onglets { display: flex; gap: 2px; padding: 0.4rem 0.5rem 0; border-bottom: 1px solid var(--grey-950, #eee); }
  .atelier__onglet {
    font: inherit; font-size: 0.82rem; cursor: pointer; padding: 0.3rem 0.7rem;
    border: 1px solid transparent; border-bottom: none; border-radius: 5px 5px 0 0;
    background: transparent; color: var(--encre-douce, #666);
  }
  .atelier__onglet.est-actif { background: var(--grey-975, #f6f6f6); color: var(--blue-france, #000091); font-weight: 600; }
  .atelier__detail-corps { flex: 1 1 auto; overflow: auto; padding: 0.8rem 0.9rem; }

  /* Enregistrer ne se cherche pas : barre fixe, état à côté du bouton. */
  .barre-enregistrement {
    position: sticky; bottom: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    margin-top: 0.6rem; padding: 0.6rem 0.2rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
    background: var(--fond-page, #f6f6f6);
  }
  .barre-enregistrement__etat { font-size: 0.82rem; color: var(--encre-douce, #666); }

  @media (max-width: 72rem) {
    /* Le plan passe sous les réglages plutôt que de se tasser à trois colonnes. */
    .atelier { grid-template-columns: 13rem minmax(0, 1fr); }
    .atelier__detail { grid-column: 1 / -1; max-height: 24rem; }
  }
  @media (max-width: 46rem) {
    .atelier { grid-template-columns: 1fr; height: auto; }
    .atelier__structure { max-height: 12rem; }
    .atelier__detail { max-height: none; }
  }

  .builder-step {
    background: #fff;
    padding: 1rem 1.1rem;
    border-radius: 6px;
    border: 1px solid var(--grey-925, #e5e5e5);
  }
  .sections-stage {
    max-width: 40rem;
    margin: 0 auto 1.5rem;
    padding: 1.25rem 1rem 0.5rem;
    background: var(--grey-950, #eee);
    border-radius: 8px;
    border: 1px dashed var(--grey-900, #ddd);
  }
  .sections-stage > .fr-h6 {
    text-align: center;
    color: var(--grey-625, #666);
    font-weight: 600;
    margin-bottom: 1.25rem;
  }
  .section-card {
    background: #fff;
    border: 1px solid var(--grey-900, #ddd);
    border-radius: 8px;
    padding: 1.5rem 1.35rem 1.25rem;
    margin-bottom: 1.75rem;
    box-shadow: 0 2px 10px rgba(22, 22, 22, 0.06);
  }
  .section-card__head {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--grey-925, #e5e5e5);
  }
  .section-step {
    flex: 0 0 auto;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--blue-france, #000091);
    background: #e8e8f8;
    border-radius: 4px;
    padding: 0.35rem 0.55rem;
    margin-top: 0.35rem;
  }
  .inline-section-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--grey-200, #161616);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.25rem 0.4rem;
    background: transparent;
    font-family: inherit;
  }
  .inline-section-title:hover {
    background: var(--grey-975, #f6f6f6);
    border-color: var(--grey-925, #e5e5e5);
  }
  .inline-section-title:focus {
    outline: none;
    background: #fff;
    border-color: var(--blue-france, #000091);
    box-shadow: 0 0 0 2px rgba(0, 0, 145, 0.12);
  }
  .inline-section-title::placeholder { color: #999; font-weight: 500; }
  .section-card__actions { flex: 0 0 auto; margin-top: 0.15rem; }
  .section-card--intro,
  .section-card--outro {
    border-left: 4px solid var(--blue-france, #000091);
  }
  .section-card--outro {
    border-left-color: var(--success, #18753c);
  }
  .section-card--outro .section-step {
    color: var(--success, #18753c);
    background: #e8f5ee;
  }
  .intro-audience {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--grey-900, #ddd);
  }
  .intro-audience__fields {
    margin-top: 0.75rem;
  }
  .field-hint {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .field-hint__icon {
    display: inline-flex;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: var(--grey-800, #666);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1;
    justify-content: center;
    align-items: center;
    cursor: help;
    flex: 0 0 auto;
    position: relative;
  }
  .field-hint__icon:hover::after,
  .field-hint__icon:focus-visible::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 0.35rem);
    transform: translateX(-50%);
    width: max-content;
    max-width: 18rem;
    padding: 0.45rem 0.55rem;
    border-radius: 4px;
    background: #1e1e1e;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 400;
    line-height: 1.35;
    white-space: normal;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    pointer-events: none;
  }
  .intro-audience__status {
    margin: 0.35rem 0 0;
  }
  .inline-form-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--blue-france, #000091);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.25rem 0.4rem;
    background: transparent;
    font-family: inherit;
    width: 100%;
  }
  .inline-form-title:hover {
    background: var(--grey-975, #f6f6f6);
    border-color: var(--grey-925, #e5e5e5);
  }
  .inline-form-title:focus {
    outline: none;
    background: #fff;
    border-color: var(--blue-france, #000091);
    box-shadow: 0 0 0 2px rgba(0, 0, 145, 0.12);
  }
  .inline-form-title::placeholder { color: #999; font-weight: 500; }
  .inline-form-desc,
  .inline-success-msg {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 0.9375rem;
    line-height: 1.45;
    color: var(--grey-425, #3a3a3a);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.35rem 0.4rem;
    background: transparent;
    resize: vertical;
    min-height: 2.5rem;
  }
  .inline-form-desc:hover,
  .inline-success-msg:hover {
    background: var(--grey-975, #f6f6f6);
    border-color: var(--grey-925, #e5e5e5);
  }
  .inline-form-desc:focus,
  .inline-success-msg:focus {
    outline: none;
    background: #fff;
    border-color: var(--blue-france, #000091);
    box-shadow: 0 0 0 2px rgba(0, 0, 145, 0.12);
  }
  .inline-form-desc::placeholder,
  .inline-success-msg::placeholder { color: #999; }
  .inline-success-msg {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--success, #18753c);
    min-height: 3rem;
  }
  .section-card__static-label {
    pointer-events: none;
    border: none !important;
    padding-left: 0;
  }
  .brand-slot {
    margin: 0 0 0.85rem;
    padding: 0.65rem 0.75rem;
    background: var(--grey-975, #f6f6f6);
    border: 1px dashed var(--grey-900, #ddd);
    border-radius: 6px;
  }
  .brand-slot__preview {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 3.5rem;
    margin-bottom: 0.5rem;
  }
  .brand-slot__preview img {
    max-height: 72px;
    max-width: 100%;
    object-fit: contain;
  }
  .brand-slot__preview--success img { max-height: 120px; }
  .brand-slot__row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
  .brand-slot__row .fr-input { flex: 1 1 12rem; min-width: 0; }
  .brand-slot__file {
    font-size: 0.8125rem;
  }
  .form-meta-strip {
    max-width: 40rem;
    margin: 0 auto 1rem;
    padding: 0.75rem 1rem;
    background: #fff;
    border: 1px solid var(--grey-925, #e5e5e5);
    border-radius: 6px;
  }
  .section-card .add-field-btn {
    width: 100%;
    margin-top: 0.75rem;
    border-style: dashed;
  }
  .sections-stage .add-section-btn {
    display: block;
    width: 100%;
    margin: 0.25rem 0 1rem;
    border-style: dashed;
  }
  .field-editor {
    background: var(--grey-975, #f6f6f6);
    border: 1px solid var(--grey-925, #e5e5e5);
    border-left: 4px solid var(--blue-france, #000091);
    border-radius: 6px;
    padding: 1rem 1rem 0.85rem;
    margin-bottom: 1rem;
  }
  .field-editor__head {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .inline-label {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--grey-200, #161616);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.2rem 0.35rem;
    background: transparent;
    font-family: inherit;
  }
  .inline-label:hover {
    background: #fff;
    border-color: var(--grey-925, #e5e5e5);
  }
  .inline-label:focus {
    outline: none;
    background: #fff;
    border-color: var(--blue-france, #000091);
    box-shadow: 0 0 0 2px rgba(0, 0, 145, 0.12);
  }
  .inline-label::placeholder { color: #999; font-weight: 500; }
  .field-preview {
    margin: 0 0 0.85rem;
    padding: 0 0.15rem;
  }
  .field-preview.is-static {
    pointer-events: none;
    opacity: 0.72;
  }
  .field-preview.is-editable .fr-input,
  .field-preview.is-editable textarea.fr-input {
    opacity: 1;
  }
  .field-preview .fr-input,
  .field-preview .fr-select {

    box-shadow: none;
    border-color: var(--grey-900, #ddd);
  }
  .field-preview__hint {
    font-size: 0.7rem;
    color: var(--grey-625, #666);
    margin: 0 0 0.25rem;
  }
  .field-props {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem 1rem;
    align-items: flex-end;
    padding-top: 0.65rem;
    border-top: 1px dashed var(--grey-900, #ddd);
    margin-bottom: 0.25rem;
  }
  .field-props .fr-input-group,
  .field-props .fr-select-group,
  .field-props .fr-checkbox-group {
    margin-bottom: 0;
    min-width: 8rem;
  }
  .field-props .fr-checkbox-group {
    padding-bottom: 0.35rem;
  }
  .behavior-panel {
    margin-top: 0.75rem;
    padding: 0.75rem;
    background: #f0f4ff;
    border: 1px solid #b3b3ea;
    border-radius: 4px;
    overflow: visible;
  }
  .behavior-panel.cascade {
    background: #f0f9ff;
    border-color: #7dd3fc;
  }
  .behavior-panel.dynamic {
    background: #faf5ff;
    border-color: #d8b4fe;
  }
  .behavior-panel h4 {
    margin: 0 0 0.5rem;
    font-size: 0.875rem;
    color: #000091;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .behavior-panel__intro {
    font-size: 0.8rem;
    line-height: 1.45;
    color: #3a3a3a;
    margin: 0 0 0.65rem;
  }
  .behavior-panel__empty {
    margin: 0.5rem 0 0;
    padding: 0.55rem 0.65rem;
    background: #fff;
    border: 1px dashed #99a;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.45;

<body>

<!--
  Une seule ligne de chrome : le widget vit dans un panneau de Grist, et chaque
  rangée d'en-tête est prise sur le formulaire qu'on compose. Le titre et la
  devise sont partis — la personne sait où elle est, elle vient de choisir ce
  widget. Reste ce qui sert : où j'en suis, et si Grist répond.
-->
<header class="app-bar">
  <nav id="steps" aria-label="Étapes du builder"></nav>
  <span id="status-badge" class="app-bar__etat" title="État de la connexion à Grist">Initialisation…</span>
  <!--
    Un seul endroit pour ce qui n'est pas la composition : voir la définition,
    l'exporter, régler ce qui vaut pour tout le formulaire. C'était dispersé —
    un bouton de téléchargement et deux replis « Technique » au fond de l'onglet
    Aperçu, invisibles depuis les trois autres.
  -->
  <details id="menu-options" class="app-menu">
    <summary class="app-menu__bouton" title="Options, export et réglages" aria-label="Options">⋯</summary>
    <div class="app-menu__panneau" id="menu-options-panneau"></div>
  </details>
</header>

<main class="app-main">
  <section id="forms-list" class="builder-step"><p class="fr-text--sm">Chargement…</p></section>
  <section id="builder" class="builder-step" hidden></section>
  <section id="preview" class="builder-step" hidden></section>
  <section id="publish-log" class="builder-step" hidden></section>
  <section id="synthese" class="builder-step" hidden></section>
</main>

<div id="toast-container"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════
const S = {
  isDemo: false,
  step: 'forms',
  tables: [],           // [{ id, tableId }] (tables candidates comme cible de formulaire)
  columnsByTable: {},   // tableId -> [{ colId, type, label }]
  forms: [],            // lignes de la table Formulaires
  currentRowId: null,   // id de ligne Formulaires en édition (null = nouveau)
  currentDef: null,     // FormDef en cours d'édition
  publishLog: [],
  showAdvanced: false,
  wizardOpen: false,
  autoTable: true
};

const GRIST_TYPES = ['Text', 'Int', 'Numeric', 'Bool', 'Date', 'DateTime', 'Choice', 'ChoiceList', 'Ref', 'RefList', 'Attachments'];
const WIDGETS_BY_TYPE = {
  Text: ['text', 'textarea'], Int: ['number', 'likert'], Numeric: ['number'], Bool: ['checkbox'],
  Date: ['date'], DateTime: ['datetime'], Choice: ['select', 'radio'], ChoiceList: ['multiselect'],
  Attachments: ['file'],
  Ref: ['select'], RefList: ['multiselect']
};
const CONDITION_OPERATORS = ['==', '!=', '>', '>=', '<', '<=', 'contains'];

const STEPS = [
  { id: 'forms', label: '1. Mes formulaires' },
  { id: 'builder', label: '2. Questions' },
  { id: 'preview', label: '3. Aperçu' },
  { id: 'publish', label: '4. Mettre en ligne' },
  { id: 'synthese', label: '5. Synthèse' }
];

// Données mock hors Grist — assez pour composer/prévisualiser un formulaire complet.
const DEMO_TABLES = [
  { tableId: 'Contacts', columns: [
    { colId: 'Nom', type: 'Text', label: 'Nom' },
    { colId: 'Email', type: 'Text', label: 'Email' },
    { colId: 'Groupe', type: 'Choice', label: 'Groupe' },
    { colId: 'Age', type: 'Int', label: 'Âge' },
    { colId: 'Actif', type: 'Bool', label: 'Actif' }
  ] },
  { tableId: 'Demandes', columns: [
    { colId: 'Titre', type: 'Text', label: 'Titre' },
    { colId: 'Description', type: 'Text', label: 'Description' },
    { colId: 'Statut', type: 'Choice', label: 'Statut' },
    { colId: 'DateEnvoi', type: 'Date', label: 'Date envoi' }
  ] },
  { tableId: 'Regions', columns: [
    { colId: 'Nom', type: 'Text', label: 'Nom' }
  ] }
];
let demoNextId = 1;

// ═══════════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════════
function esc(t) {
  return (window.GristBridge && GristBridge.util && GristBridge.util.esc) ? GristBridge.util.esc(t) : String(t == null ? '' : t);
}

function hintIcon(tip) {
  return `<span class="field-hint__icon" tabindex="0" role="note" aria-label="Aide" data-tip="${esc(tip)}">?</span>`;
}

function hintLabel(text, tip, forId) {
  const forAttr = forId ? ` for="${esc(forId)}"` : '';
  return `<label class="fr-label field-hint"${forAttr}><span>${esc(text)}</span>${hintIcon(tip)}</label>`;
}

/**
 * Une modale, pour ce qui se regarde sans quitter ce qu'on fait.
 *
 * `<dialog>` natif : la touche Echap, le fond cliquable et le piege a focus
 * viennent du navigateur, et il n'y a rien a reimplementer.
 */
function ouvrirModale(titre, contenuHtml) {
  let d = document.getElementById('modale');
  if (!d) {
    d = document.createElement('dialog');
    d.id = 'modale';
    d.className = 'modale';
    document.body.appendChild(d);
    d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); });
  }
  d.innerHTML = `
    <div class="modale__tete">
      <h3 class="modale__titre">${titre}</h3>
      <button type="button" class="modale__fermer" onclick="App.fermerModale()" aria-label="Fermer">\u2715</button>
    </div>
    <div class="modale__corps">${contenuHtml}</div>`;
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}

function fermerModale() {
  const d = document.getElementById('modale');
  if (d && typeof d.close === 'function') d.close();
  else if (d) d.removeAttribute('open');
}

// Fermer l'onglet, ou recharger la page, passe par le navigateur : lui aussi
// doit prevenir. Le texte est le sien ; on ne peut que demander l'arret.
window.addEventListener('beforeunload', function (ev) {
  if (!S.dirty) return;
  ev.preventDefault();
  ev.returnValue = '';
});

function toast(message, type) {
  const container = document.getElementById('toast-container');
  const div = document.createElement('div');
  div.className = 'app-toast ' + (type === 'error' ? 'error' : 'success');
  div.textContent = message;
  container.appendChild(div);
  setTimeout(() => div.remove(), 4500);
}

function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message || 'Délai dépassé')), ms))
  ]);
}

function newSection(n) {
  return { id: 's' + n, label: 'Étape ' + n, gate: null, condition: null, fields: [] };
}

function newField() {
  return {
    colId: '', label: '', type: 'Text', widget: 'text', required: false,
    options: {}, condition: null, cascade: null, dynamicFilter: null,
    profile: null, theme: null, polarity: '',
    _colIdLocked: false
  };
}

function newFormDef() {
  return {
    manifest_version: '1.0.0',
    id: 'form-' + Date.now().toString(36),
    title: '',
    description: '',
    classification: 'interne',
    successMessage: 'Merci !',
    // Une vue « Remplir » ajoute une ligne : c'est ce qu'on attend d'un
    // formulaire. Corriger la ligne du curseur se demande.
    editerLigneSelectionnee: false,
    branding: { logoUrl: '', logoAlt: '', successImageUrl: '', successImageAlt: '' },
    audience: { mode: 'none', tableId: '', emailCol: 'Email', groupCol: '', probe: false },
    tableId: '',
    composeMode: 'ensureSchema',
    sections: [newSection(1)],
    choices: {}
  };
}

function ensureAudience(def) {
  if (!def.audience || typeof def.audience !== 'object') {
    def.audience = { mode: 'none', tableId: '', emailCol: '', groupCol: '', probe: false };
  } else {
    if (!def.audience.mode) def.audience.mode = 'none';
    if (def.audience.emailCol == null) def.audience.emailCol = '';
    if (def.audience.groupCol == null) def.audience.groupCol = '';
    if (def.audience.tableId == null) def.audience.tableId = '';
    if (def.audience.probe == null) def.audience.probe = false;
  }
  return def.audience;
}

function onAudienceInput(key, value) {
  const a = ensureAudience(S.currentDef);
  if (key === 'probe') {
    a.probe = !!value;
    if (value && a.mode === 'bind' && a.tableId && a.emailCol) {
      applyProbeEmailSetup(a).then(function () { renderBuilder(); });
    }
    return;
  }
  if (key === 'mode') {
    a.mode = value === 'bind' ? 'bind' : 'none';
    if (a.mode === 'bind' && a.tableId) applyAudienceColumnDefaults(a);
    renderBuilder();
    return;
  }
  if (key === 'tableId') {
    a.tableId = value;
    applyAudienceColumnDefaults(a, true);
    renderBuilder();
    return;
  }
  a[key] = value;
}

/** Types compatibles pour lier email / groupe. */
function audienceEmailCandidates(cols) {
  return (cols || []).filter((c) => {
    const t = String(c.type || '');
    return t === 'Text' || t === 'Choice';
  });
}

function audienceGroupCandidates(cols) {
  return (cols || []).filter((c) => {
    const t = String(c.type || '');
    return t === 'Text' || t === 'Choice' || t === 'ChoiceList' ||
      t.indexOf('Ref:') === 0 || t.indexOf('RefList:') === 0;
  });
}

function pickColByHints(cols, hints) {
  for (let i = 0; i < hints.length; i++) {
    const re = hints[i];
    const hit = cols.find((c) => re.test(c.colId || '') || re.test(c.label || ''));
    if (hit) return hit.colId;
  }
  return '';
}

function detectAudienceEmailCol(cols) {
  const cands = audienceEmailCandidates(cols);
  return pickColByHints(cands, [/e-?mail/i, /courriel/i, /^mail$/i]) || (cands[0] && cands[0].colId) || '';
}

function detectAudienceGroupCol(cols) {
  const cands = audienceGroupCandidates(cols);
  return pickColByHints(cands, [/groupe/i, /group/i, /equipe|équipe/i, /r[oô]le/i, /profil/i, /statut/i]) || '';
}

/** force=true : recalcule même si déjà renseigné (changement de table). */
function applyAudienceColumnDefaults(aud, force) {
  const cols = S.columnsByTable[aud.tableId] || [];
  const emailOk = audienceEmailCandidates(cols).some((c) => c.colId === aud.emailCol);
  const groupOk = !aud.groupCol || audienceGroupCandidates(cols).some((c) => c.colId === aud.groupCol);
  if (force || !aud.emailCol || !emailOk) aud.emailCol = detectAudienceEmailCol(cols);
  if (force || !groupOk) aud.groupCol = detectAudienceGroupCol(cols);
}

function colSelectOptions(candidates, selected, emptyLabel) {
  const ids = new Set(candidates.map((c) => c.colId));
  let opts = `<option value="">${esc(emptyLabel || '—')}</option>`;
  candidates.forEach((c) => {
    opts += `<option value="${esc(c.colId)}" ${selected === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)} (${esc(c.type)})</option>`;
  });
  if (selected && !ids.has(selected)) {
    opts += `<option value="${esc(selected)}" selected>${esc(selected)} (hors liste)</option>`;
  }
  return opts;
}

async function applyProbeEmailSetup(aud) {
  if (!window.AudienceSetup) return;
  const cols = S.columnsByTable[aud.tableId] || [];
  const plan = AudienceSetup.planProbeEmailSetup(aud.tableId, aud.emailCol, cols);
  if (!plan.ok) {
    if (plan.reason === 'formula_column') {
      toast('Choisissez une colonne saisissable (pas une colonne formule).', 'error');
    } else if (plan.reason === 'column_not_found') {
      toast('Colonne email introuvable dans cette table.', 'error');
    }
    aud.probe = false;
    return;
  }
  if (plan.alreadyConfigured) {
    toast('La colonne email est déjà prête pour la reconnaissance automatique.');
    return;
  }
  if (S.isDemo) {
    const col = cols.find(c => c.colId === aud.emailCol);
    if (col) {
      col.formula = AudienceSetup.PROBE_EMAIL_FORMULA;
      col.isFormula = false;
      col.recalcWhen = AudienceSetup.PROBE_RECALC_WHEN;
    }
    toast('Mode démo : formule de reconnaissance simulée sur la colonne email.');
    return;
  }
  try {
    await GristBridge.applyUserActions(plan.actions);
    await reloadColumnsForTable(aud.tableId);
    toast('Formule appliquée : l’email du compte Grist sera lu à chaque nouvelle ligne.');
  } catch (e) {
    aud.probe = false;
    toast('Impossible de configurer la colonne email : ' + (e && e.message ? e.message : e), 'error');
  }
}

function renderAudienceBlock(aud) {
  const enabled = aud.mode === 'bind';
  const cols = aud.tableId ? (S.columnsByTable[aud.tableId] || []) : [];
  const emailCands = audienceEmailCandidates(cols);
  const groupCands = audienceGroupCandidates(cols);
  const emailMeta = aud.emailCol ? cols.find(c => c.colId === aud.emailCol) : null;
  const probeReady = !!(emailMeta && window.AudienceSetup && AudienceSetup.isProbeTriggerConfigured(emailMeta));
  const audEnableTip = 'Permet d’afficher ou de masquer des questions selon l’email ou le groupe de la personne connectée. Utile pour réserver un bloc à certains agents ou exclure le public.';
  const tableTip = 'Table du document qui liste les personnes (emails) et éventuellement leurs groupes.';
  const emailTip = 'Colonne qui identifie chaque personne, en général « Email ».';
  const groupTip = 'Colonne pour filtrer par groupe (ex. Agents, Public). Laissez vide si vous ne filtrez que par email.';
  const probeTip = 'Configure automatiquement la colonne email pour lire l’adresse du compte Grist connecté (formule à la création de ligne). Nécessaire pour reconnaître la personne sans qu’elle se déclare.';
  return `
    <div class="intro-audience">
      <div class="fr-checkbox-group">
        <input type="checkbox" id="aud-enable" ${enabled ? 'checked' : ''}
          onchange="App.onAudienceInput('mode', this.checked ? 'bind' : 'none')">
        <label class="fr-label field-hint" for="aud-enable">
          <span>Réserver des questions à certaines personnes ou groupes</span>
          ${hintIcon(audEnableTip)}
        </label>
      </div>
      ${enabled ? `
        <div class="intro-audience__fields fr-grid-row fr-grid-row--gutters">
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-select-group">${hintLabel('Table des personnes', tableTip)}
            <select class="fr-select" onchange="App.onAudienceInput('tableId', this.value)">
              <option value="">—</option>
              ${S.tables.map(t => `<option value="${esc(t.tableId)}" ${aud.tableId === t.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`).join('')}
            </select></div>
          </div>
          <div class="fr-col-12 fr-col-md-3">
            <div class="fr-select-group">${hintLabel('Colonne email', emailTip)}
            <select class="fr-select" onchange="App.onAudienceInput('emailCol', this.value)" ${!aud.tableId ? 'disabled' : ''}>
              ${colSelectOptions(emailCands, aud.emailCol, aud.tableId ? '—' : 'Choisir une table')}
            </select></div>
          </div>
          <div class="fr-col-12 fr-col-md-3">
            <div class="fr-select-group">${hintLabel('Colonne groupe (optionnel)', groupTip)}
            <select class="fr-select" onchange="App.onAudienceInput('groupCol', this.value)" ${!aud.tableId ? 'disabled' : ''}>
              ${colSelectOptions(groupCands, aud.groupCol, 'Aucune')}
            </select></div>
          </div>
          <div class="fr-col-12 fr-col-md-2">
            <div class="fr-checkbox-group" style="padding-top:1.5rem">
              <input type="checkbox" id="aud-probe" ${aud.probe ? 'checked' : ''}
                onchange="App.onAudienceInput('probe', this.checked)" ${!aud.tableId || !aud.emailCol ? 'disabled' : ''}>
              <label class="fr-label field-hint" for="aud-probe">
                <span>Reconnaître la personne connectée</span>
                ${hintIcon(probeTip)}
              </label>
            </div>
          </div>
        </div>
        ${aud.tableId && !emailCands.length ? `<p class="fr-hint-text">Aucune colonne Texte/Choice utilisable pour l’email dans cette table.</p>` : ''}
        ${aud.probe && aud.emailCol ? `<p class="fr-hint-text intro-audience__status">${probeReady
          ? '✓ Colonne email prête : l’adresse du compte Grist sera détectée automatiquement.'
          : 'Cochez ci-dessus pour appliquer la configuration sur la colonne email.'}</p>` : ''}
      ` : ''}
    </div>
  `;
}

const CONDITION_PANEL_TIP = 'Affiche ou masque selon des critères. Utile pour des chemins différents ou réserver des questions. Ne remplace pas les droits d’accès Grist.';
const CONDITION_COMBO_TIP = 'ET = toutes les règles doivent être vraies. OU = au moins une règle suffit.';
const CONDITION_SOURCE_TIP = 'Choisissez ce qui est évalué : contexte (widget, session), audience (personne/groupe) ou une réponse précédente.';
const CONDITION_VALUE_TIP = 'Valeur attendue pour que la règle soit vraie. Pour une liste (audience), séparez par des virgules.';

const CONTEXT_RULE_OPTS = [
  { key: 'context:inGristWidget', label: 'Dans le widget Grist', tip: 'Vrai si le formulaire est ouvert dans une page Grist (pas une page web isolée).' },
  { key: 'context:canWriteNative', label: 'Peut enregistrer dans Grist', tip: 'Vrai si la personne peut écrire dans le document via l’API Grist (accès suffisant).' },
  { key: 'context:isLoggedIn', label: 'Personne connectée', tip: 'Vrai si une session Grist est détectée (connecté ou dans le widget).' },
  { key: 'context:userEmail', label: 'Email de session', tip: 'Email du compte Grist connecté (si reconnu). Compare comme un texte.' }
];
const AUDIENCE_RULE_OPTS = [
  { key: 'audience:email', label: 'Email (liste ou session)', tip: 'Compare l’email reconnu à une liste. Configurez l’audience dans Accueil ; cochez « Reconnaître la personne connectée » si besoin.' },
  { key: 'audience:group', label: 'Groupe', tip: 'Compare le groupe de la personne (ex. Agents, Public). Nécessite une table audience avec colonne groupe dans Accueil.' }
];

const OPERATOR_TIPS = {
  '==': 'Exactement égal à la valeur.',
  '!=': 'Différent de la valeur.',
  '>': 'Strictement supérieur.',
  '>=': 'Supérieur ou égal.',
  '<': 'Strictement inférieur.',
  '<=': 'Inférieur ou égal.',
  'contains': 'Contient le texte (non sensible à la casse).',
  'notContains': 'Ne contient pas le texte.',
  'in': 'La valeur est dans la liste (virgules). Ex. : Agents, Public',
  'notIn': 'La valeur n’est pas dans la liste.'
};

function allRuleOpts() {
  return CONTEXT_RULE_OPTS.concat(AUDIENCE_RULE_OPTS);
}

function ruleOptionTip(selKey) {
  const hit = allRuleOpts().find(o => o.key === selKey);
  return hit ? hit.tip : 'Réponse d’une question affichée avant celle-ci.';
}

function operatorTip(op, isAud, isCtx) {
  if (isAud && op === 'in') return 'La personne doit appartenir à l’un des groupes/emails listés.';
  if (isAud && op === 'notIn') return 'Exclut les personnes dont le groupe/email est dans la liste.';
  if (isCtx && (op === '==' || op === '!=')) return 'Oui/Non pour les critères de contexte (widget, connecté, etc.).';
  return OPERATOR_TIPS[op] || 'Compare la source à la valeur saisie.';
}

function ruleSelectKey(rule) {
  const src = rule.source || 'field';
  const path = rule.path || rule.field || '';
  if (src === 'context' || path.indexOf('context.') === 0) {
    const p = rule.path || path.replace(/^context\./, '');
    return 'context:' + p;
  }
  if (src === 'audience' || path.indexOf('audience.') === 0) {
    const p = rule.path || path.replace(/^audience\./, '');
    return 'audience:' + p;
  }
  return 'field:' + (rule.field || path);
}

function applyRuleSourceKey(rule, key) {
  if (key.indexOf('context:') === 0) {
    rule.source = 'context';
    rule.path = key.slice(8);
    rule.field = 'context.' + rule.path;
    rule.bind = null;
    if (rule.path === 'inGristWidget' || rule.path === 'canWriteNative' || rule.path === 'isLoggedIn') {
      rule.operator = '==';
      if (rule.value === '' || rule.value == null) rule.value = true;
    }
  } else if (key.indexOf('audience:') === 0) {
    rule.source = 'audience';
    rule.path = key.slice(9);
    rule.field = 'audience.' + rule.path;
    const aud = ensureAudience(S.currentDef);
    rule.bind = aud.mode === 'bind' ? {
      tableId: aud.tableId,
      emailCol: aud.emailCol,
      groupCol: aud.groupCol
    } : null;
    if (rule.path === 'group') rule.operator = 'in';
  } else {
    rule.source = 'field';
    rule.path = key.indexOf('field:') === 0 ? key.slice(6) : key;
    rule.field = rule.path;
    rule.bind = null;
  }
}

/**
 * L'accueil du formulaire, cree quand on commence a le composer.
 *
 * Il n'existe pas par defaut : un formulaire sans accueil s'ouvre sur sa
 * premiere question, et c'est bien ce qu'on veut pour une fiche de saisie.
 * C'est l'enquete adressee a des inconnus qui a besoin d'une couverture.
 */
function ensureAccueil(def) {
  if (!def.accueil || typeof def.accueil !== 'object') def.accueil = {};
  if (!Array.isArray(def.accueil.encarts)) def.accueil.encarts = [];
  return def.accueil;
}

function ensureBranding(def) {
  if (!def.branding || typeof def.branding !== 'object') {
    def.branding = { logoUrl: '', logoAlt: '', successImageUrl: '', successImageAlt: '' };
  } else {
    ['logoUrl', 'logoAlt', 'successImageUrl', 'successImageAlt'].forEach((k) => {
      if (def.branding[k] == null) def.branding[k] = '';
    });
  }
  return def.branding;
}

/** N’autorise que http(s) et data:image pour éviter javascript: etc. */
function safeImageUrl(url) {
  if (!url || typeof url !== 'string') return '';
  const u = url.trim();
  if (/^https?:\/\//i.test(u) || /^data:image\//i.test(u)) return u;
  return '';
}

function renderBrandSlot(opts) {
  const { kind, urlKey, altKey, url, alt, previewClass, logoUrl, logoAlt } = opts;
  const safe = safeImageUrl(url);
  const canReuseLogo = kind === 'success' && !!safeImageUrl(logoUrl);
  const preview = safe
    ? `<div class="brand-slot__preview ${previewClass || ''}"><img src="${esc(safe)}" alt="${esc(alt || '')}"></div>`
    : `<div class="brand-slot__preview ${previewClass || ''}"><span class="fr-hint-text">Aucun logo / image</span></div>`;
  return `
    <div class="brand-slot">
      ${preview}
      <div class="brand-slot__row">
        <input class="fr-input" type="url" value="${esc(url || '')}"
          placeholder="URL de l’image (https://…)"
          aria-label="${kind === 'logo' ? 'URL du logo' : 'URL de l’image de fin'}"
          oninput="App.onBrandingInput('${urlKey}', this.value)"
          onchange="App.onBrandingInput('${urlKey}', this.value); App.refreshBuilderBrand()">
        <input class="brand-slot__file" type="file" accept="image/*"
          aria-label="Importer une image"
          onchange="App.onBrandingFile('${urlKey}', this)">
      </div>
      ${canReuseLogo ? `
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-mt-1w"
          onclick="App.reuseIntroImage()">Réutiliser l’image d’accueil</button>
      ` : ''}
      <div class="fr-input-group fr-mt-1w fr-mb-0">
        <label class="fr-label">Texte alternatif</label>
        <input class="fr-input" value="${esc(alt || '')}" placeholder="Ex. Logo de l’organisation"
          oninput="App.onBrandingInput('${altKey}', this.value)">
      </div>
      ${url && !safe ? `<p class="fr-hint-text" style="color:var(--error,#ce0500)">URL non autorisée (http(s) ou image embarquée uniquement).</p>` : ''}
      ${safe ? `<button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-mt-1w" onclick="App.onBrandingInput('${urlKey}', ''); App.refreshBuilderBrand()">Retirer l’image</button>` : ''}
    </div>
  `;
}

function boolFieldColIds(def) {
  const out = [];
  def.sections.forEach(sec => sec.fields.forEach(f => { if (f.type === 'Bool' && f.colId) out.push(f.colId); }));
  return out;
}

function allFieldColIds(def, excludeSi, excludeFi) {
  const out = [];
  def.sections.forEach((sec, si) => sec.fields.forEach((f, fi) => {
    if (si === excludeSi && fi === excludeFi) return;
    if (f.colId) out.push(f.colId);
  }));
  return out;
}

function refFieldColIdsExcept(def, excludeSi, excludeFi) {
  const out = [];
  def.sections.forEach((sec, si) => sec.fields.forEach((f, fi) => {
    if (si === excludeSi && fi === excludeFi) return;
    if (f.type === 'Ref' && f.colId) out.push(f.colId);
  }));
  return out;
}

/** Champs utilisables comme source de condition (étapes précédentes, ou avant dans la même). */
function priorFields(def, si, fi) {
  const out = [];
  def.sections.forEach((sec, sIdx) => {
    sec.fields.forEach((f, fIdx) => {
      if (sIdx > si) return;
      if (sIdx === si && (fi == null || fIdx >= fi)) return;
      if (!f.colId) return;
      out.push({
        colId: f.colId,
        label: f.label || f.colId,
        type: f.type,
        sectionLabel: sec.label,
        choices: (def.choices && def.choices[f.colId]) || (f.options && f.options.choices) || []
      });
    });
  });
  return out;
}

function findFieldMeta(def, colId) {
  for (const sec of def.sections) {
    for (const f of sec.fields) {
      if (f.colId === colId) {
        return {
          colId: f.colId,
          label: f.label || f.colId,
          type: f.type,
          choices: (def.choices && def.choices[f.colId]) || (f.options && f.options.choices) || [],
          refTable: (f.options && f.options.refTable) || f.refTable || ''
        };
      }
    }
  }
  return null;
}

function resolveRefTableOfField(f) {
  if (!f) return '';
  return (f.options && f.options.refTable) || f.refTable || '';
}

function fieldTypeShortLabel(type) {
  const map = { Ref: 'Référence', Choice: 'Liste', Text: 'Texte', Bool: 'Oui/Non' };
  return map[type] || type || '';
}

/** Message si aucun champ parent éligible au-dessus de la question courante. */
function emptyParentFieldsHint(def, si, fi, eligibleTypes) {
  const allPrior = [];
  def.sections.forEach((sec, sIdx) => {
    sec.fields.forEach((f, fIdx) => {
      if (sIdx > si) return;
      if (sIdx === si && fIdx >= fi) return;
      allPrior.push(f);
    });
  });
  if (!allPrior.length) {
    return 'C’est la <strong>première question</strong> de l’étape (ou du formulaire). Ajoutez une question <strong>au-dessus</strong> avant de filtrer.';
  }
  const withoutCol = allPrior.filter(f => !f.colId);
  const wrongType = allPrior.filter(f => f.colId && eligibleTypes.indexOf(f.type) === -1);
  if (withoutCol.length && !allPrior.some(f => f.colId && eligibleTypes.indexOf(f.type) !== -1)) {
    return 'Des questions existent au-dessus, mais sans <strong>colonne définie</strong>. Renseignez le libellé (ou le colId) puis revenez ici.';
  }
  if (wrongType.length && eligibleTypes.length === 1 && eligibleTypes[0] === 'Ref') {
    return 'Ajoutez <strong>au-dessus</strong> une question de type <strong>Référence</strong> (ex. Région), puis filtrez cette liste (ex. Commune).';
  }
  if (wrongType.length) {
    return 'Ajoutez <strong>au-dessus</strong> une question <strong>Liste, Texte, Oui/Non ou Référence</strong> dont la valeur servira de filtre.';
  }
  return 'Aucun champ parent disponible pour le moment.';
}

function renderParentSelectOptions(parents, selectedColId) {
  return parents.map(p =>
    `<option value="${esc(p.colId)}" ${selectedColId === p.colId ? 'selected' : ''}>${esc(p.label || p.colId)} (${esc(fieldTypeShortLabel(p.type))})</option>`
  ).join('');
}

function renderRefBehaviorPanels(def, si, fi, f, refParents, dynParents, filterColOpts, refTable) {
  if (!refTable) {
    return `
      <div class="behavior-panel behavior-panel--intro">
        <p class="behavior-panel__intro">Pour filtrer cette liste selon une autre question, choisissez d’abord une <strong>table liée</strong> ci-dessus.</p>
      </div>`;
  }

  const cascadeTip = 'Une <strong>autre question Référence</strong> placée au-dessus filtre cette liste (ex. Région → Commune). Une seule méthode de filtre à la fois.';
  const dynamicTip = 'Liste / Texte / Oui-Non : filtre direct. Référence : on lit une colonne sur la ligne choisie, puis on filtre les lignes (ex. même Groupe).';
  const canCascade = refParents.length > 0;
  const canDynamic = dynParents.length > 0;
  const cascadeEmptyHint = emptyParentFieldsHint(def, si, fi, ['Ref']);
  const dynamicEmptyHint = emptyParentFieldsHint(def, si, fi, ['Ref', 'Choice', 'Text', 'Bool']);
  const filterColsLoaded = filterColOpts && filterColOpts.trim().length > 0;

  const df = f.dynamicFilter;
  const parentMeta = df && df.parentField ? findFieldMeta(def, df.parentField) : null;
  const parentIsRef = !!(parentMeta && parentMeta.type === 'Ref');
  const parentTable = parentIsRef ? (parentMeta.refTable || '') : '';
  const parentRowCols = parentTable ? (S.columnsByTable[parentTable] || []) : (refTable ? (S.columnsByTable[refTable] || []) : []);
  const parentValueColOpts = parentRowCols.map(c =>
    `<option value="${esc(c.colId)}" ${df && df.parentValueColumn === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');
  const needsParentValueCol = parentIsRef && df && df.parentResolve === 'refRow';
  const missingParentValueCol = needsParentValueCol && !df.parentValueColumn;

  return `
    <p class="behavior-panel__intro fr-mb-1w">Deux façons de réduire cette liste (cochez <strong>une seule</strong>) — les deux nécessitent une question <strong>au-dessus</strong> dans le parcours.</p>
    <div class="behavior-panel cascade">
      <h4>Cascade Référence → Référence ${hintIcon(cascadeTip)}</h4>
      <div class="fr-checkbox-group">
        <input type="checkbox" id="casc-${si}-${fi}" ${f.cascade ? 'checked' : ''} ${canCascade ? '' : 'disabled'}
          onchange="App.onFieldCascadeToggle(${si}, ${fi}, this.checked)">
        <label class="fr-label ${canCascade ? '' : 'is-disabled'}" for="casc-${si}-${fi}">
          Filtrer selon une autre question Référence
        </label>
      </div>
      ${!canCascade ? `<div class="behavior-panel__empty">${cascadeEmptyHint}</div>` : ''}
      ${f.cascade && canCascade ? `
        <div class="fr-select-group fr-mt-1w">
          ${hintLabel('Question Référence au-dessus', 'Liste des questions Ref déjà placées avant celle-ci dans le parcours.')}
          <select class="fr-select" onchange="App.onFieldCascadeParent(${si}, ${fi}, this.value)">
            <option value="">— Choisir —</option>
            ${renderParentSelectOptions(refParents, f.cascade.parentField)}
          </select>
        </div>
        <p class="fr-hint-text">Colonne de liaison (auto) : <strong>${esc(f.cascade.parentRefCol || '—')}</strong></p>
      ` : ''}
    </div>
    <div class="behavior-panel dynamic">
      <h4>Filtre par valeur d’une autre question ${hintIcon(dynamicTip)}</h4>
      <div class="fr-checkbox-group">
        <input type="checkbox" id="dyn-${si}-${fi}" ${f.dynamicFilter ? 'checked' : ''} ${canDynamic ? '' : 'disabled'}
          onchange="App.onFieldDynamicToggle(${si}, ${fi}, this.checked)">
        <label class="fr-label ${canDynamic ? '' : 'is-disabled'}" for="dyn-${si}-${fi}">
          Filtrer selon la valeur d’une question au-dessus
        </label>
      </div>
      ${!canDynamic ? `<div class="behavior-panel__empty">${dynamicEmptyHint}</div>` : ''}
      ${f.dynamicFilter && canDynamic ? `
        <div class="fr-grid-row fr-grid-row--gutters fr-mt-1w">
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-select-group">
              ${hintLabel('Question au-dessus', 'Liste / Texte / Oui-Non : valeur directe. Référence : lit une colonne sur la ligne choisie.')}
              <select class="fr-select" onchange="App.onFieldDynamic(${si}, ${fi}, 'parentField', this.value)">
                <option value="">— Choisir —</option>
                ${renderParentSelectOptions(dynParents, f.dynamicFilter.parentField)}
              </select>
            </div>
          </div>
          ${parentIsRef ? `
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-select-group">
              ${hintLabel('Lire sur la ligne choisie', 'Colonne du contact / enregistrement sélectionné au-dessus (ex. Groupe).')}
              <select class="fr-select" onchange="App.onFieldDynamic(${si}, ${fi}, 'parentValueColumn', this.value)">
                <option value="">— Choisir —</option>${parentValueColOpts}
              </select>
            </div>
          </div>
          ` : ''}
          <div class="fr-col-12 fr-col-md-${parentIsRef ? '4' : '8'}">
            <div class="fr-select-group">
              ${hintLabel('Filtrer les lignes où', 'Colonne de « ' + esc(refTable) + ' » comparée à la valeur résolue (souvent la même, ex. Groupe).')}
              <select class="fr-select" onchange="App.onFieldDynamic(${si}, ${fi}, 'filterColumn', this.value)">
                <option value="">— Choisir —</option>${filterColOpts}
              </select>
            </div>
          </div>
        </div>
        ${missingParentValueCol ? `<div class="behavior-panel__empty">Indiquez quelle colonne lire sur la ligne choisie (ex. <strong>Groupe</strong>).</div>` : ''}
        ${!filterColsLoaded ? `<div class="behavior-panel__empty">Colonnes de <strong>${esc(refTable)}</strong> introuvables — resélectionnez la table liée ou enregistrez le formulaire pour recharger le schéma.</div>` : ''}
      ` : ''}
    </div>`;
}

// GRIST / DÉMO — chargement des données
// ═══════════════════════════════════════════════════════════
async function ensureFormulairesTable() {
  const tables = await GristBridge.loadTable('_grist_Tables');
  const exists = tables.some(t => t.tableId === 'Formulaires');
  if (!exists) {
    await GristBridge.applyUserActions(FormulairesTable.planCreateFormulairesTable());
  }
}

async function loadTablesAndColumns() {
  const tables = await GristBridge.loadTable('_grist_Tables');
  const columns = await GristBridge.loadTable('_grist_Tables_column');
  S.tables = tables
    .filter(t => t.tableId && !/^_grist/.test(t.tableId) && t.tableId !== 'Formulaires')
    .map(t => ({ id: t.id, tableId: t.tableId }));
  S.columnsByTable = {};
  S.tables.forEach(t => { S.columnsByTable[t.tableId] = []; });
  columns.forEach(c => {
    if (!colonneOffrable(c)) return;
    const table = S.tables.find(t => t.id === c.parentId);
    if (!table) return;
    S.columnsByTable[table.tableId].push(colonneLue(c));
  });
}

/**
 * Une colonne qu'une question peut remplir.
 *
 * Une colonne calculée refuse ce qu'on y écrirait, et `manualSort` est la
 * mécanique d'ordre des lignes de Grist : les proposer, c'est inviter à lier
 * une question à une case qui ne gardera pas la réponse. Vu en Grist réel, où
 * la liste des colonnes s'ouvrait sur « manualSort · ManualSortPos ».
 */
function colonneOffrable(c) {
  if (c.isFormula) return false;
  if (c.colId === 'manualSort' || c.type === 'ManualSortPos') return false;
  return true;
}

/** Une colonne Grist, lue une seule fois et de la même façon partout. */
function colonneLue(c) {
  // Les choix d'une colonne Choice vivent dans ses `widgetOptions` : sans eux,
  // le compositeur demandait de retaper à la main une liste que Grist détient
  // déjà, et les deux divergeaient aussitôt.
  var choix = null;
  try { choix = JSON.parse(c.widgetOptions || '{}').choices || null; } catch (e) { choix = null; }
  return {
    colId: c.colId,
    type: c.type,
    label: c.label || c.colId,
    choix: choix,
    formula: c.formula || '',
    isFormula: !!c.isFormula,
    recalcWhen: c.recalcWhen
  };
}

async function reloadColumnsForTable(tableId) {
  const tables = await GristBridge.loadTable('_grist_Tables');
  const table = tables.find(t => t.tableId === tableId);
  if (!table) return;
  const columns = await GristBridge.loadTable('_grist_Tables_column');
  S.columnsByTable[tableId] = columns
    .filter(c => c.parentId === table.id && colonneOffrable(c))
    .map(colonneLue);
}

async function refreshTablesAfterSchemaChange() {
  await loadTablesAndColumns();
}

/** Pose visibleCol méta Grist (id) depuis options.visibleCol (nom de colonne). */
async function applyVisibleColMeta(formDef) {
  if (!window.EnsureSchema || !EnsureSchema.planVisibleColUpdates) return;
  try {
    const tables = await GristBridge.loadTable('_grist_Tables');
    const columns = await GristBridge.loadTable('_grist_Tables_column');
    const vis = EnsureSchema.planVisibleColUpdates(formDef, tables, columns);
    if (vis.ok && vis.actions && vis.actions.length) {
      await GristBridge.applyUserActions(vis.actions);
    }
  } catch (e) {
    console.warn('[grist_forms] visibleCol méta non appliqué:', e);
  }
}

/** Applique un plan ensureSchema en mémoire (mode démo). */
function applyEnsureSchemaDemo(plan, tableId) {
  plan.actions.forEach(function (a) {
    if (a[0] === 'AddTable') {
      const cols = a[2] || [];
      if (!S.tables.some(t => t.tableId === tableId)) {
        S.tables.push({ id: S.tables.length + 1, tableId: tableId });
      }
      S.columnsByTable[tableId] = cols.map(function (c) {
        return { colId: c.id, type: c.type, label: c.label || c.id };
      });
    } else if (a[0] === 'AddColumn') {
      const colId = a[2];
      const def = a[3] || {};
      S.columnsByTable[tableId] = S.columnsByTable[tableId] || [];
      if (!S.columnsByTable[tableId].some(c => c.colId === colId)) {
        S.columnsByTable[tableId].push({ colId: colId, type: def.type, label: def.label || colId });
      }
    }
  });
}

async function loadFormulaires() {
  S.forms = await GristBridge.loadTable('Formulaires');
}

function loadDemoData() {
  S.tables = DEMO_TABLES.map((t, i) => ({ id: i + 1, tableId: t.tableId }));
  S.columnsByTable = {};
  DEMO_TABLES.forEach(t => { S.columnsByTable[t.tableId] = t.columns.slice(); });
}

async function initRealMode() {
  console.log('[builder] GristBridge prêt (window.grist.docApi détecté)');
  await ensureFormulairesTable();
  await loadTablesAndColumns();
  await loadFormulaires();
}

async function init() {
  try { grist.ready({ requiredAccess: 'full' }); } catch (e) { /* grist-plugin-api absent : on tentera quand même, la détection réelle suit */ }
  try {
    if (!window.grist || !window.grist.docApi) throw new Error('grist.docApi indisponible (hors iframe Grist)');
    await withTimeout(initRealMode(), 6000, 'Pas de réponse de Grist');
  } catch (e) {
    console.warn('[builder] Mode démo :', e && e.message);
    S.isDemo = true;
    loadDemoData();
  }
  render();
}
