 * > **Mesuré avant d'y toucher** : l'enquête du 4ᵉ chargée dans l'ancien écran
 * > faisait **34 357 px de haut — 45 écrans de défilement** — et affichait
 * > **709 contrôles d'un coup**, toutes les questions dépliées en même temps.
 * > On ne pouvait ni voir la forme du questionnaire, ni réordonner, ni
 * > travailler une question sans défiler par-dessus les soixante autres.
 *
 * Trois zones : la **structure** (ce que le formulaire est), **la question**
 * choisie — une seule à la fois —, et l'**aperçu**, qui répond pendant qu'on
 * écrit au lieu d'attendre dans l'onglet voisin. Sur écran étroit, elles
 * s'empilent.
 */
function renderBuilder() {
  const el = document.getElementById('builder');
  if (!S.currentDef) {
    el.innerHTML = `<p class="fr-text--sm">Sélectionnez ou créez un formulaire depuis l'étape « Mes formulaires ».</p>`;
    return;
  }
  const def = S.currentDef;
  ensureBranding(def);
  ensureAudience(def);
  normaliserSelection();

  const cols = S.columnsByTable[def.tableId] || [];
  const colsDatalist = `<datalist id="cols-datalist">${cols.map(c => `<option value="${esc(c.colId)}">`).join('')}</datalist>`;

  // Un réglage change, le panneau est redessiné : on garde la position de lecture
  // et les blocs repliables ouverts (ceux qui portent un identifiant).
  // Redessiner ne doit rien déplacer : ni la fenêtre, ni la structure, ni la page d'édition, ni les
  // réglages. La hauteur est figée le temps du redessin, sinon la page se raccourcit un instant et le
  // navigateur ramène la fenêtre en haut.
  const defileur = document.scrollingElement || document.documentElement;
  const yFenetre = defileur.scrollTop;
  const zones = DEFILEMENTS.map(s => { const n = el.querySelector(s); return n ? n.scrollTop : 0; });
  const remise = S._remiseDefilement || {};
  S._remiseDefilement = null;
  if (el.offsetHeight) el.style.minHeight = el.offsetHeight + 'px';
  const ouverts = Array.prototype.map.call(el.querySelectorAll('details[id][open]'), d => d.id);

  el.innerHTML = `
    <div class="atelier3">
      <nav class="rail" aria-label="Parcours du formulaire">
        <p class="colonne__role">Pages du formulaire</p>
        ${renderRailEtapes(def)}
      </nav>
      <div class="canevas" id="canevas">${renderCanevas(def)}</div>
      <aside class="inspecteur" aria-label="Réglages">${renderInspecteur(def)}</aside>
    </div>
    ${colsDatalist}
    <div class="barre-enregistrement">
      <span class="barre-enregistrement__etat">${S.dirty ? 'Modifications non enregistrées' : (S.enregistreA ? 'Enregistré à ' + S.enregistreA : esc(def.title || 'Sans titre'))}</span>
      <span class="barre-enregistrement__compte">${def.sections.length} étape(s) · ${def.sections.reduce((n, s2) => n + (s2.fields || []).length, 0)} question(s)</span>
      <button class="fr-btn" onclick="App.saveForm()">Enregistrer</button>
    </div>
  `;
  ouverts.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  DEFILEMENTS.forEach((s, i) => {
    const n = el.querySelector(s);
    if (n) n.scrollTop = remise[s] ? 0 : zones[i];
  });
  defileur.scrollTop = yFenetre;
  el.style.minHeight = '';
  monterCarteDeComposition();
}

/** Les zones qui défilent chacune pour elles-mêmes dans le compositeur. */
const DEFILEMENTS = ['.rail', '.canevas', '.inspecteur', '.inspecteur__corps'];

/**
 * La carte sur laquelle on pose les reperes d'une illustration.
 *
 * > **Poser un repere, c'est montrer ou c'est.** Saisir deux nombres pour
 * > chacun des cinq lieux d'un quartier serait demander des coordonnees a
 * > quelqu'un qui regarde une carte. On choisit la proposition, on clique a
 * > l'endroit, le repere s'y met.
 */
function monterCarteDeComposition() {
  const hote = document.querySelector('.fr-carte--composer');
  if (!hote || !window.FormCarte || typeof FormCarte.montrer !== 'function') return;
  const [si, fi] = (hote.getAttribute('data-champ') || '').split('-').map(Number);
  const f = S.currentDef?.sections?.[si]?.fields?.[fi];
  const ill = f && f.options && f.options.illustration;
  if (!ill) return;
  const options = S.currentDef.choices[f.colId] || (f.options.choices || []);
  const reperes = (ill.reperes || []).map((r) => ({
    etiquette: r.etiquette, lon: r.lon, lat: r.lat, titre: r.option
  }));
  FormCarte.montrer(hote, { centre: ill.centre, zoom: ill.zoom, fond: ill.fond, reperes })
    .then((vue) => {
      const attente = hote.querySelector('.fr-hint-text');
      if (attente) attente.remove();
      vue.carte.on('click', (ev) => {
        const choisi = S.repereEnCours;
        if (!choisi || choisi.si !== si || choisi.fi !== fi) {
          toast('Choisissez d’abord la proposition à placer', 'error');
          return;
        }
        const rang = options.indexOf(choisi.option);
        const etiquette = rang >= 0 ? String.fromCharCode(65 + rang) : '•';
        const liste = (ill.reperes || []).filter((r) => r.option !== choisi.option);
        liste.push({
          option: choisi.option, etiquette,
          lon: Math.round(ev.lngLat.lng * 1e6) / 1e6,
          lat: Math.round(ev.lngLat.lat * 1e6) / 1e6
        });
        ill.reperes = liste;
        // Le cadrage de la carte suit ce qu'on vient de regarder : sans lui,
        // le public rouvrirait la carte ailleurs que sur les reperes.
        const c = vue.carte.getCenter();
        ill.centre = [Math.round(c.lng * 1e6) / 1e6, Math.round(c.lat * 1e6) / 1e6];
        ill.zoom = Math.round(vue.carte.getZoom() * 10) / 10;
        marquerModifie();
        renderBuilder();
      });
    })
    .catch(() => {
      const attente = hote.querySelector('.fr-hint-text');
      if (attente) attente.textContent = 'La carte n’a pas pu être chargée.';
    });
}

/** Les réglages, ou le rendu : on passe de l'un à l'autre, on ne les subit pas côte à côte. */
function panneauDroit(quoi) {
  S.panneauDroit = quoi;
  renderBuilder();
}

/**
 * Le plan de l'étape : ses questions en cartes, sur plusieurs colonnes.
 *
 * C'est l'objet que compose la personne — une étape est ce que le public verra
 * sur un écran. L'ancien compositeur en faisait une liste verticale de blocs
 * dépliés ; la structure de gauche rend cette liste inutile, et la largeur
 * disponible permet de voir toute l'étape sans défiler.
 */
function renderPlanEtape(def) {
  const sel = S.selection || {};
  if (sel.quoi === 'accueil' || sel.quoi === 'fin') {
    const quoi = sel.quoi === 'accueil' ? 'l’accueil' : 'la page de confirmation';
    return `<div class="plan__vide"><p>Vous composez ${quoi}. Ses réglages sont à droite.</p>
      <p class="fr-hint-text">Choisissez une étape à gauche pour revenir aux questions.</p></div>`;
  }
  const si = sel.si != null ? sel.si : 0;
  const section = def.sections[si];
  if (!section) return '<div class="plan__vide"><p>Aucune étape.</p></div>';

  const cartes = (section.fields || []).map((f, fi) => {
    const actif = selectionEst('question', si, fi) ? ' est-actif' : '';
    const apercu = renderApercuCarte(f, def);
    return `<button type="button" class="carte${actif}" onclick="App.choisir('question', ${si}, ${fi})">
      <span class="carte__tete">
        <span class="carte__rang">${fi + 1}</span>
        <span class="carte__nature">${esc(natureCourte(f))}</span>
        ${marquesDeChamp(f)}
      </span>
      <span class="carte__question">${esc(f.label || f.colId || 'Sans libellé')}</span>
      ${f.description ? `<span class="carte__consigne">${esc(f.description)}</span>` : ''}
      <span class="carte__apercu">${apercu}</span>
    </button>`;
  }).join('');

  const chemin = (section.condition || section.gate)
    ? `<span class="plan__chemin" title="Cette étape ne s’affiche pas toujours">⤳ ${esc(FormUx.summarizeCondition(section.condition || { field: section.gate, operator: '==', value: true }) || '')}</span>`
    : '';

  return `
    <div class="plan__tete">
      <button type="button" class="plan__titre${selectionEst('etape', si) ? ' est-actif' : ''}"
        onclick="App.choisir('etape', ${si})" title="Régler l’étape">
        Étape ${si + 1} · ${esc(section.label || '')}
      </button>
      ${chemin}
      <span class="plan__compte">${(section.fields || []).length} question(s)</span>
    </div>
    <div class="plan__grille">
      ${cartes}
      <button type="button" class="carte carte--ajout" onclick="App.addField(${si})">+ Ajouter une question</button>
    </div>`;
}

/** Ce que la question donnera à voir, en miniature et sans interaction. */
function renderApercuCarte(f, def) {
  if (f.kind === 'echelle') {
    const e = window.FormEngine && FormEngine.echelleDe ? FormEngine.echelleDe(def, f) : { min: 1, max: 5 };
    let crans = '';
    for (let n = e.min; n <= e.max; n++) crans += `<i class="mini__cran">${n}</i>`;
    return `<span class="mini">${crans}${e.nonConcerne ? '<i class="mini__nsp">n.c.</i>' : ''}</span>`;
  }
  const t = String(f.type || '').replace(/:.*$/, '');
  if (t === 'Choice' || t === 'ChoiceList') {
    const choix = (def.choices[f.colId] || (f.options && f.options.choices) || []).slice(0, 3);
    if (!choix.length) return '<span class="mini mini__vide">aucune option</span>';
    return `<span class="mini">${choix.map(c => `<i class="mini__option">${esc(String(c).slice(0, 18))}</i>`).join('')}${(def.choices[f.colId] || []).length > 3 ? '<i class="mini__option">…</i>' : ''}</span>`;
  }
  if (t === 'Bool') return '<span class="mini"><i class="mini__option">Oui</i><i class="mini__option">Non</i></span>';
  if (t === 'Attachments') return '<span class="mini"><i class="mini__champ">fichier…</i></span>';
  if (t === 'Date' || t === 'DateTime') return '<span class="mini"><i class="mini__champ">jj/mm/aaaa</i></span>';
  if (t === 'Ref' || t === 'RefList') return `<span class="mini"><i class="mini__champ">${esc(resolveRefTableOfField(f) || 'table liée')}</i></span>`;
  return '<span class="mini"><i class="mini__champ">&nbsp;</i></span>';
}

/**
 * Le rail des étapes : le parcours, de haut en bas.
 *
 * Une barre horizontale tenait quatre étapes et faisait défiler les dix autres.
 * Verticalement, les quatorze sont là, avec leur nom entier, leur nombre de
 * questions et la marque de celles qui ne s'affichent pas toujours. La largeur
 * ainsi rendue va au formulaire et à ses réglages.
 */
function renderRailEtapes(def) {
  const etapes = def.sections.map((section, si) => {
    const actif = (S.selection.si === si && S.selection.quoi !== 'accueil' && S.selection.quoi !== 'fin') ? ' est-actif' : '';
    const chemin = (section.condition || section.gate)
      ? '<span class="rail__chemin" title="Cette étape ne s’affiche pas toujours">⤳</span>' : '';
    return `<button type="button" class="rail__etape${actif}" onclick="App.choisir('etape', ${si})">
      <span class="rail__rang">${si + 1}</span>
      <span class="rail__nom">${esc(section.label || 'Sans titre')}</span>
      ${chemin}<span class="rail__compte">${(section.fields || []).length}</span>
    </button>`;
  }).join('');
  return `
    <button type="button" class="rail__bout${selectionEst('accueil') ? ' est-actif' : ''}" onclick="App.choisir('accueil')">Accueil</button>
    <div class="rail__etapes">${etapes}</div>
    <button type="button" class="rail__ajout" onclick="App.addSection()">+ étape</button>
    <button type="button" class="rail__bout${selectionEst('fin') ? ' est-actif' : ''}" onclick="App.choisir('fin')">Fin</button>
    <div class="rail__pied">${renderCibleEtMode(def)}</div>`;
}

/**
 * L'inspecteur : ce qu'on règle, toujours au même endroit.
 *
 * Les réglages s'ouvraient sous le champ et poussaient la page : à chaque
 * ouverture, ce qu'on regardait se déplaçait. Ils tiennent maintenant une
 * colonne à eux ; le canevas ne bouge plus, et le champ choisi s'y signale.
 */
function renderInspecteur(def) {
  const onglet = S.inspecteur === 'controle' ? 'controle' : 'reglages';
  const soucis = verifierFormulaire(def);
  return `
    <p class="colonne__role">Réglages <span class="colonne__sujet">${esc(sujetCourant(def))}</span></p>
    <div class="inspecteur__onglets" role="tablist">
      <button type="button" role="tab" class="inspecteur__onglet${onglet === 'reglages' ? ' est-actif' : ''}"
        aria-selected="${onglet === 'reglages'}" onclick="App.inspecteur('reglages')">Réglages</button>
      <button type="button" role="tab" class="inspecteur__onglet${onglet === 'controle' ? ' est-actif' : ''}"
        aria-selected="${onglet === 'controle'}" onclick="App.inspecteur('controle')">Vérifications${soucis.length ? ' (' + soucis.length + ')' : ''}</button>
    </div>
    <div class="inspecteur__corps">
      ${onglet === 'reglages' ? renderZoneQuestion(def) : renderControle(def, soucis)}
    </div>`;
}

/**
 * Ce qu'on regle en ce moment, dit en toutes lettres.
 *
 * > « Étape 1 » s'affichait trois fois — dans le rail, en titre du canevas et
 * > dans les reglages — avec le meme poids, et aucune des trois ne disait a
 * > quoi elle servait. Le nom de l'etape appartient au parcours ; ici on
 * > nomme le **sujet de l'action**, et le canevas ne porte plus de titre
 * > d'editeur, seulement ce que le public lira.
 */
function sujetCourant(def) {
  const sel = S.selection || {};
  if (sel.quoi === 'accueil') return 'de l’accueil';
  if (sel.quoi === 'fin') return 'de la page de fin';
  const section = def.sections[sel.si] || {};
  if (sel.quoi === 'etape') return 'de l’étape « ' + (section.label || 'sans titre') + ' »';
  // Le numéro de la question est déjà dans le fil « 1 sur n » juste dessous :
  // on nomme ici ce dont il s'agit, pas son rang.
  const champ = (section.fields || [])[sel.fi] || {};
  return 'de la question « ' + (champ.label || 'sans libellé') + ' »';
}

function inspecteur(onglet) {
  S.inspecteur = onglet;
  renderBuilder();
}

/** Ce qui empêcherait le formulaire de marcher, et où aller le corriger. */
function renderControle(def, soucis) {
  if (!soucis.length) {
    return `<div class="controle controle--ok">
      <p>Rien à signaler.</p>
      <p class="fr-hint-text">Chaque question a un libellé, une colonne à elle, et ses conditions ne regardent que des réponses déjà posées.</p>
    </div>`;
  }
  return `<div class="controle">
    <p class="controle__tete">${soucis.length} point(s) à regarder</p>
    ${soucis.map(x => `
      <button type="button" class="controle__ligne" onclick="App.choisir('question', ${x.si}, ${x.fi})">
        <span class="controle__ou">Étape ${x.si + 1} · ${esc(x.question)}</span>
        <span class="controle__quoi">${esc(x.quoi)}</span>
      </button>`).join('')}
  </div>`;
}

/**
 * Le canevas : l'étape telle que le public la verra, et chaque champ
 * configurable sur place.
 *
 * > **Les champs sont dessinés par le moteur lui-même** (`renderFieldHtml`),
 * > en lecture seule. Redessiner ici une version « éditeur » aurait fait deux
 * > rendus pour une seule apparence, et ils auraient divergé au premier type
 * > ajouté.
 */
function renderCanevas(def) {
  const sel = S.selection;
  if (sel.quoi === 'accueil' || sel.quoi === 'fin') {
    // Vu en Grist réel : le canevas rendait les mêmes champs de saisie que
    // l'inspecteur, côte à côte. Deux fois le même formulaire, et nulle part
    // ce que le public lira. Le moteur rend la couverture et la page de fin.
    const estAccueil = sel.quoi === 'accueil';
    let rendu = '';
    try {
      rendu = estAccueil
        ? ((FormEngine.aUnAccueil(def)
            ? FormEngine.renderBandeauHtml(def) + FormEngine.renderAccueilHtml(def)
            : FormEngine.renderHeaderHtml(def))
          || '<p class="fr-hint-text">Ni titre, ni description, ni logo : la page s’ouvrira directement sur la première question.</p>')
        : FormEngine.renderSuccessHtml(def);
    } catch (e) { rendu = '<p class="fr-hint-text">Rendu indisponible</p>'; }
    return `
      <p class="colonne__role">Aperçu <span class="colonne__sujet">${estAccueil ? 'ce que le public lit en premier' : 'ce que le public voit après avoir répondu'}</span></p>
      <div class="canevas__page">
        <div class="fr-form canevas__public" aria-hidden="true">${rendu}</div>
      </div>`;
  }
  const si = sel.si != null ? sel.si : 0;
  const section = def.sections[si];
  if (!section) return '<div class="canevas__page"><p>Aucune étape.</p></div>';

  let derniereMatrice = null;
  let derniereGroupe = null;
  const blocs = (section.fields || []).map((f, fi) => {
    const ouvert = selectionEst('question', si, fi);
    const matrice = (f.options && f.options.matrice) || null;
    const groupe = (!matrice && f.options && f.options.groupe) || null;
    const enteteMatrice = (matrice && matrice !== derniereMatrice)
      ? `<p class="canevas__matrice">▦ ${esc(((def.matrices || {})[matrice] || {}).titre || matrice)}</p>`
      : ((groupe && groupe !== derniereGroupe)
        ? `<p class="canevas__matrice">▭ Groupe : ${esc(((def.groupes || {})[groupe] || {}).titre || groupe)}</p>` : '');
    derniereMatrice = matrice;
    derniereGroupe = groupe;
    let rendu = '';
    try { rendu = window.FormEngine ? FormEngine.renderFieldHtml(f, {}, optionsDApercu(def, f), def) : ''; }
    catch (e) { rendu = '<p class="fr-hint-text">Rendu indisponible</p>'; }
    return `
      ${enteteMatrice}
      <div class="champ-bloc${ouvert ? ' est-ouvert' : ''}" role="group" tabindex="0"
        aria-label="Question ${fi + 1} : ${esc(f.label || f.colId || '')}. Entrée pour la régler."
        ${ouvert ? 'aria-current="true"' : ''}
        onclick="App.choisirSurClic(event, ${si}, ${fi})" onkeydown="App.choisirAuClavier(event, ${si}, ${fi})">
        <div class="champ-bloc__barre">
          <span class="champ-bloc__rang">${fi + 1}</span>
          <span class="champ-bloc__nature">${esc(natureCourte(f))}</span>
          ${marquesDeChamp(f)}
          <span class="champ-bloc__espace"></span>
          <button type="button" class="champ-bloc__action" title="Monter" ${fi === 0 ? 'disabled' : ''}
            onclick="App.deplacerChamp(${si}, ${fi}, -1)">↑</button>
          <button type="button" class="champ-bloc__action" title="Descendre" ${fi === (section.fields.length - 1) ? 'disabled' : ''}
            onclick="App.deplacerChamp(${si}, ${fi}, 1)">↓</button>
          <button type="button" class="champ-bloc__action" title="Dupliquer" onclick="App.dupliquerChamp(${si}, ${fi})">⧉</button>
          <select class="champ-bloc__deplacer" title="Déplacer vers une autre étape"
            onchange="App.deplacerVersEtape(${si}, ${fi}, this.value); this.selectedIndex = 0;">
            <option value="">Déplacer vers…</option>
            ${def.sections.map((sec, k) => k === si ? '' : `<option value="${k}">${k + 1}. ${esc(sec.label || '')}</option>`).join('')}
          </select>
          <button type="button" class="champ-bloc__action" title="Régler cette question"
            onclick="App.choisir('question', ${si}, ${fi})">⚙</button>
        </div>
        <div class="champ-bloc__rendu" aria-hidden="true">${rendu}</div>
      </div>`;
  }).join('');

  return `
    <p class="colonne__role">Aperçu <span class="colonne__sujet">étape ${si + 1} sur ${def.sections.length}</span></p>
    <div class="canevas__page">
      <div class="canevas__entete">
        <h2 class="canevas__titre-public">${esc(section.label || 'Étape ' + (si + 1))}</h2>
        ${section.description ? `<p class="canevas__consigne">${esc(section.description)}</p>` : ''}
      </div>
      ${blocs}
      ${renderAjoutRapide(si)}
    </div>`;
}

/** Les options qu'un champ montre dans le canevas, sans aller chercher Grist. */
function optionsDApercu(def, f) {
  // En mode liaison, la liste appartient a la colonne : c'est elle qu'il faut
  // montrer, sinon l'apercu affiche une question sans reponses possibles alors
  // que le formulaire publie en proposera.
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  const statiques = (colonne && colonne.choix && colonne.choix.length ? colonne.choix : null)
    || def.choices[f.colId] || (f.options && f.options.choices) || null;
  if (statiques && statiques.length) return statiques;
  if (f.type === 'Ref' || f.type === 'RefList') return [{ value: '', label: '(lignes de ' + (resolveRefTableOfField(f) || 'la table liée') + ')' }];
  return null;
}

/**
 * Écrire une question, et passer à la suivante.
 *
 * Le geste dominant de la composition n'est pas de régler : c'est d'écrire.
 * Avant, ajouter une question donnait une carte vide qu'il fallait ouvrir,
 * nommer, puis typer — quatre gestes pour une ligne. Ici on écrit la question,
 * on choisit son type d'un clic si le défaut ne convient pas, et Entrée crée la
 * suivante sans quitter le clavier.
 */
function renderAjoutRapide(si) {
  const types = ((window.FormUx && FormUx.SIMPLE_TYPES) || []).map(t =>
    `<button type="button" class="ajout__type${S.typeAjout === t.key ? ' est-actif' : ''}"
      onclick="App.typeAjout('${escJs(t.key)}')">${esc(t.label)}</button>`).join('');
  // Les types moins courants (lieu, adresse, signature, curseur, heure…) ne sont pas cachés dans les
  // réglages : une liste les offre dans le même geste que les puces.
  const plus = ((window.FormUx && FormUx.ADVANCED_TYPES) || []);
  const plusActif = plus.some(t => t.key === S.typeAjout);
  const autres = plus.length
    ? `<select class="fr-select ajout__plus${plusActif ? ' est-actif' : ''}" aria-label="Autres types de réponse"
        onchange="if (this.value) App.typeAjout(this.value)">
        <option value="">Autres types…</option>
        ${plus.map(t => `<option value="${esc(t.key)}" ${S.typeAjout === t.key ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}
      </select>` : '';
  // Le bouton « + Ajouter une question » a disparu de la carte d'étape : il
  // n'avait pas sa place dans les réglages, puisqu'on ajoute en regardant le
  // formulaire. Mais une ligne de saisie muette ne dit pas qu'elle ajoute :
  // elle s'annonce, et un bouton double la touche Entrée.
  return `
    <div class="ajout">
      <p class="ajout__titre">Ajouter une question à cette étape</p>
      <div class="ajout__ligne">
        <input class="ajout__texte" id="ajout-rapide" placeholder="Écrire la question, puis Entrée…"
          aria-label="Nouvelle question"
          onkeydown="if (event.key === 'Enter') { event.preventDefault(); App.ajouterDepuisTexte(${si}, this.value); }">
        <button type="button" class="fr-btn ajout__valider"
          onclick="App.ajouterDepuisTexte(${si}, document.getElementById('ajout-rapide').value)">Ajouter</button>
      </div>
      <p class="ajout__aide">Type de réponse :</p>
      <div class="ajout__types">${types}${autres}</div>
      <p class="ajout__aide">Ou d’un geste :</p>
      <div class="ajout__types">
        <button type="button" class="ajout__type" onclick="App.ajouterIdentite(${si})"
          title="Pose Nom, Prénom et Courriel (obligatoires), sans refaire celles que le formulaire a déjà">Nom, prénom et courriel</button>
      </div>
    </div>`;
}

function typeAjout(cle) {
  // Le geste naturel est de taper la question PUIS de choisir son type : le redessin recrée le champ, la saisie
  // serait perdue à chaque fois. On la garde, avec la position du curseur.
  const avant = document.getElementById('ajout-rapide');
  const texte = avant ? avant.value : '';
  S.typeAjout = cle;
  renderBuilder();
  const champ = document.getElementById('ajout-rapide');
  if (champ) {
    champ.value = texte;
    champ.focus();
    try { champ.setSelectionRange(texte.length, texte.length); } catch (e) { /* type sans sélection */ }
  }
}

function ajouterDepuisTexte(si, texte) {
  const libelle = String(texte || '').trim();
  if (!libelle) return;
  const section = S.currentDef.sections[si];
  const champ = newField();
  champ.label = libelle;
  section.fields.push(champ);
  const fi = section.fields.length - 1;
  if (S.typeAjout) onFieldTypeKeyChange(si, fi, S.typeAjout);
  onFieldLabelBlur(si, fi);   // dérive l'identifiant de colonne quand c'est le mode
  // La question qu'on vient d'écrire devient le sujet des réglages : c'est
  // d'elle qu'on va dire où elle se range. Le clavier, lui, reste sur la
  // ligne d'ajout pour enchaîner.
  S.selection = { quoi: 'question', si: si, fi: fi };
  marquerModifie();
  renderBuilder();
  const suivant = document.getElementById('ajout-rapide');
  if (suivant) { suivant.value = ''; suivant.focus(); }
}

/**
 * Qui répond, d'un geste : Nom, Prénom, Courriel. Seules les questions absentes sont ajoutées ; en liaison
 * avec une table, une colonne qui existe déjà sous un autre nom (« e-mail », « prénom ») est reconnue.
 */
function ajouterIdentite(si) {
  const def = S.currentDef;
  const section = def.sections[si];
  if (!section) return;
  const tous = def.sections.reduce((acc, s) => acc.concat(s.fields || []), []);
  const colonnes = S.columnsByTable[def.tableId] || [];
  const nouvelles = FormUx.identiteChamps(tous, colonnes, def.composeMode !== 'ensureSchema');
  if (!nouvelles.length) { toast('Nom, prénom et courriel sont déjà dans le formulaire.', 'info'); return; }
  const premier = section.fields.length;
  // Les trois questions forment un groupe : une légende, côte à côte quand la place le permet.
  def.groupes = def.groupes || {};
  if (!def.groupes.identite) def.groupes.identite = { titre: 'Qui êtes-vous ?', colonnes: 2 };
  nouvelles.forEach(c => { c.options = c.options || {}; c.options.groupe = 'identite'; section.fields.push(c); });
  nouvelles.forEach((c, k) => onFieldLabelBlur(si, premier + k));
  S.selection = { quoi: 'question', si: si, fi: premier };
  marquerModifie();
  renderBuilder();
}

/** Déplacer, dupliquer, supprimer : sans glisser, donc au clavier et au doigt. */
function deplacerChamp(si, fi, pas) {
  const champs = S.currentDef.sections[si].fields;
  const cible = fi + pas;
  if (cible < 0 || cible >= champs.length) return;
  const [c] = champs.splice(fi, 1);
  champs.splice(cible, 0, c);
  S.selection = { quoi: 'question', si: si, fi: cible };
  marquerModifie();
  renderBuilder();
}

function deplacerVersEtape(si, fi, cibleSi) {
  const n = Number(cibleSi);
  if (!Number.isFinite(n) || n === si || !S.currentDef.sections[n]) return;
  const [c] = S.currentDef.sections[si].fields.splice(fi, 1);
  S.currentDef.sections[n].fields.push(c);
  S.selection = { quoi: 'question', si: n, fi: S.currentDef.sections[n].fields.length - 1 };
  marquerModifie();
  renderBuilder();
}

function dupliquerChamp(si, fi) {
  const champs = S.currentDef.sections[si].fields;
  const copie = JSON.parse(JSON.stringify(champs[fi]));
  copie.colId = '';           // deux questions ne peuvent pas écrire dans la même colonne
  copie.label = copie.label + ' (copie)';
  champs.splice(fi + 1, 0, copie);
  S.selection = { quoi: 'question', si: si, fi: fi + 1 };
  marquerModifie();
  renderBuilder();
}

/**
 * Ce qui empêcherait le formulaire de marcher, dit avant d'enregistrer.
 *
 * Sur soixante questions, le risque n'est pas de mal ranger un réglage : c'est
 * qu'une question n'écrive nulle part, que deux écrivent au même endroit, ou
 * qu'une condition désigne une réponse qui vient après elle — et donc qui
 * n'existe pas encore au moment où l'on en a besoin.
 */
function verifierFormulaire(def) {
  const soucis = [];
  const vus = {};
  def.sections.forEach((section, si) => {
    (section.fields || []).forEach((f, fi) => {
      const ou = { si: si, fi: fi, question: f.label || f.colId || 'Question ' + (fi + 1) };
      if (!String(f.label || '').trim()) soucis.push({ ...ou, quoi: 'Sans libellé : le public ne saura pas quoi répondre.' });
      if (!String(f.colId || '').trim()) soucis.push({ ...ou, quoi: 'Aucune colonne : la réponse ne serait écrite nulle part.' });
      else if (vus[f.colId]) soucis.push({ ...ou, quoi: `La colonne « ${f.colId} » est déjà utilisée par une autre question.` });
      else vus[f.colId] = true;
      const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
      const aChoix = (def.choices[f.colId] || []).length
        || ((f.options && f.options.choices) || []).length
        || ((colonne && colonne.choix) || []).length;
      if ((f.type === 'Choice' || f.type === 'ChoiceList') && !aChoix) {
        soucis.push({ ...ou, quoi: 'Aucune option proposée.' });
      }
      if ((f.type === 'Ref' || f.type === 'RefList') && !resolveRefTableOfField(f)) {
        soucis.push({ ...ou, quoi: 'Aucune table liée : la liste serait vide.' });
      }
      // Une condition ne peut regarder qu'en arrière.
      const regles = [];
      (function lire(c) {
        if (!c) return;
        if (c.rules) return c.rules.forEach(lire);
        if (c.field && (!c.source || c.source === 'field')) regles.push(c.field);
      })(f.condition);
      const avant = new Set(priorFields(def, si, fi).map(x => x.colId));
      regles.forEach(colId => {
        if (!avant.has(colId)) {
          soucis.push({ ...ou, quoi: `La condition regarde « ${colId} », qui n’est pas posée avant cette question.` });
        }
      });
    });
  });
  return soucis;
}

function basculerVerification() {
  S.verification = !S.verification;
  renderBuilder();
}

function renderVerification(def) {
  if (!S.verification) return '';
  const soucis = verifierFormulaire(def);
  if (!soucis.length) {
    return `<div class="verif verif--ok"><p>Rien à signaler : chaque question a un libellé, une colonne à elle, et ses conditions regardent en arrière.</p></div>`;
  }
  const lignes = soucis.map(x => `
    <button type="button" class="verif__ligne" onclick="App.choisir('question', ${x.si}, ${x.fi})">
      <span class="verif__ou">Étape ${x.si + 1} · ${esc(x.question)}</span>
      <span class="verif__quoi">${esc(x.quoi)}</span>
    </button>`).join('');
  return `<div class="verif"><p class="verif__tete">${soucis.length} point(s) à regarder</p>${lignes}</div>`;
}

/** Ce qui a changé depuis le dernier enregistrement. */
function marquerModifie() {
  S.dirty = true;
  const etat = document.querySelector('.barre-enregistrement__etat');
  if (etat) etat.textContent = 'Modifications non enregistrées';
}

/**
 * D'où viennent les options d'une question à choix.
 *
 * > **En mode liaison, elles appartiennent à la colonne.** Le compositeur en
 * > offrait une zone de texte libre, alimentée par `def.choices` — qui restait
 * > vide pour une question liée, puisque ses choix sont portés par la colonne.
 * > On voyait donc un champ vide sous une question qui propose quatre réponses,
 * > et y écrire aurait fabriqué une seconde liste, que Grist aurait refusée.
 *
 * On les montre donc telles qu'elles sont, en disant où les changer. En mode
 * création, la colonne n'existe pas encore : c'est bien ici qu'on les écrit.
 */
function renderOptionsDuChamp(def, si, f, fi, isBind) {
  if (isBind) {
    const col = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
    const choix = (col && col.choix) || (f.options && f.options.choices) || [];
    if (!f.colId) {
      return `<p class="fr-hint-text">Choisissez une colonne : ses options seront celles de la question.</p>`;
    }
    if (!choix.length) {
      return `<div class="fr-alert fr-alert--warning fr-mt-1w"><p>La colonne « ${esc(f.colId)} » ne déclare aucune liste de choix dans Grist. La question n’offrirait rien à choisir.</p></div>`;
    }
    return `
      <div class="options-liees">
        <p class="fr-label">Options proposées ${hintIcon('Elles viennent de la colonne : c’est dans Grist qu’on les change, et le formulaire suit.')}</p>
        <ul class="options-liees__liste">${choix.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        <p class="fr-hint-text">Définies par la colonne « ${esc(f.colId)} » dans Grist.</p>
      </div>`;
  }
  const valeur = (def.choices[f.colId] || (f.options && f.options.choices) || []).join('\n');
  return `
    <div class="fr-input-group">
      <label class="fr-label" for="opt-${si}-${fi}">Options proposées ${hintIcon('Une par ligne. Elles deviendront les choix de la colonne créée dans Grist.')}</label>
      <textarea class="fr-input" id="opt-${si}-${fi}" rows="4" placeholder="Une option par ligne"
        aria-describedby="opt-aide-${si}-${fi}"
        oninput="App.onFieldChoices(${si}, ${fi}, this.value)">${esc(valeur)}</textarea>
      <p class="fr-hint-text" id="opt-aide-${si}-${fi}">Une option par ligne. Sans option, la question ne propose aucun choix.</p>
    </div>`;
}

/**
 * Ce qui est propre a une saisie, et a elle seule.
 *
 * > **Une saisie range sa reponse ailleurs que dans sa colonne.** Un classement
 * > ecrit un rang par colonne, « Autre : … » demande une colonne de texte a
 * > cote de la liste. Ces colonnes ne se devinent pas : elles se choisissent
 * > ici, dans la liste des colonnes de la table, pas dans un JSON.
 *
 * Rien ne s'affiche pour une saisie qui n'a pas de reglage propre : le panneau
 * ne montre que ce qui s'applique a la question qu'on regle.
 */
/**
 * Les réglages d'une question : ceux de son type, puis ceux qui valent pour toute
 * question (le format qu'on contrôle, la valeur reçue par l'adresse).
 */
function renderReglagesSaisie(def, si, f, fi, isBind) {
  return renderReglagesSaisieSpecifiques(def, si, f, fi, isBind) + renderReglagesCommuns(def, si, f, fi);
}

function renderReglagesCommuns(def, si, f, fi) {
  const o = f.options || {};
  let html = '';
  // ── Pastilles : une couleur par choix ──
  if (f.widget === 'pastilles') {
    const couleurs = o.couleurs || {};
    const texte = Object.keys(couleurs).map(k => k + ' = ' + couleurs[k]).join('\n');
    html += `<div class="fr-input-group"><label class="fr-label" for="pas-${si}-${fi}">Couleur de chaque choix ${hintIcon('Une ligne par choix : Critique = #c9191e. Seules les couleurs #rgb et #rrggbb sont reprises.')}</label>
      <textarea class="fr-input" id="pas-${si}-${fi}" rows="4" placeholder="Critique = #c9191e" onchange="App.onCouleurs(${si}, ${fi}, this.value)">${esc(texte)}</textarea></div>`;
  }
  // ── Nombre : bornes, pas, unité, valeurs d'appui ──
  const typeBase = String(f.type || '').split(':')[0];
  if (typeBase === 'Int' || typeBase === 'Numeric') {
    const champNb = (cle, libelle, aide, ph) => `<div class="fr-input-group"><label class="fr-label" for="nb-${cle}-${si}-${fi}">${libelle}${aide ? ' ' + hintIcon(aide) : ''}</label>
      <input class="fr-input" id="nb-${cle}-${si}-${fi}" value="${esc(o[cle] === undefined ? '' : o[cle])}" ${ph ? 'placeholder="' + ph + '"' : ''}
        onchange="App.onOptionNombre(${si}, ${fi}, '${cle}', this.value)"></div>`;
    html += `<div class="bloc__duo">${champNb('min', 'Minimum')}${champNb('max', 'Maximum')}</div>
      <div class="bloc__duo">${champNb('step', 'Pas', 'Le plus petit écart entre deux valeurs (0,5 pour des demi-heures).')}${champNb('unite', 'Unité', 'Affichée après le nombre ; elle n’est pas écrite dans la cellule.', 'h, m, %')}</div>`;
    if (f.widget === 'curseur') {
      html += `<div class="fr-input-group"><label class="fr-label" for="nb-presets-${si}-${fi}">Valeurs d’appui ${hintIcon('Des boutons qui posent le curseur d’un geste : 0, 25, 50, 75, 100.')}</label>
        <input class="fr-input" id="nb-presets-${si}-${fi}" value="${esc((o.presets || []).join(', '))}" placeholder="0, 25, 50, 75, 100"
          onchange="App.onOptionPresets(${si}, ${fi}, this.value)"></div>`;
    }
  }
  // ── Date, heure : bornes et ordre ──
  if (typeBase === 'Date' || typeBase === 'DateTime' || f.widget === 'heure') {
    const memeType = (S.currentDef.sections || []).reduce((acc, s) => acc.concat(s.fields || []), [])
      .filter(g => g !== f && g.colId && String(g.type || '').split(':')[0] === typeBase && g.widget === f.widget);
    const choixApres = memeType.map(g => `<option value="${esc(g.colId)}" ${g.colId === o.apres ? 'selected' : ''}>${esc(g.label || g.colId)}</option>`).join('');
    if (f.widget !== 'heure') {
      html += `<div class="bloc__duo">
        <div class="fr-input-group"><label class="fr-label" for="dt-min-${si}-${fi}">Pas avant ${hintIcon('Une date AAAA-MM-JJ, ou « aujourdhui ».')}</label>
          <input class="fr-input" id="dt-min-${si}-${fi}" value="${esc(o.min === undefined ? '' : o.min)}" placeholder="aujourdhui" onchange="App.onOptionTexte(${si}, ${fi}, 'min', this.value)"></div>
        <div class="fr-input-group"><label class="fr-label" for="dt-max-${si}-${fi}">Pas après</label>
          <input class="fr-input" id="dt-max-${si}-${fi}" value="${esc(o.max === undefined ? '' : o.max)}" placeholder="2026-12-31" onchange="App.onOptionTexte(${si}, ${fi}, 'max', this.value)"></div>
      </div>`;
    }
    if (memeType.length) {
      html += `<div class="fr-select-group"><label class="fr-label" for="dt-apres-${si}-${fi}">Ne précède pas ${hintIcon('Une fin qui ne peut pas tomber avant son début : choisissez la question de début.')}</label>
        <select class="fr-select" id="dt-apres-${si}-${fi}" onchange="App.onOptionTexte(${si}, ${fi}, 'apres', this.value)">
          <option value="">— aucune —</option>${choixApres}</select></div>`;
    }
  }
  // ── Valeur de départ ──
  if (f.colId && ['file', 'geo', 'dessin', 'classement'].indexOf(f.widget) === -1 && !f.kind) {
    const dep = o.depart || {};
    const sources = [['', 'aucune'], ['aujourdhui', 'la date du jour'], ['maintenant', 'maintenant (date et heure)'], ['moi', 'le courriel de la personne connectée'],
      ['derniere', 'la dernière saisie sur cet appareil'], ['valeur', 'une valeur fixe']];
    html += `<div class="bloc__duo"><div class="fr-select-group"><label class="fr-label" for="dep-${si}-${fi}">Réponse proposée au départ ${hintIcon('Ce que la question montre avant qu’on y touche. Elle ne passe jamais devant une valeur déjà donnée, ni en modification d’une ligne.')}</label>
      <select class="fr-select" id="dep-${si}-${fi}" onchange="App.onDepart(${si}, ${fi}, this.value, null)">
        ${sources.map(([v, l]) => `<option value="${v}" ${v === (dep.source || '') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      ${dep.source === 'valeur' ? `<div class="fr-input-group"><label class="fr-label" for="depv-${si}-${fi}">Valeur</label>
        <input class="fr-input" id="depv-${si}-${fi}" value="${esc(dep.valeur === undefined ? '' : dep.valeur)}" onchange="App.onDepart(${si}, ${fi}, 'valeur', this.value)"></div>` : ''}</div>`;
  }
  // ── Lieu : toucher la carte, taper une adresse, ou les deux ──
  if (f.widget === 'geo' && (o.geometrie || 'Point') === 'Point' && window.FormSaisies && window.FormReferentiel) {
    const m = o.saisieLieu || 'carte';
    html += `<div class="fr-select-group"><label class="fr-label" for="lieu-${si}-${fi}">Comment indiquer le lieu ? ${hintIcon('Les deux donnent le même point. Une adresse est choisie dans la Base adresse nationale ; la recherche ne part que sur demande.')}</label>
      <select class="fr-select" id="lieu-${si}-${fi}" onchange="App.onSaisieLieu(${si}, ${fi}, this.value)">
        <option value="carte" ${m === 'carte' ? 'selected' : ''}>Toucher la carte</option>
        <option value="les-deux" ${m === 'les-deux' ? 'selected' : ''}>Carte ou adresse, au choix</option>
        <option value="adresse" ${m === 'adresse' ? 'selected' : ''}>Taper une adresse</option></select></div>`;
  }
  // ── Groupe : des questions lues comme un seul geste (nom, prénom, courriel) ──
  if (!(f.options && f.options.matrice)) {
    const groupeCourant = (f.options && f.options.groupe) || '';
    const definis = def.groupes || {};
    const choixGroupe = Object.keys(definis).map(k =>
      `<option value="${esc(k)}" ${groupeCourant === k ? 'selected' : ''}>${esc((definis[k] || {}).titre || k)}</option>`).join('');
    const g = groupeCourant ? (definis[groupeCourant] || {}) : null;
    html += `<div class="fr-select-group"><label class="fr-label" for="grp-${si}-${fi}">Groupe
        ${hintIcon('Les questions qui se suivent dans un même groupe forment un bloc sous une légende, côte à côte quand la place le permet.')}</label>
      <select class="fr-select" id="grp-${si}-${fi}" onchange="App.onGroupe(${si}, ${fi}, this.value)">
        <option value="">Aucun</option>${choixGroupe}<option value="__nouveau">+ Nouveau groupe…</option></select></div>`;
    if (g) {
      html += `<div class="bloc__duo">
        <div class="fr-input-group"><label class="fr-label" for="grp-t-${si}-${fi}">Légende du groupe</label>
          <input class="fr-input" id="grp-t-${si}-${fi}" value="${esc(g.titre || '')}" oninput="App.onGroupeDef('${escJs(groupeCourant)}', 'titre', this.value)"></div>
        <div class="fr-select-group"><label class="fr-label" for="grp-c-${si}-${fi}">Disposition</label>
          <select class="fr-select" id="grp-c-${si}-${fi}" onchange="App.onGroupeDef('${escJs(groupeCourant)}', 'colonnes', this.value)">
            <option value="1" ${g.colonnes === 2 ? '' : 'selected'}>Les unes sous les autres</option>
            <option value="2" ${g.colonnes === 2 ? 'selected' : ''}>Côte à côte si la place le permet</option></select></div>
      </div>`;
    }
  }
  // ── Lieu : la précision du GPS, quand la personne s'est localisée avec son appareil ──
  if (f.widget === 'geo' && (o.geometrie || 'Point') === 'Point') {
    const numeriques = (S.columnsByTable[def.tableId] || []).filter(c => c.type === 'Numeric' || c.type === 'Int');
    const courantePrec = o.precisionCol || '';
    const choixPrec = numeriques.map(c => `<option value="${esc(c.colId)}" ${c.colId === courantePrec ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('');
    html += `<div class="fr-select-group"><label class="fr-label" for="prec-${si}-${fi}">Noter la précision du GPS (en mètres) dans
        ${hintIcon('Remplie seulement quand la personne utilise « Ma position ». Vide si le point est posé sur la carte ou choisi par adresse.')}</label>
      <select class="fr-select" id="prec-${si}-${fi}" onchange="App.onPrecision(${si}, ${fi}, this.value)">
        <option value="">— ne pas la noter —</option>${choixPrec}</select></div>`;
  }
  // ── Clavier : ce que le téléphone ouvre pour une saisie de texte ou de nombre ──
  if ((f.type === 'Text' || f.type === 'Int' || f.type === 'Numeric') && !f.kind && ['text', 'number'].includes(f.widget)) {
    const modeClavier = (o.clavier && o.clavier.inputmode) || '';
    const claviers = [['', 'Automatique (selon le format)'], ['text', 'Lettres'], ['numeric', 'Chiffres'], ['decimal', 'Chiffres et virgule'],
      ['tel', 'Téléphone'], ['email', 'Courriel'], ['url', 'Adresse web'], ['search', 'Recherche']];
    html += `<div class="fr-select-group"><label class="fr-label" for="clav-${si}-${fi}">Clavier du téléphone
        ${hintIcon('Le clavier qui s’ouvre. Laisser « Automatique » : il se déduit du format et du type de la colonne.')}</label>
      <select class="fr-select" id="clav-${si}-${fi}" onchange="App.onClavier(${si}, ${fi}, this.value)">
        ${claviers.map(([v, l]) => `<option value="${v}" ${v === modeClavier ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  }
  // ── Lieu : ce que les services publics savent du point posé ──
  const enrichir = window.FormEnrichir;
  if (enrichir && f.widget === 'geo' && (o.geometrie || 'Point') === 'Point') {
    const cols = (o.enrichir && o.enrichir.colonnes) || {};
    const colonnes = (S.columnsByTable[def.tableId] || []);
    const lignes = Object.keys(enrichir.SENS).map(sens => {
      const attendu = enrichir.SENS[sens];
      const candidates = colonnes.filter(c => c.type === attendu || (attendu === 'Text' && c.type === 'Text'));
      const choix = candidates.map(c => `<option value="${esc(c.colId)}" ${c.colId === cols[sens] ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('');
      return `<div class="fr-select-group"><label class="fr-label" for="enr-${si}-${fi}-${sens}">${esc(sens)}</label>
        <select class="fr-select" id="enr-${si}-${fi}-${sens}" onchange="App.onEnrichir(${si}, ${fi}, '${sens}', this.value)">
          <option value="">— ne pas remplir —</option>${choix}</select></div>`;
    }).join('');
    html += `
      <details class="fr-mt-1w" ${Object.keys(cols).length ? 'open' : ''}><summary class="fr-label">Compléter le lieu avec les services publics</summary>
        <p class="fr-hint-text">La position choisie est envoyée aux services concernés ; le formulaire le dit sous la carte. Un service qui ne répond pas laisse ses colonnes vides.</p>
        <div class="bloc__duo">${lignes}</div>
      </details>`;
  }
  // ── Format : un texte qui doit être un IBAN, un SIRET… ──
  const formats = window.FormFormats;
  if (formats && f.type === 'Text' && !f.kind && f.widget !== 'geo' && f.widget !== 'dessin') {
    const courant = (o.validation && o.validation.format) || '';
    const choix = Object.keys(formats.FORMATS).map(id =>
      `<option value="${esc(id)}" ${id === courant ? 'selected' : ''}>${esc(formats.FORMATS[id].libelle)}</option>`).join('');
    html += `
      <div class="fr-select-group"><label class="fr-label" for="fmt-${si}-${fi}">Vérifier la forme de la réponse ${hintIcon('Un calcul ou un motif, jamais un appel à un service : la valeur ne quitte pas la page. Le même contrôle peut être refait côté Grist (voir l’envoi externe).')}</label>
        <select class="fr-select" id="fmt-${si}-${fi}" onchange="App.onValidation(${si}, ${fi}, this.value)">
          <option value="">— aucun —</option>${choix}
        </select></div>`;
    if (courant && formats.peutCorrigerSeulement && formats.peutCorrigerSeulement(courant)) {
      const mode = (o.validation && o.validation.mode) === 'verifier' ? 'verifier' : ((o.validation && o.validation.mode) === 'corriger' ? 'corriger' : 'verifier');
      html += `
      <div class="fr-select-group"><label class="fr-label" for="fmtm-${si}-${fi}">Si ce n’est pas la bonne forme ${hintIcon('Pour un nom, mieux vaut corriger que refuser : une personne qui n’a qu’un mot dans son nom, ou un nom à particule, ne doit jamais être bloquée. Les initiales et les espaces sont remis en ordre, ce qui est déjà bien écrit (« McDonald ») n’est pas touché.')}</label>
        <select class="fr-select" id="fmtm-${si}-${fi}" onchange="App.onValidationMode(${si}, ${fi}, this.value)">
          <option value="corriger" ${mode === 'corriger' ? 'selected' : ''}>La corriger, sans rien refuser — recommandé</option>
          <option value="verifier" ${mode === 'verifier' ? 'selected' : ''}>Demander de la corriger</option>
        </select></div>`;
    }
  }
  // ── Valeur reçue par l'adresse de la page (QR code) ──
  const p = o.prefill || {};
  if (f.colId && ['file', 'geo', 'dessin'].indexOf(f.widget) === -1) {
    html += `
      <details class="fr-mt-1w" ${p.param ? 'open' : ''}><summary class="fr-label">Préremplir depuis le lien (QR code, adresse de la page)</summary>
        <div class="fr-input-group"><label class="fr-label" for="pf-${si}-${fi}">Nom dans l’adresse ${hintIcon('Un QR code collé sur un objet ouvre le formulaire avec ce paramètre : ?objet=123. Rien n’est repris sans ce réglage. C’est une commodité, pas une protection : une adresse se fabrique à la main.')}</label>
          <input class="fr-input" id="pf-${si}-${fi}" value="${esc(p.param || '')}" placeholder="objet" pattern="[a-z][a-z0-9_]{0,31}"
            oninput="App.onPrefill(${si}, ${fi}, 'param', this.value)"></div>
        <div class="fr-checkbox-group"><input type="checkbox" id="pfv-${si}-${fi}" ${p.verrouille ? 'checked' : ''}
          onchange="App.onPrefill(${si}, ${fi}, 'verrouille', this.checked)">
          <label class="fr-label" for="pfv-${si}-${fi}">La personne ne peut pas la changer</label></div>
        <div class="fr-input-group"><label class="fr-label" for="pfl-${si}-${fi}">Nom dans l’adresse du texte à montrer</label>
          <input class="fr-input" id="pfl-${si}-${fi}" value="${esc(p.libelleParam || '')}" placeholder="objet_nom"
            oninput="App.onPrefill(${si}, ${fi}, 'libelleParam', this.value)"></div>
      </details>`;
  }
  return html;
}

function renderReglagesSaisieSpecifiques(def, si, f, fi, isBind) {
  const o = f.options || {};
  const cols = o.colonnes || {};
  const texte = (S.columnsByTable[def.tableId] || []).filter(c => c.type === 'Text');
  const choix = (S.columnsByTable[def.tableId] || []).filter(c => c.type === 'Choice');
  const optCols = (liste, courant) => liste.map(c =>
    `<option value="${esc(c.colId)}" ${c.colId === courant ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('');

  // ── Oui / Non : les deux mots qu'on lit ──
  if (f.widget === 'ouinon') {
    return `
      <div class="bloc__duo">
        <div class="fr-input-group"><label class="fr-label" for="oui-${si}-${fi}">Mot pour « oui » ${hintIcon('« Oui », « Tout à fait », « J’y suis favorable »… Ce que le public lit sur le bouton.')}</label>
          <input class="fr-input" id="oui-${si}-${fi}" value="${esc(o.libelleOui || '')}" placeholder="Oui"
            oninput="App.onFieldOption(${si}, ${fi}, 'libelleOui', this.value)"></div>
        <div class="fr-input-group"><label class="fr-label" for="non-${si}-${fi}">Mot pour « non »</label>
          <input class="fr-input" id="non-${si}-${fi}" value="${esc(o.libelleNon || '')}" placeholder="Non"
            oninput="App.onFieldOption(${si}, ${fi}, 'libelleNon', this.value)"></div>
      </div>
      <p class="fr-hint-text">Sans réponse, Grist écrira « non » : une question qui doit distinguer « non » de « sans réponse » se pose en liste de choix.</p>`;
  }

  // ── Adresse : d'ou viennent les propositions, et ou ranger ce qu'elles apportent ──
  if (f.kind === 'referentiel') {
    const r = o.referentiel || {};
    const api = window.FormReferentiel;
    const source = r.source || 'ban';
    const connue = !!(api && api.sourceConnue(source));
    const sens = connue ? api.annexesDe(source) : {};
    const annexes = cols.annexes || {};
    const colonnes = S.columnsByTable[def.tableId] || [];
    const frappe = r.declenchement === 'frappe';

    const ligneAnnexe = (cle) => {
      const modele = sens[cle];
      const courant = annexes[cle] || '';
      if (isBind) {
        // Une table qui existe : on choisit une colonne du bon type, sans en retaper le nom.
        // Pas la colonne du texte lui-même : y ranger un code postal écraserait l'adresse.
        const memeType = colonnes.filter((c) => c.type === modele.type && c.colId !== f.colId);
        return `
          <div class="fr-select-group">
            <label class="fr-label" for="ann-${si}-${fi}-${cle}">${esc(modele.label)}</label>
            <select class="fr-select" id="ann-${si}-${fi}-${cle}"
              onchange="App.onReferentielAnnexe(${si}, ${fi}, '${cle}', this.value)">
              <option value="">— ne pas l’enregistrer —</option>${optCols(memeType, courant)}
            </select>
          </div>`;
      }
      // Une table à créer : on coche, et le nom se déduit — il n'y a pas de colonne à choisir.
      return `
        <div class="fr-checkbox-group">
          <input type="checkbox" id="ann-${si}-${fi}-${cle}" ${courant ? 'checked' : ''}
            onchange="App.onReferentielAnnexeCase(${si}, ${fi}, '${cle}', this.checked)">
          <label class="fr-label" for="ann-${si}-${fi}-${cle}">${esc(modele.label)}
            ${courant ? `<span class="fr-hint-text">colonne « ${esc(courant)} »</span>` : ''}</label>
        </div>`;
    };

    return `
      ${connue ? '' : `<div class="fr-alert fr-alert--warning"><p>La source « ${esc(source)} » n’est pas connue de ce moteur : le champ restera un champ texte.</p></div>`}
      <div class="fr-select-group">
        <label class="fr-label" for="ref-src-${si}-${fi}">Source des propositions ${hintIcon('Aujourd’hui : la Base Adresse Nationale, par le service de géocodage de la Géoplateforme.')}</label>
        <select class="fr-select" id="ref-src-${si}-${fi}" onchange="App.onReferentiel(${si}, ${fi}, 'source', this.value)">
          <option value="ban" selected>${esc(api && api.SOURCES.ban ? api.SOURCES.ban.nom : 'Base Adresse Nationale')}</option>
        </select>
      </div>
      <div class="fr-select-group">
        <label class="fr-label" for="ref-decl-${si}-${fi}">Quand chercher ${hintIcon('Sur validation, rien n’est envoyé au service que la personne n’ait demandé : c’est le plus prudent, une adresse étant souvent celle d’une personne. À la frappe, chaque pause envoie un début d’adresse.')}</label>
        <select class="fr-select" id="ref-decl-${si}-${fi}" onchange="App.onReferentiel(${si}, ${fi}, 'declenchement', this.value)">
          <option value="validation" ${frappe ? '' : 'selected'}>Quand la personne valide (Entrée ou bouton) — recommandé</option>
          <option value="frappe" ${frappe ? 'selected' : ''}>À mesure qu’elle tape</option>
        </select>
      </div>
      ${connue ? `
      <p class="bloc__intitule">Ce que la liste apporte <span>enregistré à côté du texte, pour l’adresse choisie seulement</span></p>
      ${Object.keys(sens).map(ligneAnnexe).join('')}
      <p class="fr-hint-text">Si la personne corrige l’adresse après l’avoir choisie, ces colonnes restent vides : elles décriraient une autre adresse. Sans réponse du service, ce qu’elle tape est enregistré tel quel.</p>
      <p class="fr-hint-text">${esc(api.SOURCES[source].mention)} Cette mention s’affiche sous le champ.</p>` : ''}`;
  }

  // ── Dessin : ce qu'on demande de composer ──
  if (f.widget === 'dessin') {
    const d = o.dessin || {};
    const usage = d.usage || 'croquis';
    return `
      <div class="fr-select-group">
        <label class="fr-label" for="des-u-${si}-${fi}">Ce qu’on demande ${hintIcon('Une signature se fait d’un trait, en noir, dans un cadre large : ni palette, ni annulation. Un croquis se construit.')}</label>
        <select class="fr-select" id="des-u-${si}-${fi}" onchange="App.onDessin(${si}, ${fi}, 'usage', this.value)">
          <option value="croquis" ${usage === 'croquis' ? 'selected' : ''}>Un croquis, ou une annotation</option>
          <option value="signature" ${usage === 'signature' ? 'selected' : ''}>Une signature</option>
        </select>
      </div>
      ${usage === 'croquis' ? `
      <div class="fr-input-group">
        <label class="fr-label" for="des-f-${si}-${fi}">Fond à annoter ${hintIcon('Une photo, un plan, un schéma : la personne dessine dessus, et le fond part dans l’image. Laissez vide pour un canevas blanc.')}</label>
        <input class="fr-input" id="des-f-${si}-${fi}" value="${esc(d.fond || '')}" placeholder="https://…"
          onchange="App.onDessin(${si}, ${fi}, 'fond', this.value)">
        <input class="fr-input fr-mt-1w" type="file" accept="image/*"
          aria-label="Choisir un fond sur cet appareil"
          onchange="App.onDessinFichier(${si}, ${fi}, this.files && this.files[0])">
      </div>` : ''}
      <div class="fr-input-group">
        <label class="fr-label" for="des-h-${si}-${fi}">Hauteur du cadre (pixels)</label>
        <input class="fr-input" id="des-h-${si}-${fi}" type="number" min="120" max="700" step="20"
          value="${d.hauteur || (usage === 'signature' ? 180 : 320)}"
          onchange="App.onDessin(${si}, ${fi}, 'hauteur', this.value)">
      </div>
      <p class="fr-hint-text">Le dessin part en pièce jointe, comme une photo. La colonne doit être de type <code>Attachments</code>.</p>
      <p class="fr-hint-text">Un canevas ne se remplit pas au clavier : ne rendez cette question obligatoire que si la réponse peut aussi se donner autrement.</p>`;
  }

  // ── Classement : combien de rangs, et ou ils vont ──
  if (f.kind === 'classement') {
    const rangs = o.rangs || (cols.rangs || []).length || 3;
    const lignes = [];
    for (let r = 0; r < rangs; r++) {
      lignes.push(`
        <div class="fr-select-group"><label class="fr-label" for="rang-${si}-${fi}-${r}">Colonne du ${r + 1}${r === 0 ? 'ᵉʳ' : 'ᵉ'} choix</label>
          <select class="fr-select" id="rang-${si}-${fi}-${r}" onchange="App.onFieldRang(${si}, ${fi}, ${r}, this.value)">
            <option value="">— choisir —</option>${optCols(choix, (cols.rangs || [])[r])}
          </select></div>`);
    }
    return `
      <div class="fr-input-group"><label class="fr-label" for="nbr-${si}-${fi}">Nombre de rangs retenus ${hintIcon('Les propositions au-delà ne sont pas des réponses : elles n’ont pas été classées.')}</label>
        <input class="fr-input" id="nbr-${si}-${fi}" type="number" min="1" max="10" value="${rangs}"
          onchange="App.onFieldRangs(${si}, ${fi}, this.value)"></div>
      <div class="bloc__duo">${lignes.join('')}</div>
      ${renderReglageAutre(def, si, f, fi, texte, optCols)}`;
  }

  // ── Listes : plafond de cases, et reponse libre ──
  const estChoix = f.type === 'Choice' || f.type === 'ChoiceList';
  if (estChoix) {
    const plafond = f.type === 'ChoiceList' ? `
      <div class="fr-input-group"><label class="fr-label" for="max-${si}-${fi}">Nombre maximal de réponses ${hintIcon('Laissez vide pour ne pas limiter. Le public voit le compte, et les autres cases se grisent une fois le compte atteint.')}</label>
        <input class="fr-input" id="max-${si}-${fi}" type="number" min="1" placeholder="sans limite"
          value="${o.maxSelected || ''}" onchange="App.onFieldMax(${si}, ${fi}, this.value)"></div>` : '';
    return plafond + renderReglageAutre(def, si, f, fi, texte, optCols);
  }
  return '';
}

/**
 * « Autre : … » — la case qui l'autorise, la colonne qui le recueille, et ce
 * que la liste doit proposer pour que ça marche.
 *
 * > **L'etat ne se deduit pas de la colonne choisie.** Il etait porte par la
 * > presence de `colonnes.autre` : cocher la case sans avoir encore designe la
 * > colonne la decochait aussitot. C'est `options.autreLibre` qui dit l'intention,
 * > et la colonne se choisit ensuite.
 *
 * En mode liaison, la valeur « Autre » doit figurer dans la liste de la
 * colonne, sinon Grist l'encadrera en rouge. On le dit, et on propose de
 * l'ajouter a la colonne — c'est un geste sur le document, il se demande.
 */
function renderReglageAutre(def, si, f, fi, texte, optCols) {
  const o = f.options || {};
  const cols = o.colonnes || {};
  const actif = !!o.autreLibre;
  const mot = o.valeurAutre || 'Autre';
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  const listeColonne = (colonne && colonne.choix) || null;
  const manqueDansListe = actif && def.composeMode === 'bind' && listeColonne && listeColonne.indexOf(mot) === -1;
  return `
    <div class="fr-checkbox-group fr-mt-1w">
      <input type="checkbox" id="autre-${si}-${fi}" ${actif ? 'checked' : ''}
        onchange="App.onFieldAutre(${si}, ${fi}, this.checked)">
      <label class="fr-label" for="autre-${si}-${fi}">Autoriser une réponse libre ${hintIcon('Une option « Autre » s’ajoute à la liste, et ce que la personne écrit va dans une colonne de texte à part — écrit dans la liste, Grist le garderait mais l’encadrerait en rouge.')}</label>
    </div>
    ${actif ? `
      <div class="bloc__duo">
        <div class="fr-select-group"><label class="fr-label" for="autrecol-${si}-${fi}">Colonne de la précision</label>
          <select class="fr-select" id="autrecol-${si}-${fi}" onchange="App.onFieldAutreCol(${si}, ${fi}, this.value)">
            <option value="">— choisir une colonne texte —</option>${optCols(texte, cols.autre || '')}
          </select></div>
        <div class="fr-input-group"><label class="fr-label" for="autreval-${si}-${fi}">Mot affiché</label>
          <input class="fr-input" id="autreval-${si}-${fi}" value="${esc(o.valeurAutre || '')}" placeholder="Autre"
            onchange="App.onFieldOption(${si}, ${fi}, 'valeurAutre', this.value)"></div>
      </div>
      ${!cols.autre ? `<p class="fr-hint-text">Sans colonne de précision, la réponse libre ne serait enregistrée nulle part.</p>` : ''}
      ${manqueDansListe ? `
        <div class="fr-alert fr-alert--warning fr-mt-1w">
          <p>La colonne « ${esc(f.colId)} » ne propose pas « ${esc(mot)} » : Grist encadrerait la réponse en rouge.</p>
          <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-mt-1w"
            onclick="App.ajouterChoixALaColonne(${si}, ${fi})">Ajouter « ${esc(mot)} » à la colonne</button>
        </div>` : ''}` : ''}`;
}

/**
 * Le plan du formulaire entier, d'un coup d'oeil.
 *
 * Le rail montre les etapes, le canevas une etape a la fois : sur soixante
 * questions, il manquait l'endroit ou l'on voit tout — pour verifier l'ordre,
 * reperer un doublon, retrouver « cette question-la, quelque part ». Il
 * s'ouvre a la demande, et chaque ligne mene a la question.
 */
function ouvrirPlan() {
  const menu = document.getElementById('menu-options');
  if (menu) menu.open = false;
  const def = S.currentDef;
  if (!def) { toast('Ouvrez d\u2019abord un formulaire', 'error'); return; }
  const soucis = verifierFormulaire(def);
  const parQuestion = {};
  soucis.forEach(x => { parQuestion[x.si + ':' + x.fi] = (parQuestion[x.si + ':' + x.fi] || 0) + 1; });

  const etapes = def.sections.map((section, si) => {
    const questions = (section.fields || []).map((f, fi) => `
      <button type="button" class="plan__question" onclick="App.allerA(${si}, ${fi})">
        <span class="plan__rang">${fi + 1}</span>
        <span class="plan__intitule">${esc(f.label || f.colId || 'Sans libell\u00e9')}</span>
        ${marquesDeChamp(f)}
        <span class="plan__nature">${esc(natureCourte(f))}</span>
        ${parQuestion[si + ':' + fi] ? `<span class="plan__souci" title="\u00c0 regarder">!</span>` : ''}
      </button>`).join('');
    return `
      <section class="plan__etape">
        <h4 class="plan__etape-titre">${si + 1}. ${esc(section.label || 'Sans titre')}
          <span class="plan__compte">${(section.fields || []).length}</span></h4>
        ${questions || '<p class="fr-hint-text">Aucune question.</p>'}
      </section>`;
  }).join('');

  const nbQ = def.sections.reduce((n, s2) => n + (s2.fields || []).length, 0);
  ouvrirModale(`Plan de \u00ab ${esc(def.title || 'Sans titre')} \u00bb`, `
    <p class="fr-hint-text">${def.sections.length} \u00e9tape(s) \u00b7 ${nbQ} question(s)${soucis.length ? ' \u00b7 ' + soucis.length + ' point(s) \u00e0 regarder' : ''}</p>
    <div class="plan__grille">${etapes}</div>`);
}

/** Aller droit a une question depuis le plan. */
function allerA(si, fi) {
  fermerModale();
  goStep('builder');
  choisir('question', si, fi);
}

/**
 * Illustrer une question.
 *
 * > **Une question ne se comprend pas toujours avec des mots.** « Classez ces
 * > cinq lieux » suppose qu'on sache ou ils sont. Le questionnaire ecrit a la
 * > main posait une carte au-dessus du classement ; ici, n'importe quelle
 * > question peut porter une image, une carte, ou une page entiere.
 *
 * L'image vient d'une URL ou d'un fichier depose — le meme geste que pour le
 * logo du questionnaire, et le meme garde-fou sur l'adresse. La carte situe
 * des reperes, qu'on pose en cliquant : les saisir en chiffres serait demander
 * des coordonnees a quelqu'un qui regarde un quartier. La page integree, elle,
 * ouvre le formulaire sur ce qui existe deja ailleurs : une vue Grist publiee,
 * un tableau de bord, un autre widget du depot — le repondant decide devant
 * le contexte, au lieu de l'avoir lu dans un courriel une heure plus tot.
 */
function renderIllustrationDuChamp(def, si, f, fi) {
  const ill = (f.options && f.options.illustration) || null;
  const type = ill && ill.type ? ill.type : '';
  const choix = [['', 'Aucune'], ['image', 'Une image'], ['carte', 'Une carte'],
    ['inclusion', 'Une page (vue Grist, tableau de bord, widget…)']]
    .map(([v, l]) => `<option value="${v}" ${type === v ? 'selected' : ''}>${l}</option>`).join('');

  let corps = '';
  if (type === 'image') {
    corps = `
      <div class="fr-input-group">
        <label class="fr-label" for="ill-url-${si}-${fi}">Adresse de l’image</label>
        <input class="fr-input" id="ill-url-${si}-${fi}" value="${esc(ill.url || '')}" placeholder="https://…"
          onchange="App.onIllustration(${si}, ${fi}, 'url', this.value)">
        <input class="fr-input fr-mt-1w" type="file" accept="image/*"
          aria-label="Choisir une image sur cet appareil"
          onchange="App.onIllustrationFichier(${si}, ${fi}, this.files && this.files[0])">
      </div>
      <div class="bloc__duo">
        <div class="fr-input-group">
          <label class="fr-label" for="ill-alt-${si}-${fi}">Description de l’image ${hintIcon('Ce que lira quelqu’un qui ne voit pas l’image. Obligatoire si l’image porte l’information.')}</label>
          <input class="fr-input" id="ill-alt-${si}-${fi}" value="${esc(ill.alt || '')}"
            onchange="App.onIllustration(${si}, ${fi}, 'alt', this.value)">
        </div>
        <div class="fr-input-group">
          <label class="fr-label" for="ill-leg-${si}-${fi}">Légende</label>
          <input class="fr-input" id="ill-leg-${si}-${fi}" value="${esc(ill.legende || '')}"
            onchange="App.onIllustration(${si}, ${fi}, 'legende', this.value)">
        </div>
      </div>
      ${ill.url && !ill.alt ? `<p class="fr-hint-text">Sans description, l’image n’existe pas pour qui ne la voit pas.</p>` : ''}`;
  } else if (type === 'inclusion') {
    corps = `
      <div class="fr-input-group">
        <label class="fr-label" for="ill-src-${si}-${fi}">Adresse de la page ${hintIcon('Une vue Grist publiée, un tableau de bord, un plan, un widget… En https : la page s’exécute chez la personne qui répond.')}</label>
        <input class="fr-input" id="ill-src-${si}-${fi}" value="${esc(ill.url || '')}" placeholder="https://…"
          onchange="App.onIllustration(${si}, ${fi}, 'url', this.value)">
      </div>
      <div class="bloc__duo">
        <div class="fr-input-group">
          <label class="fr-label" for="ill-h-${si}-${fi}">Hauteur (pixels)</label>
          <input class="fr-input" id="ill-h-${si}-${fi}" type="number" min="120" max="900" step="20"
            value="${ill.hauteur || 320}" onchange="App.onIllustration(${si}, ${fi}, 'hauteur', this.value)">
        </div>
        <div class="fr-input-group">
          <label class="fr-label" for="ill-t-${si}-${fi}">Ce que la page montre ${hintIcon('Lu par les lecteurs d’écran à la place du contenu intégré.')}</label>
          <input class="fr-input" id="ill-t-${si}-${fi}" value="${esc(ill.titre || '')}"
            onchange="App.onIllustration(${si}, ${fi}, 'titre', this.value)">
        </div>
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="ill-legi-${si}-${fi}">Légende</label>
        <input class="fr-input" id="ill-legi-${si}-${fi}" value="${esc(ill.legende || '')}"
          onchange="App.onIllustration(${si}, ${fi}, 'legende', this.value)">
      </div>
      <p class="fr-hint-text">La page est isolée (bac à sable) : elle ne partage ni l’origine, ni les cookies du formulaire.</p>`;
  } else if (type === 'carte') {
    const reperes = ill.reperes || [];
    const options = def.choices[f.colId] || (f.options && f.options.choices) || [];
    corps = `
      <p class="fr-hint-text">Cliquez sur la carte pour poser le repère de la proposition choisie.</p>
      <div class="fr-select-group">
        <label class="fr-label" for="ill-rep-${si}-${fi}">Proposition à placer</label>
        <select class="fr-select" id="ill-rep-${si}-${fi}" onchange="App.illustrationRepere(${si}, ${fi}, this.value)">
          <option value="">— choisir —</option>
          ${options.map((o, k) => {
            const pose = reperes.find((r) => r.option === o);
            return `<option value="${esc(o)}">${String.fromCharCode(65 + k)} · ${esc(o)}${pose ? ' ✓' : ''}</option>`;
          }).join('')}
        </select>
      </div>
      <div class="fr-carte fr-carte--composer" id="ill-carte-${si}-${fi}"
        data-champ="${si}-${fi}"><p class="fr-hint-text">La carte s’affiche ici.</p></div>
      <p class="fr-hint-text">${reperes.length} repère(s) posé(s)${reperes.length ? ' — ' + esc(reperes.map((r) => r.etiquette).join(', ')) : ''}</p>
      ${reperes.length ? `<button type="button" class="fr-btn fr-btn--tertiary fr-btn--sm" onclick="App.illustrationViderReperes(${si}, ${fi})">Retirer les repères</button>` : ''}`;
  }

  return `
    <div class="fr-select-group fr-mt-1w">
      <label class="fr-label" for="ill-${si}-${fi}">Illustration ${hintIcon('Ce qui se montre avant la question : une image, ou une carte qui situe ce dont on parle.')}</label>
      <select class="fr-select" id="ill-${si}-${fi}" onchange="App.onIllustrationType(${si}, ${fi}, this.value)">${choix}</select>
    </div>
    ${corps}`;
}

/** La sélection courante, ramenée à quelque chose qui existe encore. */
function normaliserSelection() {
  const def = S.currentDef;
  const sel = S.selection || { quoi: 'accueil' };
  if (sel.quoi === 'question') {
    const section = def.sections[sel.si];
    S.selection = (section && section.fields[sel.fi]) ? sel : { quoi: 'accueil' };
  } else if (sel.quoi === 'etape') {
    S.selection = def.sections[sel.si] ? sel : { quoi: 'accueil' };
  } else {
    S.selection = sel;
  }
}

function selectionEst(quoi, si, fi) {
  const s = S.selection || {};
  if (s.quoi !== quoi) return false;
  if (si != null && s.si !== si) return false;
  if (fi != null && s.fi !== fi) return false;
  return true;
}

/** Choisir ce qu'on compose : la zone centrale et l'aperçu suivent. */
function choisir(quoi, si, fi) {
  const avant = S.selection || {};
  // Les réglages d'une autre question repartent du haut ; la page d'édition ne bouge que si l'on
  // change d'étape (passer d'une question à sa voisine ne doit pas la faire sauter).
  const memeEtape = avant.quoi === 'question' && quoi === 'question' && avant.si === si;
  S._remiseDefilement = { '.inspecteur': true, '.inspecteur__corps': true };
  if (!memeEtape) S._remiseDefilement['.canevas'] = true;
  S.selection = { quoi: quoi, si: si, fi: fi };
  renderBuilder();
}

/**
 * Régler une question en cliquant dessus, pas seulement sur la roue : la carte est l'image de ce que
 * le public verra, c'est elle qu'on vise. Les boutons de la barre (monter, dupliquer, déplacer…)
 * gardent leur geste ; une question déjà ouverte n'est pas rouverte (on ne perd ni le défilement,
 * ni le focus des réglages).
 */
function choisirSurClic(evenement, si, fi) {
  const cible = evenement && evenement.target;
  if (cible && cible.closest && cible.closest('button, select, a, input, textarea, label')) return;
  if (selectionEst('question', si, fi)) return;
  choisir('question', si, fi);
}

/** Même geste au clavier : Entrée ou Espace sur la carte (pas sur un bouton qu'elle contient). */
function choisirAuClavier(evenement, si, fi) {
  if (!evenement || evenement.target !== evenement.currentTarget) return;
  if (evenement.key !== 'Enter' && evenement.key !== ' ') return;
  evenement.preventDefault();
  if (!selectionEst('question', si, fi)) choisir('question', si, fi);
}

/**
 * Ce qui pèse sur une question, en marques : obligatoire, conditionnelle, liée
 * à une autre, groupée en matrice. On voit d'un coup d'œil où sont les
 * enchaînements, sans ouvrir une à une les soixante questions.
 */
function marquesDeChamp(f) {
  const m = [];
  if (f.required) m.push('<span class="structure__marque" title="Réponse obligatoire">●</span>');
  if (f.condition) m.push('<span class="structure__marque" title="Ne s’affiche que sous condition">⤳</span>');
  if ((f.cascade && f.cascade.parentField) || (f.dynamicFilter && f.dynamicFilter.parentField)) {
    m.push('<span class="structure__marque" title="Sa liste dépend d’une autre réponse">⇄</span>');
  }
  if (f.options && f.options.matrice) m.push('<span class="structure__marque" title="Groupée en matrice">▦</span>');
  if (f.options && f.options.groupe) m.push('<span class="structure__marque" title="Dans un groupe de questions">▭</span>');
  if (f.options && f.options.autreLibre) m.push('<span class="structure__marque" title="Accepte une réponse libre">✎</span>');
  if (f.options && f.options.maxSelected) m.push(`<span class="structure__marque" title="Au plus ${f.options.maxSelected} réponses">≤${f.options.maxSelected}</span>`);
  return m.join('');
}

/** Ce qu'est une question, en deux mots, pour se repérer dans la structure. */
function natureCourte(f) {
  // Le `kind` et le widget disent ce qu'est la question mieux que son type
  // Grist : une géométrie se range dans du texte, et ce n'est pas du texte.
  if (f.kind === 'echelle') return 'échelle';
  if (f.kind === 'geometrie' || f.widget === 'geo') return 'lieu';
  if (f.kind === 'referentiel') return 'adresse';
  if (f.kind === 'classement' || f.widget === 'classement') return 'classement';
  if (f.widget === 'ouinon') return 'oui/non';
  if (f.widget === 'radio') return 'choix en boutons';
  const parType = {
    Text: f.widget === 'textarea' ? 'paragraphe' : 'texte',
    Int: 'nombre', Numeric: 'nombre', Bool: 'oui/non',
    Date: 'date', DateTime: 'date et heure',
    Choice: 'choix', ChoiceList: 'choix multiples',
    Attachments: 'fichiers'
  };
  const t = String(f.type || '').replace(/:.*$/, '');
  if (t === 'Ref' || t === 'RefList') return 'référence';
  return parType[t] || (f.kind || f.widget || 'question');
}

/** Où partent les réponses : une ligne en pied de structure, pas un bloc. */
function renderCibleEtMode(def) {
  const isEnsure = def.composeMode === 'ensureSchema';
  const tableOptions = S.tables.map(t =>
    `<option value="${esc(t.tableId)}" ${t.tableId === def.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`
  ).join('');
  if (isEnsure) {
    return `
      <label class="fr-label fr-text--sm" for="cible-table">Table des réponses</label>
      <input class="fr-input" id="cible-table" list="tables-datalist" value="${esc(def.tableId)}" placeholder="Reponses_…"
        onchange="App.onTableChange(this.value)" oninput="App.onDefInput('tableId', this.value); App.onManualTableEdit()">
      <datalist id="tables-datalist">${S.tables.map(t => `<option value="${esc(t.tableId)}">`).join('')}</datalist>
      <p class="mode-hint">Colonnes créées à l’enregistrement —
        <button type="button" onclick="App.onComposeModeChange('bind')">utiliser des colonnes existantes</button></p>`;
  }
  return `
    <label class="fr-label fr-text--sm" for="cible-table">Table des réponses</label>
    <select class="fr-select" id="cible-table" onchange="App.onTableChange(this.value)">${tableOptions}</select>
    <p class="mode-hint">Colonnes existantes —
      <button type="button" onclick="App.onComposeModeChange('ensureSchema')">les créer automatiquement</button></p>`;
}

/**
 * Trois colonnes que personne ne remplit à la main : quand la réponse est arrivée, combien de temps
 * elle a pris, et qui l'a donnée quand l'hôte connaît la personne. Écrites à la création seulement.
 */
function renderMetaColonnes(def) {
  const meta = def.meta || {};
  const colonnes = S.columnsByTable[def.tableId] || [];
  const lignes = [
    ['timestampCol', 'Quand la réponse est arrivée', ['Date', 'DateTime', 'Numeric', 'Int'], 'Écrite en secondes, à la création.'],
    ['durationCol', 'Combien de temps elle a pris (secondes)', ['Numeric', 'Int'], 'Mesurée depuis le début du questionnaire.'],
    ['emailCol', 'Le courriel de la personne connectée', ['Text'], 'Rempli seulement quand l’hôte connaît la personne ; jamais demandé dans le formulaire.']
  ];
  const champs = lignes.map(([cle, libelle, types, aide]) => {
    const choix = colonnes.filter(c => types.includes(c.type)).map(c =>
      `<option value="${esc(c.colId)}" ${meta[cle] === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('');
    return `<div class="fr-select-group"><label class="fr-label" for="meta-${cle}">${esc(libelle)} ${hintIcon(aide)}</label>
      <select class="fr-select" id="meta-${cle}" onchange="App.onMeta('${cle}', this.value)">
        <option value="">— ne pas l’enregistrer —</option>${choix}</select></div>`;
  }).join('');
  return `<p class="bloc__intitule">Ce qui s’enregistre sans question <span>quand, combien de temps, qui</span></p>
      <div class="bloc__duo">${champs}</div>`;
}

/** Une question qui vise une table liée : `Ref`, `Ref:Table`, `RefList`. */
function estReference(f) {
  return !!f && /^Ref(List)?(:|$)/.test(String(f.type || ''));
}

/** La table qu'une référence vise, par son réglage ou par son type (`Ref:Salles`). */
function tableDeReference(f) {
  const r = resolveRefTableOfField(f);
  if (r) return r;
  const m = /^Ref(?:List)?:(.+)$/.exec(String((f && f.type) || ''));
  return m ? m[1] : '';
}

/** Les choix qu'une question propose (liste, cases, pastilles), tels que le formulaire les déclare. */
function choixDeQuestion(def, f) {
  const l = (def.choices && def.choices[f.colId]) || (f.options && f.options.choices) || [];
  return l.map(c => (c && typeof c === 'object') ? String(c.value) : String(c));
}

/**
 * Jusqu'où le formulaire accepte de réponses : un atelier de 12 places, une fenêtre d'ouverture, un plafond.
 * Le formulaire lit ce qui est pris et ferme ce qui est plein ; la table tranche par ordre d'arrivée (colonne
 * « Place ») quand deux envois se croisent. Voir docs/LIMITES.md.
 */
/** Une limite incomplète ou fausse se dit ici : elle serait sinon ignorée sans que personne ne le sache. */
function alerteLimites(def) {
  const verdict = (window.FormLimites && def.limites) ? FormLimites.normaliser(def.limites) : { erreurs: [] };
  return verdict.erreurs.length
    ? `<div class="fr-alert fr-alert--warning fr-mt-1w" role="status"><p>${verdict.erreurs.map(esc).join('<br>')}</p></div>` : '';
}

/** Remet l'alerte à jour sans redessiner le panneau (le champ en cours de saisie garde le focus). */
function majAlerteLimites() {
  const z = (typeof document !== 'undefined' && document.getElementById) ? document.getElementById('lim-alerte') : null;
  if (z && S.currentDef) z.innerHTML = alerteLimites(S.currentDef);
}

/** Une question dont on peut plafonner chaque choix : une liste, des cases, une référence. */
function estPlafonnable(f) {
  return !!f && !!f.colId && (['Choice', 'ChoiceList', 'Ref'].includes(f.type) || estReference(f)) && f.kind !== 'geometrie' && f.widget !== 'geo';
}

/** Le réglage du maximum par choix d'une question : un nombre pour tous, ou un nombre par choix. */
function reglageLimiteChoix(def, p, i, f) {
  if (estReference(f) || p.capaciteCol) {
    const cols = (S.columnsByTable[tableDeReference(f)] || []).filter(c => c.type === 'Int' || c.type === 'Numeric');
    return `<div class="fr-select-group"><label class="fr-label" for="lim-cap-${i}">Colonne de la table liée qui donne le maximum de chaque choix</label>
      <select class="fr-select" id="lim-cap-${i}" onchange="App.onLimiteChoix(${i}, 'capaciteCol', this.value)">
        <option value="">—</option>${cols.map(c => `<option value="${esc(c.colId)}" ${p.capaciteCol === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('')}</select></div>`;
  }
  const choix = choixDeQuestion(def, f);
  const valeurs = (p.max && typeof p.max === 'object') ? p.max : {};
  const commun = typeof p.max === 'number' ? p.max : '';
  return `<div class="fr-input-group"><label class="fr-label" for="lim-commun-${i}">Le même maximum pour tous les choix</label>
      <input class="fr-input" id="lim-commun-${i}" type="number" min="1" value="${esc(commun)}" placeholder="Pas de maximum" oninput="App.onLimiteChoix(${i}, 'maxCommun', this.value)"></div>
    ${choix.length ? `<p class="fr-hint-text">Ou un maximum propre à chaque choix (vide : pas de maximum) :</p>
    <div class="bloc__duo">${choix.map((c, k) => `<div class="fr-input-group"><label class="fr-label" for="lim-${i}-${k}">${esc(c)}</label>
      <input class="fr-input" id="lim-${i}-${k}" type="number" min="1" value="${esc(valeurs[c] !== undefined ? valeurs[c] : '')}"
