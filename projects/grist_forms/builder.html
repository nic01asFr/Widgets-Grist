function onFieldOption(si, fi, key, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (value === '' || value == null) delete f.options[key];
  else f.options[key] = value;
}

function onFieldLabelBlur(si, fi) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  if (def.composeMode !== 'ensureSchema') return;
  if (f._colIdLocked) return;
  if (!f.label) return;
  const oldColId = f.colId;
  const next = FormUx.slugify(f.label);
  if (!next || next === oldColId) return;
  f.colId = next;
  if (oldColId && oldColId !== next && def.choices[oldColId]) {
    def.choices[next] = def.choices[oldColId];
    delete def.choices[oldColId];
  }
  renderBuilder();
}

function onFieldColIdChange(si, fi, value) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  const oldColId = f.colId;
  f.colId = value;
  f._colIdLocked = true;
  if (def.composeMode === 'bind') {
    const col = (S.columnsByTable[def.tableId] || []).find(c => c.colId === value);
    if (col) {
      const rawType = col.type || 'Text';
      f.type = FormTypes.normalizeGristType(rawType);
      f.widget = FormTypes.defaultWidget(rawType);
      if (!f.label) f.label = col.label || value;
      f.options = f.options || {};
      if (rawType.indexOf('Ref:') === 0) { f.refTable = rawType.slice(4); f.options.refTable = f.refTable; }
      else if (rawType.indexOf('RefList:') === 0) { f.refTable = rawType.slice(8); f.options.refTable = f.refTable; }
      // Les options viennent de la colonne : c'est elle qui les détient, et une
      // liste saisie ici ne ferait que mentir sur ce que Grist acceptera.
      if (col.choix && col.choix.length) {
        f.options.choices = col.choix.slice();
        delete def.choices[value];
      } else {
        delete f.options.choices;
      }
    }
  }
  if (oldColId && oldColId !== value && def.choices[oldColId]) {
    def.choices[value] = def.choices[oldColId];
    delete def.choices[oldColId];
  }
  renderBuilder();
}

function onFieldTypeChange(si, fi, value) {

/** Ce que le canevas demande de composer. */
function onDessin(si, fi, cle, valeur) {

  const d = f.options.dessin || (f.options.dessin = {});
  marquerModifie();

    if (n > 0) d.hauteur = n; else delete d.hauteur;

    // Une signature ne s'annote pas : le fond n'aurait plus de sens.

/**
 * Un fond depose depuis l'appareil.
 *
 * Il part dans le FormDef en `data:`, comme l'illustration, et sous le meme
 * plafond : la definition se recharge a chaque ouverture du formulaire.
 */
function onDessinFichier(si, fi, fichier) {
  if (!fichier) return;
  const PLAFOND = 400 * 1024;
  if (fichier.size > PLAFOND) {
    toast('Fond trop lourd (' + Math.round(fichier.size / 1024) + ' Ko). Réduisez-le, ou donnez son adresse.', 'error');
    return;
  }
  const lecteur = new FileReader();
  lecteur.onload = () => onDessin(si, fi, 'fond', String(lecteur.result || ''));
  lecteur.readAsDataURL(fichier);
}

/** Quelle sorte d'illustration cette question porte. */
function onIllustrationType(si, fi, type) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (!type) delete f.options.illustration;
  else {
    const ancienne = f.options.illustration || {};
    if (type === 'carte') {
      f.options.illustration = { type: 'carte', fond: ancienne.fond || 'plan', reperes: ancienne.reperes || [] };
    } else if (type === 'inclusion') {
      f.options.illustration = { type: 'inclusion', url: ancienne.url || '', hauteur: ancienne.hauteur || 320,
        titre: ancienne.titre || '', legende: ancienne.legende || '' };
    } else {
      f.options.illustration = { type: 'image', url: ancienne.url || '', alt: ancienne.alt || '',
        legende: ancienne.legende || '' };
    }
  }
  marquerModifie();
  renderBuilder();
}

function onIllustration(si, fi, cle, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.options || !f.options.illustration) return;
  f.options.illustration[cle] = valeur;
  marquerModifie();
  renderBuilder();

/**
 * Une image deposee depuis l'appareil.
 *
 * Elle part dans le FormDef, en `data:` URL : un formulaire doit pouvoir
 * voyager — copie, publie, embarque — sans dependre d'un fichier reste
 * ailleurs. Au-dela de quelques centaines de kilo-octets, on refuse : la
 * definition se recharge a chaque ouverture, et une photo d'appareil la
 * rendrait lourde pour tout le monde.
 */
function onIllustrationFichier(si, fi, fichier) {
  if (!fichier) return;
  const PLAFOND = 400 * 1024;
  if (fichier.size > PLAFOND) {
    toast('Image trop lourde (' + Math.round(fichier.size / 1024) + ' Ko). Réduisez-la, ou donnez son adresse.', 'error');
    return;
  }
  const lecteur = new FileReader();
  lecteur.onload = () => {
    onIllustration(si, fi, 'url', String(lecteur.result || ''));
  };
  lecteur.readAsDataURL(fichier);
}

/** Combien de rangs un classement retient. */

  f.options = f.options || {};
  f.options.rangs = n;
  f.options.colonnes = f.options.colonnes || {};
  const rangs = (f.options.colonnes.rangs || []).slice(0, n);
  while (rangs.length < n) rangs.push('');
  f.options.colonnes.rangs = rangs;
  marquerModifie();

}

/** Le plafond de cases cochees. */

/**
 * Autoriser une reponse libre.
 *
 * L'option « Autre » s'ajoute a la liste proposee, car c'est elle que la
 * colonne acceptera : ecrire le texte libre a sa place serait refuse par
 * Grist, qui l'encadrerait en rouge.
 */
function onFieldAutre(si, fi, actif) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};
  if (actif) {
    f.options.autreLibre = true;
    if (!f.options.valeurAutre) f.options.valeurAutre = 'Autre';
    if (f.type === 'Choice' || f.type === 'ChoiceList') f.kind = 'choix_autre';
    // En mode création, la liste nous appartient : « Autre » s'y ajoute.
    if (def.composeMode === 'ensureSchema') {
      const liste = def.choices[f.colId] || (f.options.choices || []);
      if (liste.indexOf(f.options.valeurAutre) === -1) {
        def.choices[f.colId] = liste.concat([f.options.valeurAutre]);
      }
    }
    // Une seule colonne texte libre : c'est forcément celle-là.
    const texte = (S.columnsByTable[def.tableId] || [])
      .filter(c => c.type === 'Text' && c.colId !== f.colId);
    if (!f.options.colonnes.autre && texte.length === 1) f.options.colonnes.autre = texte[0].colId;
  } else {
    delete f.options.autreLibre;
    delete f.options.colonnes.autre;
    if (f.kind === 'choix_autre') delete f.kind;
  }
  marquerModifie();
  renderBuilder();
}

/**
 * Ajouter « Autre » à la liste de la colonne, dans Grist.
 *
 * Le compositeur écrit déjà le schéma quand il crée les colonnes ; ici il
 * modifie une colonne existante, et c'est pourquoi le geste se demande au
 * lieu de se faire tout seul quand on coche la case.
 */
async function ajouterChoixALaColonne(si, fi) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  const mot = (f.options && f.options.valeurAutre) || 'Autre';
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  if (!colonne) return;
  const liste = (colonne.choix || []).concat([mot]);
  try {
    await GristBridge.applyUserActions([['ModifyColumn', def.tableId, f.colId, {
      widgetOptions: JSON.stringify({ choices: liste, choiceOptions: {} })
    }]]);
    colonne.choix = liste;
    toast(`« ${mot} » ajouté à la colonne ${f.colId}`, 'success');
  } catch (e) {
    toast('Grist a refusé la modification de la colonne : ' + (e && e.message ? e.message : ''), 'error');
  }
  renderBuilder();
}

function onFieldAutreCol(si, fi, colId) {

  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};

function onFieldCascadeToggle(si, fi, checked) {

  const refPrior = priorFields(S.currentDef, si, fi).filter(p => p.type === 'Ref');
  if (checked && !refPrior.length) {
    toast('Ajoutez d’abord une question Référence au-dessus de celle-ci.', 'error');
    return;
  }
  f.cascade = checked ? { parentField: '', parentRefCol: '' } : null;
  if (checked) f.dynamicFilter = null;
  renderBuilder();
}

function onFieldCascadeParent(si, fi, parentColId) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  if (!f.cascade) f.cascade = { parentField: '', parentRefCol: '' };
  f.cascade.parentField = parentColId || '';
  f.cascade.parentRefCol = '';
  const parent = findFieldMeta(def, parentColId);
  const childTable = resolveRefTableOfField(f);
  const parentTable = parent && parent.refTable;
  if (childTable && parentTable) {
    const cols = S.columnsByTable[childTable] || [];
    f.cascade.parentRefCol = FormUx.detectRefColumn(cols, parentTable) || '';
  }
  renderBuilder();
}

function onFieldCascade(si, fi, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.cascade) f.cascade = { parentField: '', parentRefCol: '' };
  f.cascade[prop] = value;
}

function onFieldDynamicToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  const dynPrior = priorFields(S.currentDef, si, fi).filter(p =>
    p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  if (checked && !dynPrior.length) {
    toast('Ajoutez d’abord une question (Liste, Texte, Oui/Non ou Référence) au-dessus.', 'error');
    return;
  }
  f.dynamicFilter = checked ? { parentField: '', filterColumn: '' } : null;
  if (checked) f.cascade = null;
  renderBuilder();
}

function onFieldDynamic(si, fi, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.dynamicFilter) f.dynamicFilter = { parentField: '', filterColumn: '' };
  if (prop === 'parentField') {
    f.dynamicFilter.parentField = value || '';
    const parentMeta = value ? findFieldMeta(S.currentDef, value) : null;
    if (parentMeta && parentMeta.type === 'Ref') {
      f.dynamicFilter.parentResolve = 'refRow';
      if (!f.dynamicFilter.parentValueColumn) {
        const cols = parentMeta.refTable ? (S.columnsByTable[parentMeta.refTable] || []) : [];
        const guess = cols.find(c => /groupe|group|type|categorie|catégorie|org/i.test(c.colId || c.label || ''));
        f.dynamicFilter.parentValueColumn = guess ? guess.colId : '';
        if (!f.dynamicFilter.filterColumn && f.dynamicFilter.parentValueColumn) {
          f.dynamicFilter.filterColumn = f.dynamicFilter.parentValueColumn;
        }
      }
    } else {
      f.dynamicFilter.parentResolve = 'value';
      delete f.dynamicFilter.parentValueColumn;
    }
  } else if (prop === 'parentValueColumn') {
    f.dynamicFilter.parentValueColumn = value || '';
    f.dynamicFilter.parentResolve = 'refRow';
    if (value && !f.dynamicFilter.filterColumn) f.dynamicFilter.filterColumn = value;
  } else {
    f.dynamicFilter[prop] = value;
  }
  renderBuilder();
}

function setConditionOn(target, checked) {
  if (!checked) {
    target.condition = null;
    if (target.gate !== undefined) target.gate = null;
    return;
  }
  target.condition = FormUx.compactCondition(FormUx.normalizeToCompound(null)) ||
    { field: '', operator: '==', value: '' };
  // Ensure editable compound in memory via normalize on next render
  const c = FormUx.normalizeToCompound(target.condition);
  target.condition = FormUx.compactCondition(c) || { field: '', operator: '==', value: '' };
}

function mutateCompound(target, mutator) {
  const compound = FormUx.normalizeToCompound(target.condition);
  mutator(compound);
  target.condition = FormUx.compactCondition(compound);
  if (target.gate !== undefined) {
    // Sync gate shortcut when single Bool == true
    const c = target.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      target.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else {
      target.gate = null;
    }
  }
}

function onSectionConditionToggle(si, checked) {
  const sec = S.currentDef.sections[si];
  setConditionOn(sec, checked);
  if (checked) {
    mutateCompound(sec, function (c) {
      c.op = 'and';
      c.rules = [FormUx.emptyRule()];
    });
    // keep uncompacted for editing: store compound if empty field
    sec.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  }
  renderBuilder();
}

function onFieldConditionToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!checked) { f.condition = null; renderBuilder(); return; }
  f.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  renderBuilder();
}

function onSectionConditionOp(si, value) {
  mutateCompound(S.currentDef.sections[si], function (c) { c.op = value === 'or' ? 'or' : 'and'; });
  // Keep compound form while editing
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onFieldConditionOp(si, fi, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onSectionRuleAdd(si) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onFieldRuleAdd(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onSectionRuleRemove(si, ri) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.splice(ri, 1);
  if (!sec.condition.rules.length) sec.condition = null;
  else sec.condition = FormUx.compactCondition(sec.condition) || sec.condition;
  if (!sec.condition) sec.gate = null;
  renderBuilder();
}

function onFieldRuleRemove(si, fi, ri) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.splice(ri, 1);
  if (!f.condition.rules.length) f.condition = null;
  else f.condition = FormUx.compactCondition(f.condition) || f.condition;
  renderBuilder();
}

function coerceRuleValue(raw, sourceType) {
  if (sourceType === 'Bool') {
    if (raw === true || raw === 'true') return true;
    if (raw === false || raw === 'false') return false;
  }
  if (sourceType === 'Int' || sourceType === 'Numeric' || sourceType === 'Ref') {
    const n = Number(raw);
    if (raw !== '' && Number.isFinite(n)) return n;
  }
  return raw;
}

function parseAudienceValue(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw == null || raw === '') return '';
  if (typeof raw === 'boolean') return raw;
  const s = String(raw);
  if (s.indexOf(',') !== -1) {
    return s.split(',').map(x => x.trim()).filter(Boolean);
  }
  return s;
}

function onSectionRule(si, ri, prop, value) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  const rule = sec.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (sec.condition.rules.length === 1 && sec.condition.rules[0].field) {
    const compact = FormUx.compactCondition(sec.condition);
    sec.condition = compact;
    const c = sec.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      sec.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else sec.gate = null;
  }
  renderBuilder();
}

function onFieldRule(si, fi, ri, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  const rule = f.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (f.condition.rules.length === 1 && f.condition.rules[0].field) {
    f.condition = FormUx.compactCondition(f.condition);
  }
  renderBuilder();
}

// Legacy no-ops kept if referenced
function onFieldCondition(si, fi, prop, value) {
  onFieldRule(si, fi, 0, prop, value);
}

// ── Enregistrement (upsert Formulaires + ensureSchema si mode actif) ────
async function saveForm() {
  const def = S.currentDef;
  if (!def.title) { toast('Le titre du formulaire est requis', 'error'); return; }
  if (!def.tableId) { toast('Indiquez un nom pour la table des réponses', 'error'); return; }

  try {
    if (def.composeMode === 'ensureSchema') {
      const tableExists = S.tables.some(t => t.tableId === def.tableId);
      if (!tableExists) S.columnsByTable[def.tableId] = S.columnsByTable[def.tableId] || [];
      const existingColumns = (S.columnsByTable[def.tableId] || []).map(c => ({ id: c.colId, type: c.type }));
      const plan = EnsureSchema.planEnsureSchema(def, existingColumns, { tableExists: tableExists });
      if (!plan.ok) {
        const msgs = FormUx.humanizeBindingErrors(plan.errors);
        toast(msgs.join(' ; '), 'error');
        return;
      }
      if (plan.actions.length) {
        const hasAddColumn = plan.actions.some(a => a[0] === 'AddColumn');
        if (tableExists && hasAddColumn) {
          if (!confirm('Cette table existe déjà. Ajouter les colonnes manquantes ?')) return;
        }
        if (S.isDemo) {
          applyEnsureSchemaDemo(plan, def.tableId);
        } else {
          await GristBridge.applyUserActions(plan.actions);
          await refreshTablesAfterSchemaChange();
          if (S.tables.some(t => t.tableId === def.tableId)) {
            await reloadColumnsForTable(def.tableId);
          }
          await applyVisibleColMeta(def);
        }
        const createdTable = plan.actions.some(a => a[0] === 'AddTable');
        toast(
          createdTable
            ? 'Table « ' + def.tableId + ' » créée depuis le formulaire'
            : plan.actions.length + ' colonne(s) créée(s) sur ' + def.tableId,
          'success'
        );
      } else if (!S.isDemo) {
        // Binding déjà aligné : tenter quand même visibleCol méta (Ref)
        await applyVisibleColMeta(def);
      }
    }

    const existingRow = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    const meta = {
      version: existingRow ? existingRow.Version : 0,
      statut: existingRow ? existingRow.Statut : 'brouillon',
      publishedSectionRef: existingRow ? existingRow.PublishedSectionRef : undefined,
      updatedAt: GristBridge.util.fromDate(new Date())
    };
    const fields = FormulairesTable.rowFromFormDef(def, meta);

    if (S.isDemo) {
      saveDemoFormulaireRow(fields);
    } else if (S.currentRowId) {
      await GristBridge.updateRow('Formulaires', S.currentRowId, fields);
      await loadFormulaires();
    } else {
      await GristBridge.addRow('Formulaires', fields);
      await loadFormulaires();
      const found = S.forms.find(r => r.FormId === def.id);
      if (found) S.currentRowId = found.id;
    }

    S.dirty = false;
    S.enregistreA = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    toast('Formulaire enregistré', 'success');
    const row = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    if (row && row.Statut === 'publie') {
      toast('Pensez à remettre en ligne le formulaire');
    }
  } catch (e) {
    toast('Erreur à l\'enregistrement : ' + (e && e.message), 'error');
    throw e;
  }
}

function saveDemoFormulaireRow(fields) {
  if (S.currentRowId) {
    const row = S.forms.find(r => r.id === S.currentRowId);
    Object.assign(row, fields);
  } else {
    const row = Object.assign({ id: demoNextId++ }, fields);
    S.forms.push(row);
    S.currentRowId = row.id;
  }
}

function telechargerJson(objet, nom) {
  const blob = new Blob([JSON.stringify(objet, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadFormDef() {
  if (!S.currentDef) return;
  try { telechargerJson(FormulairesTable.defPropre(S.currentDef), (S.currentDef.id || 'formulaire') + '.json'); }

/**
 * Le formulaire tel que le public le recevra.
 *
 * En mode liaison, les listes de choix vivent dans les colonnes Grist : le
 * FormDef n'a pas a les recopier, et un apercu qui ne les lit pas montre des
 * questions sans reponses possibles. On les pose ici, sur une copie — le
 * formulaire enregistre, lui, reste tel qu'il a ete compose.
 */
function defPourApercu(def) {
  if (!def) return def;
  const copie = JSON.parse(JSON.stringify(def));
  const colonnes = S.columnsByTable[copie.tableId] || [];
  copie.choices = copie.choices || {};
  (copie.sections || []).forEach(section => (section.fields || []).forEach(f => {
    if (copie.choices[f.colId] && copie.choices[f.colId].length) return;
    if (f.options && f.options.choices && f.options.choices.length) return;
    const col = colonnes.find(c => c.colId === f.colId);
    if (col && col.choix && col.choix.length) copie.choices[f.colId] = col.choix.slice();
  }));
  return copie;
}

function fetchScriptSource(relPath) {
  return fetch(relPath).then(r => {
    if (!r.ok) throw new Error('Impossible de charger ' + relPath + ' (HTTP ' + r.status + ')');
    return r.text();
  });
}

function extractSectionRef(result) {
  if (result == null) return null;

  function fromVal(rv) {
    if (rv == null) return null;
    if (typeof rv === 'number' && !Number.isNaN(rv)) return rv;
    if (typeof rv === 'string' && /^\d+$/.test(rv)) return Number(rv);
    if (typeof rv === 'object') {
      if (typeof rv.sectionRef === 'number') return rv.sectionRef;
      if (typeof rv.viewSectionRef === 'number') return rv.viewSectionRef;
      if (typeof rv.id === 'number') return rv.id;
      if (Array.isArray(rv.viewSections) && rv.viewSections.length) {
        const vs = rv.viewSections[0];
        const nested = fromVal(vs);
        if (nested != null) return nested;
      }
    }
    return null;
  }

  let found = fromVal(result);
  if (found != null) return found;

  if (result.retValues != null) {
    const list = Array.isArray(result.retValues) ? result.retValues : [result.retValues];
    for (let i = 0; i < list.length; i++) {
      found = fromVal(list[i]);
      if (found != null) return found;
      if (Array.isArray(list[i])) {
        for (let j = 0; j < list[i].length; j++) {
          found = fromVal(list[i][j]);
          if (found != null) return found;
        }
      }
    }
  }

  function deepFind(obj, depth) {
    if (!obj || typeof obj !== 'object' || depth > 8) return null;
    if (typeof obj.sectionRef === 'number') return obj.sectionRef;
    if (typeof obj.viewSectionRef === 'number') return obj.viewSectionRef;
    if (Array.isArray(obj)) {
      for (let i = 0; i < obj.length; i++) {
        const n = deepFind(obj[i], depth + 1);
        if (n != null) return n;
      }
      return null;
    }
    const keys = Object.keys(obj);
    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      const v = obj[key];
      if (typeof v === 'number' && /sectionRef/i.test(key)) return v;
      const nested = deepFind(v, depth + 1);
      if (nested != null) return nested;
    }
    return null;
  }

  return deepFind(result, 0);
}

/**
 * La section de la page déjà publiée, si elle existe encore.
 *
 * Une page se supprime dans Grist sans rien dire au formulaire : on vérifie
 * avant de la réutiliser, et on en recrée une si elle a disparu.
 */
async function sectionPublieeValide(sectionRef) {
  const ref = Number(sectionRef);
  if (!Number.isFinite(ref) || ref <= 0) return null;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === ref);
    return s && s.parentKey === 'custom' ? ref : null;
  } catch (e) {
    return null;
  }
}

/**
 * La page porte le titre du formulaire.
 *
 * `CreateViewSection` ignore le nom qu'on lui passe — les pages s'appelaient
 * toutes « New page », et deux formulaires publiés devenaient indiscernables.
 */
async function nommerPagePubliee(sectionRef, nom) {
  if (!nom) return;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === sectionRef);
    if (!s || !s.parentId) return;
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views', s.parentId, { name: nom }],
      ['UpdateRecord', '_grist_Views_section', sectionRef, { title: nom }]
    ]);
  } catch (e) {
    logPublish('La page n’a pas pu être renommée : ' + (e && e.message));
  }
}

async function publishForm() {
  const def = S.currentDef;
  if (!def) return;
  try {
    logPublish('Enregistrement du formulaire avant publication…');
    await saveForm();
    renderPublishStep();

    if (S.isDemo) {
      logPublish('Mode démo : publication simulée (aucune écriture Grist).');
      toast('Publication simulée (mode démo)', 'success');
      return;
    }

    logPublish('Construction du bundle runtime (bridge + types + attachments + session-context + carte + dessin + engine + CSS)…');
    const [bridgeJs, typesJs, attachmentsJs, sessionContextJs, carteJs, dessinJs, engineJs, cssText] =
      await Promise.all([
      fetchScriptSource('shared/grist-bridge.js'),
      fetchScriptSource('shared/types.js'),
      fetchScriptSource('shared/attachments.js'),
      fetchScriptSource('shared/session-context.js'),
      fetchScriptSource('shared/carte-geometrie.js'),
      fetchScriptSource('shared/dessin.js'),
      fetchScriptSource('runtime/engine.js'),
      fetch('shared/dsfr-like.css').then(function (r) {
        if (!r.ok) throw new Error('Impossible de charger dsfr-like.css (' + r.status + ')');
        return r.text();
      })
    ]);
    const fullHtml = Publish.buildRuntimeDocument(def,
      { bridgeJs, typesJs, attachmentsJs, sessionContextJs, carteJs, dessinJs, engineJs, cssText });
    const { html, js } = Publish.splitHtmlJs(fullHtml);
    const optionsStr = Publish.buildCustomViewOptions({ html, js });

    const tableRow = S.tables.find(t => t.tableId === def.tableId);
    if (!tableRow) throw new Error('Table cible introuvable : ' + def.tableId);

    // Remettre en ligne REMPLACE le formulaire figé sur la page déjà publiée,
    // comme l'écran le promet. Créer une page de plus laissait l'ancienne en
    // service avec l'ancienne version, sans que rien ne le dise.
    const pageNom = def.title || def.id;
    const rowPub = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    let sectionRef = await sectionPublieeValide(rowPub && rowPub.PublishedSectionRef);
    if (sectionRef) {
      logPublish('Page déjà publiée (section ' + sectionRef + ') : remplacement du formulaire figé…');
    } else {
      logPublish('Création de la page « ' + pageNom + ' »…');
      const createRes = await GristBridge.applyUserActions(Publish.planCreateCustomPage(tableRow.id, pageNom));
      sectionRef = extractSectionRef(createRes);
      if (!sectionRef) throw new Error('Impossible de déterminer la section créée (réponse CreateViewSection inattendue)');
    }

    logPublish('Application du snapshot figé (_html/_js) sur la section ' + sectionRef + '…');
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views_section', sectionRef, { options: optionsStr }]
    ]);
    await nommerPagePubliee(sectionRef, pageNom);

    const row = S.forms.find(r => r.id === S.currentRowId);
    const nextVersion = (row ? row.Version : 0) + 1;
    await GristBridge.updateRow('Formulaires', S.currentRowId, {
      Version: nextVersion,
      Statut: 'publie',
      PublishedSectionRef: sectionRef,
      UpdatedAt: GristBridge.util.fromDate(new Date())
    });
    await loadFormulaires();

    logPublish('Publication terminée (version ' + nextVersion + ').');
    toast('Formulaire publié', 'success');
    renderPublishStep();
  } catch (e) {
    logPublish('Erreur : ' + (e && e.message));
    toast('Échec de la publication : ' + (e && e.message), 'error');
    renderPublishStep();
  }
}

/**
 * Le harnais d'essai se charge a la demande, et seulement a la demande.
 *
 * Il ouvre une porte — des actions declenchees par un message du parent — qui
 * n'a rien a faire dans un formulaire en service. Elle ne s'ouvre que sur
 * `?e2e=1`, et le fichier ne pese plus sur les autres chargements.
 */
(function chargerHarnaisDEssai() {
  var demande = false;
  try { demande = /([?&])e2e=1(?:&|$)/.test(location.search || ''); } catch (e) { return; }
  if (!demande) return;
  var s = document.createElement('script');
  s.src = 'tests/e2e-hook.js';
  s.async = false;
  document.body.appendChild(s);
}());
