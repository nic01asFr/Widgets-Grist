        data-choix="${esc(c)}" oninput="App.onLimiteChoix(${i}, 'maxChoix', this.value, this.getAttribute('data-choix'))"></div>`).join('')}</div>` : ''}`;
}

/**
 * Plafonner les choix d'une question se règle dans la question elle-même : c'est elle qu'on a sous les yeux,
 * et ses choix sont déjà là. Le même geste vaut pour des places d'atelier, des créneaux, des portions ou
 * des salles ; rien ici ne dépend de ce que les choix représentent.
 */
function renderLimiteQuestion(def, f) {
  if (!estPlafonnable(f)) return '';
  const parChoix = (def.limites && def.limites.parChoix) || [];
  const i = parChoix.findIndex(p => p.colId === f.colId);
  const actif = i >= 0;
  return `<section class="bloc">
    <h4 class="bloc__titre">Nombre de réponses par choix ${hintIcon('Facultatif. Quand un choix a atteint son maximum, il n’est plus proposé : « complet » s’affiche à sa place. Sert à limiter des places, des créneaux, des portions, des salles…')}</h4>
    <div class="fr-checkbox-group"><input type="checkbox" id="lim-q-actif" ${actif ? 'checked' : ''} onchange="App.onLimiteQuestion('${escJs(f.colId)}', this.checked)">
      <label class="fr-label" for="lim-q-actif">Limiter le nombre de réponses de chaque choix</label></div>
    ${actif ? reglageLimiteChoix(def, parChoix[i], i, f) : ''}
  </section>`;
}

/** Cocher ou décocher la limite par choix d'une question. */
function onLimiteQuestion(colId, actif) {
  const parChoix = (S.currentDef.limites && S.currentDef.limites.parChoix) || [];
  const i = parChoix.findIndex(p => p.colId === colId);
  if (actif && i < 0) onLimiteChoix(-1, 'ajouter', colId);
  else if (!actif && i >= 0) onLimiteChoix(i, 'retirer');
}

/** Ce qui est plafonné ailleurs dans le formulaire, avec un accès direct à la question. */
function resumeLimitesChoix(def) {
  const parChoix = (def.limites && def.limites.parChoix) || [];
  if (!parChoix.length) return '';
  const lignes = [];
  def.sections.forEach((s, si) => (s.fields || []).forEach((f, fi) => {
    const p = parChoix.find(x => x.colId === f.colId);
    if (!p) return;
    const detail = p.capaciteCol ? 'maximum lu dans la table liée'
      : typeof p.max === 'number' ? p.max + ' par choix'
      : Object.keys(p.max || {}).map(c => c + ' : ' + p.max[c]).join(' · ') || 'pas encore de maximum';
    lignes.push(`<li><button type="button" class="fr-btn fr-btn--tertiary fr-btn--sm" onclick="App.choisir('question', ${si}, ${fi})">${esc(f.label || f.colId)}</button> <span class="fr-hint-text">${esc(detail)}</span></li>`);
  }));
  return lignes.length ? `<p class="fr-label fr-mt-1w">Maximum par choix <span class="fr-hint-text">(se règle dans chaque question)</span></p><ul class="liste-sans-puce">${lignes.join('')}</ul>` : '';
}

/** Une limite générale : total, dates, colonne « Place », messages, lignes qui ne comptent pas. */
function onLimite(cle, valeur) {
  marquerModifie();
  const def = S.currentDef;
  const L = def.limites = def.limites || {};
  const v = String(valeur == null ? '' : valeur).trim();
  if (cle === 'total') { const n = Number(v); if (n >= 1) L.total = Math.floor(n); else delete L.total; }
  else if (cle === 'ouvertDu' || cle === 'jusquau') { if (v) L[cle] = v; else delete L[cle]; }
  else if (cle === 'placeCol') { if (v) L.placeCol = v; else delete L.placeCol; }
  else if (cle === 'unique') {
    if (v) { L.unique = { colId: v }; if (!L.placeCol) L.placeCol = 'Place'; }
    else delete L.unique;
  }
  else if (cle === 'saufCol') { if (v) L.sauf = { colId: v, valeurs: (L.sauf && L.sauf.valeurs) || [] }; else delete L.sauf; }
  else if (cle === 'saufValeurs') { if (L.sauf) L.sauf.valeurs = v.split(',').map(s => s.trim()).filter(Boolean); }
  else if (cle.indexOf('msg:') === 0) {
    L.messages = L.messages || {};
    if (v) L.messages[cle.slice(4)] = v; else delete L.messages[cle.slice(4)];
    if (!Object.keys(L.messages).length) delete L.messages;
  }
  if (!Object.keys(L).length) delete def.limites;
  if (cle === 'placeCol' || cle === 'saufCol' || cle === 'unique') renderBuilder(); else majAlerteLimites();
}

/** Une limite par choix : ajouter une question, régler ses places, la retirer. */
function onLimiteChoix(i, cle, valeur, choix) {
  marquerModifie();
  const def = S.currentDef;
  const L = def.limites = def.limites || {};
  L.parChoix = L.parChoix || [];
  if (cle === 'ajouter') {
    if (valeur) {
      const f = def.sections.reduce((acc, s) => acc.concat(s.fields || []), []).find(x => x.colId === valeur);
      L.parChoix.push(estReference(f) ? { colId: valeur, capaciteCol: '' } : { colId: valeur, max: {} });
    }
  } else {
    const p = L.parChoix[i];
    if (!p) return;
    if (cle === 'retirer') L.parChoix.splice(i, 1);
    else if (cle === 'capaciteCol') { if (valeur) p.capaciteCol = valeur; else delete p.capaciteCol; }
    else if (cle === 'maxCommun') { const n = Number(valeur); if (n >= 1) p.max = Math.floor(n); else if (typeof p.max === 'number') p.max = {}; }
    else if (cle === 'maxChoix') {
      if (typeof p.max !== 'object' || p.max === null) p.max = {};
      const n = Number(valeur);
      if (n >= 1) p.max[choix] = Math.floor(n); else delete p.max[choix];
    }
  }
  if (!L.parChoix.length) delete L.parChoix;
  if (!Object.keys(L).length) delete def.limites;
  if (cle === 'ajouter' || cle === 'retirer' || cle === 'capaciteCol') renderBuilder(); else majAlerteLimites();
}

/** Une colonne remplie sans question ; vide : on ne l'écrit pas. */
function onMeta(cle, valeur) {
  if (!['timestampCol', 'durationCol', 'emailCol'].includes(cle)) return;
  marquerModifie();
  const def = S.currentDef;
  def.meta = def.meta || {};
  if (valeur) def.meta[cle] = valeur; else delete def.meta[cle];
  if (!Object.keys(def.meta).length) delete def.meta;
  renderBuilder();
}

/**
 * L'apparence : le thème que le public verra. Trois choix : celui du document (par défaut), un thème donné à ce formulaire

  const T = window.FormThemeDef;

  const brut = (def.apparence && def.apparence.mode === 'formulaire') ? (S._apparenceTexte != null ? S._apparenceTexte : JSON.stringify(def.apparence.themedef || {}, null, 2)) : '';
  const erreur = S._apparenceErreur ? `<p class="fr-error-text" role="alert">${esc(PHRASES_THEMEDEF[S._apparenceErreur] || 'Ce thème n’est pas lisible.')}</p>` : '';

function majApparence() {
  marquerModifie();
  renderBuilder();
  habillerApercus();
}

function onApparenceMode(mode) {
  const def = S.currentDef;
  S._apparenceErreur = null;
  if (mode === 'document') delete def.apparence;
  else if (mode === 'grist') def.apparence = { mode: 'grist' };
  else if (mode === 'aucune') def.apparence = { mode: 'aucune' };
  else def.apparence = Object.assign({ mode: 'formulaire' }, def.apparence && def.apparence.themedef ? { themedef: def.apparence.themedef } : {});
  if (mode !== 'formulaire') S._apparenceTexte = null;
  majApparence();
}

/** Un thème collé ou déposé : lu comme une donnée non fiable ; il n'entre dans le formulaire que s'il est lisible. */
function onApparenceTexte(texte) {
  const T = window.FormThemeDef;
  const def = S.currentDef;
  const lu = T.lireThemeDef(String(texte || ''));
  if (!lu.ok) { S._apparenceErreur = lu.erreur; S._apparenceTexte = String(texte || ''); majApparence(); return; }
  S._apparenceErreur = null;
  S._apparenceTexte = null;
  def.apparence = { mode: 'formulaire', themedef: lu.themedef };
  majApparence();
}

function onApparenceFichier(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  if (f.size > 16384) { S._apparenceErreur = 'trop-gros'; majApparence(); return; }
  const lecteur = new FileReader();
  lecteur.onload = function () { onApparenceTexte(String(lecteur.result || '')); };
  lecteur.readAsText(f);
}

/**
 * Le rang, dans l'apercu, de l'etape qu'on compose.
 *
 * L'apercu ne montre que les etapes visibles : une etape conditionnelle non
 * remplie n'y figure pas. Le rang du compositeur n'est donc pas celui de
 * l'apercu — sans cette traduction, on compose une etape et on en regarde une
 * autre.
 */
function etapeVisibleCourante(def) {
  const sel = S.selection || {};
  // Quand c'est l'accueil qu'on compose, on ne demande aucune etape : le
  // moteur ouvre alors sur sa page d'accueil, qui est bien ce qu'on regarde.
  if (sel.quoi === 'accueil' && FormEngine.aUnAccueil && FormEngine.aUnAccueil(def)) return undefined;
  if (!def || sel.si == null || !window.FormEngine || !FormEngine.isSectionVisible) return 0;
  const visibles = def.sections.filter((sec) => FormEngine.isSectionVisible(sec, {}, {}));
  const rang = visibles.indexOf(def.sections[sel.si]);
  return rang >= 0 ? rang : 0;
}

/** L'aperçu, posé sur l'étape qu'on compose. */
function monterApercuAtelier() {
  const cible = document.getElementById('builder-preview-mount');
  if (!cible || !window.FormEngine) return;
  const sel = S.selection || {};
  const def = S.currentDef;
  // L'aperçu ne montre que les étapes visibles : une étape conditionnelle non
  // remplie n'y figure pas. Le rang du compositeur n'est donc pas celui de
  // l'aperçu — sans cette traduction, on compose une étape et on en regarde
  // une autre.
  let depart = (sel.quoi === 'accueil' && window.FormEngine.aUnAccueil && window.FormEngine.aUnAccueil(def))
    ? undefined : 0;
  if (sel.si != null && window.FormEngine.isSectionVisible) {
    const visibles = def.sections.filter((sec) => window.FormEngine.isSectionVisible(sec, {}, {}));
    const rang = visibles.indexOf(def.sections[sel.si]);
    depart = rang >= 0 ? rang : 0;
  }
  const vue = window.FormEngine.mount(cible, def, {
    submit: () => Promise.resolve(),
    loadTable: S.isDemo ? null : ((t) => GristBridge.loadTable(t)),
    skipProbe: true,
    etapeDepart: depart
  });
  S.apercuAtelier = vue;
}

function renderFieldPreview(f, si, fi) {
  const configuredPh = (f.options && f.options.placeholder) || '';
  const isTextLike = f.type === 'Text' || f.type === 'Int' || f.type === 'Numeric';
  if (isTextLike && (f.widget === 'text' || f.widget === 'textarea' || f.type === 'Int' || f.type === 'Numeric')) {
    const onPh = `App.onFieldOption(${si}, ${fi}, 'placeholder', this.value)`;
    const control = f.widget === 'textarea'
      ? `<textarea class="fr-input" rows="2" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">${esc(configuredPh)}</textarea>`
      : `<input class="fr-input" type="${f.type === 'Int' || f.type === 'Numeric' ? 'number' : 'text'}"
          value="${esc(configuredPh)}" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">`;
    return `<div class="field-preview is-editable">
      ${control}
    </div>`;
  }
  const ph = 'Aperçu du champ';
  let inner = '';
  if (f.type === 'Bool') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Oui / Non</label></div>`;
  } else if (f.type === 'Choice') {
    inner = `<select class="fr-select" disabled><option>${esc(ph)}</option></select>`;
  } else if (f.type === 'ChoiceList') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Option…</label></div>`;
  } else if (f.type === 'Attachments') {
    inner = `<input class="fr-input" type="text" disabled value="Pièce jointe…">`;
  } else if (f.type === 'Date') {
    inner = `<input class="fr-input" type="date" disabled>`;
  } else if (f.type === 'Ref' || f.type === 'RefList') {
    inner = `<select class="fr-select" disabled><option>Liste liée…</option></select>`;
  } else {
    inner = `<input class="fr-input" type="text" disabled placeholder="${esc(ph)}">`;
  }
  return `<div class="field-preview is-static">${inner}</div>`;
}

function renderConditionValueInput(scope, si, fi, ruleIndex, sourceField, currentValue) {
  const v = currentValue != null ? String(currentValue) : '';
  const onChange = scope === 'section'
    ? `App.onSectionRule(${si}, ${ruleIndex}, 'value', this.value)`
    : `App.onFieldRule(${si}, ${fi}, ${ruleIndex}, 'value', this.value)`;
  if (!sourceField) {
    return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
  }
  if (sourceField.type === 'Bool') {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="true" ${v === 'true' || currentValue === true ? 'selected' : ''}>Oui</option>
      <option value="false" ${v === 'false' || currentValue === false ? 'selected' : ''}>Non</option>
    </select>`;
  }
  if (sourceField.type === 'Choice' && sourceField.choices && sourceField.choices.length) {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="">—</option>
      ${sourceField.choices.map(c => {
        const val = typeof c === 'object' ? c.value : c;
        const lab = typeof c === 'object' ? (c.label || c.value) : c;
        return `<option value="${esc(val)}" ${String(val) === v ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}
    </select>`;
  }
  if (sourceField.type === 'Date') {
    return `<input class="fr-input" type="date" value="${esc(v)}" onchange="${onChange}">`;
  }
  if (sourceField.type === 'Int' || sourceField.type === 'Numeric') {
    return `<input class="fr-input" type="number" value="${esc(v)}" oninput="${onChange}">`;
  }
  return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
}

/**
 * La condition dite en une phrase : « S'affiche si « Âge » est supérieur à 18. »
 *
 * Quatre colonnes de listes ne se lisent pas ; une phrase, si. Seules les règles qui regardent une question
 * précédente sont dites ainsi : les autres (situation, identité) gardent leur ligne de réglage.
 */
function phraseConditions(compound, prior, scope) {
  const dites = (compound.rules || []).map(rule => {
    const col = rule.field || rule.path;
    const src = prior.find(p => p.colId === col);
    if (!src || ruleSelectKey(rule).indexOf('field:') !== 0) return null;
    const op = (FormUx.operatorsForType(src.type) || []).find(o => o.value === rule.operator);
    const prend = FormUx.operatorTakesValue(rule.operator);
    // Une règle à moitié écrite ne se dit pas : on ne montre que ce qui est complet.
    if (!op || (prend && (rule.value == null || rule.value === ''))) return null;
    return '« ' + (src.label || col) + ' » : ' + String(op.label).toLowerCase() + (prend ? ' « ' + String(rule.value) + ' »' : '');
  }).filter(Boolean);
  if (!dites.length) return '';
  const lien = compound.op === 'or' ? ' ou ' : ' et ';
  return '<p class="rule-resume"><strong>' + (scope === 'section' ? 'L’étape' : 'La question') + ' s’affiche si</strong> ' +
    esc(dites.join(lien)) + '.</p>';
}

function renderConditionEditor(scope, si, fi, condition, prior) {
  const compound = FormUx.normalizeToCompound(condition);
  const enabled = !!condition;
  const toggleFn = scope === 'section'
    ? `App.onSectionConditionToggle(${si}, this.checked)`
    : `App.onFieldConditionToggle(${si}, ${fi}, this.checked)`;
  const opFn = scope === 'section'
    ? `App.onSectionConditionOp(${si}, this.value)`
    : `App.onFieldConditionOp(${si}, ${fi}, this.value)`;
  const addFn = scope === 'section'
    ? `App.onSectionRuleAdd(${si})`
    : `App.onFieldRuleAdd(${si}, ${fi})`;

  if (!enabled) {
    return `
      <div class="behavior-panel">
        <div class="fr-checkbox-group">
          <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" onchange="${toggleFn}">
          <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
            <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
            ${hintIcon(CONDITION_PANEL_TIP)}
          </label>
        </div>
      </div>`;
  }

  const rulesHtml = compound.rules.map((rule, ri) => {
    const selKey = ruleSelectKey(rule);
    const isCtx = selKey.indexOf('context:') === 0;
    const isAud = selKey.indexOf('audience:') === 0;
    const src = (!isCtx && !isAud)
      ? (findFieldMeta(S.currentDef, rule.field || rule.path) || prior.find(p => p.colId === (rule.field || rule.path)))
      : (isCtx ? { type: 'Bool' } : { type: 'Text' });
    const ops = isAud
      ? [
          { value: 'in', label: 'dans' },
          { value: 'notIn', label: 'pas dans' },
          { value: '==', label: 'égal à' },
          { value: '!=', label: 'différent de' }
        ]
      : (isCtx && (rule.path === 'userEmail' || selKey === 'context:userEmail')
        ? FormUx.operatorsForType('Text')
        : (isCtx ? [{ value: '==', label: 'égal à' }, { value: '!=', label: 'différent de' }] : FormUx.operatorsForType(src && src.type)));
    const opOpts = ops.map(o =>
      `<option value="${esc(o.value)}" ${rule.operator === o.value ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    const fieldSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'field', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'field', this.value)`;
    const opSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'operator', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'operator', this.value)`;
    const delFn = scope === 'section'
      ? `App.onSectionRuleRemove(${si}, ${ri})`
      : `App.onFieldRuleRemove(${si}, ${fi}, ${ri})`;
    const valueHint = isAud
      ? 'Emails ou groupes, séparés par des virgules'
      : (isCtx && rule.path !== 'userEmail' ? 'Oui ou Non' : 'Valeur attendue');
    const srcTip = ruleOptionTip(selKey);
    const opTip = operatorTip(rule.operator, isAud, isCtx);
    return `
      <div class="rule-row">
        <div class="fr-select-group">${hintLabel('Réponse à regarder', CONDITION_SOURCE_TIP)}
          <select class="fr-select" onchange="${fieldSelect}">
            <option value="">—</option>
            <optgroup label="Situation de la personne">${CONTEXT_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            <optgroup label="Identité de la personne">${AUDIENCE_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            ${prior.length ? `<optgroup label="Questions précédentes">${prior.map(p =>
              `<option value="field:${esc(p.colId)}" ${selKey === 'field:' + p.colId ? 'selected' : ''}>${esc(p.label)}</option>`
            ).join('')}</optgroup>` : ''}
          </select>
          <p class="fr-hint-text">${esc(srcTip)}</p>
        </div>
        <div class="fr-select-group">${hintLabel('Comparaison', opTip)}
          <select class="fr-select" onchange="${opSelect}">${opOpts}</select>
        </div>
        <div class="fr-input-group">${hintLabel('Valeur attendue', isAud ? valueHint : (isCtx && rule.path !== 'userEmail' ? 'Oui = critère vrai, Non = critère faux.' : CONDITION_VALUE_TIP))}
          ${!FormUx.operatorTakesValue(rule.operator)
            ? `<input class="fr-input" disabled value="" placeholder="Aucune valeur à saisir" aria-label="Aucune valeur : ${esc(opTip)}">`
            : isCtx && rule.path !== 'userEmail'
            ? `<select class="fr-select" onchange="${scope === 'section'
                ? `App.onSectionRule(${si}, ${ri}, 'value', this.value === 'true')`
                : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value === 'true')`}">
                <option value="true" ${rule.value === true || rule.value === 'true' ? 'selected' : ''}>Oui</option>
                <option value="false" ${rule.value === false || rule.value === 'false' ? 'selected' : ''}>Non</option>
              </select>`
            : (isAud
              ? `<input class="fr-input" value="${esc(Array.isArray(rule.value) ? rule.value.join(', ') : (rule.value != null ? rule.value : ''))}"
                  placeholder="${esc(valueHint)}"
                  oninput="${scope === 'section'
                    ? `App.onSectionRule(${si}, ${ri}, 'value', this.value)`
                    : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value)`}">`
              : renderConditionValueInput(scope, si, fi, ri, src, rule.value))}
        </div>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer cette condition" aria-label="Supprimer cette condition" onclick="${delFn}">✕</button>
      </div>`;
  }).join('');

  return `
    <div class="behavior-panel">
      <div class="fr-checkbox-group">
        <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" checked onchange="${toggleFn}">
        <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
          <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
          ${hintIcon(CONDITION_PANEL_TIP)}
        </label>
      </div>
      <div class="fr-select-group fr-mt-1w">
        ${hintLabel('Quand il y a plusieurs conditions', CONDITION_COMBO_TIP)}
        <select class="fr-select" onchange="${opFn}">
          <option value="and" ${compound.op === 'and' ? 'selected' : ''}>Toutes doivent être vraies</option>
          <option value="or" ${compound.op === 'or' ? 'selected' : ''}>Une seule suffit</option>
        </select>
      </div>
      ${phraseConditions(compound, prior, scope)}
      ${rulesHtml}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" onclick="${addFn}">+ Ajouter une condition</button>
    </div>`;
}

/**
 * L'éditeur d'une étape, sans ses questions : elles vivent maintenant dans la
 * colonne de structure, et ne se composent qu'une à la fois.
 */
function renderSectionEditor(def, section, si) {
  const prior = priorFields(def, si, null);
  const condSummary = FormUx.summarizeCondition(section.condition || (section.gate ? { field: section.gate, operator: '==', value: true } : null));
  const pathBadge = (section.condition || section.gate)
    ? `<span class="cfg-badge path">Chemin : ${esc(condSummary || section.gate)}</span>` : '';

  // Un ancien `gate` s'affiche comme la condition qu'il est.
  let sectionCond = section.condition;
  if (!sectionCond && section.gate) {
    sectionCond = { field: section.gate, operator: '==', value: true };
  }

  return `
    <div class="section-card">
      <div class="fr-input-group">
        <label class="fr-label" for="sec-titre-${si}">Titre de l’étape ${hintIcon('Le public le lit en haut de l’écran.')}</label>
        <input class="fr-input" id="sec-titre-${si}" value="${esc(section.label)}"
          placeholder="Ex. Votre quartier"
          oninput="App.onSectionInput(${si}, 'label', this.value)">
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="sec-desc-${si}">Consigne de l’étape ${hintIcon('Facultatif : ce qu’on explique avant les questions.')}</label>
        <textarea class="fr-input" id="sec-desc-${si}" rows="2"
          placeholder="Ce qu’on explique avant les questions…"
          oninput="App.onSectionInput(${si}, 'description', this.value)">${esc(section.description || '')}</textarea>
      </div>
      ${pathBadge ? `<div class="badge-row">${pathBadge}</div>` : ''}
      ${si === 0 ? '' : renderConditionEditor('section', si, null, sectionCond, prior)}
      <button type="button" class="fr-btn fr-btn--tertiary section-card__retirer" onclick="App.removeSection(${si})">Supprimer cette étape</button>
    </div>
  `;
}

/**
 * Le panneau d'une question, rangé par intention plutôt qu'en liste de réglages.
 *
 * Quatre blocs, dans l'ordre où l'on se pose les questions : ce que le public
 * voit, où la réponse se range, quand la question s'affiche, et ce qu'elle
 * propose. Chaque bloc dit en une phrase ce qu'il permet — c'est par là qu'on
 * découvre ce que l'outil sait faire, sans lire une documentation.
 */
function renderFieldEditor(def, si, f, fi) {
  const isBind = def.composeMode === 'bind';
  const isChoiceLike = f.type === 'Choice' || f.type === 'ChoiceList';
  const isRefLike = f.type === 'Ref' || f.type === 'RefList';
  const choicesValue = (def.choices[f.colId] || []).join('\n');
  const typeKey = (window.FormUx && FormUx.fieldTypeKey) ? FormUx.fieldTypeKey(f) : 'text';
  const simpleOpts = ((window.FormUx && FormUx.SIMPLE_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  const advancedOpts = ((window.FormUx && FormUx.ADVANCED_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  // Un groupe répétable se règle dans le FormDef (`options.champs`) : le compositeur le garde tel quel, sans le déformer.
  const widgetChoices = f.widget === 'groupe' ? ['groupe'] : (WIDGETS_BY_TYPE[f.type] || ['text']);
  const widgetOptions = widgetChoices.map(w => `<option value="${w}" ${f.widget === w ? 'selected' : ''}>${esc(WIDGET_LABELS[w] || w)}</option>`).join('');
  const prior = priorFields(def, si, fi);
  const refParents = prior.filter(p => p.type === 'Ref');
  const dynParents = prior.filter(p => p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  const refTableOptions = S.tables.map(t =>
    `<option value="${esc(t.tableId)}" ${resolveRefTableOfField(f) === t.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`
  ).join('');
  const childCols = resolveRefTableOfField(f) ? (S.columnsByTable[resolveRefTableOfField(f)] || []) : [];
  const filterColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${f.dynamicFilter && f.dynamicFilter.filterColumn === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');
  const visibleColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${(f.options && f.options.visibleCol) === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');

  const section = def.sections[si];
  const nb = (section.fields || []).length;
  const echelle = f.kind === 'echelle' ? ((f.options && f.options.echelle) || '') : '';
  const matrice = f.kind === 'echelle' ? ((f.options && f.options.matrice) || '') : '';
  const echelleOpts = Object.keys(def.echelles || {}).map(k =>
    `<option value="${esc(k)}" ${echelle === k ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const matriceOpts = Object.keys(def.matrices || {}).map(k =>
    `<option value="${esc(k)}" ${matrice === k ? 'selected' : ''}>${esc((def.matrices[k] || {}).titre || k)}</option>`).join('');

  return `
    <div class="field-editor">
      <div class="panneau__fil">
        <button type="button" class="panneau__nav" ${fi > 0 ? `onclick="App.choisir('question', ${si}, ${fi - 1})"` : 'disabled'} title="Question précédente">‹</button>
        <span>Question ${fi + 1} sur ${nb}</span>
        <button type="button" class="panneau__nav" ${fi < nb - 1 ? `onclick="App.choisir('question', ${si}, ${fi + 1})"` : 'disabled'} title="Question suivante">›</button>
        <span class="panneau__fil-espace"></span>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la question" onclick="App.removeField(${si}, ${fi})">🗑</button>
      </div>

      <section class="bloc">
        <h4 class="bloc__titre">Ce que le public voit ${hintIcon('La phrase que lit la personne qui répond. Écrivez une question, pas un nom de colonne : « Les espaces publics sont agréables » plutôt que « EP_Agreables (1–5) ».')}</h4>
        <div class="fr-input-group">
          <label class="fr-label" for="lab-${si}-${fi}">Question posée</label>
          <input class="fr-input" id="lab-${si}-${fi}" value="${esc(f.label)}"
            placeholder="Ce que lit la personne qui répond"
            oninput="App.onFieldInput(${si}, ${fi}, 'label', this.value)"
            onblur="App.onFieldLabelBlur(${si}, ${fi})">
        </div>
        <div class="fr-input-group">
          <label class="fr-label" for="desc-${si}-${fi}">Consigne</label>
          <input class="fr-input" id="desc-${si}-${fi}" value="${esc(f.description || '')}"
            placeholder="Précision affichée sous la question (facultatif)"
            oninput="App.onFieldInput(${si}, ${fi}, 'description', this.value)">
        </div>
        <div class="fr-checkbox-group">
          <input type="checkbox" id="req-${si}-${fi}" ${f.required ? 'checked' : ''}
            onchange="App.onFieldInput(${si}, ${fi}, 'required', this.checked)">
          <label class="fr-label" for="req-${si}-${fi}">Réponse obligatoire</label>
        </div>
        ${renderIllustrationDuChamp(def, si, f, fi)}
        ${renderFieldPreview(f, si, fi)}
      </section>

      <section class="bloc">
        <h4 class="bloc__titre">Où la réponse se range ${hintIcon('Chaque question écrit dans une colonne Grist. Le type décide de ce que la colonne accepte, et de la façon de répondre.')}</h4>
        <div class="bloc__duo">
          <div class="fr-select-group"><label class="fr-label" for="type-${si}-${fi}">Type de réponse</label>
            <select class="fr-select" id="type-${si}-${fi}" onchange="App.onFieldTypeKeyChange(${si}, ${fi}, this.value)">
              ${simpleOpts}
              <optgroup label="Avancé">${advancedOpts}</optgroup>
            </select>
          </div>
          ${isBind ? `
            <div class="fr-select-group"><label class="fr-label" for="col-${si}-${fi}">Colonne ${hintIcon('Les réponses iront dans cette colonne de la table. Son type et, le cas échéant, sa liste de choix viennent d’elle.')}</label>
              <select class="fr-select" id="col-${si}-${fi}" onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
                <option value="">— choisir une colonne —</option>
                ${(S.columnsByTable[def.tableId] || []).map(c => `<option value="${esc(c.colId)}" ${c.colId === f.colId ? 'selected' : ''}>${esc(c.label || c.colId)} · ${esc(c.type)}</option>`).join('')}
                ${f.colId && !(S.columnsByTable[def.tableId] || []).some(c => c.colId === f.colId)
                  ? `<option value="${esc(f.colId)}" selected>${esc(f.colId)} · absente de la table</option>` : ''}
              </select>
            </div>` : `
            <div class="fr-input-group"><label class="fr-label" for="col-${si}-${fi}">Nom de la colonne ${hintIcon('Elle sera créée à l’enregistrement, avec le type choisi.')}</label>
              <input class="fr-input" id="col-${si}-${fi}" value="${esc(f.colId)}"
                onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
            </div>`}
        </div>

        ${isChoiceLike ? renderOptionsDuChamp(def, si, f, fi, isBind) : ''}
        ${renderReglagesSaisie(def, si, f, fi, isBind)}

        ${f.kind === 'echelle' ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label" for="ech-${si}-${fi}">Échelle ${hintIcon('Les bornes et les mots qui disent ce que valent les extrémités. Plusieurs questions peuvent partager la même.')}</label>
              <select class="fr-select" id="ech-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'echelle', this.value)">${echelleOpts}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label" for="mat-${si}-${fi}">Regroupée avec ${hintIcon('Les questions d’une même matrice sont posées ensemble, sous une seule question et une seule échelle.')}</label>
              <select class="fr-select" id="mat-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'matrice', this.value)">
                <option value="">Aucune</option>${matriceOpts}
              </select>
            </div>
          </div>
          <div class="fr-select-group">
            <label class="fr-label" for="pol-${si}-${fi}">Ce que « haut » veut dire ${hintIcon('« Les espaces sont agréables » et « Il faudrait ajouter des places » se notent toutes deux de 1 à 5, mais un 5 est une bonne nouvelle dans un cas et une demande dans l’autre. Sans cette marque, la synthèse les range ensemble.')}</label>
            <select class="fr-select" id="pol-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'polarite', this.value)">
              <option value="" ${!(f.options && f.options.polarite) ? 'selected' : ''}>Non précisé — la question ne ressortira pas</option>
              <option value="satisfaction" ${f.options && f.options.polarite === 'satisfaction' ? 'selected' : ''}>Un point de satisfaction (haut = ça va)</option>
              <option value="besoin" ${f.options && f.options.polarite === 'besoin' ? 'selected' : ''}>Un besoin, un problème (haut = à traiter)</option>
              <option value="preference" ${f.options && f.options.polarite === 'preference' ? 'selected' : ''}>Une préférence (haut = souhaité)</option>
            </select>
          </div>` : ''}

        ${isRefLike ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label">Table liée</label>
              <select class="fr-select" onchange="App.onFieldRefTable(${si}, ${fi}, this.value)"><option value="">—</option>${refTableOptions}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label">Colonne affichée ${hintIcon('Ce que la personne lit dans la liste : le nom de la ligne, plutôt que son identifiant.')}</label>
              <select class="fr-select" onchange="App.onFieldVisibleCol(${si}, ${fi}, this.value)">
                <option value="">Nom (défaut)</option>${visibleColOpts}
              </select>
            </div>
          </div>` : ''}

        <details class="json-preview">
          <summary>Avancé</summary>
          <div class="fr-select-group fr-mt-1w"><label class="fr-label">Façon de répondre</label>
            <select class="fr-select" onchange="App.onFieldInput(${si}, ${fi}, 'widget', this.value)">${widgetOptions}</select>
          </div>
        </details>
      </section>

      ${renderLimiteQuestion(def, f)}

      <section class="bloc">
        <h4 class="bloc__titre">Quand elle s’affiche ${hintIcon('Une question peut dépendre d’une réponse précédente. Sans condition, elle est toujours posée. Les conditions ne remplacent pas les droits Grist : elles cachent, elles ne protègent pas.')}</h4>
        ${renderConditionEditor('field', si, fi, f.condition, prior)}
      </section>

      ${isRefLike && f.type === 'Ref' ? `
        <section class="bloc">
          <h4 class="bloc__titre">Ce qu’elle propose ${hintIcon('La liste peut se restreindre selon une réponse précédente : la commune d’une région choisie, les contacts d’un même service.')}</h4>
          ${renderRefBehaviorPanels(def, si, fi, f, refParents, dynParents, filterColOpts, resolveRefTableOfField(f))}
        </section>` : ''}
    </div>
  `;
}

function onDefInput(prop, value) {
  marquerModifie();
  S.currentDef[prop] = value;
  if (prop === 'title' && S.currentDef.composeMode === 'ensureSchema' && S.autoTable) {
    S.currentDef.tableId = FormUx.tableNameFromTitle(value);
  }
}

function onAccueil(cle, valeur) {
  const a = ensureAccueil(S.currentDef);
  marquerModifie();
  if (cle === 'dureeMinutes') {
    const n = Number(valeur);
    if (n > 0) a.dureeMinutes = n; else delete a.dureeMinutes;
    renderBuilder();
    return;
  }
  a[cle] = valeur == null ? '' : String(valeur);
}

function onEncart(i, cle, valeur) {
  const a = ensureAccueil(S.currentDef);
  if (!a.encarts[i]) return;
  marquerModifie();
  a.encarts[i][cle] = valeur == null ? '' : String(valeur);
  if (cle === 'ton') renderBuilder();
}

function ajouterEncart() {
  const a = ensureAccueil(S.currentDef);
  a.encarts.push({ ton: 'discret', titre: '', texte: '' });
  marquerModifie();
  renderBuilder();
}

function retirerEncart(i) {
  const a = ensureAccueil(S.currentDef);
  a.encarts.splice(i, 1);
  marquerModifie();
  renderBuilder();
}

function onBrandingInput(key, value) {
  const b = ensureBranding(S.currentDef);
  b[key] = value == null ? '' : String(value);
}

function onBrandingFile(urlKey, inputEl) {
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!/^image\//i.test(file.type || '')) {
    toast('Fichier image requis (PNG, JPG, SVG, WebP…)', 'error');
    return;
  }
  if (file.size > 1.5 * 1024 * 1024) {
    toast('Image trop lourde (max. 1,5 Mo). Préférez une URL.', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    onBrandingInput(urlKey, reader.result || '');
    renderBuilder();
  };
  reader.onerror = () => toast('Impossible de lire le fichier', 'error');
  reader.readAsDataURL(file);
}

function refreshBuilderBrand() {
  renderBuilder();
}

function reuseIntroImage() {
  const b = ensureBranding(S.currentDef);
  if (!safeImageUrl(b.logoUrl)) return;
  b.successImageUrl = b.logoUrl;
  b.successImageAlt = b.logoAlt || b.successImageAlt || '';
  renderBuilder();
}

function onTitleBlur() {
  const def = S.currentDef;
  if (!def) return;
  if (def.composeMode === 'ensureSchema' && S.autoTable) {
    def.tableId = FormUx.tableNameFromTitle(def.title);
    renderBuilder();
  }
}

function onManualTableEdit() {
  S.autoTable = false;
}

function onTableChange(value) {
  S.currentDef.tableId = value;
  if (S.currentDef.composeMode === 'ensureSchema') S.autoTable = false;
  renderBuilder();
}

function onComposeModeChange(value) {
  S.currentDef.composeMode = value;
  if (value === 'ensureSchema') {
    S.autoTable = true;
    if (!S.currentDef.tableId && S.currentDef.title) {
      S.currentDef.tableId = FormUx.tableNameFromTitle(S.currentDef.title);
    }
    // Une question sans colonne reçoit son identifiant depuis son libellé : sans lui,
    // le moteur n'écrit rien pour elle (ni correction ni valeur).
    for (const s of S.currentDef.sections) {
      for (const f of s.fields) {
        if (!f.colId && f.label) f.colId = FormUx.slugify(f.label);
      }
    }
  } else {
    S.autoTable = false;
    if (!S.currentDef.tableId && S.tables[0]) S.currentDef.tableId = S.tables[0].tableId;
  }
  renderBuilder();
}

function addSection() { S.currentDef.sections.push(newSection(S.currentDef.sections.length + 1)); renderBuilder(); }
function removeSection(si) { S.currentDef.sections.splice(si, 1); renderBuilder(); }
function addField(si) { S.currentDef.sections[si].fields.push(newField()); renderBuilder(); }
function removeField(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  if (f && f.colId && S.currentDef.choices[f.colId]) delete S.currentDef.choices[f.colId];
  S.currentDef.sections[si].fields.splice(fi, 1);
  renderBuilder();
}

function onSectionInput(si, prop, value) {
  marquerModifie(); S.currentDef.sections[si][prop] = value; }
/**
 * Le canevas suit ce qu'on tape.
 *
 * > Redessiner tout le compositeur à chaque touche ferait perdre le curseur du champ qu'on remplit. Seul le
 * > canevas (ce que le public lira) est donc redessiné, après une courte pause, et jamais s'il porte le focus.
 */
function rafraichirCanevas() {
  clearTimeout(S._tCanevas);
  S._tCanevas = setTimeout(() => {
    const canevas = document.getElementById('canevas');
    if (!canevas || !S.currentDef) return;
    if (canevas.contains(document.activeElement)) return;
    const haut = canevas.scrollTop;
    canevas.innerHTML = renderCanevas(S.currentDef);
    canevas.scrollTop = haut;
  }, 200);
}

function onFieldInput(si, fi, prop, value) {
  marquerModifie(); S.currentDef.sections[si].fields[fi][prop] = value; rafraichirCanevas(); }
function onFieldOption(si, fi, key, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (value === '' || value == null) delete f.options[key];
  else f.options[key] = value;
  rafraichirCanevas();
}

function onFieldLabelBlur(si, fi) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  if (def.composeMode !== 'ensureSchema') return;
  if (f._colIdLocked) return;
  if (!f.label) return;
  const oldColId = f.colId;
  const next = FormUx.slugify(f.label);
  if (!next || next === oldColId) return;
  f.colId = next;
  if (oldColId && oldColId !== next && def.choices[oldColId]) {
    def.choices[next] = def.choices[oldColId];
    delete def.choices[oldColId];
  }
  renderBuilder();
}

function onFieldColIdChange(si, fi, value) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  const oldColId = f.colId;
  f.colId = value;
  f._colIdLocked = true;
  if (def.composeMode === 'bind') {
    const col = (S.columnsByTable[def.tableId] || []).find(c => c.colId === value);
    if (col) {
      const rawType = col.type || 'Text';
      f.type = FormTypes.normalizeGristType(rawType);
      f.widget = FormTypes.defaultWidget(rawType);
      if (!f.label) f.label = col.label || value;
      f.options = f.options || {};
      if (rawType.indexOf('Ref:') === 0) { f.refTable = rawType.slice(4); f.options.refTable = f.refTable; }
      else if (rawType.indexOf('RefList:') === 0) { f.refTable = rawType.slice(8); f.options.refTable = f.refTable; }
      // Les options viennent de la colonne : c'est elle qui les détient, et une
      // liste saisie ici ne ferait que mentir sur ce que Grist acceptera.
      if (col.choix && col.choix.length) {
        f.options.choices = col.choix.slice();
        delete def.choices[value];
      } else {
        delete f.options.choices;
      }
    }
  }
  if (oldColId && oldColId !== value && def.choices[oldColId]) {
    def.choices[value] = def.choices[oldColId];
    delete def.choices[oldColId];
  }
  renderBuilder();
}

function onFieldTypeChange(si, fi, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.type = value;
  f.widget = FormTypes.defaultWidget(value);
  renderBuilder();
}

function onFieldTypeKeyChange(si, fi, key) {
  const f = S.currentDef.sections[si].fields[fi];
  FormUx.applyTypeKey(f, key);
  f.options = f.options || {};
  if (f.kind === 'referentiel') {
    // Une adresse sans source n'est qu'un champ texte : on pose la seule connue.
    if (!f.options.referentiel) f.options.referentiel = { source: 'ban' };
  } else {
    // On quitte l'adresse : ses reglages et ses colonnes annexes s'en vont avec elle,
    // sans quoi un champ ordinaire garderait la trace de ce qu'il n'est plus.
    delete f.options.referentiel;
    if (f.options.colonnes) {
      delete f.options.colonnes.annexes;
      if (!Object.keys(f.options.colonnes).length) delete f.options.colonnes;
    }
  }
  renderBuilder();
}

function onFieldChoices(si, fi, text) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  const list = text.split('\n').map(s => s.trim()).filter(Boolean);
  if (f.colId) S.currentDef.choices[f.colId] = list;
  rafraichirCanevas();
}

/** Une option numérique : vide l'efface, un nombre s'écrit comme nombre. */
function onOptionNombre(si, fi, cle, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const v = String(valeur || '').trim().replace(',', '.');
  if (cle === 'unite') { if (v) f.options.unite = String(valeur).trim(); else delete f.options.unite; }
  else if (v !== '' && Number.isFinite(Number(v))) f.options[cle] = Number(v);
  else delete f.options[cle];
  renderBuilder();
}

/** Une couleur par choix : « Critique = #c9191e », une par ligne ; ce qui n'est pas une couleur sûre est écarté. */
function onCouleurs(si, fi, texte) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const couleurs = {};
  String(texte || '').split('\n').forEach(ligne => {
    const i = ligne.lastIndexOf('=');
    if (i < 1) return;
    const cle = ligne.slice(0, i).trim();
    const hex = ligne.slice(i + 1).trim();
    if (cle && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(hex)) couleurs[cle] = hex;
  });
  if (Object.keys(couleurs).length) f.options.couleurs = couleurs; else delete f.options.couleurs;
  renderBuilder();
}

/** Une option de texte (borne de date, question à ne pas précéder). */
function onOptionTexte(si, fi, cle, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (String(valeur || '').trim()) f.options[cle] = String(valeur).trim(); else delete f.options[cle];
}

function onOptionPresets(si, fi, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const liste = String(valeur || '').split(/[;,\s]+/).map(Number).filter(Number.isFinite);
  if (liste.length) f.options.presets = liste; else delete f.options.presets;
}

/** La valeur de départ d'une question. */
function onDepart(si, fi, source, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (!source) { delete f.options.depart; renderBuilder(); return; }
  const d = f.options.depart = f.options.depart || {};
  d.source = source;
  if (source === 'valeur') { if (valeur !== null) d.valeur = valeur; else if (d.valeur === undefined) d.valeur = ''; }
  else delete d.valeur;
  renderBuilder();
}

/** Ce qu'un lieu complète : une colonne par sens (adresse, commune, bâtiment…). */
function onEnrichir(si, fi, sens, colId) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const e = f.options.enrichir = f.options.enrichir || { colonnes: {} };
  if (colId) e.colonnes[sens] = colId; else delete e.colonnes[sens];
  if (!Object.keys(e.colonnes).length) delete f.options.enrichir;
}

/** Comment un lieu se renseigne : carte, adresse, ou les deux. La carte seule est le réglage par défaut : on ne l'écrit pas. */
function onSaisieLieu(si, fi, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (valeur && valeur !== 'carte') f.options.saisieLieu = valeur; else delete f.options.saisieLieu;
  renderBuilder();
}

/** Ranger une question dans un groupe, ou en créer un ; vide : elle sort du groupe. */
function onGroupe(si, fi, valeur) {
  marquerModifie();
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  f.options = f.options || {};
  if (valeur === '__nouveau') {
    def.groupes = def.groupes || {};
    let n = Object.keys(def.groupes).length + 1;
    while (def.groupes['groupe-' + n]) n++;
    def.groupes['groupe-' + n] = { titre: 'Nouveau groupe', colonnes: 1 };
    f.options.groupe = 'groupe-' + n;
  } else if (valeur) {
    f.options.groupe = valeur;
  } else {
    delete f.options.groupe;
  }
  renderBuilder();
}

/** La légende et la disposition d'un groupe, partagées par toutes ses questions. */
function onGroupeDef(id, cle, valeur) {
  const def = S.currentDef;
  if (!def.groupes || !def.groupes[id]) return;
  marquerModifie();
  if (cle === 'colonnes') def.groupes[id].colonnes = Number(valeur) === 2 ? 2 : 1;
  else if (cle === 'titre') def.groupes[id].titre = String(valeur || '');
  if (cle === 'colonnes') renderBuilder();
}

/** La colonne qui reçoit la précision d'un relevé GPS ; vide : on ne la note pas. */
function onPrecision(si, fi, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (valeur) f.options.precisionCol = valeur; else delete f.options.precisionCol;
  renderBuilder();
}

/** Le clavier qu'ouvre un téléphone. Automatique = rien d'écrit : il se déduit du format. */
function onClavier(si, fi, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const clavier = Object.assign({}, f.options.clavier);
  if (valeur) clavier.inputmode = valeur; else delete clavier.inputmode;
  if (Object.keys(clavier).length) f.options.clavier = clavier; else delete f.options.clavier;
  renderBuilder();
}

/** Le format qu'une question de texte contrôle (IBAN, SIRET…). */
function onValidation(si, fi, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (valeur) {
    f.options.validation = { format: valeur };
    // Un nom se corrige, il ne se refuse pas : c'est le réglage de départ.
    if (window.FormFormats && FormFormats.peutCorrigerSeulement && FormFormats.peutCorrigerSeulement(valeur)) f.options.validation.mode = 'corriger';
  } else delete f.options.validation;
  renderBuilder();
}

/** Corriger sans rien refuser, ou demander de corriger (les noms). */
function onValidationMode(si, fi, mode) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  const v = f.options && f.options.validation;
  if (!v) return;
  if (mode === 'corriger') v.mode = 'corriger'; else delete v.mode;
  renderBuilder();
}

/** Ce que la question reprend de l'adresse de la page. */
function onPrefill(si, fi, cle, valeur) {
  marquerModifie();
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const p = f.options.prefill = f.options.prefill || {};
  if (cle === 'verrouille') { if (valeur) p.verrouille = true; else delete p.verrouille; }
  else if (String(valeur || '').trim()) p[cle] = String(valeur).trim();
  else delete p[cle];
  // Sans paramètre, il n'y a plus de valeur reçue : la déclaration s'efface.
  if (!p.param) delete f.options.prefill;
}

/** D'ou viennent les propositions d'une adresse, et quand la recherche part. */
function onReferentiel(si, fi, cle, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const r = f.options.referentiel || (f.options.referentiel = { source: 'ban' });
  marquerModifie();
  if (cle === 'declenchement') {
    // La validation est le defaut : on ne l'ecrit pas, pour que le FormDef dise ce qui est choisi.
    if (valeur === 'frappe') r.declenchement = 'frappe'; else delete r.declenchement;
  } else {
    r[cle] = valeur;
  }
  renderBuilder();
}

/** Associer un sens (code postal, coordonnees…) a une colonne qui existe. */
function onReferentielAnnexe(si, fi, cle, colId) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};
  const annexes = f.options.colonnes.annexes || (f.options.colonnes.annexes = {});
  marquerModifie();
  if (colId) annexes[cle] = colId; else delete annexes[cle];
  if (!Object.keys(annexes).length) delete f.options.colonnes.annexes;
  renderBuilder();
}

/** Les noms de colonnes qu'on propose quand la table est a creer. */
const SUFFIXES_ANNEXES = {
  codePostal: 'CodePostal', commune: 'Commune', insee: 'Insee',
  latitude: 'Latitude', longitude: 'Longitude', identifiant: 'IdBan'
};

/** Table a creer : cocher un sens fixe le nom de sa colonne, qu'on n'a pas a inventer. */
function onReferentielAnnexeCase(si, fi, cle, coche) {
  const f = S.currentDef.sections[si].fields[fi];
  onReferentielAnnexe(si, fi, cle, coche ? ((f.colId || 'Adresse') + '_' + (SUFFIXES_ANNEXES[cle] || cle)) : '');
}

/** Ce que le canevas demande de composer. */
function onDessin(si, fi, cle, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const d = f.options.dessin || (f.options.dessin = {});
  marquerModifie();
  if (cle === 'hauteur') {
    const n = Number(valeur);
    if (n > 0) d.hauteur = n; else delete d.hauteur;
  } else if (cle === 'usage') {
    d.usage = valeur;
    // Une signature ne s'annote pas : le fond n'aurait plus de sens.
    if (valeur === 'signature') delete d.fond;
  } else {
    if (valeur) d[cle] = String(valeur); else delete d[cle];
  }
  renderBuilder();
}

/**
 * Un fond depose depuis l'appareil.
 *
 * Il part dans le FormDef en `data:`, comme l'illustration, et sous le meme
 * plafond : la definition se recharge a chaque ouverture du formulaire.
 */
function onDessinFichier(si, fi, fichier) {
  if (!fichier) return;
  const PLAFOND = 400 * 1024;
  if (fichier.size > PLAFOND) {
    toast('Fond trop lourd (' + Math.round(fichier.size / 1024) + ' Ko). Réduisez-le, ou donnez son adresse.', 'error');
    return;
  }
  const lecteur = new FileReader();
  lecteur.onload = () => onDessin(si, fi, 'fond', String(lecteur.result || ''));
  lecteur.readAsDataURL(fichier);
}

/** Quelle sorte d'illustration cette question porte. */
function onIllustrationType(si, fi, type) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  if (!type) delete f.options.illustration;
  else {
    const ancienne = f.options.illustration || {};
    if (type === 'carte') {
      f.options.illustration = { type: 'carte', fond: ancienne.fond || 'plan', reperes: ancienne.reperes || [] };
    } else if (type === 'inclusion') {
      f.options.illustration = { type: 'inclusion', url: ancienne.url || '', hauteur: ancienne.hauteur || 320,
        titre: ancienne.titre || '', legende: ancienne.legende || '' };
    } else {
      f.options.illustration = { type: 'image', url: ancienne.url || '', alt: ancienne.alt || '',
        legende: ancienne.legende || '' };
    }
  }
  marquerModifie();
  renderBuilder();
}

function onIllustration(si, fi, cle, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.options || !f.options.illustration) return;
  f.options.illustration[cle] = valeur;
  marquerModifie();
  renderBuilder();
}

/**
 * Une image deposee depuis l'appareil.
 *
 * Elle part dans le FormDef, en `data:` URL : un formulaire doit pouvoir
 * voyager — copie, publie, embarque — sans dependre d'un fichier reste
 * ailleurs. Au-dela de quelques centaines de kilo-octets, on refuse : la
 * definition se recharge a chaque ouverture, et une photo d'appareil la
 * rendrait lourde pour tout le monde.
 */
function onIllustrationFichier(si, fi, fichier) {
  if (!fichier) return;
  const PLAFOND = 400 * 1024;
  if (fichier.size > PLAFOND) {
    toast('Image trop lourde (' + Math.round(fichier.size / 1024) + ' Ko). Réduisez-la, ou donnez son adresse.', 'error');
    return;
  }
  const lecteur = new FileReader();
  lecteur.onload = () => {
    onIllustration(si, fi, 'url', String(lecteur.result || ''));
  };
  lecteur.readAsDataURL(fichier);
}

/** La proposition dont on va poser le repere au prochain clic sur la carte. */
function illustrationRepere(si, fi, option) {
  S.repereEnCours = option ? { si, fi, option } : null;
}

function illustrationViderReperes(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.options || !f.options.illustration) return;
  f.options.illustration.reperes = [];
  marquerModifie();
  renderBuilder();
}

/** Combien de rangs un classement retient. */
function onFieldRangs(si, fi, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  const n = Math.max(1, Math.min(10, parseInt(valeur, 10) || 3));
  f.options = f.options || {};
  f.options.rangs = n;
  f.options.colonnes = f.options.colonnes || {};
  const rangs = (f.options.colonnes.rangs || []).slice(0, n);
  while (rangs.length < n) rangs.push('');
  f.options.colonnes.rangs = rangs;
  marquerModifie();
  renderBuilder();
}

/** La colonne ou atterrit le choix de rang n. */
function onFieldRang(si, fi, rang, colId) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};
  const rangs = (f.options.colonnes.rangs || []).slice();
  rangs[rang] = colId;
  f.options.colonnes.rangs = rangs;
  marquerModifie();
  renderBuilder();
}

/** Le plafond de cases cochees. */
function onFieldMax(si, fi, valeur) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  const n = parseInt(valeur, 10);
  if (Number.isFinite(n) && n > 0) f.options.maxSelected = n;
  else delete f.options.maxSelected;
  marquerModifie();
  renderBuilder();
}

/**
 * Autoriser une reponse libre.
 *
 * L'option « Autre » s'ajoute a la liste proposee, car c'est elle que la
 * colonne acceptera : ecrire le texte libre a sa place serait refuse par
 * Grist, qui l'encadrerait en rouge.
 */
function onFieldAutre(si, fi, actif) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};
  if (actif) {
    f.options.autreLibre = true;
    if (!f.options.valeurAutre) f.options.valeurAutre = 'Autre';
    if (f.type === 'Choice' || f.type === 'ChoiceList') f.kind = 'choix_autre';
    // En mode création, la liste nous appartient : « Autre » s'y ajoute.
    if (def.composeMode === 'ensureSchema') {
      const liste = def.choices[f.colId] || (f.options.choices || []);
      if (liste.indexOf(f.options.valeurAutre) === -1) {
        def.choices[f.colId] = liste.concat([f.options.valeurAutre]);
      }
    }
    // Une seule colonne texte libre : c'est forcément celle-là.
    const texte = (S.columnsByTable[def.tableId] || [])
      .filter(c => c.type === 'Text' && c.colId !== f.colId);
    if (!f.options.colonnes.autre && texte.length === 1) f.options.colonnes.autre = texte[0].colId;
  } else {
    delete f.options.autreLibre;
    delete f.options.colonnes.autre;
    if (f.kind === 'choix_autre') delete f.kind;
  }
  marquerModifie();
  renderBuilder();
}

/**
 * Ajouter « Autre » à la liste de la colonne, dans Grist.
 *
 * Le compositeur écrit déjà le schéma quand il crée les colonnes ; ici il
 * modifie une colonne existante, et c'est pourquoi le geste se demande au
 * lieu de se faire tout seul quand on coche la case.
 */
async function ajouterChoixALaColonne(si, fi) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  const mot = (f.options && f.options.valeurAutre) || 'Autre';
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  if (!colonne) return;
  const liste = (colonne.choix || []).concat([mot]);
  try {
    await GristBridge.applyUserActions([['ModifyColumn', def.tableId, f.colId, {
      widgetOptions: JSON.stringify({ choices: liste, choiceOptions: {} })
    }]]);
    colonne.choix = liste;
    toast(`« ${mot} » ajouté à la colonne ${f.colId}`, 'success');
  } catch (e) {
    toast('Grist a refusé la modification de la colonne : ' + (e && e.message ? e.message : ''), 'error');
  }
  renderBuilder();
}

function onFieldAutreCol(si, fi, colId) {
  const f = S.currentDef.sections[si].fields[fi];
  f.options = f.options || {};
  f.options.colonnes = f.options.colonnes || {};

function onFieldVisibleCol(si, fi, value) {

function onFieldCascadeToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  const refPrior = priorFields(S.currentDef, si, fi).filter(p => p.type === 'Ref');
  if (checked && !refPrior.length) {
    toast('Ajoutez d’abord une question Référence au-dessus de celle-ci.', 'error');
    return;
  }
  f.cascade = checked ? { parentField: '', parentRefCol: '' } : null;
  if (checked) f.dynamicFilter = null;
  renderBuilder();
}

function onFieldCascadeParent(si, fi, parentColId) {
  const def = S.currentDef;
  const f = def.sections[si].fields[fi];
  if (!f.cascade) f.cascade = { parentField: '', parentRefCol: '' };
  f.cascade.parentField = parentColId || '';
  f.cascade.parentRefCol = '';
  const parent = findFieldMeta(def, parentColId);
  const childTable = resolveRefTableOfField(f);
  const parentTable = parent && parent.refTable;
  if (childTable && parentTable) {
    const cols = S.columnsByTable[childTable] || [];
    f.cascade.parentRefCol = FormUx.detectRefColumn(cols, parentTable) || '';
  }
  renderBuilder();
}

function onFieldCascade(si, fi, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.cascade) f.cascade = { parentField: '', parentRefCol: '' };
  f.cascade[prop] = value;
}

function onFieldDynamicToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  const dynPrior = priorFields(S.currentDef, si, fi).filter(p =>
    p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  if (checked && !dynPrior.length) {
    toast('Ajoutez d’abord une question (Liste, Texte, Oui/Non ou Référence) au-dessus.', 'error');
    return;
  }
  f.dynamicFilter = checked ? { parentField: '', filterColumn: '' } : null;
  if (checked) f.cascade = null;
  renderBuilder();
}

function onFieldDynamic(si, fi, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.dynamicFilter) f.dynamicFilter = { parentField: '', filterColumn: '' };
  if (prop === 'parentField') {
    f.dynamicFilter.parentField = value || '';
    const parentMeta = value ? findFieldMeta(S.currentDef, value) : null;
    if (parentMeta && parentMeta.type === 'Ref') {
      f.dynamicFilter.parentResolve = 'refRow';
      if (!f.dynamicFilter.parentValueColumn) {
        const cols = parentMeta.refTable ? (S.columnsByTable[parentMeta.refTable] || []) : [];
        const guess = cols.find(c => /groupe|group|type|categorie|catégorie|org/i.test(c.colId || c.label || ''));
        f.dynamicFilter.parentValueColumn = guess ? guess.colId : '';
        if (!f.dynamicFilter.filterColumn && f.dynamicFilter.parentValueColumn) {
          f.dynamicFilter.filterColumn = f.dynamicFilter.parentValueColumn;
        }
      }
    } else {
      f.dynamicFilter.parentResolve = 'value';
      delete f.dynamicFilter.parentValueColumn;
    }
  } else if (prop === 'parentValueColumn') {
    f.dynamicFilter.parentValueColumn = value || '';
    f.dynamicFilter.parentResolve = 'refRow';
    if (value && !f.dynamicFilter.filterColumn) f.dynamicFilter.filterColumn = value;
  } else {
    f.dynamicFilter[prop] = value;
  }
  renderBuilder();
}

function setConditionOn(target, checked) {
  if (!checked) {
    target.condition = null;
    if (target.gate !== undefined) target.gate = null;
    return;
  }
  target.condition = FormUx.compactCondition(FormUx.normalizeToCompound(null)) ||
    { field: '', operator: '==', value: '' };
  // Ensure editable compound in memory via normalize on next render
  const c = FormUx.normalizeToCompound(target.condition);
  target.condition = FormUx.compactCondition(c) || { field: '', operator: '==', value: '' };
}

function mutateCompound(target, mutator) {
  const compound = FormUx.normalizeToCompound(target.condition);
  mutator(compound);
  target.condition = FormUx.compactCondition(compound);
  if (target.gate !== undefined) {
    // Sync gate shortcut when single Bool == true
    const c = target.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      target.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else {
      target.gate = null;
    }
  }
}

function onSectionConditionToggle(si, checked) {
  const sec = S.currentDef.sections[si];
  setConditionOn(sec, checked);
  if (checked) {
    mutateCompound(sec, function (c) {
      c.op = 'and';
      c.rules = [FormUx.emptyRule()];
    });
    // keep uncompacted for editing: store compound if empty field
    sec.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  }
  renderBuilder();
}

function onFieldConditionToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!checked) { f.condition = null; renderBuilder(); return; }
  f.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  renderBuilder();
}

function onSectionConditionOp(si, value) {
  mutateCompound(S.currentDef.sections[si], function (c) { c.op = value === 'or' ? 'or' : 'and'; });
  // Keep compound form while editing
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onFieldConditionOp(si, fi, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onSectionRuleAdd(si) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onFieldRuleAdd(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onSectionRuleRemove(si, ri) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.splice(ri, 1);
  if (!sec.condition.rules.length) sec.condition = null;
  else sec.condition = FormUx.compactCondition(sec.condition) || sec.condition;
  if (!sec.condition) sec.gate = null;
  renderBuilder();
}

function onFieldRuleRemove(si, fi, ri) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.splice(ri, 1);
  if (!f.condition.rules.length) f.condition = null;
  else f.condition = FormUx.compactCondition(f.condition) || f.condition;
  renderBuilder();
}

function coerceRuleValue(raw, sourceType) {
  if (sourceType === 'Bool') {
    if (raw === true || raw === 'true') return true;
    if (raw === false || raw === 'false') return false;
  }
  if (sourceType === 'Int' || sourceType === 'Numeric' || sourceType === 'Ref') {
    const n = Number(raw);
    if (raw !== '' && Number.isFinite(n)) return n;
  }
  return raw;
}

function parseAudienceValue(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw == null || raw === '') return '';
  if (typeof raw === 'boolean') return raw;
  const s = String(raw);
  if (s.indexOf(',') !== -1) {
    return s.split(',').map(x => x.trim()).filter(Boolean);
  }
  return s;
}

function onSectionRule(si, ri, prop, value) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  const rule = sec.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (sec.condition.rules.length === 1 && sec.condition.rules[0].field) {
    const compact = FormUx.compactCondition(sec.condition);
    sec.condition = compact;
    const c = sec.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      sec.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else sec.gate = null;
  }
  renderBuilder();
}

function onFieldRule(si, fi, ri, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  const rule = f.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (f.condition.rules.length === 1 && f.condition.rules[0].field) {
    f.condition = FormUx.compactCondition(f.condition);
  }
  renderBuilder();
}

// Legacy no-ops kept if referenced
function onFieldCondition(si, fi, prop, value) {
  onFieldRule(si, fi, 0, prop, value);
}

// ── Enregistrement (upsert Formulaires + ensureSchema si mode actif) ────
async function saveForm() {
  const def = S.currentDef;
  if (!def.title) { toast('Le titre du formulaire est requis', 'error'); return; }
  if (!def.tableId) { toast('Indiquez un nom pour la table des réponses', 'error'); return; }

  // Une question sans colonne ferait refuser toute la ligne à l'envoi : on la nomme d'après son libellé.
  for (const s of def.sections) {
    for (const f of s.fields) {
      if (!f.colId && f.label && def.composeMode === 'ensureSchema') f.colId = FormUx.slugify(f.label);
    }
  }
  const sansColonne = def.sections.flatMap(s => s.fields).filter(f => !f.colId);
  if (sansColonne.length) {
    toast('Choisissez la colonne de : ' + sansColonne.map(f => f.label || 'question sans titre').join(', '), 'error');
    return;
  }

  try {
    if (def.composeMode === 'ensureSchema') {
      const tableExists = S.tables.some(t => t.tableId === def.tableId);
      if (!tableExists) S.columnsByTable[def.tableId] = S.columnsByTable[def.tableId] || [];
      const existingColumns = await colonnesExistantes(def.tableId);
      const plan = EnsureSchema.planEnsureSchema(def, existingColumns, { tableExists: tableExists });
      if (!plan.ok) {
        const msgs = FormUx.humanizeBindingErrors(plan.errors);
        toast(msgs.join(' ; '), 'error');
        return;
      }
      if (plan.actions.length) {
        const hasAddColumn = plan.actions.some(a => a[0] === 'AddColumn');
        if (tableExists && hasAddColumn) {
          if (!confirm('Cette table existe déjà. Ajouter les colonnes manquantes ?')) return;
        }
        if (S.isDemo) {
          applyEnsureSchemaDemo(plan, def.tableId);
        } else {
          await GristBridge.applyUserActions(plan.actions);
          await refreshTablesAfterSchemaChange();
          if (S.tables.some(t => t.tableId === def.tableId)) {
            await reloadColumnsForTable(def.tableId);
          }
          await applyVisibleColMeta(def);
        }
        const createdTable = plan.actions.some(a => a[0] === 'AddTable');
        const misesAJour = plan.actions.filter(a => a[0] === 'ModifyColumn').length;
        const creees = plan.actions.length - misesAJour;
        toast(
          createdTable
            ? 'Table « ' + def.tableId + ' » créée depuis le formulaire'
            : [
                creees ? creees + ' colonne(s) créée(s) sur ' + def.tableId : '',
                misesAJour ? 'formule des places mise à jour' : ''
              ].filter(Boolean).join(', '),
          'success'
        );
      } else if (!S.isDemo) {
        // Binding déjà aligné : tenter quand même visibleCol méta (Ref)
        await applyVisibleColMeta(def);
      }
    }

    const existingRow = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    const meta = {
      version: existingRow ? existingRow.Version : 0,
      statut: existingRow ? existingRow.Statut : 'brouillon',
      publishedSectionRef: existingRow ? existingRow.PublishedSectionRef : undefined,
      updatedAt: GristBridge.util.fromDate(new Date())
    };
    const fields = FormulairesTable.rowFromFormDef(def, meta);

    if (S.isDemo) {
      saveDemoFormulaireRow(fields);
    } else if (S.currentRowId) {
      await GristBridge.updateRow('Formulaires', S.currentRowId, fields);
      await loadFormulaires();
    } else {
      await GristBridge.addRow('Formulaires', fields);
      await loadFormulaires();
      const found = S.forms.find(r => r.FormId === def.id);
      if (found) S.currentRowId = found.id;
    }

    S.dirty = false;
    S.enregistreA = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    toast('Formulaire enregistré', 'success');
    const row = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    if (row && row.Statut === 'publie') {
      toast('Pensez à remettre en ligne le formulaire');
    }
  } catch (e) {
    toast('Erreur à l\'enregistrement : ' + (e && e.message), 'error');
    throw e;
  }
}

function saveDemoFormulaireRow(fields) {
  if (S.currentRowId) {
    const row = S.forms.find(r => r.id === S.currentRowId);
    Object.assign(row, fields);
  } else {
    const row = Object.assign({ id: demoNextId++ }, fields);
    S.forms.push(row);
    S.currentRowId = row.id;
  }
}

/**
 * Le menu : voir, exporter, régler — ce qui vaut pour le formulaire entier,
 * accessible depuis n'importe quelle étape.
 *
 * Il se peuple à l'ouverture, pas au rendu de chaque écran : son contenu dépend
 * du formulaire courant, qui change sous lui.
 */
function renderMenuOptions() {
  const panneau = document.getElementById('menu-options-panneau');
  if (!panneau) return;
  const def = S.currentDef;
  if (!def) {
    panneau.innerHTML = outilHtml() + `<p class="app-menu__note">Choisissez un formulaire pour voir sa définition, l’exporter ou la régler.</p>`;
    return;
  }
  let smJson = '';
  try { smJson = JSON.stringify(SurveyProject.formDefToSurveyManifest(def), null, 2); }
  catch (e) { smJson = 'Projection impossible : ' + (e && e.message); }

  panneau.innerHTML = outilHtml() + `
    <p class="app-menu__titre">Exporter</p>

/** Fermer le menu : un clic ailleurs, ou Échap. */
function installerMenuOptions() {
  const menu = document.getElementById('menu-options');
  if (!menu) return;
  menu.addEventListener('toggle', () => { if (menu.open) renderMenuOptions(); });
  document.addEventListener('click', (e) => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.open) menu.open = false; });
}

function telechargerJson(objet, nom) {
  const blob = new Blob([JSON.stringify(objet, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadFormDef() {
  if (!S.currentDef) return;
  try { telechargerJson(FormulairesTable.defPropre(S.currentDef), (S.currentDef.id || 'formulaire') + '.json'); }
  catch (e) { toast('Erreur export : ' + (e && e.message), 'error'); }
}

async function copierFormDef() {
  if (!S.currentDef) return;
  const texte = JSON.stringify(FormulairesTable.defPropre(S.currentDef), null, 2);
  try {
    await navigator.clipboard.writeText(texte);
    toast('Définition copiée', 'success');
  } catch (e) {
    // Le presse-papier est refusé dans certaines iframes : on ne ment pas.
    toast('Copie refusée par le navigateur — utilisez le téléchargement', 'error');
  }
}

/** Les réglages d'ensemble vivent sur l'écran des questions : on y mène. */
function ouvrirReglages() {
  const menu = document.getElementById('menu-options');
  if (menu) menu.open = false;
  goStep('builder');
  requestAnimationFrame(() => {
    const cible = document.getElementById('cible-table');
    if (!cible) return;
    cible.scrollIntoView({ block: 'center', behavior: 'smooth' });
    cible.focus();
  });
}

function downloadSurveyManifest() {
  if (!S.currentDef) return;
  try {
    const sm = SurveyProject.formDefToSurveyManifest(S.currentDef);
    const blob = new Blob([JSON.stringify(sm, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (S.currentDef.id || 'survey') + '-manifest.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    toast('Erreur export : ' + (e && e.message), 'error');
  }
}

/**
 * Le formulaire tel que le public le recevra.
 *
 * En mode liaison, les listes de choix vivent dans les colonnes Grist : le
 * FormDef n'a pas a les recopier, et un apercu qui ne les lit pas montre des
 * questions sans reponses possibles. On les pose ici, sur une copie — le
 * formulaire enregistre, lui, reste tel qu'il a ete compose.
 */
function defPourApercu(def) {
  if (!def) return def;
  const copie = JSON.parse(JSON.stringify(def));
  const colonnes = S.columnsByTable[copie.tableId] || [];
  copie.choices = copie.choices || {};
  (copie.sections || []).forEach(section => (section.fields || []).forEach(f => {
    if (copie.choices[f.colId] && copie.choices[f.colId].length) return;
    if (f.options && f.options.choices && f.options.choices.length) return;
    const col = colonnes.find(c => c.colId === f.colId);
    if (col && col.choix && col.choix.length) copie.choices[f.colId] = col.choix.slice();
  }));
  return copie;
}

/** Voir le formulaire comme on le verra : sur un telephone, ou en grand. */
function apercuLargeur(quoi) {
  S.apercuLargeur = quoi;
  renderPreviewStep();
}

function mountPreview() {
  const mountEl = document.getElementById('preview-mount');
  if (!mountEl) return;
  const previewBridge = {
    submit(data) {
      toast('Aperçu : soumission simulée (voir console)', 'success');
      console.log('[builder preview] soumission simulée', data);
      return Promise.resolve();
    }
  };
  habillerApercus();
  try {
    FormEngine.mount(mountEl, defPourApercu(S.currentDef), Object.assign(previewBridge, {
      // On arrive sur l'etape qu'on etait en train de composer : sans cela,
      // verifier la septieme demandait de repondre aux six premieres.
      etapeDepart: etapeVisibleCourante(S.currentDef),
      loadTable: S.isDemo ? null : function (t) { return GristBridge.loadTable(t); },
      skipProbe: true
    }));
  } catch (e) {
    mountEl.innerHTML = `<div class="fr-alert fr-alert--error"><p>Erreur de rendu : ${esc(e.message)}</p></div>`;
  }
}
