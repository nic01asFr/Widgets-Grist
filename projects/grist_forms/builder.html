// RENDU — navigation par étapes
// ═══════════════════════════════════════════════════════════
function render() {
  renderStatusBadge();
  renderSteps();
  goStep(S.step || 'forms');
}

function renderStatusBadge() {
  const badge = document.getElementById('status-badge');
  if (!badge) return;
  // Une pastille et deux mots : l'état tient sur la barre, sans prendre de ligne.
  if (S.isDemo) {
    badge.className = 'app-bar__etat est-demo';
    badge.textContent = 'Hors Grist';
    badge.title = 'Mode démo : rien n’est écrit dans un document';
  } else {
    badge.className = 'app-bar__etat est-connecte';
    badge.textContent = 'Connecté';
    badge.title = 'Connecté à Grist';
  }
}

function renderSteps() {
  const nav = document.getElementById('steps');
  nav.innerHTML = STEPS.map(s => `
    <button type="button" class="fr-btn ${S.step === s.id ? 'is-active' : 'fr-btn--secondary'}" onclick="App.goStep('${s.id}')">${s.label}</button>
  `).join('');
}

function goStep(step) {
  S.step = step;
  renderSteps();
  document.querySelectorAll('.builder-step').forEach(el => { el.hidden = true; });
  if (step === 'forms') { renderFormsList(); document.getElementById('forms-list').hidden = false; }
  if (step === 'builder') { renderBuilder(); document.getElementById('builder').hidden = false; }
  if (step === 'preview') { renderPreviewStep(); document.getElementById('preview').hidden = false; }
  if (step === 'publish') { renderPublishStep(); document.getElementById('publish-log').hidden = false; }
}

// ═══════════════════════════════════════════════════════════
// ÉTAPE 1 — Liste des formulaires / wizard
// ═══════════════════════════════════════════════════════════
function renderFormsList() {
  const el = document.getElementById('forms-list');

  if (S.wizardOpen) {
    const templates = (window.FormUx && FormUx.templates) ? FormUx.templates() : [];
    const tplCards = templates.map(t => `
      <button type="button" class="wizard-card" onclick="App.applyTemplate('${esc(t.id)}')">
        <h3>${esc(t.label)}</h3>
        <p>${esc(t.description)}</p>
      </button>
    `).join('');
    el.innerHTML = `
      <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle fr-mb-2w">
        <div class="fr-col"><h2 class="fr-h5 fr-mb-0">Nouveau formulaire</h2></div>
        <div class="fr-col fr-col--auto"><button class="fr-btn fr-btn--secondary" onclick="App.cancelWizard()">Annuler</button></div>
      </div>
      <p class="fr-text--sm">Comment voulez-vous commencer ?</p>
      <div class="wizard-grid">
        <button type="button" class="wizard-card" onclick="App.startWizardCreate()">
          <h3>Créer un questionnaire</h3>
          <p>Les réponses iront dans une nouvelle table créée automatiquement.</p>
        </button>
        <button type="button" class="wizard-card" onclick="App.startWizardBind()">
          <h3>Brancher sur une table existante</h3>
          <p>Reliez les questions aux colonnes déjà présentes dans Grist.</p>
        </button>
      </div>
      <h3 class="fr-h6 fr-mt-3w">Ou partir d’un modèle</h3>
      <div class="wizard-grid">${tplCards}</div>
    `;
    return;
  }

  const rows = S.forms.map(f => `
    <tr>
      <td>${esc(f.Nom)}</td>
      <td>${esc(f.TableCible)}</td>
      <td>${esc(f.Version)}</td>
      <td>
        <span class="fr-badge ${f.Statut === 'publie' ? 'fr-badge--success' : 'fr-badge--info'}">${esc(f.Statut)}</span>
        ${f.Statut === 'publie' ? `<span class="publish-hint">Toute modification des questions exige de remettre en ligne</span>` : ''}
      </td>
      <td><button class="fr-btn fr-btn--sm" onclick="App.editForm(${f.id})">Éditer</button></td>
    </tr>
  `).join('');

  el.innerHTML = `
    <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle fr-mb-2w">
      <div class="fr-col"><h2 class="fr-h5 fr-mb-0">Mes formulaires</h2></div>
      <div class="fr-col fr-col--auto"><button class="fr-btn" onclick="App.newForm()">+ Nouveau formulaire</button></div>
    </div>
    ${S.forms.length
      ? `<table class="fr-table"><thead><tr><th>Nom</th><th>Table cible</th><th>Version</th><th>Statut</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="fr-text--sm">Aucun formulaire pour le moment${S.isDemo ? ' (mode démo)' : ''}.</p>`}
  `;
}

function newForm() {
  S.wizardOpen = true;
  renderFormsList();
}

function cancelWizard() {
  S.wizardOpen = false;
  renderFormsList();
}

function startWizardCreate() {
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = newFormDef();
  S.autoTable = true;
  S.publishLog = [];
  goStep('builder');
}

function startWizardBind() {
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = newFormDef();
  S.currentDef.composeMode = 'bind';
  S.currentDef.tableId = (S.tables[0] && S.tables[0].tableId) || '';
  S.autoTable = false;
  S.publishLog = [];
  goStep('builder');
}

function applyTemplate(templateId) {
  if (!window.FormUx) { toast('FormUx indisponible', 'error'); return; }
  const tpl = FormUx.templates().find(t => t.id === templateId);
  if (!tpl) { toast('Modèle introuvable', 'error'); return; }
  const built = tpl.build();
  const base = newFormDef();
  Object.assign(base, built, {
    id: base.id,
    manifest_version: base.manifest_version,
    classification: base.classification,
    composeMode: 'ensureSchema',
    tableId: FormUx.tableNameFromTitle(built.title || 'Questionnaire')
  });
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = base;
  S.autoTable = true;
  S.publishLog = [];
  goStep('builder');
}

function editForm(id) {
  const row = S.forms.find(f => f.id === id);
  if (!row) return;
  let def;
  try { def = JSON.parse(row.Def); } catch (e) { toast('Def JSON invalide pour ce formulaire', 'error'); return; }
  S.currentDef = def;
  // L'identifiant de colonne d'un formulaire enregistré est une décision déjà
  // prise : renommer son libellé ne doit pas le redériver, et viser une autre
  // colonne. La marque de travail ne part plus dans `Def` (elle n'appartient
  // pas au contrat), on la repose donc à l'ouverture.
  (def.sections || []).forEach(s => (s.fields || []).forEach(f => { f._colIdLocked = true; }));
  ensureBranding(def);
  ensureAudience(def);
  S.currentRowId = id;
  S.publishLog = [];
  S.wizardOpen = false;
  S.autoTable = def.composeMode === 'ensureSchema';
  goStep('builder');
}

// ═══════════════════════════════════════════════════════════
// ÉTAPE 2 — Construction (sections / champs)
// ═══════════════════════════════════════════════════════════
/**
 * L'écran de composition, en trois zones.
 *
 * > **Mesuré avant d'y toucher** : l'enquête du 4ᵉ chargée dans l'ancien écran
 * > faisait **34 357 px de haut — 45 écrans de défilement** — et affichait
 * > **709 contrôles d'un coup**, toutes les questions dépliées en même temps.
 * > On ne pouvait ni voir la forme du questionnaire, ni réordonner, ni
 * > travailler une question sans défiler par-dessus les soixante autres.
 *
 * Trois zones : la **structure** (ce que le formulaire est), **la question**
 * choisie — une seule à la fois —, et l'**aperçu**, qui répond pendant qu'on
 * écrit au lieu d'attendre dans l'onglet voisin. Sur écran étroit, elles
 * s'empilent.
 */
function renderBuilder() {
  const el = document.getElementById('builder');
  if (!S.currentDef) {
    el.innerHTML = `<p class="fr-text--sm">Sélectionnez ou créez un formulaire depuis l'étape « Mes formulaires ».</p>`;
    return;
  }
  const def = S.currentDef;
  ensureBranding(def);
  ensureAudience(def);
  normaliserSelection();

  const cols = S.columnsByTable[def.tableId] || [];
  const colsDatalist = `<datalist id="cols-datalist">${cols.map(c => `<option value="${esc(c.colId)}">`).join('')}</datalist>`;

  el.innerHTML = `
    <div class="atelier">
      <aside class="atelier__structure" aria-label="Structure du formulaire">
        ${renderStructure(def)}
      </aside>
      <div class="atelier__question">
        ${renderZoneQuestion(def)}
      </div>
      <aside class="atelier__apercu" aria-label="Aperçu">
        <div class="atelier__apercu-tete">
          <span>Aperçu</span>
          <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm"
            onclick="App.refreshPreview()" title="Actualiser l’aperçu">↻</button>
        </div>
        <div class="atelier__apercu-cadre" id="builder-preview-mount"></div>
      </aside>
    </div>
    ${colsDatalist}
    <div class="barre-enregistrement">
      <span class="barre-enregistrement__etat">${esc(def.title || 'Sans titre')} — ${def.sections.length} étape(s), ${def.sections.reduce((n, s2) => n + (s2.fields || []).length, 0)} question(s)</span>
      <button class="fr-btn" onclick="App.saveForm()">Enregistrer</button>
    </div>
  `;
  monterApercuAtelier();
}

/** La sélection courante, ramenée à quelque chose qui existe encore. */
function normaliserSelection() {
  const def = S.currentDef;
  const sel = S.selection || { quoi: 'accueil' };
  if (sel.quoi === 'question') {
    const section = def.sections[sel.si];
    S.selection = (section && section.fields[sel.fi]) ? sel : { quoi: 'accueil' };
  } else if (sel.quoi === 'etape') {
    S.selection = def.sections[sel.si] ? sel : { quoi: 'accueil' };
  } else {
    S.selection = sel;
  }
}

function selectionEst(quoi, si, fi) {
  const s = S.selection || {};
  if (s.quoi !== quoi) return false;
  if (si != null && s.si !== si) return false;
  if (fi != null && s.fi !== fi) return false;
  return true;
}

/** Choisir ce qu'on compose : la zone centrale et l'aperçu suivent. */
function choisir(quoi, si, fi) {
  S.selection = { quoi: quoi, si: si, fi: fi };
  renderBuilder();
}

/** Le plan du formulaire : ses étapes, leurs questions, et ce qu'elles sont. */
function renderStructure(def) {
  const etapes = def.sections.map((section, si) => {
    const questions = (section.fields || []).map((f, fi) => {
      const actif = selectionEst('question', si, fi) ? ' est-actif' : '';
      return `<button type="button" class="structure__question${actif}" onclick="App.choisir('question', ${si}, ${fi})">
        <span class="structure__intitule">${esc(f.label || f.colId || 'Sans libellé')}</span>
        ${marquesDeChamp(f)}
        <span class="structure__nature">${esc(natureCourte(f))}</span>
      </button>`;
    }).join('');
    const chemin = (section.condition || section.gate)
      ? '<span class="structure__chemin" title="Cette étape ne s’affiche pas toujours">⤳</span>' : '';
    return `
      <div class="structure__etape">
        <button type="button" class="structure__titre${selectionEst('etape', si) ? ' est-actif' : ''}" onclick="App.choisir('etape', ${si})">
          <span class="structure__intitule">${esc(section.label || 'Étape ' + (si + 1))}</span>
          ${chemin}<span class="structure__compte">${(section.fields || []).length}</span>
        </button>
        ${questions}
        <button type="button" class="structure__ajout" onclick="App.addField(${si})">+ question</button>
      </div>`;
  }).join('');

  return `
    <button type="button" class="structure__titre structure__titre--bout${selectionEst('accueil') ? ' est-actif' : ''}" onclick="App.choisir('accueil')">Accueil</button>
    ${etapes}
    <button type="button" class="structure__ajout structure__ajout--etape" onclick="App.addSection()">+ étape</button>
    <button type="button" class="structure__titre structure__titre--bout${selectionEst('fin') ? ' est-actif' : ''}" onclick="App.choisir('fin')">Fin</button>
    <div class="structure__pied">${renderCibleEtMode(def)}</div>
  `;
}

/**
 * Ce qui pèse sur une question, en marques : obligatoire, conditionnelle, liée
 * à une autre, groupée en matrice. On voit d'un coup d'œil où sont les
 * enchaînements, sans ouvrir une à une les soixante questions.
 */
function marquesDeChamp(f) {
  const m = [];
  if (f.required) m.push('<span class="structure__marque" title="Réponse obligatoire">●</span>');
  if (f.condition) m.push('<span class="structure__marque" title="Ne s’affiche que sous condition">⤳</span>');
  if ((f.cascade && f.cascade.parentField) || (f.dynamicFilter && f.dynamicFilter.parentField)) {
    m.push('<span class="structure__marque" title="Sa liste dépend d’une autre réponse">⇄</span>');
  }
  if (f.options && f.options.matrice) m.push('<span class="structure__marque" title="Groupée en matrice">▦</span>');
  return m.join('');
}

/** Ce qu'est une question, en deux mots, pour se repérer dans la structure. */
function natureCourte(f) {
  if (f.kind === 'echelle') return 'échelle';
  const parType = {
    Text: f.widget === 'textarea' ? 'paragraphe' : 'texte',
    Int: 'nombre', Numeric: 'nombre', Bool: 'oui/non',
    Date: 'date', DateTime: 'date et heure',
    Choice: 'choix', ChoiceList: 'choix multiples',
    Attachments: 'fichiers'
  };
  const t = String(f.type || '').replace(/:.*$/, '');
  if (t === 'Ref' || t === 'RefList') return 'référence';
  return parType[t] || (f.kind || f.widget || 'question');
}

/** Où partent les réponses : une ligne en pied de structure, pas un bloc. */
function renderCibleEtMode(def) {
  const isEnsure = def.composeMode === 'ensureSchema';
  const tableOptions = S.tables.map(t =>
    `<option value="${esc(t.tableId)}" ${t.tableId === def.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`
  ).join('');
  if (isEnsure) {
    return `
      <label class="fr-label fr-text--sm" for="cible-table">Table des réponses</label>
      <input class="fr-input" id="cible-table" list="tables-datalist" value="${esc(def.tableId)}" placeholder="Reponses_…"
        onchange="App.onTableChange(this.value)" oninput="App.onDefInput('tableId', this.value); App.onManualTableEdit()">
      <datalist id="tables-datalist">${S.tables.map(t => `<option value="${esc(t.tableId)}">`).join('')}</datalist>
      <p class="mode-hint">Colonnes créées à l’enregistrement —
        <button type="button" onclick="App.onComposeModeChange('bind')">utiliser des colonnes existantes</button></p>`;
  }
  return `
    <label class="fr-label fr-text--sm" for="cible-table">Table des réponses</label>
    <select class="fr-select" id="cible-table" onchange="App.onTableChange(this.value)">${tableOptions}</select>
    <p class="mode-hint">Colonnes existantes —
      <button type="button" onclick="App.onComposeModeChange('ensureSchema')">les créer automatiquement</button></p>`;
}

/** Ce qu'on compose : l'accueil, une étape, une question, ou la fin. */
function renderZoneQuestion(def) {
  const sel = S.selection;
  if (sel.quoi === 'accueil') {
    const brand = def.branding;
    return `
      <h3 class="atelier__titre">Accueil</h3>
      <div class="fr-input-group">
        <label class="fr-label" for="acc-titre">Titre du questionnaire</label>
        <input class="fr-input" id="acc-titre" value="${esc(def.title)}" placeholder="Ce que le public lit en premier"
          oninput="App.onDefInput('title', this.value)" onblur="App.onTitleBlur()">
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="acc-desc">Description</label>
        <textarea class="fr-input" id="acc-desc" rows="3" placeholder="À quoi sert cette enquête, qui la mène…"
          oninput="App.onDefInput('description', this.value)">${esc(def.description)}</textarea>
      </div>
      ${renderBrandSlot({ kind: 'logo', urlKey: 'logoUrl', altKey: 'logoAlt', url: brand.logoUrl, alt: brand.logoAlt })}
      ${renderAudienceBlock(def.audience)}`;
  }
  if (sel.quoi === 'fin') {
    const brand = def.branding;
    return `
      <h3 class="atelier__titre">Page de confirmation</h3>
      <div class="fr-input-group">
        <label class="fr-label" for="fin-msg">Message de succès</label>
        <textarea class="fr-input" id="fin-msg" rows="3" placeholder="Merci ! Votre réponse a bien été enregistrée."
          oninput="App.onDefInput('successMessage', this.value)">${esc(def.successMessage)}</textarea>
      </div>
      ${renderBrandSlot({
        kind: 'success', urlKey: 'successImageUrl', altKey: 'successImageAlt',
        url: brand.successImageUrl, alt: brand.successImageAlt,
        logoUrl: brand.logoUrl, logoAlt: brand.logoAlt, previewClass: 'brand-slot__preview--success'
      })}`;
  }
  if (sel.quoi === 'etape') {
    return `<h3 class="atelier__titre">Étape ${sel.si + 1}</h3>${renderSectionEditor(def, def.sections[sel.si], sel.si)}`;
  }
  const section = def.sections[sel.si];
  const champ = section.fields[sel.fi];
  return `
    <h3 class="atelier__titre">${esc(section.label || 'Étape ' + (sel.si + 1))}</h3>
    ${renderFieldEditor(def, sel.si, champ, sel.fi)}`;
}

/** L'aperçu, posé sur l'étape qu'on compose. */
function monterApercuAtelier() {
  const cible = document.getElementById('builder-preview-mount');
  if (!cible || !window.FormEngine) return;
  const sel = S.selection || {};
  const def = S.currentDef;
  // L'aperçu ne montre que les étapes visibles : une étape conditionnelle non
  // remplie n'y figure pas. Le rang du compositeur n'est donc pas celui de
  // l'aperçu — sans cette traduction, on compose une étape et on en regarde
  // une autre.
  let depart = 0;
  if (sel.si != null && window.FormEngine.isSectionVisible) {
    const visibles = def.sections.filter((sec) => window.FormEngine.isSectionVisible(sec, {}, {}));
    const rang = visibles.indexOf(def.sections[sel.si]);
    depart = rang >= 0 ? rang : 0;
  }
  const vue = window.FormEngine.mount(cible, def, {
    submit: () => Promise.resolve(),
    loadTable: S.isDemo ? null : ((t) => GristBridge.loadTable(t)),
    skipProbe: true,
    etapeDepart: depart
  });
  S.apercuAtelier = vue;
}

function renderFieldPreview(f, si, fi) {
  const configuredPh = (f.options && f.options.placeholder) || '';
  const isTextLike = f.type === 'Text' || f.type === 'Int' || f.type === 'Numeric';
  if (isTextLike && (f.widget === 'text' || f.widget === 'textarea' || f.type === 'Int' || f.type === 'Numeric')) {
    const onPh = `App.onFieldOption(${si}, ${fi}, 'placeholder', this.value)`;
    const control = f.widget === 'textarea'
      ? `<textarea class="fr-input" rows="2" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">${esc(configuredPh)}</textarea>`
      : `<input class="fr-input" type="${f.type === 'Int' || f.type === 'Numeric' ? 'number' : 'text'}"
          value="${esc(configuredPh)}" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">`;
    return `<div class="field-preview is-editable">
      ${control}
    </div>`;
  }
  const ph = 'Aperçu du champ';
  let inner = '';
  if (f.type === 'Bool') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Oui / Non</label></div>`;
  } else if (f.type === 'Choice') {
    inner = `<select class="fr-select" disabled><option>${esc(ph)}</option></select>`;
  } else if (f.type === 'ChoiceList') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Option…</label></div>`;
  } else if (f.type === 'Attachments') {
    inner = `<input class="fr-input" type="text" disabled value="Pièce jointe…">`;
  } else if (f.type === 'Date') {
    inner = `<input class="fr-input" type="date" disabled>`;
  } else if (f.type === 'Ref' || f.type === 'RefList') {
    inner = `<select class="fr-select" disabled><option>Liste liée…</option></select>`;
  } else {
    inner = `<input class="fr-input" type="text" disabled placeholder="${esc(ph)}">`;
  }
  return `<div class="field-preview is-static">${inner}</div>`;
}

function renderConditionValueInput(scope, si, fi, ruleIndex, sourceField, currentValue) {
  const v = currentValue != null ? String(currentValue) : '';
  const onChange = scope === 'section'
    ? `App.onSectionRule(${si}, ${ruleIndex}, 'value', this.value)`
    : `App.onFieldRule(${si}, ${fi}, ${ruleIndex}, 'value', this.value)`;
  if (!sourceField) {
    return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
  }
  if (sourceField.type === 'Bool') {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="true" ${v === 'true' || currentValue === true ? 'selected' : ''}>Oui</option>
      <option value="false" ${v === 'false' || currentValue === false ? 'selected' : ''}>Non</option>
    </select>`;
  }
  if (sourceField.type === 'Choice' && sourceField.choices && sourceField.choices.length) {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="">—</option>
      ${sourceField.choices.map(c => {
        const val = typeof c === 'object' ? c.value : c;
        const lab = typeof c === 'object' ? (c.label || c.value) : c;
        return `<option value="${esc(val)}" ${String(val) === v ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}
    </select>`;
  }
  if (sourceField.type === 'Date') {
    return `<input class="fr-input" type="date" value="${esc(v)}" onchange="${onChange}">`;
  }
  if (sourceField.type === 'Int' || sourceField.type === 'Numeric') {
    return `<input class="fr-input" type="number" value="${esc(v)}" oninput="${onChange}">`;
  }
  return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
}

function renderConditionEditor(scope, si, fi, condition, prior) {
  const compound = FormUx.normalizeToCompound(condition);
  const enabled = !!condition;
  const toggleFn = scope === 'section'
    ? `App.onSectionConditionToggle(${si}, this.checked)`
    : `App.onFieldConditionToggle(${si}, ${fi}, this.checked)`;
  const opFn = scope === 'section'
    ? `App.onSectionConditionOp(${si}, this.value)`
    : `App.onFieldConditionOp(${si}, ${fi}, this.value)`;
  const addFn = scope === 'section'
    ? `App.onSectionRuleAdd(${si})`
    : `App.onFieldRuleAdd(${si}, ${fi})`;

  if (!enabled) {
    return `
      <div class="behavior-panel">
        <div class="fr-checkbox-group">
          <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" onchange="${toggleFn}">
          <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
            <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
            ${hintIcon(CONDITION_PANEL_TIP)}
          </label>
        </div>
      </div>`;
  }

  const rulesHtml = compound.rules.map((rule, ri) => {
    const selKey = ruleSelectKey(rule);
    const isCtx = selKey.indexOf('context:') === 0;
    const isAud = selKey.indexOf('audience:') === 0;
    const src = (!isCtx && !isAud)
      ? (findFieldMeta(S.currentDef, rule.field || rule.path) || prior.find(p => p.colId === (rule.field || rule.path)))
      : (isCtx ? { type: 'Bool' } : { type: 'Text' });
    const ops = isAud
      ? [
          { value: 'in', label: 'dans' },
          { value: 'notIn', label: 'pas dans' },
          { value: '==', label: 'égal à' },
          { value: '!=', label: 'différent de' }
        ]
      : (isCtx && (rule.path === 'userEmail' || selKey === 'context:userEmail')
        ? FormUx.operatorsForType('Text')
        : (isCtx ? [{ value: '==', label: 'égal à' }, { value: '!=', label: 'différent de' }] : FormUx.operatorsForType(src && src.type)));
    const opOpts = ops.map(o =>
      `<option value="${esc(o.value)}" ${rule.operator === o.value ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    const fieldSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'field', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'field', this.value)`;
    const opSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'operator', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'operator', this.value)`;
    const delFn = scope === 'section'
      ? `App.onSectionRuleRemove(${si}, ${ri})`
      : `App.onFieldRuleRemove(${si}, ${fi}, ${ri})`;
    const valueHint = isAud
      ? 'Emails ou groupes, séparés par des virgules'
      : (isCtx && rule.path !== 'userEmail' ? 'Oui ou Non' : 'Valeur attendue');
    const srcTip = ruleOptionTip(selKey);
    const opTip = operatorTip(rule.operator, isAud, isCtx);
    return `
      <div class="rule-row">
        <div class="fr-select-group">${hintLabel('Source', CONDITION_SOURCE_TIP)}
          <select class="fr-select" onchange="${fieldSelect}">
            <option value="">—</option>
            <optgroup label="Contexte">${CONTEXT_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            <optgroup label="Audience">${AUDIENCE_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            ${prior.length ? `<optgroup label="Questions précédentes">${prior.map(p =>
              `<option value="field:${esc(p.colId)}" ${selKey === 'field:' + p.colId ? 'selected' : ''}>${esc(p.label)}</option>`
            ).join('')}</optgroup>` : ''}
          </select>
          <p class="fr-hint-text">${esc(srcTip)}</p>
        </div>
        <div class="fr-select-group">${hintLabel('Opérateur', opTip)}
          <select class="fr-select" onchange="${opSelect}">${opOpts}</select>
        </div>
        <div class="fr-input-group">${hintLabel('Valeur', isAud ? valueHint : (isCtx && rule.path !== 'userEmail' ? 'Oui = critère vrai, Non = critère faux.' : CONDITION_VALUE_TIP))}
          ${isCtx && rule.path !== 'userEmail'
            ? `<select class="fr-select" onchange="${scope === 'section'
                ? `App.onSectionRule(${si}, ${ri}, 'value', this.value === 'true')`
                : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value === 'true')`}">
                <option value="true" ${rule.value === true || rule.value === 'true' ? 'selected' : ''}>Oui</option>
                <option value="false" ${rule.value === false || rule.value === 'false' ? 'selected' : ''}>Non</option>
              </select>`
            : (isAud
              ? `<input class="fr-input" value="${esc(Array.isArray(rule.value) ? rule.value.join(', ') : (rule.value != null ? rule.value : ''))}"
                  placeholder="${esc(valueHint)}"
                  oninput="${scope === 'section'
                    ? `App.onSectionRule(${si}, ${ri}, 'value', this.value)`
                    : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value)`}">`
              : renderConditionValueInput(scope, si, fi, ri, src, rule.value))}
        </div>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la règle" onclick="${delFn}">✕</button>
      </div>`;
  }).join('');

  return `
    <div class="behavior-panel">
      <div class="fr-checkbox-group">
        <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" checked onchange="${toggleFn}">
        <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
          <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
          ${hintIcon(CONDITION_PANEL_TIP)}
        </label>
      </div>
      <div class="fr-select-group fr-mt-1w">
        ${hintLabel('Combinaison des règles', CONDITION_COMBO_TIP)}
        <select class="fr-select" onchange="${opFn}">
          <option value="and" ${compound.op === 'and' ? 'selected' : ''}>Toutes (ET)</option>
          <option value="or" ${compound.op === 'or' ? 'selected' : ''}>Au moins une (OU)</option>
        </select>
      </div>
      ${rulesHtml}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" onclick="${addFn}">+ Ajouter une règle</button>
    </div>`;
}

/**
 * L'éditeur d'une étape, sans ses questions : elles vivent maintenant dans la
 * colonne de structure, et ne se composent qu'une à la fois.
 */
function renderSectionEditor(def, section, si) {
  const prior = priorFields(def, si, null);
  const condSummary = FormUx.summarizeCondition(section.condition || (section.gate ? { field: section.gate, operator: '==', value: true } : null));
  const pathBadge = (section.condition || section.gate)
    ? `<span class="cfg-badge path">Chemin : ${esc(condSummary || section.gate)}</span>` : '';

  // Un ancien `gate` s'affiche comme la condition qu'il est.
  let sectionCond = section.condition;
  if (!sectionCond && section.gate) {
    sectionCond = { field: section.gate, operator: '==', value: true };
  }

  return `
    <div class="section-card">
      <div class="section-card__head">
        <span class="section-step">Étape ${si + 1}</span>
        <input class="inline-section-title" value="${esc(section.label)}"
          placeholder="Titre de l’étape"
          aria-label="Titre de l’étape ${si + 1}"
          oninput="App.onSectionInput(${si}, 'label', this.value)">
        <div class="section-card__actions">
          <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer l’étape" onclick="App.removeSection(${si})">🗑</button>
        </div>
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="sec-desc-${si}">Consigne de l’étape</label>
        <textarea class="fr-input" id="sec-desc-${si}" rows="2"
          placeholder="Ce qu’on explique avant les questions…"
          oninput="App.onSectionInput(${si}, 'description', this.value)">${esc(section.description || '')}</textarea>
      </div>
      ${pathBadge ? `<div class="badge-row">${pathBadge}</div>` : ''}
      ${si === 0 ? '' : renderConditionEditor('section', si, null, sectionCond, prior)}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm add-field-btn" onclick="App.addField(${si})">+ Ajouter une question</button>
    </div>
  `;
}

function renderFieldPreview(f, si, fi) {
  const configuredPh = (f.options && f.options.placeholder) || '';
  const isTextLike = f.type === 'Text' || f.type === 'Int' || f.type === 'Numeric';
  if (isTextLike && (f.widget === 'text' || f.widget === 'textarea' || f.type === 'Int' || f.type === 'Numeric')) {
    const onPh = `App.onFieldOption(${si}, ${fi}, 'placeholder', this.value)`;
    const control = f.widget === 'textarea'
      ? `<textarea class="fr-input" rows="2" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">${esc(configuredPh)}</textarea>`
      : `<input class="fr-input" type="${f.type === 'Int' || f.type === 'Numeric' ? 'number' : 'text'}"
          value="${esc(configuredPh)}" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">`;
    return `<div class="field-preview is-editable">
      ${control}
    </div>`;
  }
  const ph = 'Aperçu du champ';
  let inner = '';
  if (f.type === 'Bool') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Oui / Non</label></div>`;
  } else if (f.type === 'Choice') {
    inner = `<select class="fr-select" disabled><option>${esc(ph)}</option></select>`;
  } else if (f.type === 'ChoiceList') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Option…</label></div>`;
  } else if (f.type === 'Attachments') {
    inner = `<input class="fr-input" type="text" disabled value="Pièce jointe…">`;
  } else if (f.type === 'Date') {
    inner = `<input class="fr-input" type="date" disabled>`;
  } else if (f.type === 'Ref' || f.type === 'RefList') {
    inner = `<select class="fr-select" disabled><option>Liste liée…</option></select>`;
  } else {
    inner = `<input class="fr-input" type="text" disabled placeholder="${esc(ph)}">`;
  }
  return `<div class="field-preview is-static">${inner}</div>`;
}

function renderConditionValueInput(scope, si, fi, ruleIndex, sourceField, currentValue) {
  const v = currentValue != null ? String(currentValue) : '';
  const onChange = scope === 'section'
    ? `App.onSectionRule(${si}, ${ruleIndex}, 'value', this.value)`
    : `App.onFieldRule(${si}, ${fi}, ${ruleIndex}, 'value', this.value)`;
  if (!sourceField) {
    return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
  }
  if (sourceField.type === 'Bool') {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="true" ${v === 'true' || currentValue === true ? 'selected' : ''}>Oui</option>
      <option value="false" ${v === 'false' || currentValue === false ? 'selected' : ''}>Non</option>
    </select>`;
  }
  if (sourceField.type === 'Choice' && sourceField.choices && sourceField.choices.length) {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="">—</option>
      ${sourceField.choices.map(c => {
        const val = typeof c === 'object' ? c.value : c;
        const lab = typeof c === 'object' ? (c.label || c.value) : c;
        return `<option value="${esc(val)}" ${String(val) === v ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}
    </select>`;
  }
  if (sourceField.type === 'Date') {
    return `<input class="fr-input" type="date" value="${esc(v)}" onchange="${onChange}">`;
  }
  if (sourceField.type === 'Int' || sourceField.type === 'Numeric') {
    return `<input class="fr-input" type="number" value="${esc(v)}" oninput="${onChange}">`;
  }
  return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
}

function renderConditionEditor(scope, si, fi, condition, prior) {
  const compound = FormUx.normalizeToCompound(condition);
  const enabled = !!condition;
  const toggleFn = scope === 'section'
    ? `App.onSectionConditionToggle(${si}, this.checked)`
    : `App.onFieldConditionToggle(${si}, ${fi}, this.checked)`;
  const opFn = scope === 'section'
    ? `App.onSectionConditionOp(${si}, this.value)`
    : `App.onFieldConditionOp(${si}, ${fi}, this.value)`;
  const addFn = scope === 'section'
    ? `App.onSectionRuleAdd(${si})`
    : `App.onFieldRuleAdd(${si}, ${fi})`;

  if (!enabled) {
    return `
      <div class="behavior-panel">
        <div class="fr-checkbox-group">
          <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" onchange="${toggleFn}">
          <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
            <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
            ${hintIcon(CONDITION_PANEL_TIP)}
          </label>
        </div>
      </div>`;
  }

  const rulesHtml = compound.rules.map((rule, ri) => {
    const selKey = ruleSelectKey(rule);
    const isCtx = selKey.indexOf('context:') === 0;
    const isAud = selKey.indexOf('audience:') === 0;
    const src = (!isCtx && !isAud)
      ? (findFieldMeta(S.currentDef, rule.field || rule.path) || prior.find(p => p.colId === (rule.field || rule.path)))
      : (isCtx ? { type: 'Bool' } : { type: 'Text' });
    const ops = isAud
      ? [
          { value: 'in', label: 'dans' },
          { value: 'notIn', label: 'pas dans' },
          { value: '==', label: 'égal à' },
          { value: '!=', label: 'différent de' }
        ]
      : (isCtx && (rule.path === 'userEmail' || selKey === 'context:userEmail')
        ? FormUx.operatorsForType('Text')
        : (isCtx ? [{ value: '==', label: 'égal à' }, { value: '!=', label: 'différent de' }] : FormUx.operatorsForType(src && src.type)));
    const opOpts = ops.map(o =>
      `<option value="${esc(o.value)}" ${rule.operator === o.value ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    const fieldSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'field', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'field', this.value)`;
    const opSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'operator', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'operator', this.value)`;
    const delFn = scope === 'section'
      ? `App.onSectionRuleRemove(${si}, ${ri})`
      : `App.onFieldRuleRemove(${si}, ${fi}, ${ri})`;
    const valueHint = isAud
      ? 'Emails ou groupes, séparés par des virgules'
      : (isCtx && rule.path !== 'userEmail' ? 'Oui ou Non' : 'Valeur attendue');
    const srcTip = ruleOptionTip(selKey);
    const opTip = operatorTip(rule.operator, isAud, isCtx);
    return `
      <div class="rule-row">
        <div class="fr-select-group">${hintLabel('Source', CONDITION_SOURCE_TIP)}
          <select class="fr-select" onchange="${fieldSelect}">
            <option value="">—</option>
            <optgroup label="Contexte">${CONTEXT_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            <optgroup label="Audience">${AUDIENCE_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            ${prior.length ? `<optgroup label="Questions précédentes">${prior.map(p =>
              `<option value="field:${esc(p.colId)}" ${selKey === 'field:' + p.colId ? 'selected' : ''}>${esc(p.label)}</option>`
            ).join('')}</optgroup>` : ''}
          </select>
          <p class="fr-hint-text">${esc(srcTip)}</p>
        </div>
        <div class="fr-select-group">${hintLabel('Opérateur', opTip)}
          <select class="fr-select" onchange="${opSelect}">${opOpts}</select>
        </div>
        <div class="fr-input-group">${hintLabel('Valeur', isAud ? valueHint : (isCtx && rule.path !== 'userEmail' ? 'Oui = critère vrai, Non = critère faux.' : CONDITION_VALUE_TIP))}
          ${isCtx && rule.path !== 'userEmail'
            ? `<select class="fr-select" onchange="${scope === 'section'
                ? `App.onSectionRule(${si}, ${ri}, 'value', this.value === 'true')`
                : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value === 'true')`}">
                <option value="true" ${rule.value === true || rule.value === 'true' ? 'selected' : ''}>Oui</option>
                <option value="false" ${rule.value === false || rule.value === 'false' ? 'selected' : ''}>Non</option>
              </select>`
            : (isAud
              ? `<input class="fr-input" value="${esc(Array.isArray(rule.value) ? rule.value.join(', ') : (rule.value != null ? rule.value : ''))}"
                  placeholder="${esc(valueHint)}"
                  oninput="${scope === 'section'
                    ? `App.onSectionRule(${si}, ${ri}, 'value', this.value)`
                    : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value)`}">`
              : renderConditionValueInput(scope, si, fi, ri, src, rule.value))}
        </div>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la règle" onclick="${delFn}">✕</button>
      </div>`;
  }).join('');

  return `
    <div class="behavior-panel">
      <div class="fr-checkbox-group">
        <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" checked onchange="${toggleFn}">
        <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
          <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
          ${hintIcon(CONDITION_PANEL_TIP)}
        </label>
      </div>
      <div class="fr-select-group fr-mt-1w">
        ${hintLabel('Combinaison des règles', CONDITION_COMBO_TIP)}
        <select class="fr-select" onchange="${opFn}">
          <option value="and" ${compound.op === 'and' ? 'selected' : ''}>Toutes (ET)</option>
          <option value="or" ${compound.op === 'or' ? 'selected' : ''}>Au moins une (OU)</option>
        </select>
      </div>
      ${rulesHtml}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" onclick="${addFn}">+ Ajouter une règle</button>
    </div>`;
}

function renderSectionEditor(def, section, si) {
  const fieldsHtml = section.fields.map((f, fi) => renderFieldEditor(def, si, f, fi)).join('');
  const prior = priorFields(def, si, null);
  const condSummary = FormUx.summarizeCondition(section.condition || (section.gate ? { field: section.gate, operator: '==', value: true } : null));
  const pathBadge = (section.condition || section.gate)
    ? `<span class="cfg-badge path">Chemin : ${esc(condSummary || section.gate)}</span>` : '';

  // Migrate gate → condition display if only gate set
  let sectionCond = section.condition;
  if (!sectionCond && section.gate) {
    sectionCond = { field: section.gate, operator: '==', value: true };
  }

  return `
    <div class="section-card">
      <div class="section-card__head">
        <span class="section-step">Étape ${si + 1}</span>
        <input class="inline-section-title" value="${esc(section.label)}"
          placeholder="Titre de l’étape"
          aria-label="Titre de l’étape ${si + 1}"
          oninput="App.onSectionInput(${si}, 'label', this.value)">
        <div class="section-card__actions">
          <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer l’étape" onclick="App.removeSection(${si})">🗑</button>
        </div>
      </div>
      ${pathBadge ? `<div class="badge-row">${pathBadge}</div>` : ''}
      ${si === 0 ? '' : renderConditionEditor('section', si, null, sectionCond, prior)}
      ${fieldsHtml}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm add-field-btn" onclick="App.addField(${si})">+ Ajouter une question</button>
    </div>
  `;
}

/**
 * Le panneau d'une question, rangé par intention plutôt qu'en liste de réglages.
 *
 * Quatre blocs, dans l'ordre où l'on se pose les questions : ce que le public
 * voit, où la réponse se range, quand la question s'affiche, et ce qu'elle
 * propose. Chaque bloc dit en une phrase ce qu'il permet — c'est par là qu'on
 * découvre ce que l'outil sait faire, sans lire une documentation.
 */
function renderFieldEditor(def, si, f, fi) {
  const isBind = def.composeMode === 'bind';
  const isChoiceLike = f.type === 'Choice' || f.type === 'ChoiceList';
  const isRefLike = f.type === 'Ref' || f.type === 'RefList';
  const choicesValue = (def.choices[f.colId] || []).join('\n');
  const typeKey = (window.FormUx && FormUx.fieldTypeKey) ? FormUx.fieldTypeKey(f) : 'text';
  const simpleOpts = ((window.FormUx && FormUx.SIMPLE_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  const advancedOpts = ((window.FormUx && FormUx.ADVANCED_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  const widgetChoices = WIDGETS_BY_TYPE[f.type] || ['text'];
  const widgetOptions = widgetChoices.map(w => `<option value="${w}" ${f.widget === w ? 'selected' : ''}>${w}</option>`).join('');
  const prior = priorFields(def, si, fi);
  const refParents = prior.filter(p => p.type === 'Ref');
  const dynParents = prior.filter(p => p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  const refTableOptions = S.tables.map(t =>
    `<option value="${esc(t.tableId)}" ${resolveRefTableOfField(f) === t.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`
  ).join('');
  const childCols = resolveRefTableOfField(f) ? (S.columnsByTable[resolveRefTableOfField(f)] || []) : [];
  const filterColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${f.dynamicFilter && f.dynamicFilter.filterColumn === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');
  const visibleColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${(f.options && f.options.visibleCol) === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');

  const section = def.sections[si];
  const nb = (section.fields || []).length;
  const echelle = f.kind === 'echelle' ? ((f.options && f.options.echelle) || '') : '';
  const matrice = f.kind === 'echelle' ? ((f.options && f.options.matrice) || '') : '';
  const echelleOpts = Object.keys(def.echelles || {}).map(k =>
    `<option value="${esc(k)}" ${echelle === k ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const matriceOpts = Object.keys(def.matrices || {}).map(k =>
    `<option value="${esc(k)}" ${matrice === k ? 'selected' : ''}>${esc((def.matrices[k] || {}).titre || k)}</option>`).join('');

  return `
    <div class="field-editor">
      <div class="panneau__fil">
        <button type="button" class="panneau__nav" ${fi > 0 ? `onclick="App.choisir('question', ${si}, ${fi - 1})"` : 'disabled'} title="Question précédente">‹</button>
        <span>Question ${fi + 1} sur ${nb}</span>
        <button type="button" class="panneau__nav" ${fi < nb - 1 ? `onclick="App.choisir('question', ${si}, ${fi + 1})"` : 'disabled'} title="Question suivante">›</button>
        <span class="panneau__fil-espace"></span>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la question" onclick="App.removeField(${si}, ${fi})">🗑</button>
      </div>

      <section class="bloc">
        <h4 class="bloc__titre">Ce que le public voit ${hintIcon('La phrase que lit la personne qui répond. Écrivez une question, pas un nom de colonne : « Les espaces publics sont agréables » plutôt que « EP_Agreables (1–5) ».')}</h4>
        <div class="fr-input-group">
          <label class="fr-label" for="lab-${si}-${fi}">Question posée</label>
          <input class="fr-input" id="lab-${si}-${fi}" value="${esc(f.label)}"
            placeholder="Ce que lit la personne qui répond"
            oninput="App.onFieldInput(${si}, ${fi}, 'label', this.value)"
            onblur="App.onFieldLabelBlur(${si}, ${fi})">
        </div>
        <div class="fr-input-group">
          <label class="fr-label" for="desc-${si}-${fi}">Consigne</label>
          <input class="fr-input" id="desc-${si}-${fi}" value="${esc(f.description || '')}"
            placeholder="Précision affichée sous la question (facultatif)"
            oninput="App.onFieldInput(${si}, ${fi}, 'description', this.value)">
        </div>
        <div class="fr-checkbox-group">
          <input type="checkbox" id="req-${si}-${fi}" ${f.required ? 'checked' : ''}
            onchange="App.onFieldInput(${si}, ${fi}, 'required', this.checked)">
          <label class="fr-label" for="req-${si}-${fi}">Réponse obligatoire</label>
        </div>
        ${renderFieldPreview(f, si, fi)}
      </section>

      <section class="bloc">
        <h4 class="bloc__titre">Où la réponse se range ${hintIcon('Chaque question écrit dans une colonne Grist. Le type décide de ce que la colonne accepte, et de la façon de répondre.')}</h4>
        <div class="bloc__duo">
          <div class="fr-select-group"><label class="fr-label" for="type-${si}-${fi}">Type de réponse</label>
            <select class="fr-select" id="type-${si}-${fi}" onchange="App.onFieldTypeKeyChange(${si}, ${fi}, this.value)">
              ${simpleOpts}
              <optgroup label="Avancé">${advancedOpts}</optgroup>
            </select>
          </div>
          ${isBind ? `
            <div class="fr-input-group"><label class="fr-label" for="col-${si}-${fi}">Colonne</label>
              <input class="fr-input" id="col-${si}-${fi}" list="cols-datalist" value="${esc(f.colId)}"
                onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
            </div>` : `
            <div class="fr-input-group"><label class="fr-label" for="col-${si}-${fi}">Nom de la colonne</label>
              <input class="fr-input" id="col-${si}-${fi}" value="${esc(f.colId)}"
                onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
            </div>`}
        </div>

        ${isChoiceLike ? `
          <div class="fr-input-group">
            <label class="fr-label" for="opt-${si}-${fi}">Options proposées ${hintIcon('Une par ligne. Elles deviennent les choix de la colonne dans Grist.')}</label>
            <textarea class="fr-input" id="opt-${si}-${fi}" rows="4"
              oninput="App.onFieldChoices(${si}, ${fi}, this.value)">${esc(choicesValue)}</textarea>
          </div>` : ''}

        ${f.kind === 'echelle' ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label" for="ech-${si}-${fi}">Échelle ${hintIcon('Les bornes et les mots qui disent ce que valent les extrémités. Plusieurs questions peuvent partager la même.')}</label>
              <select class="fr-select" id="ech-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'echelle', this.value)">${echelleOpts}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label" for="mat-${si}-${fi}">Regroupée avec ${hintIcon('Les questions d’une même matrice sont posées ensemble, sous une seule question et une seule échelle.')}</label>
              <select class="fr-select" id="mat-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'matrice', this.value)">
                <option value="">Aucune</option>${matriceOpts}
              </select>
            </div>
          </div>` : ''}

        ${isRefLike ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label">Table liée</label>
              <select class="fr-select" onchange="App.onFieldRefTable(${si}, ${fi}, this.value)"><option value="">—</option>${refTableOptions}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label">Colonne affichée ${hintIcon('Ce que la personne lit dans la liste : le nom de la ligne, plutôt que son identifiant.')}</label>
              <select class="fr-select" onchange="App.onFieldVisibleCol(${si}, ${fi}, this.value)">
                <option value="">Nom (défaut)</option>${visibleColOpts}
              </select>
            </div>
          </div>` : ''}

        <details class="json-preview">
          <summary>Technique</summary>
          <div class="fr-select-group fr-mt-1w"><label class="fr-label">Contrôle de saisie</label>
            <select class="fr-select" onchange="App.onFieldInput(${si}, ${fi}, 'widget', this.value)">${widgetOptions}</select>
          </div>
        </details>
      </section>

      <section class="bloc">
        <h4 class="bloc__titre">Quand elle s’affiche ${hintIcon('Une question peut dépendre d’une réponse précédente. Sans condition, elle est toujours posée. Les conditions ne remplacent pas les droits Grist : elles cachent, elles ne protègent pas.')}</h4>
        ${renderConditionEditor('field', si, fi, f.condition, prior)}
      </section>

      ${isRefLike && f.type === 'Ref' ? `
        <section class="bloc">
          <h4 class="bloc__titre">Ce qu’elle propose ${hintIcon('La liste peut se restreindre selon une réponse précédente : la commune d’une région choisie, les contacts d’un même service.')}</h4>
          ${renderRefBehaviorPanels(def, si, fi, f, refParents, dynParents, filterColOpts, resolveRefTableOfField(f))}
        </section>` : ''}
    </div>
  `;
}

function onDefInput(prop, value) {
  S.currentDef[prop] = value;
  if (prop === 'title' && S.currentDef.composeMode === 'ensureSchema' && S.autoTable) {
    S.currentDef.tableId = FormUx.tableNameFromTitle(value);
  }
}

function onBrandingInput(key, value) {
  const b = ensureBranding(S.currentDef);
  b[key] = value == null ? '' : String(value);
}

function onBrandingFile(urlKey, inputEl) {
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!/^image\//i.test(file.type || '')) {
    toast('Fichier image requis (PNG, JPG, SVG, WebP…)', 'error');
    return;
  }
  if (file.size > 1.5 * 1024 * 1024) {
    toast('Image trop lourde (max. 1,5 Mo). Préférez une URL.', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    onBrandingInput(urlKey, reader.result || '');
    renderBuilder();
  };

function onFieldLabelBlur(si, fi) {

  if (f._colIdLocked) return;

  const next = FormUx.slugify(f.label);
  if (!next || next === oldColId) return;
  f.colId = next;
  if (oldColId && oldColId !== next && def.choices[oldColId]) {
    def.choices[next] = def.choices[oldColId];

  if (def.composeMode === 'bind') {
    const col = (S.columnsByTable[def.tableId] || []).find(c => c.colId === value);
    if (col) {
      const rawType = col.type || 'Text';
      f.type = FormTypes.normalizeGristType(rawType);
      f.widget = FormTypes.defaultWidget(rawType);
      if (!f.label) f.label = col.label || value;
      f.options = f.options || {};
      if (rawType.indexOf('Ref:') === 0) { f.refTable = rawType.slice(4); f.options.refTable = f.refTable; }
      else if (rawType.indexOf('RefList:') === 0) { f.refTable = rawType.slice(8); f.options.refTable = f.refTable; }
    }

  if (oldColId && oldColId !== value && def.choices[oldColId]) {
    def.choices[value] = def.choices[oldColId];

function onFieldCascadeParent(si, fi, parentColId) {
  const def = S.currentDef;

function onFieldCascade(si, fi, prop, value) {

function onFieldDynamicToggle(si, fi, checked) {

  const dynPrior = priorFields(S.currentDef, si, fi).filter(p =>
    p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  if (checked && !dynPrior.length) {
    toast('Ajoutez d’abord une question (Liste, Texte, Oui/Non ou Référence) au-dessus.', 'error');
    return;
  }
  f.dynamicFilter = checked ? { parentField: '', filterColumn: '' } : null;
  if (checked) f.cascade = null;
  renderBuilder();
}

function onFieldDynamic(si, fi, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!f.dynamicFilter) f.dynamicFilter = { parentField: '', filterColumn: '' };
  if (prop === 'parentField') {
    f.dynamicFilter.parentField = value || '';
    const parentMeta = value ? findFieldMeta(S.currentDef, value) : null;
    if (parentMeta && parentMeta.type === 'Ref') {
      f.dynamicFilter.parentResolve = 'refRow';
      if (!f.dynamicFilter.parentValueColumn) {
        const cols = parentMeta.refTable ? (S.columnsByTable[parentMeta.refTable] || []) : [];
        const guess = cols.find(c => /groupe|group|type|categorie|catégorie|org/i.test(c.colId || c.label || ''));
        f.dynamicFilter.parentValueColumn = guess ? guess.colId : '';
        if (!f.dynamicFilter.filterColumn && f.dynamicFilter.parentValueColumn) {
          f.dynamicFilter.filterColumn = f.dynamicFilter.parentValueColumn;
        }
      }
    } else {
      f.dynamicFilter.parentResolve = 'value';
      delete f.dynamicFilter.parentValueColumn;
    }
  } else if (prop === 'parentValueColumn') {
    f.dynamicFilter.parentValueColumn = value || '';
    f.dynamicFilter.parentResolve = 'refRow';
    if (value && !f.dynamicFilter.filterColumn) f.dynamicFilter.filterColumn = value;
  } else {
    f.dynamicFilter[prop] = value;
  }
  renderBuilder();
}

function setConditionOn(target, checked) {
  if (!checked) {
    target.condition = null;
    if (target.gate !== undefined) target.gate = null;
    return;
  }
  target.condition = FormUx.compactCondition(FormUx.normalizeToCompound(null)) ||
    { field: '', operator: '==', value: '' };
  // Ensure editable compound in memory via normalize on next render
  const c = FormUx.normalizeToCompound(target.condition);
  target.condition = FormUx.compactCondition(c) || { field: '', operator: '==', value: '' };
}

function mutateCompound(target, mutator) {
  const compound = FormUx.normalizeToCompound(target.condition);
  mutator(compound);
  target.condition = FormUx.compactCondition(compound);
  if (target.gate !== undefined) {
    // Sync gate shortcut when single Bool == true
    const c = target.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      target.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else {
      target.gate = null;
    }
  }
}

function onSectionConditionToggle(si, checked) {
  const sec = S.currentDef.sections[si];
  setConditionOn(sec, checked);
  if (checked) {
    mutateCompound(sec, function (c) {
      c.op = 'and';
      c.rules = [FormUx.emptyRule()];
    });
    // keep uncompacted for editing: store compound if empty field
    sec.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  }
  renderBuilder();
}

function onFieldConditionToggle(si, fi, checked) {
  const f = S.currentDef.sections[si].fields[fi];
  if (!checked) { f.condition = null; renderBuilder(); return; }
  f.condition = { op: 'and', rules: [FormUx.emptyRule()] };
  renderBuilder();
}

function onSectionConditionOp(si, value) {
  mutateCompound(S.currentDef.sections[si], function (c) { c.op = value === 'or' ? 'or' : 'and'; });
  // Keep compound form while editing
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onFieldConditionOp(si, fi, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.op = value === 'or' ? 'or' : 'and';
  renderBuilder();
}

function onSectionRuleAdd(si) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onFieldRuleAdd(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.push(FormUx.emptyRule());
  renderBuilder();
}

function onSectionRuleRemove(si, ri) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  sec.condition.rules.splice(ri, 1);
  if (!sec.condition.rules.length) sec.condition = null;
  else sec.condition = FormUx.compactCondition(sec.condition) || sec.condition;
  if (!sec.condition) sec.gate = null;
  renderBuilder();
}

function onFieldRuleRemove(si, fi, ri) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  f.condition.rules.splice(ri, 1);
  if (!f.condition.rules.length) f.condition = null;
  else f.condition = FormUx.compactCondition(f.condition) || f.condition;
  renderBuilder();
}

function coerceRuleValue(raw, sourceType) {
  if (sourceType === 'Bool') {
    if (raw === true || raw === 'true') return true;
    if (raw === false || raw === 'false') return false;
  }
  if (sourceType === 'Int' || sourceType === 'Numeric' || sourceType === 'Ref') {
    const n = Number(raw);
    if (raw !== '' && Number.isFinite(n)) return n;
  }
  return raw;
}

function parseAudienceValue(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw == null || raw === '') return '';
  if (typeof raw === 'boolean') return raw;
  const s = String(raw);
  if (s.indexOf(',') !== -1) {
    return s.split(',').map(x => x.trim()).filter(Boolean);
  }
  return s;
}

function onSectionRule(si, ri, prop, value) {
  const sec = S.currentDef.sections[si];
  sec.condition = FormUx.normalizeToCompound(sec.condition);
  const rule = sec.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (sec.condition.rules.length === 1 && sec.condition.rules[0].field) {
    const compact = FormUx.compactCondition(sec.condition);
    sec.condition = compact;
    const c = sec.condition;
    if (c && !c.op && c.operator === '==' && (c.value === true || c.value === 'true')) {
      const meta = findFieldMeta(S.currentDef, c.field);
      sec.gate = (meta && meta.type === 'Bool') ? c.field : null;
    } else sec.gate = null;
  }
  renderBuilder();
}

function onFieldRule(si, fi, ri, prop, value) {
  const f = S.currentDef.sections[si].fields[fi];
  f.condition = FormUx.normalizeToCompound(f.condition);
  const rule = f.condition.rules[ri];
  if (!rule) return;
  if (prop === 'field') {
    applyRuleSourceKey(rule, value);
    if (rule.source === 'field') {
      rule.value = '';
      const meta = findFieldMeta(S.currentDef, rule.field);
      const ops = FormUx.operatorsForType(meta && meta.type);
      rule.operator = (ops[0] && ops[0].value) || '==';
    }
  } else if (prop === 'operator') {
    rule.operator = value;
  } else if (prop === 'value') {
    rule.value = rule.source === 'audience' ? parseAudienceValue(value) : coerceRuleValue(value,
      (findFieldMeta(S.currentDef, rule.field) || {}).type);
    return;
  }
  if (f.condition.rules.length === 1 && f.condition.rules[0].field) {
    f.condition = FormUx.compactCondition(f.condition);
  }
  renderBuilder();
}

// Legacy no-ops kept if referenced
function onFieldCondition(si, fi, prop, value) {
  onFieldRule(si, fi, 0, prop, value);
}

// ── Enregistrement (upsert Formulaires + ensureSchema si mode actif) ────
async function saveForm() {
  const def = S.currentDef;
  if (!def.title) { toast('Le titre du formulaire est requis', 'error'); return; }
  if (!def.tableId) { toast('Indiquez un nom pour la table des réponses', 'error'); return; }

  try {
    if (def.composeMode === 'ensureSchema') {
      const tableExists = S.tables.some(t => t.tableId === def.tableId);
      if (!tableExists) S.columnsByTable[def.tableId] = S.columnsByTable[def.tableId] || [];
      const existingColumns = (S.columnsByTable[def.tableId] || []).map(c => ({ id: c.colId, type: c.type }));
      const plan = EnsureSchema.planEnsureSchema(def, existingColumns, { tableExists: tableExists });
      if (!plan.ok) {
        const msgs = FormUx.humanizeBindingErrors(plan.errors);
        toast(msgs.join(' ; '), 'error');
        return;
      }
      if (plan.actions.length) {
        const hasAddColumn = plan.actions.some(a => a[0] === 'AddColumn');
        if (tableExists && hasAddColumn) {
          if (!confirm('Cette table existe déjà. Ajouter les colonnes manquantes ?')) return;
        }
        if (S.isDemo) {
          applyEnsureSchemaDemo(plan, def.tableId);
        } else {
          await GristBridge.applyUserActions(plan.actions);
          await refreshTablesAfterSchemaChange();
          if (S.tables.some(t => t.tableId === def.tableId)) {
            await reloadColumnsForTable(def.tableId);
          }
          await applyVisibleColMeta(def);
        }
        const createdTable = plan.actions.some(a => a[0] === 'AddTable');
        toast(
          createdTable
            ? 'Table « ' + def.tableId + ' » créée depuis le formulaire'
            : plan.actions.length + ' colonne(s) créée(s) sur ' + def.tableId,
          'success'
        );
      } else if (!S.isDemo) {
        // Binding déjà aligné : tenter quand même visibleCol méta (Ref)
        await applyVisibleColMeta(def);
      }
    }

    const existingRow = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    const meta = {
      version: existingRow ? existingRow.Version : 0,
      statut: existingRow ? existingRow.Statut : 'brouillon',
      publishedSectionRef: existingRow ? existingRow.PublishedSectionRef : undefined,
      updatedAt: GristBridge.util.fromDate(new Date())
    };
    const fields = FormulairesTable.rowFromFormDef(def, meta);

    if (S.isDemo) {
      saveDemoFormulaireRow(fields);
    } else if (S.currentRowId) {
      await GristBridge.updateRow('Formulaires', S.currentRowId, fields);
      await loadFormulaires();
    } else {
      await GristBridge.addRow('Formulaires', fields);
      await loadFormulaires();
      const found = S.forms.find(r => r.FormId === def.id);
      if (found) S.currentRowId = found.id;
    }

    toast('Formulaire enregistré', 'success');
    const row = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    if (row && row.Statut === 'publie') {
      toast('Pensez à remettre en ligne le formulaire');
    }
  } catch (e) {
    toast('Erreur à l\'enregistrement : ' + (e && e.message), 'error');
    throw e;
  }
}

function saveDemoFormulaireRow(fields) {
  if (S.currentRowId) {
    const row = S.forms.find(r => r.id === S.currentRowId);
    Object.assign(row, fields);
  } else {
    const row = Object.assign({ id: demoNextId++ }, fields);
    S.forms.push(row);
    S.currentRowId = row.id;
  }
}

/**
 * Le menu : voir, exporter, régler — ce qui vaut pour le formulaire entier,
 * accessible depuis n'importe quelle étape.
 *
 * Il se peuple à l'ouverture, pas au rendu de chaque écran : son contenu dépend
 * du formulaire courant, qui change sous lui.
 */
function renderMenuOptions() {
  const panneau = document.getElementById('menu-options-panneau');
  if (!panneau) return;
  const def = S.currentDef;
  if (!def) {
    panneau.innerHTML = `<p class="app-menu__note">Choisissez un formulaire pour voir sa définition, l’exporter ou la régler.</p>`;
    return;
  }
  let smJson = '';
  try { smJson = JSON.stringify(SurveyProject.formDefToSurveyManifest(def), null, 2); }
  catch (e) { smJson = 'Projection impossible : ' + (e && e.message); }

  panneau.innerHTML = `
    <p class="app-menu__titre">Exporter</p>
    <div class="app-menu__lignes">
      <button class="app-menu__action" onclick="App.downloadFormDef()">Télécharger la définition (.json)</button>
      <button class="app-menu__action" onclick="App.downloadSurveyManifest()">Télécharger le Survey Manifest (.json)</button>
      <button class="app-menu__action" onclick="App.copierFormDef()">Copier la définition</button>
    </div>
    <p class="app-menu__titre">Réglages du formulaire</p>
    <div class="app-menu__lignes">
      <p class="app-menu__note">Identifiant : <code>${esc(def.id)}</code> — table : <code>${esc(def.tableId || '—')}</code></p>
      <button class="app-menu__action" onclick="App.ouvrirReglages()">Ouvrir les options avancées…</button>
    </div>
    <p class="app-menu__titre">Voir</p>
    <details class="json-preview"><summary>Définition (FormDef)</summary><pre>${esc(JSON.stringify(def, null, 2))}</pre></details>
    <details class="json-preview"><summary>Projection Survey Manifest</summary><pre>${esc(smJson)}</pre></details>
  `;
}

/** Fermer le menu : un clic ailleurs, ou Échap. */
function installerMenuOptions() {
  const menu = document.getElementById('menu-options');
  if (!menu) return;
  menu.addEventListener('toggle', () => { if (menu.open) renderMenuOptions(); });
  document.addEventListener('click', (e) => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.open) menu.open = false; });
}

function telechargerJson(objet, nom) {
  const blob = new Blob([JSON.stringify(objet, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadFormDef() {
  if (!S.currentDef) return;
  try { telechargerJson(FormulairesTable.defPropre(S.currentDef), (S.currentDef.id || 'formulaire') + '.json'); }
  catch (e) { toast('Erreur export : ' + (e && e.message), 'error'); }
}

async function copierFormDef() {
  if (!S.currentDef) return;
  const texte = JSON.stringify(FormulairesTable.defPropre(S.currentDef), null, 2);
  try {
    await navigator.clipboard.writeText(texte);
    toast('Définition copiée', 'success');
  } catch (e) {
    // Le presse-papier est refusé dans certaines iframes : on ne ment pas.
    toast('Copie refusée par le navigateur — utilisez le téléchargement', 'error');
  }
}

/** Les réglages d'ensemble vivent sur l'écran des questions : on y mène. */
function ouvrirReglages() {
  const menu = document.getElementById('menu-options');
  if (menu) menu.open = false;
  goStep('builder');
  requestAnimationFrame(() => {
    const avancees = document.querySelector('#builder details.fr-mt-3w, #builder details');
    if (avancees) {
      avancees.open = true;
      avancees.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  });
}

function downloadSurveyManifest() {
  if (!S.currentDef) return;
  try {
    const sm = SurveyProject.formDefToSurveyManifest(S.currentDef);
    const blob = new Blob([JSON.stringify(sm, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (S.currentDef.id || 'survey') + '-manifest.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    toast('Erreur export : ' + (e && e.message), 'error');
  }
}

function mountPreview() {
  const mountEl = document.getElementById('preview-mount');
  if (!mountEl) return;
  const previewBridge = {
    submit(data) {
      toast('Aperçu : soumission simulée (voir console)', 'success');
      console.log('[builder preview] soumission simulée', data);
      return Promise.resolve();
    }
  };
  try {
    FormEngine.mount(mountEl, S.currentDef, previewBridge);
  } catch (e) {
    mountEl.innerHTML = `<div class="fr-alert fr-alert--error"><p>Erreur de rendu : ${esc(e.message)}</p></div>`;
  }
}

function renderPublishStep() {
  const el = document.getElementById('publish-log');
  if (!S.currentDef) {
    el.innerHTML = `<p class="fr-text--sm">Sélectionnez ou créez un formulaire avant de publier.</p>`;
    return;
  }
  const row = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
  const alreadyPublished = row && row.Statut === 'publie';
  const btnLabel = alreadyPublished ? 'Remettre en ligne' : 'Mettre en ligne';
  el.innerHTML = `
    <h2 class="fr-h5">Mettre en ligne</h2>
    <p>Crée une page Grist dédiée pour remplir le formulaire (bundle figé : moteur, audience, styles).</p>
    <p class="fr-text--sm">Version : <strong>${esc(row ? row.Version : 0)}</strong> — Statut : <strong>${esc(row ? row.Statut : 'brouillon (non enregistré)')}</strong></p>
    ${alreadyPublished ? `<div class="fr-alert fr-alert--warning fr-mb-2w"><p>Une version est déjà en ligne. <strong>Remettre en ligne</strong> remplace le formulaire figé sur la page publiée (même URL).</p></div>` : ''}
    ${S.isDemo ? `<div class="fr-alert fr-alert--info fr-mb-2w"><p>Mode démo : publication simulée, sans écriture Grist.</p></div>` : ''}
    <button class="fr-btn" onclick="App.publishForm()">${btnLabel}</button>
    <span class="publish-hint">Le bundle inclut session, audience et moteur de conditions. Les droits Grist restent la vraie barrière de sécurité.</span>
    <details class="json-preview fr-mt-3w">
      <summary>Journal technique</summary>
      <div id="publish-log-entries" class="fr-mt-1w"></div>

}

function fetchScriptSource(relPath) {
  return fetch(relPath).then(r => {
    if (!r.ok) throw new Error('Impossible de charger ' + relPath + ' (HTTP ' + r.status + ')');
    return r.text();
  });
}

function extractSectionRef(result) {
  if (result == null) return null;

  function fromVal(rv) {
    if (rv == null) return null;
    if (typeof rv === 'number' && !Number.isNaN(rv)) return rv;
    if (typeof rv === 'string' && /^\d+$/.test(rv)) return Number(rv);
    if (typeof rv === 'object') {
      if (typeof rv.sectionRef === 'number') return rv.sectionRef;
      if (typeof rv.viewSectionRef === 'number') return rv.viewSectionRef;
      if (typeof rv.id === 'number') return rv.id;
      if (Array.isArray(rv.viewSections) && rv.viewSections.length) {
        const vs = rv.viewSections[0];
        const nested = fromVal(vs);
        if (nested != null) return nested;
      }
    }
    return null;
  }

  let found = fromVal(result);
  if (found != null) return found;

  if (result.retValues != null) {
    const list = Array.isArray(result.retValues) ? result.retValues : [result.retValues];
    for (let i = 0; i < list.length; i++) {
      found = fromVal(list[i]);
      if (found != null) return found;
      if (Array.isArray(list[i])) {
        for (let j = 0; j < list[i].length; j++) {
          found = fromVal(list[i][j]);
          if (found != null) return found;
        }
      }
    }
  }

  function deepFind(obj, depth) {
    if (!obj || typeof obj !== 'object' || depth > 8) return null;
    if (typeof obj.sectionRef === 'number') return obj.sectionRef;
    if (typeof obj.viewSectionRef === 'number') return obj.viewSectionRef;
    if (Array.isArray(obj)) {
      for (let i = 0; i < obj.length; i++) {
        const n = deepFind(obj[i], depth + 1);
        if (n != null) return n;
      }
      return null;
    }
    const keys = Object.keys(obj);
    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      const v = obj[key];
      if (typeof v === 'number' && /sectionRef/i.test(key)) return v;
      const nested = deepFind(v, depth + 1);
      if (nested != null) return nested;
    }
    return null;
  }

  return deepFind(result, 0);
}

/**
 * La section de la page déjà publiée, si elle existe encore.
 *
 * Une page se supprime dans Grist sans rien dire au formulaire : on vérifie
 * avant de la réutiliser, et on en recrée une si elle a disparu.
 */
async function sectionPublieeValide(sectionRef) {
  const ref = Number(sectionRef);
  if (!Number.isFinite(ref) || ref <= 0) return null;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === ref);
    return s && s.parentKey === 'custom' ? ref : null;
  } catch (e) {
    return null;
  }
}

/**
 * La page porte le titre du formulaire.
 *
 * `CreateViewSection` ignore le nom qu'on lui passe — les pages s'appelaient
 * toutes « New page », et deux formulaires publiés devenaient indiscernables.
 */
async function nommerPagePubliee(sectionRef, nom) {
  if (!nom) return;
  try {
    const sections = await GristBridge.loadTable('_grist_Views_section');
    const s = (sections || []).find(x => x.id === sectionRef);
    if (!s || !s.parentId) return;
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views', s.parentId, { name: nom }],
      ['UpdateRecord', '_grist_Views_section', sectionRef, { title: nom }]
    ]);
  } catch (e) {
    logPublish('La page n’a pas pu être renommée : ' + (e && e.message));
  }
}

async function publishForm() {
  const def = S.currentDef;
  if (!def) return;
  try {
    logPublish('Enregistrement du formulaire avant publication…');
    await saveForm();
    renderPublishStep();

    if (S.isDemo) {
      logPublish('Mode démo : publication simulée (aucune écriture Grist).');
      toast('Publication simulée (mode démo)', 'success');
      return;
    }

    logPublish('Construction du bundle runtime (bridge + types + attachments + session-context + engine + CSS)…');
    const [bridgeJs, typesJs, attachmentsJs, sessionContextJs, engineJs, cssText] = await Promise.all([
      fetchScriptSource('shared/grist-bridge.js'),
      fetchScriptSource('shared/types.js'),
      fetchScriptSource('shared/attachments.js'),
      fetchScriptSource('shared/session-context.js'),
      fetchScriptSource('runtime/engine.js'),
      fetch('shared/dsfr-like.css').then(function (r) {
        if (!r.ok) throw new Error('Impossible de charger dsfr-like.css (' + r.status + ')');
        return r.text();
      })
    ]);
    const fullHtml = Publish.buildRuntimeDocument(def, { bridgeJs, typesJs, attachmentsJs, sessionContextJs, engineJs, cssText });
    const { html, js } = Publish.splitHtmlJs(fullHtml);
    const optionsStr = Publish.buildCustomViewOptions({ html, js });

    const tableRow = S.tables.find(t => t.tableId === def.tableId);
    if (!tableRow) throw new Error('Table cible introuvable : ' + def.tableId);

    // Remettre en ligne REMPLACE le formulaire figé sur la page déjà publiée,
    // comme l'écran le promet. Créer une page de plus laissait l'ancienne en
    // service avec l'ancienne version, sans que rien ne le dise.
    const pageNom = def.title || def.id;
    const rowPub = S.currentRowId ? S.forms.find(r => r.id === S.currentRowId) : null;
    let sectionRef = await sectionPublieeValide(rowPub && rowPub.PublishedSectionRef);
    if (sectionRef) {
      logPublish('Page déjà publiée (section ' + sectionRef + ') : remplacement du formulaire figé…');
    } else {
      logPublish('Création de la page « ' + pageNom + ' »…');
      const createRes = await GristBridge.applyUserActions(Publish.planCreateCustomPage(tableRow.id, pageNom));
      sectionRef = extractSectionRef(createRes);
      if (!sectionRef) throw new Error('Impossible de déterminer la section créée (réponse CreateViewSection inattendue)');
    }

    logPublish('Application du snapshot figé (_html/_js) sur la section ' + sectionRef + '…');
    await GristBridge.applyUserActions([
      ['UpdateRecord', '_grist_Views_section', sectionRef, { options: optionsStr }]
    ]);
    await nommerPagePubliee(sectionRef, pageNom);

    const row = S.forms.find(r => r.id === S.currentRowId);
    const nextVersion = (row ? row.Version : 0) + 1;
    await GristBridge.updateRow('Formulaires', S.currentRowId, {
      Version: nextVersion,
      Statut: 'publie',
      PublishedSectionRef: sectionRef,
      UpdatedAt: GristBridge.util.fromDate(new Date())
    });
    await loadFormulaires();

    logPublish('Publication terminée (version ' + nextVersion + ').');
    toast('Formulaire publié', 'success');
    renderPublishStep();
  } catch (e) {
    logPublish('Erreur : ' + (e && e.message));
    toast('Échec de la publication : ' + (e && e.message), 'error');
    renderPublishStep();
  }
}

/** Hook E2E : ?e2e=1 ou widget connecté à Grist (postMessage parent). */
