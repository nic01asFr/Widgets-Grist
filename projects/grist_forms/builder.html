// RENDU — navigation par étapes
// ═══════════════════════════════════════════════════════════
function render() {
  renderStatusBadge();
  renderSteps();
  goStep(S.step || 'forms');
}

function renderStatusBadge() {
  const badge = document.getElementById('status-badge');
  if (!badge) return;
  // Une pastille et deux mots : l'état tient sur la barre, sans prendre de ligne.
  if (S.isDemo) {
    badge.className = 'app-bar__etat est-demo';
    badge.textContent = 'Hors Grist';
    badge.title = 'Mode démo : rien n’est écrit dans un document';
  } else {
    badge.className = 'app-bar__etat est-connecte';
    badge.textContent = 'Connecté';
    badge.title = 'Connecté à Grist';
  }
}

function renderSteps() {
  const nav = document.getElementById('steps');
  nav.innerHTML = STEPS.map(s => `
    <button type="button" class="fr-btn ${S.step === s.id ? 'is-active' : 'fr-btn--secondary'}" onclick="App.goStep('${s.id}')">${s.label}</button>
  `).join('');
}

/**
 * Quitter un formulaire modifie se demande.
 *
 * `S.dirty` etait tenu a jour et ne servait a rien : revenir a la liste, ou
 * ouvrir un autre formulaire, effacait sans un mot une heure de travail. Le
 * compositeur ne peut pas enregistrer tout seul — une question a demi ecrite
 * n'est pas une version — alors il demande.
 */
function peutQuitterLeFormulaire() {
  if (!S.dirty || !S.currentDef) return true;
  const titre = S.currentDef.title || 'ce formulaire';
  const ok = window.confirm(
    'Les modifications de \u00ab ' + titre + ' \u00bb ne sont pas enregistr\u00e9es.\n\n' +
    'Quitter maintenant les perdra. Continuer ?');
  if (ok) S.dirty = false;
  return ok;
}

function goStep(step) {
  // Les quatre ecrans travaillent sur le meme formulaire : seul le retour a la
  // liste le quitte vraiment.
  if (step === 'forms' && S.step === 'builder' && !peutQuitterLeFormulaire()) return;
  S.step = step;
  renderSteps();
  document.querySelectorAll('.builder-step').forEach(el => { el.hidden = true; });
  if (step === 'forms') { renderFormsList(); document.getElementById('forms-list').hidden = false; }
  if (step === 'builder') { renderBuilder(); document.getElementById('builder').hidden = false; }
  if (step === 'preview') { renderPreviewStep(); document.getElementById('preview').hidden = false; }
  if (step === 'publish') { renderPublishStep(); document.getElementById('publish-log').hidden = false; }
  if (step === 'synthese') { renderSyntheseStep(); document.getElementById('synthese').hidden = false; }
}

/**
 * Ce que les reponses disent, relues par la definition qui les a produites.
 *
 * > **Un formulaire sans restitution est un formulaire a moitie.** On a passe
 * > du temps a bien poser les questions ; la table, elle, ne montre que des
 * > entiers dans des colonnes. Cet ecran ne refait pas un tableau de bord —
 * > Grist en fait de meilleurs — il rend le sens que seul le FormDef porte :
 * > ce que « 4 » veut dire, a quelle etape la question etait posee, et de quel
 * > cote penche une echelle.
 */
async function renderSyntheseStep() {
  const zone = document.getElementById('synthese');
  const def = S.currentDef;
  if (!def) {
    zone.innerHTML = `<div class="fr-alert fr-alert--info"><p>Ouvrez un formulaire pour en voir la synthèse.</p></div>`;
    return;
  }
  zone.innerHTML = `
    <div class="bloc">
      <div class="bloc__tete">
        <h2 class="fr-h5">Synthèse</h2>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" onclick="App.goStep('synthese')">Actualiser</button>
      </div>
      <p class="fr-hint-text">Lecture seule : rien n’est écrit dans le document.</p>
      <div id="synthese-rendu" class="fr-synthese"><p class="fr-hint-text">Lecture des réponses…</p></div>
    </div>`;
  const cible = document.getElementById('synthese-rendu');
  try {
    const lignes = await lireReponses(def);
    const modele = FormSynthese.construire(def, lignes);
    cible.innerHTML = FormSyntheseVue.rendre(modele, def);
  } catch (e) {
    cible.innerHTML = `<div class="fr-alert fr-alert--error"><p>${esc(e.message)}</p></div>`;
  }
}

/** Les reponses de la table cible, remises en lignes. */
async function lireReponses(def) {
  if (S.isDemo) return [];
  const data = await GristBridge.loadTable(def.tableId);
  return FormSynthese.enLignes(data);
}

// ═══════════════════════════════════════════════════════════
// ÉTAPE 1 — Liste des formulaires / wizard
// ═══════════════════════════════════════════════════════════
function renderFormsList() {
  const el = document.getElementById('forms-list');

  if (S.wizardOpen) {
    const templates = (window.FormUx && FormUx.templates) ? FormUx.templates() : [];
    const tplCards = templates.map(t => `
      <button type="button" class="wizard-card" onclick="App.applyTemplate('${esc(t.id)}')">
        <h3>${esc(t.label)}</h3>
        <p>${esc(t.description)}</p>
      </button>
    `).join('');
    el.innerHTML = `
      <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle fr-mb-2w">
        <div class="fr-col"><h2 class="fr-h5 fr-mb-0">Nouveau formulaire</h2></div>
        <div class="fr-col fr-col--auto"><button class="fr-btn fr-btn--secondary" onclick="App.cancelWizard()">Annuler</button></div>
      </div>
      <p class="fr-text--sm">Comment voulez-vous commencer ?</p>
      <div class="wizard-grid">
        <button type="button" class="wizard-card" onclick="App.startWizardCreate()">
          <h3>Créer un questionnaire</h3>
          <p>Les réponses iront dans une nouvelle table créée automatiquement.</p>
        </button>
        <button type="button" class="wizard-card" onclick="App.startWizardBind()">
          <h3>Brancher sur une table existante</h3>
          <p>Reliez les questions aux colonnes déjà présentes dans Grist.</p>
        </button>
      </div>
      <h3 class="fr-h6 fr-mt-3w">Ou partir d’un modèle</h3>
      <div class="wizard-grid">${tplCards}</div>
    `;
    return;
  }

  // Une ligne de tableau ne dit pas grand-chose d'un questionnaire : on
  // reconnait le sien a son nom, a ce qu'il demande et a son etat. Des cartes,
  // donc, qui remplissent la largeur disponible au lieu de cinq colonnes
  // etroites.
  const cartes = S.forms.map(f => {
    let combien = '';
    try {
      const d = JSON.parse(f.Def || '{}');
      const nbQ = (d.sections || []).reduce((n, sec) => n + ((sec.fields || []).length), 0);
      combien = `${(d.sections || []).length} étape(s) · ${nbQ} question(s)`;
    } catch (e) { combien = ''; }
    const publie = f.Statut === 'publie';
    return `
      <button type="button" class="form-carte" onclick="App.editForm(${f.id})">
        <span class="form-carte__tete">
          <span class="fr-badge ${publie ? 'fr-badge--success' : 'fr-badge--info'}">${publie ? 'En ligne' : 'Brouillon'}</span>
          <span class="form-carte__version">v${esc(f.Version)}</span>
        </span>
        <span class="form-carte__nom">${esc(f.Nom || 'Sans titre')}</span>
        <span class="form-carte__detail">${esc(combien)}</span>
        <span class="form-carte__table">Les réponses vont dans <strong>${esc(f.TableCible)}</strong></span>
        ${publie ? `<span class="form-carte__note">Toute modification des questions exige de remettre en ligne</span>` : ''}
      </button>`;
  }).join('');

  el.innerHTML = `
    <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle fr-mb-2w">
      <div class="fr-col"><h2 class="fr-h5 fr-mb-0">Mes formulaires</h2></div>
      <div class="fr-col fr-col--auto"><button class="fr-btn" onclick="App.newForm()">+ Nouveau formulaire</button></div>
    </div>
    ${S.forms.length
      ? `<div class="form-cartes">${cartes}</div>`
      : `<p class="fr-text--sm">Aucun formulaire pour le moment${S.isDemo ? ' (mode démo)' : ''}.</p>`}
  `;
}

function newForm() {
  if (!peutQuitterLeFormulaire()) return;
  S.wizardOpen = true;
  renderFormsList();
}

function cancelWizard() {
  S.wizardOpen = false;
  renderFormsList();
}

function startWizardCreate() {
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = newFormDef();
  S.autoTable = true;
  S.publishLog = [];
  goStep('builder');
}

function startWizardBind() {
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = newFormDef();
  S.currentDef.composeMode = 'bind';
  S.currentDef.tableId = (S.tables[0] && S.tables[0].tableId) || '';
  S.autoTable = false;
  S.publishLog = [];
  goStep('builder');
}

function applyTemplate(templateId) {
  if (!window.FormUx) { toast('FormUx indisponible', 'error'); return; }
  const tpl = FormUx.templates().find(t => t.id === templateId);
  if (!tpl) { toast('Modèle introuvable', 'error'); return; }
  const built = tpl.build();
  const base = newFormDef();
  Object.assign(base, built, {
    id: base.id,
    manifest_version: base.manifest_version,
    classification: base.classification,
    composeMode: 'ensureSchema',
    tableId: FormUx.tableNameFromTitle(built.title || 'Questionnaire')
  });
  S.wizardOpen = false;
  S.currentRowId = null;
  S.currentDef = base;
  S.autoTable = true;
  S.publishLog = [];
  goStep('builder');
}

function editForm(id) {
  if (!peutQuitterLeFormulaire()) return;
  const row = S.forms.find(f => f.id === id);
  if (!row) return;
  let def;
  try { def = JSON.parse(row.Def); } catch (e) { toast('Def JSON invalide pour ce formulaire', 'error'); return; }
  S.currentDef = def;
  // L'identifiant de colonne d'un formulaire enregistré est une décision déjà
  // prise : renommer son libellé ne doit pas le redériver, et viser une autre
  // colonne. La marque de travail ne part plus dans `Def` (elle n'appartient
  // pas au contrat), on la repose donc à l'ouverture.
  (def.sections || []).forEach(s => (s.fields || []).forEach(f => { f._colIdLocked = true; }));
  ensureBranding(def);
  ensureAudience(def);
  S.currentRowId = id;
  S.publishLog = [];
  S.wizardOpen = false;
  S.autoTable = def.composeMode === 'ensureSchema';
  goStep('builder');
}

// ═══════════════════════════════════════════════════════════
// ÉTAPE 2 — Construction (sections / champs)
// ═══════════════════════════════════════════════════════════
/**
 * L'écran de composition, en trois zones.
 *
 * > **Mesuré avant d'y toucher** : l'enquête du 4ᵉ chargée dans l'ancien écran
 * > faisait **34 357 px de haut — 45 écrans de défilement** — et affichait
 * > **709 contrôles d'un coup**, toutes les questions dépliées en même temps.
 * > On ne pouvait ni voir la forme du questionnaire, ni réordonner, ni
 * > travailler une question sans défiler par-dessus les soixante autres.
 *
 * Trois zones : la **structure** (ce que le formulaire est), **la question**
 * choisie — une seule à la fois —, et l'**aperçu**, qui répond pendant qu'on
 * écrit au lieu d'attendre dans l'onglet voisin. Sur écran étroit, elles
 * s'empilent.
 */
function renderBuilder() {
  const el = document.getElementById('builder');
  if (!S.currentDef) {
    el.innerHTML = `<p class="fr-text--sm">Sélectionnez ou créez un formulaire depuis l'étape « Mes formulaires ».</p>`;
    return;
  }
  const def = S.currentDef;
  ensureBranding(def);
  ensureAudience(def);
  normaliserSelection();

  const cols = S.columnsByTable[def.tableId] || [];
  const colsDatalist = `<datalist id="cols-datalist">${cols.map(c => `<option value="${esc(c.colId)}">`).join('')}</datalist>`;

  el.innerHTML = `
    <div class="atelier3">
      <nav class="rail" aria-label="Parcours du formulaire">
        <p class="colonne__role">Parcours</p>
        ${renderRailEtapes(def)}
      </nav>
      <div class="canevas" id="canevas">${renderCanevas(def)}</div>
      <aside class="inspecteur" aria-label="Réglages">${renderInspecteur(def)}</aside>
    </div>
    ${colsDatalist}
    <div class="barre-enregistrement">
      <span class="barre-enregistrement__etat">${S.dirty ? 'Modifications non enregistrées' : (S.enregistreA ? 'Enregistré à ' + S.enregistreA : esc(def.title || 'Sans titre'))}</span>
      <span class="barre-enregistrement__compte">${def.sections.length} étape(s) · ${def.sections.reduce((n, s2) => n + (s2.fields || []).length, 0)} question(s)</span>
      <button class="fr-btn" onclick="App.saveForm()">Enregistrer</button>
    </div>
  `;
  monterCarteDeComposition();
}

/**
 * La carte sur laquelle on pose les reperes d'une illustration.
 *
 * > **Poser un repere, c'est montrer ou c'est.** Saisir deux nombres pour
 * > chacun des cinq lieux d'un quartier serait demander des coordonnees a
 * > quelqu'un qui regarde une carte. On choisit la proposition, on clique a
 * > l'endroit, le repere s'y met.
 */
function monterCarteDeComposition() {
  const hote = document.querySelector('.fr-carte--composer');
  if (!hote || !window.FormCarte || typeof FormCarte.montrer !== 'function') return;
  const [si, fi] = (hote.getAttribute('data-champ') || '').split('-').map(Number);
  const f = S.currentDef?.sections?.[si]?.fields?.[fi];
  const ill = f && f.options && f.options.illustration;
  if (!ill) return;
  const options = S.currentDef.choices[f.colId] || (f.options.choices || []);
  const reperes = (ill.reperes || []).map((r) => ({
    etiquette: r.etiquette, lon: r.lon, lat: r.lat, titre: r.option
  }));
  FormCarte.montrer(hote, { centre: ill.centre, zoom: ill.zoom, fond: ill.fond, reperes })
    .then((vue) => {
      const attente = hote.querySelector('.fr-hint-text');
      if (attente) attente.remove();
      vue.carte.on('click', (ev) => {
        const choisi = S.repereEnCours;
        if (!choisi || choisi.si !== si || choisi.fi !== fi) {
          toast('Choisissez d’abord la proposition à placer', 'error');
          return;
        }
        const rang = options.indexOf(choisi.option);
        const etiquette = rang >= 0 ? String.fromCharCode(65 + rang) : '•';
        const liste = (ill.reperes || []).filter((r) => r.option !== choisi.option);
        liste.push({
          option: choisi.option, etiquette,
          lon: Math.round(ev.lngLat.lng * 1e6) / 1e6,
          lat: Math.round(ev.lngLat.lat * 1e6) / 1e6
        });
        ill.reperes = liste;
        // Le cadrage de la carte suit ce qu'on vient de regarder : sans lui,
        // le public rouvrirait la carte ailleurs que sur les reperes.
        const c = vue.carte.getCenter();
        ill.centre = [Math.round(c.lng * 1e6) / 1e6, Math.round(c.lat * 1e6) / 1e6];
        ill.zoom = Math.round(vue.carte.getZoom() * 10) / 10;
        marquerModifie();
        renderBuilder();
      });
    })
    .catch(() => {
      const attente = hote.querySelector('.fr-hint-text');
      if (attente) attente.textContent = 'La carte n’a pas pu être chargée.';
    });
}

/** Les réglages, ou le rendu : on passe de l'un à l'autre, on ne les subit pas côte à côte. */
function panneauDroit(quoi) {
  S.panneauDroit = quoi;
  renderBuilder();
}

/**
 * Le plan de l'étape : ses questions en cartes, sur plusieurs colonnes.
 *
 * C'est l'objet que compose la personne — une étape est ce que le public verra
 * sur un écran. L'ancien compositeur en faisait une liste verticale de blocs
 * dépliés ; la structure de gauche rend cette liste inutile, et la largeur
 * disponible permet de voir toute l'étape sans défiler.
 */
function renderPlanEtape(def) {
  const sel = S.selection || {};
  if (sel.quoi === 'accueil' || sel.quoi === 'fin') {
    const quoi = sel.quoi === 'accueil' ? 'l’accueil' : 'la page de confirmation';
    return `<div class="plan__vide"><p>Vous composez ${quoi}. Ses réglages sont à droite.</p>
      <p class="fr-hint-text">Choisissez une étape à gauche pour revenir aux questions.</p></div>`;
  }
  const si = sel.si != null ? sel.si : 0;
  const section = def.sections[si];
  if (!section) return '<div class="plan__vide"><p>Aucune étape.</p></div>';

  const cartes = (section.fields || []).map((f, fi) => {
    const actif = selectionEst('question', si, fi) ? ' est-actif' : '';
    const apercu = renderApercuCarte(f, def);
    return `<button type="button" class="carte${actif}" onclick="App.choisir('question', ${si}, ${fi})">
      <span class="carte__tete">
        <span class="carte__rang">${fi + 1}</span>
        <span class="carte__nature">${esc(natureCourte(f))}</span>
        ${marquesDeChamp(f)}
      </span>
      <span class="carte__question">${esc(f.label || f.colId || 'Sans libellé')}</span>
      ${f.description ? `<span class="carte__consigne">${esc(f.description)}</span>` : ''}
      <span class="carte__apercu">${apercu}</span>
    </button>`;
  }).join('');

  const chemin = (section.condition || section.gate)
    ? `<span class="plan__chemin" title="Cette étape ne s’affiche pas toujours">⤳ ${esc(FormUx.summarizeCondition(section.condition || { field: section.gate, operator: '==', value: true }) || '')}</span>`
    : '';

  return `
    <div class="plan__tete">
      <button type="button" class="plan__titre${selectionEst('etape', si) ? ' est-actif' : ''}"
        onclick="App.choisir('etape', ${si})" title="Régler l’étape">
        Étape ${si + 1} · ${esc(section.label || '')}
      </button>
      ${chemin}
      <span class="plan__compte">${(section.fields || []).length} question(s)</span>
    </div>
    <div class="plan__grille">
      ${cartes}
      <button type="button" class="carte carte--ajout" onclick="App.addField(${si})">+ Ajouter une question</button>
    </div>`;
}

/** Ce que la question donnera à voir, en miniature et sans interaction. */
function renderApercuCarte(f, def) {
  if (f.kind === 'echelle') {
    const e = window.FormEngine && FormEngine.echelleDe ? FormEngine.echelleDe(def, f) : { min: 1, max: 5 };
    let crans = '';
    for (let n = e.min; n <= e.max; n++) crans += `<i class="mini__cran">${n}</i>`;
    return `<span class="mini">${crans}${e.nonConcerne ? '<i class="mini__nsp">n.c.</i>' : ''}</span>`;
  }
  const t = String(f.type || '').replace(/:.*$/, '');
  if (t === 'Choice' || t === 'ChoiceList') {
    const choix = (def.choices[f.colId] || (f.options && f.options.choices) || []).slice(0, 3);
    if (!choix.length) return '<span class="mini mini__vide">aucune option</span>';
    return `<span class="mini">${choix.map(c => `<i class="mini__option">${esc(String(c).slice(0, 18))}</i>`).join('')}${(def.choices[f.colId] || []).length > 3 ? '<i class="mini__option">…</i>' : ''}</span>`;
  }
  if (t === 'Bool') return '<span class="mini"><i class="mini__option">Oui</i><i class="mini__option">Non</i></span>';
  if (t === 'Attachments') return '<span class="mini"><i class="mini__champ">fichier…</i></span>';
  if (t === 'Date' || t === 'DateTime') return '<span class="mini"><i class="mini__champ">jj/mm/aaaa</i></span>';
  if (t === 'Ref' || t === 'RefList') return `<span class="mini"><i class="mini__champ">${esc(resolveRefTableOfField(f) || 'table liée')}</i></span>`;
  return '<span class="mini"><i class="mini__champ">&nbsp;</i></span>';
}

/**
 * Le rail des étapes : le parcours, de haut en bas.
 *
 * Une barre horizontale tenait quatre étapes et faisait défiler les dix autres.
 * Verticalement, les quatorze sont là, avec leur nom entier, leur nombre de
 * questions et la marque de celles qui ne s'affichent pas toujours. La largeur
 * ainsi rendue va au formulaire et à ses réglages.
 */
function renderRailEtapes(def) {
  const etapes = def.sections.map((section, si) => {
    const actif = (S.selection.si === si && S.selection.quoi !== 'accueil' && S.selection.quoi !== 'fin') ? ' est-actif' : '';
    const chemin = (section.condition || section.gate)
      ? '<span class="rail__chemin" title="Cette étape ne s’affiche pas toujours">⤳</span>' : '';
    return `<button type="button" class="rail__etape${actif}" onclick="App.choisir('etape', ${si})">
      <span class="rail__rang">${si + 1}</span>
      <span class="rail__nom">${esc(section.label || 'Sans titre')}</span>
      ${chemin}<span class="rail__compte">${(section.fields || []).length}</span>
    </button>`;
  }).join('');
  return `
    <button type="button" class="rail__bout${selectionEst('accueil') ? ' est-actif' : ''}" onclick="App.choisir('accueil')">Accueil</button>
    <div class="rail__etapes">${etapes}</div>
    <button type="button" class="rail__ajout" onclick="App.addSection()">+ étape</button>
    <button type="button" class="rail__bout${selectionEst('fin') ? ' est-actif' : ''}" onclick="App.choisir('fin')">Fin</button>
    <div class="rail__pied">${renderCibleEtMode(def)}</div>`;
}

/**
 * L'inspecteur : ce qu'on règle, toujours au même endroit.
 *
 * Les réglages s'ouvraient sous le champ et poussaient la page : à chaque
 * ouverture, ce qu'on regardait se déplaçait. Ils tiennent maintenant une
 * colonne à eux ; le canevas ne bouge plus, et le champ choisi s'y signale.
 */
function renderInspecteur(def) {
  const onglet = S.inspecteur === 'controle' ? 'controle' : 'reglages';
  const soucis = verifierFormulaire(def);
  return `
    <p class="colonne__role">Réglages <span class="colonne__sujet">${esc(sujetCourant(def))}</span></p>
    <div class="inspecteur__onglets" role="tablist">
      <button type="button" role="tab" class="inspecteur__onglet${onglet === 'reglages' ? ' est-actif' : ''}"
        aria-selected="${onglet === 'reglages'}" onclick="App.inspecteur('reglages')">Réglages</button>
      <button type="button" role="tab" class="inspecteur__onglet${onglet === 'controle' ? ' est-actif' : ''}"
        aria-selected="${onglet === 'controle'}" onclick="App.inspecteur('controle')">Contrôle${soucis.length ? ' (' + soucis.length + ')' : ''}</button>
    </div>
    <div class="inspecteur__corps">
      ${onglet === 'reglages' ? renderZoneQuestion(def) : renderControle(def, soucis)}
    </div>`;
}

/**
 * Ce qu'on regle en ce moment, dit en toutes lettres.
 *
 * > « Étape 1 » s'affichait trois fois — dans le rail, en titre du canevas et
 * > dans les reglages — avec le meme poids, et aucune des trois ne disait a
 * > quoi elle servait. Le nom de l'etape appartient au parcours ; ici on
 * > nomme le **sujet de l'action**, et le canevas ne porte plus de titre
 * > d'editeur, seulement ce que le public lira.
 */
function sujetCourant(def) {
  const sel = S.selection || {};
  if (sel.quoi === 'accueil') return 'de l’accueil';
  if (sel.quoi === 'fin') return 'de la page de fin';
  const section = def.sections[sel.si] || {};
  if (sel.quoi === 'etape') return 'de l’étape « ' + (section.label || 'sans titre') + ' »';
  // Le numéro de la question est déjà dans le fil « 1 sur n » juste dessous :
  // on nomme ici ce dont il s'agit, pas son rang.
  const champ = (section.fields || [])[sel.fi] || {};
  return 'de la question « ' + (champ.label || 'sans libellé') + ' »';
}

function inspecteur(onglet) {
  S.inspecteur = onglet;
  renderBuilder();
}

/** Ce qui empêcherait le formulaire de marcher, et où aller le corriger. */
function renderControle(def, soucis) {
  if (!soucis.length) {
    return `<div class="controle controle--ok">
      <p>Rien à signaler.</p>
      <p class="fr-hint-text">Chaque question a un libellé, une colonne à elle, et ses conditions ne regardent que des réponses déjà posées.</p>
    </div>`;
  }
  return `<div class="controle">
    <p class="controle__tete">${soucis.length} point(s) à regarder</p>
    ${soucis.map(x => `
      <button type="button" class="controle__ligne" onclick="App.choisir('question', ${x.si}, ${x.fi})">
        <span class="controle__ou">Étape ${x.si + 1} · ${esc(x.question)}</span>
        <span class="controle__quoi">${esc(x.quoi)}</span>
      </button>`).join('')}
  </div>`;
}

/**
 * Le canevas : l'étape telle que le public la verra, et chaque champ
 * configurable sur place.
 *
 * > **Les champs sont dessinés par le moteur lui-même** (`renderFieldHtml`),
 * > en lecture seule. Redessiner ici une version « éditeur » aurait fait deux
 * > rendus pour une seule apparence, et ils auraient divergé au premier type
 * > ajouté.
 */
function renderCanevas(def) {
  const sel = S.selection;
  if (sel.quoi === 'accueil' || sel.quoi === 'fin') {
    // Vu en Grist réel : le canevas rendait les mêmes champs de saisie que
    // l'inspecteur, côte à côte. Deux fois le même formulaire, et nulle part
    // ce que le public lira. Le moteur rend la couverture et la page de fin.
    const estAccueil = sel.quoi === 'accueil';
    let rendu = '';
    try {
      rendu = estAccueil
        ? ((FormEngine.aUnAccueil(def)
            ? FormEngine.renderBandeauHtml(def) + FormEngine.renderAccueilHtml(def)
            : FormEngine.renderHeaderHtml(def))
          || '<p class="fr-hint-text">Ni titre, ni description, ni logo : la page s’ouvrira directement sur la première question.</p>')
        : FormEngine.renderSuccessHtml(def);
    } catch (e) { rendu = '<p class="fr-hint-text">Rendu indisponible</p>'; }
    return `
      <p class="colonne__role">Aperçu <span class="colonne__sujet">${estAccueil ? 'ce que le public lit en premier' : 'ce que le public voit après avoir répondu'}</span></p>
      <div class="canevas__page">
        <div class="fr-form canevas__public" aria-hidden="true">${rendu}</div>
      </div>`;
  }
  const si = sel.si != null ? sel.si : 0;
  const section = def.sections[si];
  if (!section) return '<div class="canevas__page"><p>Aucune étape.</p></div>';

  let derniereMatrice = null;
  const blocs = (section.fields || []).map((f, fi) => {
    const ouvert = selectionEst('question', si, fi);
    const matrice = (f.options && f.options.matrice) || null;
    const enteteMatrice = (matrice && matrice !== derniereMatrice)
      ? `<p class="canevas__matrice">▦ ${esc(((def.matrices || {})[matrice] || {}).titre || matrice)}</p>` : '';
    derniereMatrice = matrice;
    let rendu = '';
    try { rendu = window.FormEngine ? FormEngine.renderFieldHtml(f, {}, optionsDApercu(def, f), def) : ''; }
    catch (e) { rendu = '<p class="fr-hint-text">Rendu indisponible</p>'; }
    return `
      ${enteteMatrice}
      <div class="champ-bloc${ouvert ? ' est-ouvert' : ''}">
        <div class="champ-bloc__barre">
          <span class="champ-bloc__rang">${fi + 1}</span>
          <span class="champ-bloc__nature">${esc(natureCourte(f))}</span>
          ${marquesDeChamp(f)}
          <span class="champ-bloc__espace"></span>
          <button type="button" class="champ-bloc__action" title="Monter" ${fi === 0 ? 'disabled' : ''}
            onclick="App.deplacerChamp(${si}, ${fi}, -1)">↑</button>
          <button type="button" class="champ-bloc__action" title="Descendre" ${fi === (section.fields.length - 1) ? 'disabled' : ''}
            onclick="App.deplacerChamp(${si}, ${fi}, 1)">↓</button>
          <button type="button" class="champ-bloc__action" title="Dupliquer" onclick="App.dupliquerChamp(${si}, ${fi})">⧉</button>
          <select class="champ-bloc__deplacer" title="Déplacer vers une autre étape"
            onchange="App.deplacerVersEtape(${si}, ${fi}, this.value); this.selectedIndex = 0;">
            <option value="">→ étape…</option>
            ${def.sections.map((sec, k) => k === si ? '' : `<option value="${k}">${k + 1}. ${esc(sec.label || '')}</option>`).join('')}
          </select>
          <button type="button" class="champ-bloc__action" title="Régler cette question"
            onclick="App.choisir('question', ${si}, ${fi})">⚙</button>
        </div>
        <div class="champ-bloc__rendu" aria-hidden="true">${rendu}</div>
      </div>`;
  }).join('');

  return `
    <p class="colonne__role">Aperçu <span class="colonne__sujet">étape ${si + 1} sur ${def.sections.length}</span></p>
    <div class="canevas__page">
      <div class="canevas__entete">
        <h2 class="canevas__titre-public">${esc(section.label || 'Étape ' + (si + 1))}</h2>
        ${section.description ? `<p class="canevas__consigne">${esc(section.description)}</p>` : ''}
      </div>
      ${blocs}
      ${renderAjoutRapide(si)}
    </div>`;
}

/** Les options qu'un champ montre dans le canevas, sans aller chercher Grist. */
function optionsDApercu(def, f) {
  // En mode liaison, la liste appartient a la colonne : c'est elle qu'il faut
  // montrer, sinon l'apercu affiche une question sans reponses possibles alors
  // que le formulaire publie en proposera.
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  const statiques = (colonne && colonne.choix && colonne.choix.length ? colonne.choix : null)
    || def.choices[f.colId] || (f.options && f.options.choices) || null;
  if (statiques && statiques.length) return statiques;
  if (f.type === 'Ref' || f.type === 'RefList') return [{ value: '', label: '(lignes de ' + (resolveRefTableOfField(f) || 'la table liée') + ')' }];
  return null;
}

/**
 * Écrire une question, et passer à la suivante.
 *
 * Le geste dominant de la composition n'est pas de régler : c'est d'écrire.
 * Avant, ajouter une question donnait une carte vide qu'il fallait ouvrir,
 * nommer, puis typer — quatre gestes pour une ligne. Ici on écrit la question,
 * on choisit son type d'un clic si le défaut ne convient pas, et Entrée crée la
 * suivante sans quitter le clavier.
 */
function renderAjoutRapide(si) {
  const types = ((window.FormUx && FormUx.SIMPLE_TYPES) || []).map(t =>
    `<button type="button" class="ajout__type${S.typeAjout === t.key ? ' est-actif' : ''}"
      onclick="App.typeAjout('${esc(t.key)}')">${esc(t.label)}</button>`).join('');
  // Le bouton « + Ajouter une question » a disparu de la carte d'étape : il
  // n'avait pas sa place dans les réglages, puisqu'on ajoute en regardant le
  // formulaire. Mais une ligne de saisie muette ne dit pas qu'elle ajoute :
  // elle s'annonce, et un bouton double la touche Entrée.
  return `
    <div class="ajout">
      <p class="ajout__titre">Ajouter une question à cette étape</p>
      <div class="ajout__ligne">
        <input class="ajout__texte" id="ajout-rapide" placeholder="Écrire la question, puis Entrée…"
          aria-label="Nouvelle question"
          onkeydown="if (event.key === 'Enter') { event.preventDefault(); App.ajouterDepuisTexte(${si}, this.value); }">
        <button type="button" class="fr-btn ajout__valider"
          onclick="App.ajouterDepuisTexte(${si}, document.getElementById('ajout-rapide').value)">Ajouter</button>
      </div>
      <p class="ajout__aide">Type de réponse :</p>
      <div class="ajout__types">${types}</div>
    </div>`;
}

function typeAjout(cle) {
  S.typeAjout = cle;
  renderBuilder();
  const champ = document.getElementById('ajout-rapide');
  if (champ) champ.focus();
}

function ajouterDepuisTexte(si, texte) {
  const libelle = String(texte || '').trim();
  if (!libelle) return;
  const section = S.currentDef.sections[si];
  const champ = newField();
  champ.label = libelle;
  section.fields.push(champ);
  const fi = section.fields.length - 1;
  if (S.typeAjout) onFieldTypeKeyChange(si, fi, S.typeAjout);
  onFieldLabelBlur(si, fi);   // dérive l'identifiant de colonne quand c'est le mode
  // La question qu'on vient d'écrire devient le sujet des réglages : c'est
  // d'elle qu'on va dire où elle se range. Le clavier, lui, reste sur la
  // ligne d'ajout pour enchaîner.
  S.selection = { quoi: 'question', si: si, fi: fi };
  marquerModifie();
  renderBuilder();
  const suivant = document.getElementById('ajout-rapide');
  if (suivant) { suivant.value = ''; suivant.focus(); }
}

/** Déplacer, dupliquer, supprimer : sans glisser, donc au clavier et au doigt. */
function deplacerChamp(si, fi, pas) {
  const champs = S.currentDef.sections[si].fields;
  const cible = fi + pas;
  if (cible < 0 || cible >= champs.length) return;
  const [c] = champs.splice(fi, 1);
  champs.splice(cible, 0, c);
  S.selection = { quoi: 'question', si: si, fi: cible };
  marquerModifie();
  renderBuilder();
}

function deplacerVersEtape(si, fi, cibleSi) {
  const n = Number(cibleSi);
  if (!Number.isFinite(n) || n === si || !S.currentDef.sections[n]) return;
  const [c] = S.currentDef.sections[si].fields.splice(fi, 1);
  S.currentDef.sections[n].fields.push(c);
  S.selection = { quoi: 'question', si: n, fi: S.currentDef.sections[n].fields.length - 1 };
  marquerModifie();
  renderBuilder();
}

function dupliquerChamp(si, fi) {
  const champs = S.currentDef.sections[si].fields;
  const copie = JSON.parse(JSON.stringify(champs[fi]));
  copie.colId = '';           // deux questions ne peuvent pas écrire dans la même colonne
  copie.label = copie.label + ' (copie)';
  champs.splice(fi + 1, 0, copie);
  S.selection = { quoi: 'question', si: si, fi: fi + 1 };
  marquerModifie();
  renderBuilder();
}

/**
 * Ce qui empêcherait le formulaire de marcher, dit avant d'enregistrer.
 *
 * Sur soixante questions, le risque n'est pas de mal ranger un réglage : c'est
 * qu'une question n'écrive nulle part, que deux écrivent au même endroit, ou
 * qu'une condition désigne une réponse qui vient après elle — et donc qui
 * n'existe pas encore au moment où l'on en a besoin.
 */
function verifierFormulaire(def) {
  const soucis = [];
  const vus = {};
  def.sections.forEach((section, si) => {
    (section.fields || []).forEach((f, fi) => {
      const ou = { si: si, fi: fi, question: f.label || f.colId || 'Question ' + (fi + 1) };
      if (!String(f.label || '').trim()) soucis.push({ ...ou, quoi: 'Sans libellé : le public ne saura pas quoi répondre.' });
      if (!String(f.colId || '').trim()) soucis.push({ ...ou, quoi: 'Aucune colonne : la réponse ne serait écrite nulle part.' });
      else if (vus[f.colId]) soucis.push({ ...ou, quoi: `La colonne « ${f.colId} » est déjà utilisée par une autre question.` });
      else vus[f.colId] = true;
      const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
      const aChoix = (def.choices[f.colId] || []).length
        || ((f.options && f.options.choices) || []).length
        || ((colonne && colonne.choix) || []).length;
      if ((f.type === 'Choice' || f.type === 'ChoiceList') && !aChoix) {
        soucis.push({ ...ou, quoi: 'Aucune option proposée.' });
      }
      if ((f.type === 'Ref' || f.type === 'RefList') && !resolveRefTableOfField(f)) {
        soucis.push({ ...ou, quoi: 'Aucune table liée : la liste serait vide.' });
      }
      // Une condition ne peut regarder qu'en arrière.
      const regles = [];
      (function lire(c) {
        if (!c) return;
        if (c.rules) return c.rules.forEach(lire);
        if (c.field && (!c.source || c.source === 'field')) regles.push(c.field);
      })(f.condition);
      const avant = new Set(priorFields(def, si, fi).map(x => x.colId));
      regles.forEach(colId => {
        if (!avant.has(colId)) {
          soucis.push({ ...ou, quoi: `La condition regarde « ${colId} », qui n’est pas posée avant cette question.` });
        }
      });
    });
  });
  return soucis;
}

function basculerVerification() {
  S.verification = !S.verification;
  renderBuilder();
}

function renderVerification(def) {
  if (!S.verification) return '';
  const soucis = verifierFormulaire(def);
  if (!soucis.length) {
    return `<div class="verif verif--ok"><p>Rien à signaler : chaque question a un libellé, une colonne à elle, et ses conditions regardent en arrière.</p></div>`;
  }
  const lignes = soucis.map(x => `
    <button type="button" class="verif__ligne" onclick="App.choisir('question', ${x.si}, ${x.fi})">
      <span class="verif__ou">Étape ${x.si + 1} · ${esc(x.question)}</span>
      <span class="verif__quoi">${esc(x.quoi)}</span>
    </button>`).join('');
  return `<div class="verif"><p class="verif__tete">${soucis.length} point(s) à regarder</p>${lignes}</div>`;
}

/** Ce qui a changé depuis le dernier enregistrement. */
function marquerModifie() {
  S.dirty = true;
  const etat = document.querySelector('.barre-enregistrement__etat');
  if (etat) etat.textContent = 'Modifications non enregistrées';
}

/**
 * D'où viennent les options d'une question à choix.
 *
 * > **En mode liaison, elles appartiennent à la colonne.** Le compositeur en
 * > offrait une zone de texte libre, alimentée par `def.choices` — qui restait
 * > vide pour une question liée, puisque ses choix sont portés par la colonne.
 * > On voyait donc un champ vide sous une question qui propose quatre réponses,
 * > et y écrire aurait fabriqué une seconde liste, que Grist aurait refusée.
 *
 * On les montre donc telles qu'elles sont, en disant où les changer. En mode
 * création, la colonne n'existe pas encore : c'est bien ici qu'on les écrit.
 */
function renderOptionsDuChamp(def, si, f, fi, isBind) {
  if (isBind) {
    const col = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
    const choix = (col && col.choix) || (f.options && f.options.choices) || [];
    if (!f.colId) {
      return `<p class="fr-hint-text">Choisissez une colonne : ses options seront celles de la question.</p>`;
    }
    if (!choix.length) {
      return `<div class="fr-alert fr-alert--warning fr-mt-1w"><p>La colonne « ${esc(f.colId)} » ne déclare aucune liste de choix dans Grist. La question n’offrirait rien à choisir.</p></div>`;
    }
    return `
      <div class="options-liees">
        <p class="fr-label">Options proposées ${hintIcon('Elles viennent de la colonne : c’est dans Grist qu’on les change, et le formulaire suit.')}</p>
        <ul class="options-liees__liste">${choix.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        <p class="fr-hint-text">Définies par la colonne « ${esc(f.colId)} » dans Grist.</p>
      </div>`;
  }
  const valeur = (def.choices[f.colId] || (f.options && f.options.choices) || []).join('\n');
  return `
    <div class="fr-input-group">
      <label class="fr-label" for="opt-${si}-${fi}">Options proposées ${hintIcon('Une par ligne. Elles deviendront les choix de la colonne créée dans Grist.')}</label>
      <textarea class="fr-input" id="opt-${si}-${fi}" rows="4"
        oninput="App.onFieldChoices(${si}, ${fi}, this.value)">${esc(valeur)}</textarea>
    </div>`;
}

/**
 * Ce qui est propre a une saisie, et a elle seule.
 *
 * > **Une saisie range sa reponse ailleurs que dans sa colonne.** Un classement
 * > ecrit un rang par colonne, « Autre : … » demande une colonne de texte a
 * > cote de la liste. Ces colonnes ne se devinent pas : elles se choisissent
 * > ici, dans la liste des colonnes de la table, pas dans un JSON.
 *
 * Rien ne s'affiche pour une saisie qui n'a pas de reglage propre : le panneau
 * ne montre que ce qui s'applique a la question qu'on regle.
 */
function renderReglagesSaisie(def, si, f, fi, isBind) {
  const o = f.options || {};
  const cols = o.colonnes || {};
  const texte = (S.columnsByTable[def.tableId] || []).filter(c => c.type === 'Text');
  const choix = (S.columnsByTable[def.tableId] || []).filter(c => c.type === 'Choice');
  const optCols = (liste, courant) => liste.map(c =>
    `<option value="${esc(c.colId)}" ${c.colId === courant ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`).join('');

  // ── Oui / Non : les deux mots qu'on lit ──
  if (f.widget === 'ouinon') {
    return `
      <div class="bloc__duo">
        <div class="fr-input-group"><label class="fr-label" for="oui-${si}-${fi}">Mot pour « oui » ${hintIcon('« Oui », « Tout à fait », « J’y suis favorable »… Ce que le public lit sur le bouton.')}</label>
          <input class="fr-input" id="oui-${si}-${fi}" value="${esc(o.libelleOui || '')}" placeholder="Oui"
            oninput="App.onFieldOption(${si}, ${fi}, 'libelleOui', this.value)"></div>
        <div class="fr-input-group"><label class="fr-label" for="non-${si}-${fi}">Mot pour « non »</label>
          <input class="fr-input" id="non-${si}-${fi}" value="${esc(o.libelleNon || '')}" placeholder="Non"
            oninput="App.onFieldOption(${si}, ${fi}, 'libelleNon', this.value)"></div>
      </div>
      <p class="fr-hint-text">Sans réponse, Grist écrira « non » : une question qui doit distinguer « non » de « sans réponse » se pose en liste de choix.</p>`;
  }

  // ── Dessin : ce qu'on demande de composer ──
  if (f.widget === 'dessin') {
    const d = o.dessin || {};
    const usage = d.usage || 'croquis';
    return `
      <div class="fr-select-group">
        <label class="fr-label" for="des-u-${si}-${fi}">Ce qu’on demande ${hintIcon('Une signature se fait d’un trait, en noir, dans un cadre large : ni palette, ni annulation. Un croquis se construit.')}</label>
        <select class="fr-select" id="des-u-${si}-${fi}" onchange="App.onDessin(${si}, ${fi}, 'usage', this.value)">
          <option value="croquis" ${usage === 'croquis' ? 'selected' : ''}>Un croquis, ou une annotation</option>
          <option value="signature" ${usage === 'signature' ? 'selected' : ''}>Une signature</option>
        </select>
      </div>
      ${usage === 'croquis' ? `
      <div class="fr-input-group">
        <label class="fr-label" for="des-f-${si}-${fi}">Fond à annoter ${hintIcon('Une photo, un plan, un schéma : la personne dessine dessus, et le fond part dans l’image. Laissez vide pour un canevas blanc.')}</label>
        <input class="fr-input" id="des-f-${si}-${fi}" value="${esc(d.fond || '')}" placeholder="https://…"
          onchange="App.onDessin(${si}, ${fi}, 'fond', this.value)">
        <input class="fr-input fr-mt-1w" type="file" accept="image/*"
          aria-label="Choisir un fond sur cet appareil"
          onchange="App.onDessinFichier(${si}, ${fi}, this.files && this.files[0])">
      </div>` : ''}
      <div class="fr-input-group">
        <label class="fr-label" for="des-h-${si}-${fi}">Hauteur du cadre (pixels)</label>
        <input class="fr-input" id="des-h-${si}-${fi}" type="number" min="120" max="700" step="20"
          value="${d.hauteur || (usage === 'signature' ? 180 : 320)}"
          onchange="App.onDessin(${si}, ${fi}, 'hauteur', this.value)">
      </div>
      <p class="fr-hint-text">Le dessin part en pièce jointe, comme une photo. La colonne doit être de type <code>Attachments</code>.</p>
      <p class="fr-hint-text">Un canevas ne se remplit pas au clavier : ne rendez cette question obligatoire que si la réponse peut aussi se donner autrement.</p>`;
  }

  // ── Classement : combien de rangs, et ou ils vont ──
  if (f.kind === 'classement') {
    const rangs = o.rangs || (cols.rangs || []).length || 3;
    const lignes = [];
    for (let r = 0; r < rangs; r++) {
      lignes.push(`
        <div class="fr-select-group"><label class="fr-label" for="rang-${si}-${fi}-${r}">Colonne du ${r + 1}${r === 0 ? 'ᵉʳ' : 'ᵉ'} choix</label>
          <select class="fr-select" id="rang-${si}-${fi}-${r}" onchange="App.onFieldRang(${si}, ${fi}, ${r}, this.value)">
            <option value="">— choisir —</option>${optCols(choix, (cols.rangs || [])[r])}
          </select></div>`);
    }
    return `
      <div class="fr-input-group"><label class="fr-label" for="nbr-${si}-${fi}">Nombre de rangs retenus ${hintIcon('Les propositions au-delà ne sont pas des réponses : elles n’ont pas été classées.')}</label>
        <input class="fr-input" id="nbr-${si}-${fi}" type="number" min="1" max="10" value="${rangs}"
          onchange="App.onFieldRangs(${si}, ${fi}, this.value)"></div>
      <div class="bloc__duo">${lignes.join('')}</div>
      ${renderReglageAutre(def, si, f, fi, texte, optCols)}`;
  }

  // ── Listes : plafond de cases, et reponse libre ──
  const estChoix = f.type === 'Choice' || f.type === 'ChoiceList';
  if (estChoix) {
    const plafond = f.type === 'ChoiceList' ? `
      <div class="fr-input-group"><label class="fr-label" for="max-${si}-${fi}">Nombre maximal de réponses ${hintIcon('Laissez vide pour ne pas limiter. Le public voit le compte, et les autres cases se grisent une fois le compte atteint.')}</label>
        <input class="fr-input" id="max-${si}-${fi}" type="number" min="1" placeholder="sans limite"
          value="${o.maxSelected || ''}" onchange="App.onFieldMax(${si}, ${fi}, this.value)"></div>` : '';
    return plafond + renderReglageAutre(def, si, f, fi, texte, optCols);
  }
  return '';
}

/**
 * « Autre : … » — la case qui l'autorise, la colonne qui le recueille, et ce
 * que la liste doit proposer pour que ça marche.
 *
 * > **L'etat ne se deduit pas de la colonne choisie.** Il etait porte par la
 * > presence de `colonnes.autre` : cocher la case sans avoir encore designe la
 * > colonne la decochait aussitot. C'est `options.autreLibre` qui dit l'intention,
 * > et la colonne se choisit ensuite.
 *
 * En mode liaison, la valeur « Autre » doit figurer dans la liste de la
 * colonne, sinon Grist l'encadrera en rouge. On le dit, et on propose de
 * l'ajouter a la colonne — c'est un geste sur le document, il se demande.
 */
function renderReglageAutre(def, si, f, fi, texte, optCols) {
  const o = f.options || {};
  const cols = o.colonnes || {};
  const actif = !!o.autreLibre;
  const mot = o.valeurAutre || 'Autre';
  const colonne = (S.columnsByTable[def.tableId] || []).find(c => c.colId === f.colId);
  const listeColonne = (colonne && colonne.choix) || null;
  const manqueDansListe = actif && def.composeMode === 'bind' && listeColonne && listeColonne.indexOf(mot) === -1;
  return `
    <div class="fr-checkbox-group fr-mt-1w">
      <input type="checkbox" id="autre-${si}-${fi}" ${actif ? 'checked' : ''}
        onchange="App.onFieldAutre(${si}, ${fi}, this.checked)">
      <label class="fr-label" for="autre-${si}-${fi}">Autoriser une réponse libre ${hintIcon('Une option « Autre » s’ajoute à la liste, et ce que la personne écrit va dans une colonne de texte à part — écrit dans la liste, Grist le garderait mais l’encadrerait en rouge.')}</label>
    </div>
    ${actif ? `
      <div class="bloc__duo">
        <div class="fr-select-group"><label class="fr-label" for="autrecol-${si}-${fi}">Colonne de la précision</label>
          <select class="fr-select" id="autrecol-${si}-${fi}" onchange="App.onFieldAutreCol(${si}, ${fi}, this.value)">
            <option value="">— choisir une colonne texte —</option>${optCols(texte, cols.autre || '')}
          </select></div>
        <div class="fr-input-group"><label class="fr-label" for="autreval-${si}-${fi}">Mot affiché</label>
          <input class="fr-input" id="autreval-${si}-${fi}" value="${esc(o.valeurAutre || '')}" placeholder="Autre"
            onchange="App.onFieldOption(${si}, ${fi}, 'valeurAutre', this.value)"></div>
      </div>
      ${!cols.autre ? `<p class="fr-hint-text">Sans colonne de précision, la réponse libre ne serait enregistrée nulle part.</p>` : ''}
      ${manqueDansListe ? `
        <div class="fr-alert fr-alert--warning fr-mt-1w">

          <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-mt-1w"
            onclick="App.ajouterChoixALaColonne(${si}, ${fi})">Ajouter « ${esc(mot)} » à la colonne</button>
        </div>` : ''}` : ''}`;
}

/**
 * Le plan du formulaire entier, d'un coup d'oeil.
 *
 * Le rail montre les etapes, le canevas une etape a la fois : sur soixante
 * questions, il manquait l'endroit ou l'on voit tout — pour verifier l'ordre,
 * reperer un doublon, retrouver « cette question-la, quelque part ». Il
 * s'ouvre a la demande, et chaque ligne mene a la question.
 */
function ouvrirPlan() {
  const menu = document.getElementById('menu-options');
  if (menu) menu.open = false;
  const def = S.currentDef;
  if (!def) { toast('Ouvrez d\u2019abord un formulaire', 'error'); return; }
  const soucis = verifierFormulaire(def);
  const parQuestion = {};
  soucis.forEach(x => { parQuestion[x.si + ':' + x.fi] = (parQuestion[x.si + ':' + x.fi] || 0) + 1; });

  const etapes = def.sections.map((section, si) => {
    const questions = (section.fields || []).map((f, fi) => `
      <button type="button" class="plan__question" onclick="App.allerA(${si}, ${fi})">
        <span class="plan__rang">${fi + 1}</span>
        <span class="plan__intitule">${esc(f.label || f.colId || 'Sans libell\u00e9')}</span>
        ${marquesDeChamp(f)}
        <span class="plan__nature">${esc(natureCourte(f))}</span>
        ${parQuestion[si + ':' + fi] ? `<span class="plan__souci" title="\u00c0 regarder">!</span>` : ''}
      </button>`).join('');
    return `
      <section class="plan__etape">
        <h4 class="plan__etape-titre">${si + 1}. ${esc(section.label || 'Sans titre')}
          <span class="plan__compte">${(section.fields || []).length}</span></h4>
        ${questions || '<p class="fr-hint-text">Aucune question.</p>'}
      </section>`;
  }).join('');

  const nbQ = def.sections.reduce((n, s2) => n + (s2.fields || []).length, 0);
  ouvrirModale(`Plan de \u00ab ${esc(def.title || 'Sans titre')} \u00bb`, `
    <p class="fr-hint-text">${def.sections.length} \u00e9tape(s) \u00b7 ${nbQ} question(s)${soucis.length ? ' \u00b7 ' + soucis.length + ' point(s) \u00e0 regarder' : ''}</p>
    <div class="plan__grille">${etapes}</div>`);
}

/** Aller droit a une question depuis le plan. */
function allerA(si, fi) {
  fermerModale();
  goStep('builder');
  choisir('question', si, fi);
}

/** La sélection courante, ramenée à quelque chose qui existe encore. */
function normaliserSelection() {
  const def = S.currentDef;
  const sel = S.selection || { quoi: 'accueil' };
  if (sel.quoi === 'question') {
    const section = def.sections[sel.si];
    S.selection = (section && section.fields[sel.fi]) ? sel : { quoi: 'accueil' };
  } else if (sel.quoi === 'etape') {
    S.selection = def.sections[sel.si] ? sel : { quoi: 'accueil' };
  } else {
    S.selection = sel;
  }
}

function selectionEst(quoi, si, fi) {
  const s = S.selection || {};
  if (s.quoi !== quoi) return false;
  if (si != null && s.si !== si) return false;
  if (fi != null && s.fi !== fi) return false;
  return true;
}

/** Choisir ce qu'on compose : la zone centrale et l'aperçu suivent. */
function choisir(quoi, si, fi) {
  S.selection = { quoi: quoi, si: si, fi: fi };
  renderBuilder();
}

/**
 * Ce qui pèse sur une question, en marques : obligatoire, conditionnelle, liée
 * à une autre, groupée en matrice. On voit d'un coup d'œil où sont les
 * enchaînements, sans ouvrir une à une les soixante questions.
 */
function marquesDeChamp(f) {
  const m = [];
  if (f.required) m.push('<span class="structure__marque" title="Réponse obligatoire">●</span>');
  if (f.condition) m.push('<span class="structure__marque" title="Ne s’affiche que sous condition">⤳</span>');
  if ((f.cascade && f.cascade.parentField) || (f.dynamicFilter && f.dynamicFilter.parentField)) {
    m.push('<span class="structure__marque" title="Sa liste dépend d’une autre réponse">⇄</span>');
  }
  if (f.options && f.options.matrice) m.push('<span class="structure__marque" title="Groupée en matrice">▦</span>');
  if (f.options && f.options.autreLibre) m.push('<span class="structure__marque" title="Accepte une réponse libre">✎</span>');
  if (f.options && f.options.maxSelected) m.push(`<span class="structure__marque" title="Au plus ${f.options.maxSelected} réponses">≤${f.options.maxSelected}</span>`);
  return m.join('');
}

/** Ce qu'est une question, en deux mots, pour se repérer dans la structure. */
function natureCourte(f) {
  // Le `kind` et le widget disent ce qu'est la question mieux que son type
  // Grist : une géométrie se range dans du texte, et ce n'est pas du texte.
  if (f.kind === 'echelle') return 'échelle';
  if (f.kind === 'geometrie' || f.widget === 'geo') return 'lieu';
  if (f.kind === 'classement' || f.widget === 'classement') return 'classement';
  if (f.widget === 'ouinon') return 'oui/non';
  if (f.widget === 'radio') return 'choix en boutons';
  const parType = {
    Text: f.widget === 'textarea' ? 'paragraphe' : 'texte',
    Int: 'nombre', Numeric: 'nombre', Bool: 'oui/non',
    Date: 'date', DateTime: 'date et heure',
    Choice: 'choix', ChoiceList: 'choix multiples',
    Attachments: 'fichiers'
  };
  const t = String(f.type || '').replace(/:.*$/, '');
  if (t === 'Ref' || t === 'RefList') return 'référence';
  return parType[t] || (f.kind || f.widget || 'question');
}

/**
 * Le rang, dans l'apercu, de l'etape qu'on compose.
 *
 * L'apercu ne montre que les etapes visibles : une etape conditionnelle non
 * remplie n'y figure pas. Le rang du compositeur n'est donc pas celui de
 * l'apercu — sans cette traduction, on compose une etape et on en regarde une
 * autre.
 */
function etapeVisibleCourante(def) {
  const sel = S.selection || {};
  // Quand c'est l'accueil qu'on compose, on ne demande aucune etape : le
  // moteur ouvre alors sur sa page d'accueil, qui est bien ce qu'on regarde.
  if (sel.quoi === 'accueil' && FormEngine.aUnAccueil && FormEngine.aUnAccueil(def)) return undefined;
  if (!def || sel.si == null || !window.FormEngine || !FormEngine.isSectionVisible) return 0;
  const visibles = def.sections.filter((sec) => FormEngine.isSectionVisible(sec, {}, {}));
  const rang = visibles.indexOf(def.sections[sel.si]);
  return rang >= 0 ? rang : 0;
}

/** L'aperçu, posé sur l'étape qu'on compose. */
function monterApercuAtelier() {
  const cible = document.getElementById('builder-preview-mount');
  if (!cible || !window.FormEngine) return;
  const sel = S.selection || {};
  const def = S.currentDef;
  // L'aperçu ne montre que les étapes visibles : une étape conditionnelle non
  // remplie n'y figure pas. Le rang du compositeur n'est donc pas celui de
  // l'aperçu — sans cette traduction, on compose une étape et on en regarde
  // une autre.
  let depart = (sel.quoi === 'accueil' && window.FormEngine.aUnAccueil && window.FormEngine.aUnAccueil(def))
    ? undefined : 0;
  if (sel.si != null && window.FormEngine.isSectionVisible) {
    const visibles = def.sections.filter((sec) => window.FormEngine.isSectionVisible(sec, {}, {}));
    const rang = visibles.indexOf(def.sections[sel.si]);
    depart = rang >= 0 ? rang : 0;
  }
  const vue = window.FormEngine.mount(cible, def, {
    submit: () => Promise.resolve(),
    loadTable: S.isDemo ? null : ((t) => GristBridge.loadTable(t)),
    skipProbe: true,
    etapeDepart: depart
  });
  S.apercuAtelier = vue;
}

function renderFieldPreview(f, si, fi) {
  const configuredPh = (f.options && f.options.placeholder) || '';
  const isTextLike = f.type === 'Text' || f.type === 'Int' || f.type === 'Numeric';
  if (isTextLike && (f.widget === 'text' || f.widget === 'textarea' || f.type === 'Int' || f.type === 'Numeric')) {
    const onPh = `App.onFieldOption(${si}, ${fi}, 'placeholder', this.value)`;
    const control = f.widget === 'textarea'
      ? `<textarea class="fr-input" rows="2" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">${esc(configuredPh)}</textarea>`
      : `<input class="fr-input" type="${f.type === 'Int' || f.type === 'Numeric' ? 'number' : 'text'}"
          value="${esc(configuredPh)}" placeholder="Saisir le placeholder…"
          aria-label="Placeholder" oninput="${onPh}">`;
    return `<div class="field-preview is-editable">
      ${control}
    </div>`;
  }
  const ph = 'Aperçu du champ';
  let inner = '';
  if (f.type === 'Bool') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Oui / Non</label></div>`;
  } else if (f.type === 'Choice') {
    inner = `<select class="fr-select" disabled><option>${esc(ph)}</option></select>`;
  } else if (f.type === 'ChoiceList') {
    inner = `<div class="fr-checkbox-group"><input type="checkbox" disabled><label class="fr-label">Option…</label></div>`;
  } else if (f.type === 'Attachments') {
    inner = `<input class="fr-input" type="text" disabled value="Pièce jointe…">`;
  } else if (f.type === 'Date') {
    inner = `<input class="fr-input" type="date" disabled>`;
  } else if (f.type === 'Ref' || f.type === 'RefList') {
    inner = `<select class="fr-select" disabled><option>Liste liée…</option></select>`;
  } else {
    inner = `<input class="fr-input" type="text" disabled placeholder="${esc(ph)}">`;
  }
  return `<div class="field-preview is-static">${inner}</div>`;
}

function renderConditionValueInput(scope, si, fi, ruleIndex, sourceField, currentValue) {
  const v = currentValue != null ? String(currentValue) : '';
  const onChange = scope === 'section'
    ? `App.onSectionRule(${si}, ${ruleIndex}, 'value', this.value)`
    : `App.onFieldRule(${si}, ${fi}, ${ruleIndex}, 'value', this.value)`;
  if (!sourceField) {
    return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
  }
  if (sourceField.type === 'Bool') {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="true" ${v === 'true' || currentValue === true ? 'selected' : ''}>Oui</option>
      <option value="false" ${v === 'false' || currentValue === false ? 'selected' : ''}>Non</option>
    </select>`;
  }
  if (sourceField.type === 'Choice' && sourceField.choices && sourceField.choices.length) {
    return `<select class="fr-select" onchange="${onChange}">
      <option value="">—</option>
      ${sourceField.choices.map(c => {
        const val = typeof c === 'object' ? c.value : c;
        const lab = typeof c === 'object' ? (c.label || c.value) : c;
        return `<option value="${esc(val)}" ${String(val) === v ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}
    </select>`;
  }
  if (sourceField.type === 'Date') {
    return `<input class="fr-input" type="date" value="${esc(v)}" onchange="${onChange}">`;
  }
  if (sourceField.type === 'Int' || sourceField.type === 'Numeric') {
    return `<input class="fr-input" type="number" value="${esc(v)}" oninput="${onChange}">`;
  }
  return `<input class="fr-input" value="${esc(v)}" oninput="${onChange}" placeholder="Valeur">`;
}

function renderConditionEditor(scope, si, fi, condition, prior) {
  const compound = FormUx.normalizeToCompound(condition);
  const enabled = !!condition;
  const toggleFn = scope === 'section'
    ? `App.onSectionConditionToggle(${si}, this.checked)`
    : `App.onFieldConditionToggle(${si}, ${fi}, this.checked)`;
  const opFn = scope === 'section'
    ? `App.onSectionConditionOp(${si}, this.value)`
    : `App.onFieldConditionOp(${si}, ${fi}, this.value)`;
  const addFn = scope === 'section'
    ? `App.onSectionRuleAdd(${si})`
    : `App.onFieldRuleAdd(${si}, ${fi})`;

  if (!enabled) {
    return `
      <div class="behavior-panel">
        <div class="fr-checkbox-group">
          <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" onchange="${toggleFn}">
          <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
            <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
            ${hintIcon(CONDITION_PANEL_TIP)}
          </label>
        </div>
      </div>`;
  }

  const rulesHtml = compound.rules.map((rule, ri) => {
    const selKey = ruleSelectKey(rule);
    const isCtx = selKey.indexOf('context:') === 0;
    const isAud = selKey.indexOf('audience:') === 0;
    const src = (!isCtx && !isAud)
      ? (findFieldMeta(S.currentDef, rule.field || rule.path) || prior.find(p => p.colId === (rule.field || rule.path)))
      : (isCtx ? { type: 'Bool' } : { type: 'Text' });
    const ops = isAud
      ? [
          { value: 'in', label: 'dans' },
          { value: 'notIn', label: 'pas dans' },
          { value: '==', label: 'égal à' },
          { value: '!=', label: 'différent de' }
        ]
      : (isCtx && (rule.path === 'userEmail' || selKey === 'context:userEmail')
        ? FormUx.operatorsForType('Text')
        : (isCtx ? [{ value: '==', label: 'égal à' }, { value: '!=', label: 'différent de' }] : FormUx.operatorsForType(src && src.type)));
    const opOpts = ops.map(o =>
      `<option value="${esc(o.value)}" ${rule.operator === o.value ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    const fieldSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'field', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'field', this.value)`;
    const opSelect = scope === 'section'
      ? `App.onSectionRule(${si}, ${ri}, 'operator', this.value)`
      : `App.onFieldRule(${si}, ${fi}, ${ri}, 'operator', this.value)`;
    const delFn = scope === 'section'
      ? `App.onSectionRuleRemove(${si}, ${ri})`
      : `App.onFieldRuleRemove(${si}, ${fi}, ${ri})`;
    const valueHint = isAud
      ? 'Emails ou groupes, séparés par des virgules'
      : (isCtx && rule.path !== 'userEmail' ? 'Oui ou Non' : 'Valeur attendue');
    const srcTip = ruleOptionTip(selKey);
    const opTip = operatorTip(rule.operator, isAud, isCtx);
    return `
      <div class="rule-row">
        <div class="fr-select-group">${hintLabel('Source', CONDITION_SOURCE_TIP)}
          <select class="fr-select" onchange="${fieldSelect}">
            <option value="">—</option>
            <optgroup label="Contexte">${CONTEXT_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            <optgroup label="Audience">${AUDIENCE_RULE_OPTS.map(o =>
              `<option value="${esc(o.key)}" ${selKey === o.key ? 'selected' : ''}>${esc(o.label)}</option>`
            ).join('')}</optgroup>
            ${prior.length ? `<optgroup label="Questions précédentes">${prior.map(p =>
              `<option value="field:${esc(p.colId)}" ${selKey === 'field:' + p.colId ? 'selected' : ''}>${esc(p.label)}</option>`
            ).join('')}</optgroup>` : ''}
          </select>
          <p class="fr-hint-text">${esc(srcTip)}</p>
        </div>
        <div class="fr-select-group">${hintLabel('Opérateur', opTip)}
          <select class="fr-select" onchange="${opSelect}">${opOpts}</select>
        </div>
        <div class="fr-input-group">${hintLabel('Valeur', isAud ? valueHint : (isCtx && rule.path !== 'userEmail' ? 'Oui = critère vrai, Non = critère faux.' : CONDITION_VALUE_TIP))}
          ${isCtx && rule.path !== 'userEmail'
            ? `<select class="fr-select" onchange="${scope === 'section'
                ? `App.onSectionRule(${si}, ${ri}, 'value', this.value === 'true')`
                : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value === 'true')`}">
                <option value="true" ${rule.value === true || rule.value === 'true' ? 'selected' : ''}>Oui</option>
                <option value="false" ${rule.value === false || rule.value === 'false' ? 'selected' : ''}>Non</option>
              </select>`
            : (isAud
              ? `<input class="fr-input" value="${esc(Array.isArray(rule.value) ? rule.value.join(', ') : (rule.value != null ? rule.value : ''))}"
                  placeholder="${esc(valueHint)}"
                  oninput="${scope === 'section'
                    ? `App.onSectionRule(${si}, ${ri}, 'value', this.value)`
                    : `App.onFieldRule(${si}, ${fi}, ${ri}, 'value', this.value)`}">`
              : renderConditionValueInput(scope, si, fi, ri, src, rule.value))}
        </div>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la règle" onclick="${delFn}">✕</button>
      </div>`;
  }).join('');

  return `
    <div class="behavior-panel">
      <div class="fr-checkbox-group">
        <input type="checkbox" id="cond-${scope}-${si}-${fi != null ? fi : 's'}" checked onchange="${toggleFn}">
        <label class="fr-label field-hint" for="cond-${scope}-${si}-${fi != null ? fi : 's'}">
          <span>${scope === 'section' ? 'Afficher cette étape seulement si…' : 'Afficher cette question seulement si…'}</span>
          ${hintIcon(CONDITION_PANEL_TIP)}
        </label>
      </div>
      <div class="fr-select-group fr-mt-1w">
        ${hintLabel('Combinaison des règles', CONDITION_COMBO_TIP)}
        <select class="fr-select" onchange="${opFn}">
          <option value="and" ${compound.op === 'and' ? 'selected' : ''}>Toutes (ET)</option>
          <option value="or" ${compound.op === 'or' ? 'selected' : ''}>Au moins une (OU)</option>
        </select>
      </div>
      ${rulesHtml}
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" onclick="${addFn}">+ Ajouter une règle</button>
    </div>`;
}

/**
 * L'éditeur d'une étape, sans ses questions : elles vivent maintenant dans la
 * colonne de structure, et ne se composent qu'une à la fois.
 */
function renderSectionEditor(def, section, si) {
  const prior = priorFields(def, si, null);
  const condSummary = FormUx.summarizeCondition(section.condition || (section.gate ? { field: section.gate, operator: '==', value: true } : null));
  const pathBadge = (section.condition || section.gate)
    ? `<span class="cfg-badge path">Chemin : ${esc(condSummary || section.gate)}</span>` : '';

  // Un ancien `gate` s'affiche comme la condition qu'il est.
  let sectionCond = section.condition;
  if (!sectionCond && section.gate) {
    sectionCond = { field: section.gate, operator: '==', value: true };
  }

  return `
    <div class="section-card">
      <div class="fr-input-group">
        <label class="fr-label" for="sec-titre-${si}">Titre de l’étape ${hintIcon('Le public le lit en haut de l’écran.')}</label>
        <input class="fr-input" id="sec-titre-${si}" value="${esc(section.label)}"
          placeholder="Ex. Votre quartier"
          oninput="App.onSectionInput(${si}, 'label', this.value)">
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="sec-desc-${si}">Consigne de l’étape ${hintIcon('Facultatif : ce qu’on explique avant les questions.')}</label>
        <textarea class="fr-input" id="sec-desc-${si}" rows="2"
          placeholder="Ce qu’on explique avant les questions…"
          oninput="App.onSectionInput(${si}, 'description', this.value)">${esc(section.description || '')}</textarea>
      </div>
      ${pathBadge ? `<div class="badge-row">${pathBadge}</div>` : ''}
      ${si === 0 ? '' : renderConditionEditor('section', si, null, sectionCond, prior)}
      <button type="button" class="fr-btn fr-btn--tertiary section-card__retirer" onclick="App.removeSection(${si})">Supprimer cette étape</button>
    </div>
  `;
}

/**
 * Le panneau d'une question, rangé par intention plutôt qu'en liste de réglages.
 *
 * Quatre blocs, dans l'ordre où l'on se pose les questions : ce que le public
 * voit, où la réponse se range, quand la question s'affiche, et ce qu'elle
 * propose. Chaque bloc dit en une phrase ce qu'il permet — c'est par là qu'on
 * découvre ce que l'outil sait faire, sans lire une documentation.
 */
function renderFieldEditor(def, si, f, fi) {
  const isBind = def.composeMode === 'bind';
  const isChoiceLike = f.type === 'Choice' || f.type === 'ChoiceList';
  const isRefLike = f.type === 'Ref' || f.type === 'RefList';
  const choicesValue = (def.choices[f.colId] || []).join('\n');
  const typeKey = (window.FormUx && FormUx.fieldTypeKey) ? FormUx.fieldTypeKey(f) : 'text';
  const simpleOpts = ((window.FormUx && FormUx.SIMPLE_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  const advancedOpts = ((window.FormUx && FormUx.ADVANCED_TYPES) || []).map(t =>
    `<option value="${esc(t.key)}" ${typeKey === t.key ? 'selected' : ''}>${esc(t.label)}</option>`
  ).join('');
  const widgetChoices = WIDGETS_BY_TYPE[f.type] || ['text'];
  const widgetOptions = widgetChoices.map(w => `<option value="${w}" ${f.widget === w ? 'selected' : ''}>${w}</option>`).join('');
  const prior = priorFields(def, si, fi);
  const refParents = prior.filter(p => p.type === 'Ref');
  const dynParents = prior.filter(p => p.type === 'Ref' || p.type === 'Choice' || p.type === 'Text' || p.type === 'Bool');
  const refTableOptions = S.tables.map(t =>
    `<option value="${esc(t.tableId)}" ${resolveRefTableOfField(f) === t.tableId ? 'selected' : ''}>${esc(t.tableId)}</option>`
  ).join('');
  const childCols = resolveRefTableOfField(f) ? (S.columnsByTable[resolveRefTableOfField(f)] || []) : [];
  const filterColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${f.dynamicFilter && f.dynamicFilter.filterColumn === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');
  const visibleColOpts = childCols.map(c =>
    `<option value="${esc(c.colId)}" ${(f.options && f.options.visibleCol) === c.colId ? 'selected' : ''}>${esc(c.label || c.colId)}</option>`
  ).join('');

  const section = def.sections[si];
  const nb = (section.fields || []).length;
  const echelle = f.kind === 'echelle' ? ((f.options && f.options.echelle) || '') : '';
  const matrice = f.kind === 'echelle' ? ((f.options && f.options.matrice) || '') : '';
  const echelleOpts = Object.keys(def.echelles || {}).map(k =>
    `<option value="${esc(k)}" ${echelle === k ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const matriceOpts = Object.keys(def.matrices || {}).map(k =>
    `<option value="${esc(k)}" ${matrice === k ? 'selected' : ''}>${esc((def.matrices[k] || {}).titre || k)}</option>`).join('');

  return `
    <div class="field-editor">
      <div class="panneau__fil">
        <button type="button" class="panneau__nav" ${fi > 0 ? `onclick="App.choisir('question', ${si}, ${fi - 1})"` : 'disabled'} title="Question précédente">‹</button>
        <span>Question ${fi + 1} sur ${nb}</span>
        <button type="button" class="panneau__nav" ${fi < nb - 1 ? `onclick="App.choisir('question', ${si}, ${fi + 1})"` : 'disabled'} title="Question suivante">›</button>
        <span class="panneau__fil-espace"></span>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline" title="Supprimer la question" onclick="App.removeField(${si}, ${fi})">🗑</button>
      </div>

      <section class="bloc">
        <h4 class="bloc__titre">Ce que le public voit ${hintIcon('La phrase que lit la personne qui répond. Écrivez une question, pas un nom de colonne : « Les espaces publics sont agréables » plutôt que « EP_Agreables (1–5) ».')}</h4>
        <div class="fr-input-group">
          <label class="fr-label" for="lab-${si}-${fi}">Question posée</label>
          <input class="fr-input" id="lab-${si}-${fi}" value="${esc(f.label)}"
            placeholder="Ce que lit la personne qui répond"
            oninput="App.onFieldInput(${si}, ${fi}, 'label', this.value)"
            onblur="App.onFieldLabelBlur(${si}, ${fi})">
        </div>
        <div class="fr-input-group">
          <label class="fr-label" for="desc-${si}-${fi}">Consigne</label>
          <input class="fr-input" id="desc-${si}-${fi}" value="${esc(f.description || '')}"
            placeholder="Précision affichée sous la question (facultatif)"
            oninput="App.onFieldInput(${si}, ${fi}, 'description', this.value)">
        </div>
        <div class="fr-checkbox-group">
          <input type="checkbox" id="req-${si}-${fi}" ${f.required ? 'checked' : ''}
            onchange="App.onFieldInput(${si}, ${fi}, 'required', this.checked)">
          <label class="fr-label" for="req-${si}-${fi}">Réponse obligatoire</label>
        </div>
        ${renderIllustrationDuChamp(def, si, f, fi)}
        ${renderFieldPreview(f, si, fi)}
      </section>

      <section class="bloc">
        <h4 class="bloc__titre">Où la réponse se range ${hintIcon('Chaque question écrit dans une colonne Grist. Le type décide de ce que la colonne accepte, et de la façon de répondre.')}</h4>
        <div class="bloc__duo">
          <div class="fr-select-group"><label class="fr-label" for="type-${si}-${fi}">Type de réponse</label>
            <select class="fr-select" id="type-${si}-${fi}" onchange="App.onFieldTypeKeyChange(${si}, ${fi}, this.value)">
              ${simpleOpts}
              <optgroup label="Avancé">${advancedOpts}</optgroup>
            </select>
          </div>
          ${isBind ? `
            <div class="fr-select-group"><label class="fr-label" for="col-${si}-${fi}">Colonne ${hintIcon('Les réponses iront dans cette colonne de la table. Son type et, le cas échéant, sa liste de choix viennent d’elle.')}</label>
              <select class="fr-select" id="col-${si}-${fi}" onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
                <option value="">— choisir une colonne —</option>
                ${(S.columnsByTable[def.tableId] || []).map(c => `<option value="${esc(c.colId)}" ${c.colId === f.colId ? 'selected' : ''}>${esc(c.label || c.colId)} · ${esc(c.type)}</option>`).join('')}
                ${f.colId && !(S.columnsByTable[def.tableId] || []).some(c => c.colId === f.colId)
                  ? `<option value="${esc(f.colId)}" selected>${esc(f.colId)} · absente de la table</option>` : ''}
              </select>
            </div>` : `
            <div class="fr-input-group"><label class="fr-label" for="col-${si}-${fi}">Nom de la colonne ${hintIcon('Elle sera créée à l’enregistrement, avec le type choisi.')}</label>
              <input class="fr-input" id="col-${si}-${fi}" value="${esc(f.colId)}"
                onchange="App.onFieldColIdChange(${si}, ${fi}, this.value)">
            </div>`}
        </div>

        ${isChoiceLike ? renderOptionsDuChamp(def, si, f, fi, isBind) : ''}
        ${renderReglagesSaisie(def, si, f, fi, isBind)}

        ${f.kind === 'echelle' ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label" for="ech-${si}-${fi}">Échelle ${hintIcon('Les bornes et les mots qui disent ce que valent les extrémités. Plusieurs questions peuvent partager la même.')}</label>
              <select class="fr-select" id="ech-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'echelle', this.value)">${echelleOpts}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label" for="mat-${si}-${fi}">Regroupée avec ${hintIcon('Les questions d’une même matrice sont posées ensemble, sous une seule question et une seule échelle.')}</label>
              <select class="fr-select" id="mat-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'matrice', this.value)">
                <option value="">Aucune</option>${matriceOpts}
              </select>
            </div>
          </div>
          <div class="fr-select-group">
            <label class="fr-label" for="pol-${si}-${fi}">Ce que « haut » veut dire ${hintIcon('« Les espaces sont agréables » et « Il faudrait ajouter des places » se notent toutes deux de 1 à 5, mais un 5 est une bonne nouvelle dans un cas et une demande dans l’autre. Sans cette marque, la synthèse les range ensemble.')}</label>
            <select class="fr-select" id="pol-${si}-${fi}" onchange="App.onFieldOption(${si}, ${fi}, 'polarite', this.value)">
              <option value="" ${!(f.options && f.options.polarite) ? 'selected' : ''}>Non précisé — la question ne ressortira pas</option>
              <option value="satisfaction" ${f.options && f.options.polarite === 'satisfaction' ? 'selected' : ''}>Un point de satisfaction (haut = ça va)</option>
              <option value="besoin" ${f.options && f.options.polarite === 'besoin' ? 'selected' : ''}>Un besoin, un problème (haut = à traiter)</option>
              <option value="preference" ${f.options && f.options.polarite === 'preference' ? 'selected' : ''}>Une préférence (haut = souhaité)</option>
            </select>
          </div>` : ''}

        ${isRefLike ? `
          <div class="bloc__duo">
            <div class="fr-select-group"><label class="fr-label">Table liée</label>
              <select class="fr-select" onchange="App.onFieldRefTable(${si}, ${fi}, this.value)"><option value="">—</option>${refTableOptions}</select>
            </div>
            <div class="fr-select-group"><label class="fr-label">Colonne affichée ${hintIcon('Ce que la personne lit dans la liste : le nom de la ligne, plutôt que son identifiant.')}</label>
              <select class="fr-select" onchange="App.onFieldVisibleCol(${si}, ${fi}, this.value)">
                <option value="">Nom (défaut)</option>${visibleColOpts}
              </select>
            </div>
          </div>` : ''}

        <details class="json-preview">
          <summary>Technique</summary>
          <div class="fr-select-group fr-mt-1w"><label class="fr-label">Contrôle de saisie</label>
            <select class="fr-select" onchange="App.onFieldInput(${si}, ${fi}, 'widget', this.value)">${widgetOptions}</select>
          </div>
        </details>
      </section>

      <section class="bloc">
        <h4 class="bloc__titre">Quand elle s’affiche ${hintIcon('Une question peut dépendre d’une réponse précédente. Sans condition, elle est toujours posée. Les conditions ne remplacent pas les droits Grist : elles cachent, elles ne protègent pas.')}</h4>
        ${renderConditionEditor('field', si, fi, f.condition, prior)}
      </section>

      ${isRefLike && f.type === 'Ref' ? `
        <section class="bloc">
          <h4 class="bloc__titre">Ce qu’elle propose ${hintIcon('La liste peut se restreindre selon une réponse précédente : la commune d’une région choisie, les contacts d’un même service.')}</h4>
          ${renderRefBehaviorPanels(def, si, fi, f, refParents, dynParents, filterColOpts, resolveRefTableOfField(f))}
        </section>` : ''}
    </div>
  `;
}

function onDefInput(prop, value) {
  marquerModifie();
  S.currentDef[prop] = value;
  if (prop === 'title' && S.currentDef.composeMode === 'ensureSchema' && S.autoTable) {

  }
}

function onAccueil(cle, valeur) {

  if (cle === 'dureeMinutes') {

    if (n > 0) a.dureeMinutes = n; else delete a.dureeMinutes;
    renderBuilder();

function onEncart(i, cle, valeur) {

function retirerEncart(i) {

function onBrandingInput(key, value) {

}

function onBrandingFile(urlKey, inputEl) {
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!/^image\//i.test(file.type || '')) {
    toast('Fichier image requis (PNG, JPG, SVG, WebP…)', 'error');
    return;
  }
  if (file.size > 1.5 * 1024 * 1024) {
    toast('Image trop lourde (max. 1,5 Mo). Préférez une URL.', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    onBrandingInput(urlKey, reader.result || '');
    renderBuilder();
  };
  reader.onerror = () => toast('Impossible de lire le fichier', 'error');
  reader.readAsDataURL(file);
}

function addSection() { S.currentDef.sections.push(newSection(S.currentDef.sections.length + 1)); renderBuilder(); }
function removeSection(si) { S.currentDef.sections.splice(si, 1); renderBuilder(); }
function addField(si) { S.currentDef.sections[si].fields.push(newField()); renderBuilder(); }
function removeField(si, fi) {
  const f = S.currentDef.sections[si].fields[fi];
  if (f && f.colId && S.currentDef.choices[f.colId]) delete S.currentDef.choices[f.colId];
  S.currentDef.sections[si].fields.splice(fi, 1);
  renderBuilder();
}

function onSectionInput(si, prop, value) {

function onFieldInput(si, fi, prop, value) {
